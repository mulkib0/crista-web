<title>화합물 스크리닝 학습 30종</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="1.2 화합물 스크리닝 — 학생이 지표를 배우고, 기준을 직접 정하고, 후보를 직접 골라 근거를 남기는 학습 활동 시안 30종.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 위 띠(미션 · 표적) → 왼쪽 '지표 사전 · 내 기준' · 가운데 활동 · 활동 아래 '내 후보 바구니' → 맨 아래 활동 30종 고르기 띠.
     색은 Crista 브랜드(잉크 · 페이퍼 · 라임). 관문 색(크기·극성 파랑 · Ro5 주황 · 경고 보라 · QED 청록)은 지표 표시에만,
     맞음/틀림은 good/bad 의미색. 모서리는 각지게. */
  :root {
    --bg: #f1f1e9; --surface: #f8f8f2; --raise: #e7e8de; --fg: #080b09; --muted: #5b6358; --faint: #9aa196;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --hi: #c6ff4a; --hi-fg: #080b09; --hit-ring: #080b09;
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14);
    --f1: #c9ccc1; --f2: #2a78d6; --f3: #eb6834; --f4: #6250d6; --f5: #1baf7a; --f6: #a3a99c; --f7: #c6ff4a;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --dict-w: 300px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f0c; --surface: #111712; --raise: #1a221b; --fg: #eef0e6; --muted: #9da59a; --faint: #5f675d;
      --line: rgba(238, 240, 230, 0.12); --line-strong: rgba(238, 240, 230, 0.3); --hit-ring: #c6ff4a;
      --good: #9fe07a; --good-bg: rgba(159, 224, 122, 0.12); --bad: #ff8a6b; --bad-bg: rgba(255, 138, 107, 0.13); --warn: #f2c66b; --warn-bg: rgba(242, 198, 107, 0.13);
      --f1: #343b34; --f2: #3987e5; --f3: #d95926; --f4: #9085e9; --f5: #199e70; --f6: #6a7368; --f7: #c6ff4a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f0c; --surface: #111712; --raise: #1a221b; --fg: #eef0e6; --muted: #9da59a; --faint: #5f675d;
    --line: rgba(238, 240, 230, 0.12); --line-strong: rgba(238, 240, 230, 0.3); --hit-ring: #c6ff4a;
    --good: #9fe07a; --good-bg: rgba(159, 224, 122, 0.12); --bad: #ff8a6b; --bad-bg: rgba(255, 138, 107, 0.13); --warn: #f2c66b; --warn-bg: rgba(242, 198, 107, 0.13);
    --f1: #343b34; --f2: #3987e5; --f3: #d95926; --f4: #9085e9; --f5: #199e70; --f6: #6a7368; --f7: #c6ff4a;
    color-scheme: dark;
  }
  [data-f="1"] { --c: var(--f1); } [data-f="2"] { --c: var(--f2); } [data-f="3"] { --c: var(--f3); }
  [data-f="4"] { --c: var(--f4); } [data-f="5"] { --c: var(--f5); } [data-f="6"] { --c: var(--f6); } [data-f="7"] { --c: var(--f7); }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--hi-fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ── 위 띠 ── */
  .top { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 10px; border-bottom: 1px solid var(--line-strong); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.03em; font-size: 16px; }
  .brand svg { width: 18px; height: 18px; }
  .crumb { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-left: 14px; border-left: 1px solid var(--line); }
  .crumb b { color: var(--fg); font-weight: 600; }
  .top .sp { flex: 1; }
  .tsel { display: flex; align-items: center; gap: 8px; }
  .tsel label { font-size: 12px; color: var(--muted); }
  select { border: 1px solid var(--line-strong); background: var(--surface); padding: 5px 8px; border-radius: 0; }
  .sum { display: flex; align-items: baseline; gap: 14px; font-family: var(--mono); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .sum span { display: inline-flex; align-items: baseline; gap: 6px; }
  .sum b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .sum .hit { background: var(--hi); color: var(--hi-fg); padding: 0 6px; }
  .sum small { font-family: var(--sans); color: var(--muted); font-size: 12px; }

  /* ── 미션 띠 ── */
  .mission { display: flex; gap: 8px 16px; align-items: baseline; flex-wrap: wrap; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .mission .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--fg); color: var(--bg); padding: 2px 7px; }
  .mission h2 { margin: 0; font-size: 15px; letter-spacing: -0.02em; }
  .mission p { margin: 0; color: var(--muted); font-size: 13px; max-width: 78ch; flex-basis: 100%; }
  .mission .hints { display: flex; gap: 6px; flex-wrap: wrap; flex-basis: 100%; }
  .mission .hints span { font-size: 12px; border: 1px dashed var(--line-strong); padding: 1px 7px; }

  /* ── 작업 영역 ── */
  .work { display: grid; grid-template-columns: var(--dict-w) minmax(0, 1fr); min-height: 0; }
  .dict { border-right: 1px solid var(--line); padding: 14px 14px 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
  .dict-h { display: flex; align-items: center; gap: 10px; }
  .dict-h h2 { margin: 0; font-size: 11px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .dict-tog { display: none; }
  .dict-intro { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  .ent { border: 1px solid var(--line); background: var(--surface); }
  .ent.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--hi); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .ent > button { width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; }
  .ent .sym { font-family: var(--mono); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .ent .sym::before { content: ""; width: 8px; height: 8px; background: var(--c, var(--faint)); }
  .ent .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ent .rule { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .ent .one { grid-column: 1 / -1; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .ent .body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; line-height: 1.55; }
  .ent .body p { margin: 0; }
  .ent .body .an { border-left: 2px solid var(--hi); padding-left: 8px; }
  .ent .body .gd { font-weight: 600; }
  .ent .body .mh { background: var(--raise); padding: 4px 8px; font-size: 12px; }
  .ent .hist { width: 100%; height: 46px; display: block; }
  .ent .hist text { font-family: var(--mono); font-size: 9px; fill: var(--muted); }
  .ctlrow { display: flex; flex-direction: column; gap: 4px; }
  .ctlrow .lab { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .ctlrow .lab .val { font-family: var(--mono); font-weight: 500; }
  input[type="range"] { width: 100%; accent-color: var(--fg); }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .chk .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chk input { accent-color: var(--fg); }
  .seg { display: flex; border: 1px solid var(--line-strong); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 4px 4px; font-size: 12px; font-family: var(--mono); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  .stage { min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 22px 22px; }
  .vhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .vhead .vn { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
  .vhead .grp { font-size: 11px; border: 1px solid var(--line-strong); padding: 0 6px; }
  .vhead h1 { margin: 0; font-size: 24px; letter-spacing: -0.03em; line-height: 1.2; text-wrap: balance; flex-basis: 100%; }
  .vhead p { margin: 0; color: var(--muted); max-width: 66ch; flex-basis: 100%; }
  .vhead .goal { flex-basis: 100%; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
  .vhead .goal b { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; background: var(--hi); color: var(--hi-fg); padding: 1px 6px; }

  .act { position: relative; min-height: 420px; border: 1px solid var(--line); background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .act.bare { padding: 0; }
  .act canvas { display: block; width: 100%; }
  .act svg { max-width: 100%; }
  .act svg text { fill: var(--fg); font-family: var(--sans); }
  .act .t-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .act .t-muted { fill: var(--muted); }
  .pending { display: grid; place-items: center; min-height: 380px; color: var(--muted); }

  /* ── 활동 공통 부품 — 시안들이 같이 쓴다 ── */
  .btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover:not(:disabled) { background: var(--raise); }
  .btn.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.pri:hover:not(:disabled) { background: var(--fg); opacity: 0.88; }
  .btn.hi { background: var(--hi); color: var(--hi-fg); border-color: var(--hi-fg); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min, 220px)), 1fr)); }
  .q { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }
  /* SmilesDrawer 가 구조식 SVG 에 넣는 전역 `.sub { font: 5pt Arial }` 를 이긴다 */
  .page p.sub, .page span.sub, .page div.sub, .page label.sub { font: 13px/1.5 var(--sans); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; border: 1px solid var(--line-strong); padding: 0 6px; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .chip.ok { color: var(--good); background: var(--good-bg); border-color: transparent; }
  .chip.no { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .ind { border: 0; border-bottom: 1px dashed currentColor; background: transparent; padding: 0; font: inherit; font-weight: 600; cursor: help; }
  .ind:hover { background: var(--hi); color: var(--hi-fg); }
  .fb { padding: 10px 12px; font-size: 13px; line-height: 1.55; border-left: 3px solid var(--line-strong); background: var(--raise); }
  .fb.right { border-color: var(--good); background: var(--good-bg); }
  .fb.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .fb b:first-child { margin-right: 6px; }
  .prog { display: flex; gap: 3px; }
  .prog i { flex: 1; height: 4px; background: var(--line); }
  .prog i.on { background: var(--fg); }
  .prog i.ok { background: var(--good); }
  .prog i.no { background: var(--bad); }

  /* 분자 카드 — ctx.mcard(c) */
  .mc { border: 1px solid var(--line-strong); background: var(--bg); display: flex; flex-direction: column; min-width: 0; position: relative; }
  .mc.picked { box-shadow: inset 0 0 0 2px var(--hit-ring); }
  .mc .mh { display: flex; justify-content: space-between; gap: 6px; padding: 7px 9px 0; align-items: baseline; }
  .mc .mh b { font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc .mh .mono { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .mc .molbox { height: 104px; padding: 2px 8px; }
  .mc dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border-top: 1px solid var(--line); }
  .mc dl div { padding: 4px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .mc dl div:nth-child(3n) { border-right: 0; }
  .mc dt { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.04em; }
  .mc dd { margin: 0; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .mc dd.no { color: var(--bad); font-weight: 600; }
  .mc dd.no::after { content: " ✕"; font-size: 10px; }
  .mc .mf { display: flex; gap: 6px; padding: 7px 9px; align-items: center; justify-content: space-between; }
  .mc.hide-v dd { color: transparent; text-shadow: 0 0 6px var(--muted); }

  /* ── 내 후보 바구니 ── */
  .tray { border: 1px solid var(--line-strong); background: var(--surface); }
  .tray-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tray-h h3 { margin: 0; font-size: 14px; }
  .tray-h .cnt { font-family: var(--mono); font-size: 12px; }
  .tray-h .sp { flex: 1; }
  .tray-list { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; min-height: 64px; align-items: stretch; }
  .tray-empty { color: var(--muted); font-size: 12.5px; align-self: center; }
  .tc { flex: none; width: 196px; border: 1px solid var(--line); background: var(--bg); padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .tc .tn { display: flex; justify-content: space-between; gap: 6px; }
  .tc .tn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc .tn button { border: 0; background: transparent; padding: 0 2px; color: var(--muted); }
  .tc .tw { display: flex; gap: 3px; flex-wrap: wrap; }
  .tc .why { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  .check { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .check ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }

  /* ── 툴팁 ── */
  .tip { position: fixed; z-index: 30; pointer-events: none; width: 252px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px -8px rgba(0,0,0,0.25); padding: 10px 12px; font-size: 12px; }
  .tip h4 { margin: 0; font-size: 13px; line-height: 1.3; }
  .tip .id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .tip .molbox { height: 92px; margin: 6px 0; }
  .tip dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 1px 10px; margin: 0; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip dt { color: var(--muted); }
  .tip dd { margin: 0; }
  .tip dd.x { color: var(--bad); font-weight: 600; }
  .fate { display: flex; gap: 6px; align-items: flex-start; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.4; }
  .fate i { width: 10px; height: 10px; background: var(--c); flex: none; margin-top: 3px; }

  .molbox { display: grid; place-items: center; width: 100%; }
  .molbox svg.mol { width: 100%; height: 100%; }
  .fallback { font-family: var(--mono); font-size: 10px; color: var(--muted); word-break: break-all; }

  /* ── 활동 고르기 띠 ── */
  .pick { position: sticky; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line-strong); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; }
  .pick .row2 { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; min-width: 0; align-items: center; }
  .pick button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 4px 9px 5px; display: flex; gap: 6px; align-items: baseline; font-size: 12px; white-space: nowrap; }
  .pick button .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .pick button:hover { border-color: var(--line-strong); }
  .pick button[aria-pressed="true"] { background: var(--hi); color: var(--hi-fg); border-color: var(--hi-fg); }
  .pick button[aria-pressed="true"] .n { color: inherit; }
  .pick .g { flex: none; font-size: 10.5px; color: var(--muted); padding: 0 4px 0 10px; border-left: 1px solid var(--line); white-space: nowrap; }
  .pick .g:first-child { border-left: 0; padding-left: 0; }
  .pick .nav { display: flex; gap: 4px; }
  .pick .nav button { padding: 4px 8px; }

  @media (max-width: 900px) {
    .work { grid-template-columns: minmax(0, 1fr); }
    .dict { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
    .dict-tog { display: inline-flex; margin-left: auto; border: 1px solid var(--line-strong); background: var(--surface); padding: 4px 10px; font-size: 12px; }
    .dict:not(.open) > :not(.dict-h) { display: none; }
    .stage { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .act { padding: 14px; min-height: 340px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>

<div class="page">
  <header class="top gut">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 19 10 10 19 1 10Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 6 14 10 10 14 6 10Z" fill="currentColor"/></svg>CRISTA</div>
    <div class="crumb">1. 발견 · <b>1.2 화합물 스크리닝</b></div>
    <div class="tsel"><label for="tid">미션 표적</label><select id="tid"></select></div>
    <div class="sp"></div>
    <div class="sum" id="sum" aria-live="polite"></div>
  </header>
  <section class="mission gut" id="mission" aria-label="미션"></section>

  <div class="work">
    <aside class="dict" id="dict" aria-label="지표 사전과 내 기준"></aside>

  function reason(c) {

      case 5: return `QED ${c.qed.toFixed(2)} < ${S.qedMin.toFixed(2)}`;
      case 6: return `${g} 점수 ${c.score.toFixed(3)} · 통과 중 ${c.rank}위`;
      case 7: return `${g} 점수 ${c.score.toFixed(3)} · 통과 중 ${c.rank}위`;

    if (a.mwMax && c.mw > a.mwMax) out.push({ lv: "warn", t: `미션 조언보다 MW 큼(${c.mw.toFixed(0)} > ${a.mwMax})` });
    if (a.qedMin && c.qed < a.qedMin) out.push({ lv: "warn", t: `미션 조언보다 QED 낮음(${c.qed.toFixed(2)} < ${a.qedMin})` });
    if (c.ro5 > (a.ro5Max ?? 1)) out.push({ lv: "warn", t: `Ro5 위반 ${c.ro5}개` });
    if (c.srank > 60) out.push({ lv: "warn", t: `${m.gene} 점수 낮음(전체 ${c.srank}위)` });
    return out;
  }

  function adviceCheck() {
    const a = MISSIONS[S.tid].advice, out = [];

    if (a.mwMax != null) out.push({ ok: S.mwMax <= a.mwMax, t: `MW ≤ ${a.mwMax}`, mine: `내 기준 ≤ ${S.mwMax}` });
    if (a.ro5Max != null) out.push({ ok: S.ro5Max <= a.ro5Max, t: `Ro5 위반 ≤ ${a.ro5Max}`, mine: `내 기준 ≤ ${S.ro5Max}` });
    if (a.noAlerts) out.push({ ok: S.noAlerts, t: "구조 경고 빼기", mine: S.noAlerts ? "빼는 중" : "허용 중" });
    if (a.qedMin != null) out.push({ ok: S.qedMin >= a.qedMin, t: `QED ≥ ${a.qedMin}`, mine: `내 기준 ≥ ${S.qedMin.toFixed(2)}` });
    return out;

  let PAL = {};
  function readPal() {
    const cs = getComputedStyle(document.documentElement), g = (k) => cs.getPropertyValue(k).trim();

      hi: g("--hi"), hitRing: g("--hit-ring"), good: g("--good"), bad: g("--bad"), warn: g("--warn"), f: [null, 1, 2, 3, 4, 5, 6, 7].map((i) => i && g("--f" + i)) };

  const meta = (id) => NAMES.find((n) => n[0] === id) || [id, "?", "A"];
  function renderSum() {
    $("sum").innerHTML = `<span><b>${X.length}</b><small>→ 내 기준 통과</small><b>${REM[5]}</b></span><span><small>내 후보</small><b class="hit">${S.picks.length}</b><small>/ ${PICK_MAX}</small></span>`;
  }
  function renderMission() {
    const m = MISSIONS[S.tid], ref = XM.get(m.ref);
    $("mission").innerHTML = `<span class="tag">미션</span><h2>${esc(m.title)}</h2><span class="muted" style="font-size:12px">${m.gene} · ${m.disease} · 실제 약 ${ref ? esc(short(ref.n, 14)) : "—"}</span>
      <p>${esc(m.story)}</p><div class="hints">${m.hints.map((h) => `<span>${esc(h)}</span>`).join("")}</div>`;
  }
  function renderHead() {
    const [id, name, g] = meta(S.v), v = current();
    $("vhead").innerHTML = `<span class="vn">활동 ${id} / 30</span><span class="grp">${GROUPS[g]}</span><h1>${esc(name)}</h1>${v && v.line ? `<p>${esc(v.line)}</p>` : ""}${v && v.goal ? `<div class="goal"><b>배울 것</b><span>${esc(v.goal)}</span></div>` : ""}`;
  }
  function renderPick() {
    let last = null;
    $("pick").innerHTML = NAMES.map(([id, name, g]) => { const head = g !== last ? `<span class="g">${GROUPS[g]}</span>` : ""; last = g;
      return `${head}<button type="button" data-v="${id}" aria-pressed="${S.v === id}"><span class="n">${id}</span>${esc(name)}</button>`; }).join("");
    const on = $("pick").querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  function renderAct() {
    const el = $("act"), v = current();
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    const sy = scrollY;
    el.className = "act"; el.removeAttribute("style"); el.innerHTML = ""; ctx._canvasTip = false; hideTip();
    if (!v) { el.innerHTML = `<div class="pending">활동 ${esc(S.v)}을 불러오지 못했습니다.</div>`; return; }
    try { cleanup = v.render(el, ctx) || null; } catch (e) { console.error(e); el.innerHTML = `<div class="pending">그리다 멈췄습니다: ${esc(e.message)}</div>`; }
    drawMols(el);
    if (Math.abs(scrollY - sy) > 2) scrollTo(0, sy);
  }
  function refresh(keep) {
    compute(); readPal(); renderSum(); renderMission(); renderHead(); renderTray();
    const v = current();
    if (keep && v && v.update) v.update(ctx); else if (!keep) renderAct();
  }

  /* ── 이벤트 ── */
  const dict = $("dict");
  dict.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "dicttog") { dictOpen = !dictOpen; renderDict(); return; }
    if (b.id === "reset") { const keep = { tid: S.tid, picks: S.picks, why: S.why, v: S.v }; Object.assign(S, JSON.parse(JSON.stringify(DEF)), keep); refresh(); renderDict(); return; }
    if (b.dataset.ent) { const k = b.dataset.ent; openSet.has(k) ? openSet.delete(k) : openSet.add(k); renderDict(); return; }
    if (b.dataset.seg) { S[b.dataset.seg] = +b.dataset.v; refresh(); renderDict(); }
  });
  dict.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.num) { S[t.dataset.num] = +t.value; const lab = t.closest(".ctlrow").querySelector(".val"); const d = IND.find((x) => x.ctl && x.ctl.key === t.dataset.num);
      lab.textContent = `${d.k === "qed" ? "≥ " : "≤ "}${(+t.value).toFixed(d.ctl.fix || 0)} ${d.ctl.unit}`; refresh();
      const r = t.closest(".ent").querySelector(".rule"); if (r) r.textContent = d.rule(S); }
  });
  dict.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.num) { renderDict(); const n = $("c-" + t.dataset.num); if (n) n.focus(); }
    else if (t.dataset.lib != null) { S.lib[t.dataset.lib] = t.checked; refresh(); renderDict(); }
    else if (t.dataset.tog) { S[t.dataset.tog] = t.checked; refresh(); renderDict(); }
  });
  document.addEventListener("click", (e) => {
    const p = e.target.closest("[data-pick]"); if (p && !p.disabled) { togglePick(p.dataset.pick); return; }
    const i = e.target.closest("[data-ind]"); if (i) { openInd(i.dataset.ind); return; }
    if (e.target.closest("#checkb")) { checkOpen = !checkOpen; renderTray(); }
  });
  $("tray").addEventListener("pointermove", (e) => { const el = e.target.closest("[data-cid]"); if (el) showTip(e, XM.get(el.dataset.cid)); else hideTip(); });
  $("tray").addEventListener("pointerleave", hideTip);
  $("tid").innerHTML = Object.entries(MISSIONS).map(([k, m]) => `<option value="${k}">${m.gene} · ${m.disease}</option>`).join("");
  $("tid").addEventListener("change", (e) => { S.tid = e.target.value; refresh(); renderDict(); });
  function go(id) {
    S.v = id;
    try { history.replaceState(null, "", "#v" + id); } catch (e) {}
    try { localStorage.setItem("crista-learn-v", id); } catch (e) {}
    renderPick(); refresh();
  }
  $("pick").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) go(b.dataset.v); });
  const idx = () => NAMES.findIndex((n) => n[0] === S.v);
  $("vprev").addEventListener("click", () => go(NAMES[(idx() + NAMES.length - 1) % NAMES.length][0]));
  $("vnext").addEventListener("click", () => go(NAMES[(idx() + 1) % NAMES.length][0]));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select, textarea")) return;
    if (e.key === "ArrowRight" && e.shiftKey) { $("vnext").click(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" && e.shiftKey) { $("vprev").click(); e.preventDefault(); }
  });
  let rz = 0, lastW = 0;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const w = $("act").clientWidth; if (w !== lastW) { lastW = w; renderAct(); } }, 160); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { refresh(); renderDict(); });
  new MutationObserver(() => { refresh(); renderDict(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  window.SV.boot = () => {
    const h = (location.hash.match(/^#v(\d\d)$/) || [])[1];
    let saved = null; try { saved = localStorage.getItem("crista-learn-v"); } catch (e) {}
    S.v = NAMES.some((n) => n[0] === h) ? h : NAMES.some((n) => n[0] === saved) ? saved : "01";
    compute(); renderPick(); renderDict(); lastW = $("act").clientWidth; refresh();
  };
})();
</script>
<script src="screening-learn-1.js"></script>
<script src="screening-learn-2.js"></script>
<script src="screening-learn-3.js"></script>
<script>SV.boot();</script>

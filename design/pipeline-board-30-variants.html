<title>Crista 학급 전광판</title>
<meta name="description" content="05 4단계 로드맵 위에 다른 모둠의 주가 · 임상 소식을 띄우는 학급 전광판 시안 30종.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
  /* 레이아웃: 왼쪽 사이드바에 번호 단계(1.~8.), 오른쪽에 그 단계의 실제 작업 화면. 아래 띠는 시안 30종을 고르는 미리보기 도구.
     색은 Crista 브랜드(잉크 · 페이퍼 · 라임)와 시안 20.02 '박막 무지개'의 얇은 막 간섭색. 모서리는 각지게. */
  :root {
    --bg: #f1f1e9; --surface: #f8f8f2; --raise: #e7e8de; --fg: #080b09; --muted: #5b6358;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --acc: #080b09; --acc-fg: #f1f1e9; --hi: #c6ff4a; --hi-fg: #080b09;
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14);
    --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11);
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-ink: #080b09;
    --side-bg: transparent; --side-fg: var(--fg); --side-muted: var(--muted); --side-line: var(--line); --side-on: var(--film); --side-on-fg: var(--film-ink);
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --side-w: 272px; --log-w: 0px; --fs: 14px;
    color-scheme: light;
  }
  html[data-tone="fog"] { --bg: #e3e6dd; --surface: #edefe8; --raise: #d7dbd0; --muted: #545d52; }
  html[data-tone="film"] { --bg: #f1f1e9; --surface: #fbfbf6; --acc: #080b09; }
  html[data-tone="ink"], html[data-tone="night"] {
    --bg: #080b09; --surface: #0f140f; --raise: #182018; --fg: #f1f1e9; --muted: #9da59a;
    --line: rgba(241, 241, 233, 0.12); --line-strong: rgba(241, 241, 233, 0.32);
    --acc: #c6ff4a; --acc-fg: #080b09;
    --good: #9fe07a; --good-bg: rgba(159, 224, 122, 0.12); --warn: #f2c66b; --warn-bg: rgba(242, 198, 107, 0.13);
    --bad: #ff8a6b; --bad-bg: rgba(255, 138, 107, 0.13);
    --film: linear-gradient(115deg, #ff9fd4 0%, #8fd4ff 28%, #c6ff4a 52%, #ffc98f 76%, #c9a6ff 100%);
    color-scheme: dark;
  }
  html[data-tone="night"] { --bg: #0f140f; --surface: #151c15; --raise: #1d261d; --acc: #f1f1e9; --acc-fg: #080b09; }
  /* 사이드바 채움 */
  .shell[data-fill="ink"] { --side-bg: #080b09; --side-fg: #f1f1e9; --side-muted: #9da59a; --side-line: rgba(241,241,233,0.14); --side-on: #c6ff4a; --side-on-fg: #080b09; }
  .shell[data-fill="lime"] { --side-bg: #c6ff4a; --side-fg: #080b09; --side-muted: #3c4a1c; --side-line: rgba(8,11,9,0.18); --side-on: #080b09; --side-on-fg: #c6ff4a; }
  .shell[data-fill="film"] { --side-bg: var(--film); --side-fg: #080b09; --side-muted: #3d4540; --side-line: rgba(8,11,9,0.16); --side-on: #080b09; --side-on-fg: #f1f1e9; }
  .shell[data-fill="surface"] { --side-bg: var(--surface); }
  .shell[data-scale="lg"] { --fs: 16px; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: var(--fs); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--hi-fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .shell {
    font-size: var(--fs);
    display: grid; min-height: 0;
    grid-template-columns: var(--side-w) minmax(0, 1fr) var(--log-w);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top top top" "board board board" "side main log" "side strip log";
  }
  .shell[data-log="drawer"], .shell.log-open { --log-w: 300px; }
  .shell[data-side="chip"] { --side-w: 112px; }
  .shell[data-side="ledger"] { --side-w: 320px; }
  .shell[data-side="numeral"] { --side-w: 286px; }

  /* ── 위 띠: 회사 · 연구비 ── */
  .top {
    grid-area: top; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--line-strong); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.03em; font-size: 17px; }
  .brand svg { width: 20px; height: 20px; }
  .brand small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .co { display: flex; align-items: center; gap: 6px; padding-left: 14px; border-left: 1px solid var(--line); min-width: 0; }
  .co input { width: 9.5em; border: 1px solid transparent; background: transparent; padding: 4px 6px; font-weight: 600; }
  .co input:hover, .co input:focus { border-color: var(--line-strong); background: var(--surface); }
  .co .tick { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 2px 6px; border: 1px solid var(--line-strong); }
  .top-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kv { display: grid; line-height: 1.2; }
  .kv span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .kv b { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .shell[data-top="hud"] .kv.cash { padding: 6px 12px; background: var(--fg); color: var(--bg); }
  .shell[data-top="hud"] .kv.cash span { color: inherit; opacity: 0.7; }
  .shell[data-top="hud"] .kv.cash b { font-size: 20px; }
  .shell[data-top="quiet"] .kv.day, .shell[data-top="quiet"] .co .tick { display: none; }
  .btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px;
    border: 1px solid var(--line-strong); background: transparent; border-radius: 0; font-weight: 600; font-size: 0.93em; white-space: nowrap;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--fg); }
  .btn.pri { background: var(--acc); color: var(--acc-fg); border-color: var(--acc); }
  .btn.pri:hover:not(:disabled) { box-shadow: inset 0 0 0 999px rgba(128,128,128,0.16); }
  .btn.film { background: var(--film); color: var(--film-ink); border-color: transparent; }
  .btn:disabled { opacity: 0.42; }
  .btn.sm { min-height: 30px; padding: 0 10px; font-size: 0.84em; }
  .btn .cost { font-family: var(--mono); font-weight: 500; font-size: 0.9em; opacity: 0.8; }

  /* ── 사이드바 공통 ── */
  .side {
    grid-area: side; overflow: auto; background: var(--side-bg); color: var(--side-fg);
    border-right: 1px solid var(--line-strong); display: flex; flex-direction: column;
    padding: 18px 14px 18px max(16px, env(safe-area-inset-left, 0px));
  }
  .side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--side-muted); margin: 0 0 12px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .st {
    appearance: none; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; border-radius: 0;
    display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 8px; padding: 10px 10px 10px 6px; position: relative;
  }
  .st:hover:not([data-s="lock"]) { background: rgba(128,128,128,0.10); }
  .st-n { font-family: var(--mono); font-weight: 600; font-size: 15px; grid-row: span 3; line-height: 1.35; }
  .st-t { font-weight: 600; line-height: 1.35; }
  .st-s { font-family: var(--mono); font-size: 10.5px; color: var(--side-muted); line-height: 1.4; margin-top: 2px; }
  .st-m { display: flex; gap: 8px; margin-top: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--side-muted); }
  .st-m .ok { color: inherit; }
  .st[data-s="cur"] { background: var(--side-on); color: var(--side-on-fg); }
  .st[data-s="cur"] .st-s, .st[data-s="cur"] .st-m { color: inherit; opacity: 0.78; }
  .st[data-s="lock"] { opacity: 0.45; cursor: not-allowed; }
  .st[data-s="done"] .st-n::after { content: " ✓"; }
  .side-foot { margin-top: auto; padding-top: 18px; display: grid; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--side-muted); }
  .prog { height: 4px; background: var(--side-line); position: relative; }
  .prog i { position: absolute; inset: 0 auto 0 0; background: var(--side-fg); }
  .conn { display: grid; gap: 4px; }
  .conn span::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; background: currentColor; vertical-align: 1px; }

  /* 큰 번호 */
  .shell[data-side="numeral"] .st { grid-template-columns: 62px minmax(0,1fr); padding: 12px 10px 12px 4px; }
  .shell[data-side="numeral"] .st-n { font-family: var(--sans); font-size: 42px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.95; }
  .shell[data-side="numeral"] .st[data-s="lock"] .st-n, .shell[data-side="numeral"] .st[data-s="open"] .st-n { color: transparent; -webkit-text-stroke: 1px var(--side-fg); }
  .shell[data-side="numeral"] .st[data-s="lock"] { opacity: 0.6; }
  .shell[data-side="numeral"] .st[data-s="done"] .st-n::after { content: ""; }
  .shell[data-side="numeral"] .st[data-s="done"] .st-t::after { content: "  ✓"; font-family: var(--mono); font-size: 12px; }

  /* 레일 */
  .shell[data-side="rail"] .steps { gap: 0; position: relative; }
  .shell[data-side="rail"] .steps::before { content: ""; position: absolute; left: 20px; top: 16px; bottom: 16px; width: 1px; background: var(--side-line); }
  .shell[data-side="rail"] .st { padding: 10px 8px 14px 4px; grid-template-columns: 34px minmax(0,1fr); }
  .shell[data-side="rail"] .st[data-s="cur"] { background: transparent; color: inherit; }
  .shell[data-side="rail"] .st[data-s="cur"] .st-t { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .shell[data-side="rail"] .st-n {
    width: 32px; height: 32px; display: grid; place-items: center; font-size: 13px; position: relative; z-index: 1;
    border: 1px solid var(--side-line); background: var(--bg); color: var(--fg);
  }
  .shell[data-side="rail"][data-fill="film"] .st-n { background: #f1f1e9; color: #080b09; }
  .shell[data-side="rail"] .st[data-s="done"] .st-n { background: var(--side-fg); color: var(--side-bg, var(--bg)); border-color: var(--side-fg); }
  .shell[data-side="rail"]:not([data-fill]) .st[data-s="done"] .st-n, .shell[data-side="rail"][data-fill="none"] .st[data-s="done"] .st-n { color: var(--bg); }
  .shell[data-side="rail"] .st[data-s="done"] .st-n::after { content: ""; }
  .shell[data-side="rail"] .st[data-s="cur"] .st-n { background: var(--film); color: #080b09; border-color: transparent; }

  /* 4단계 묶음 */
  .grp { display: grid; gap: 2px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--side-line); }
  .grp:last-child { border-bottom: 0; }
  .grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 1.12em; font-weight: 700; letter-spacing: -0.02em; }
  .grp-h b { font-family: var(--mono); font-size: 0.9em; }
  .grp-h span { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--side-muted); letter-spacing: 0.06em; margin-left: auto; }
  .shell[data-side="phase"] .st { grid-template-columns: 38px minmax(0,1fr); padding: 7px 8px 7px 14px; }
  .shell[data-side="phase"] .st-n { font-size: 12px; }
  .shell[data-side="phase"] .st-m { display: none; }

  /* 원장 */
  .shell[data-side="ledger"] .side { padding-right: 0; }
  .lg-head, .shell[data-side="ledger"] .st { display: grid; grid-template-columns: 30px minmax(0,1fr) 54px 62px; column-gap: 8px; align-items: center; }
  .lg-head { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); padding: 0 10px 8px 6px; border-bottom: 1px solid var(--side-line); }
  .shell[data-side="ledger"] .steps { gap: 0; }
  .shell[data-side="ledger"] .st { border-bottom: 1px solid var(--side-line); padding: 11px 10px 11px 6px; }
  .shell[data-side="ledger"] .st-n { grid-row: auto; font-size: 13px; }
  .shell[data-side="ledger"] .st-s { display: none; }
  .shell[data-side="ledger"] .st-m { display: contents; }
  .shell[data-side="ledger"] .st-m span { margin: 0; font-size: 10px; }
  .shell[data-side="ledger"] .st-m span:last-child { text-align: right; }

  /* 바인더 인덱스 */
  .shell[data-side="index"] .side { padding-right: 0; }
  .shell[data-side="index"] .steps { gap: 6px; }
  .shell[data-side="index"] .st { border: 1px solid var(--side-line); border-right: 0; background: var(--surface); color: var(--fg); grid-template-columns: 44px minmax(0,1fr); padding: 0; }
  .shell[data-side="index"] .st-n { grid-row: span 3; display: grid; place-items: center; font-size: 20px; border-right: 1px solid var(--side-line); align-self: stretch; }
  .shell[data-side="index"] .st-t { padding: 9px 10px 0; }
  .shell[data-side="index"] .st-s { padding: 0 10px; }
  .shell[data-side="index"] .st-m { padding: 0 10px 9px; }
  .shell[data-side="index"] .st[data-s="cur"] { background: var(--bg); color: var(--fg); margin-right: -1px; border-color: var(--line-strong); }
  .shell[data-side="index"] .st[data-s="cur"] .st-n { background: var(--film); color: #080b09; }
  .shell[data-side="index"] .st[data-s="done"] .st-n { background: var(--fg); color: var(--bg); }
  .shell[data-side="index"] .st[data-s="done"] .st-n::after { content: ""; }

  /* 칩 */
  .shell[data-side="chip"] .side { padding: 14px 10px 14px max(10px, env(safe-area-inset-left, 0px)); }
  .shell[data-side="chip"] .side-h { text-align: center; }
  .shell[data-side="chip"] .steps { gap: 6px; }
  .shell[data-side="chip"] .st { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 10px 4px; border: 1px solid var(--side-line); }
  .shell[data-side="chip"] .st-n { font-size: 22px; grid-row: auto; line-height: 1; font-family: var(--sans); font-weight: 700; }
  .shell[data-side="chip"] .st-t { font-size: 11.5px; margin-top: 4px; }
  .shell[data-side="chip"] .st-s, .shell[data-side="chip"] .st-m, .shell[data-side="chip"] .side-foot .conn { display: none; }
  .shell[data-side="chip"] .st[data-s="done"] .st-n::after { content: ""; }
  .shell[data-side="chip"] .st[data-s="done"] { border-color: var(--side-fg); }

  /* ── 오른쪽 작업 화면 ── */
  .main { grid-area: main; overflow: auto; min-width: 0; background: var(--bg); }
  .wrap { max-width: 1180px; padding: 26px max(16px, env(safe-area-inset-right, 0px)) 40px 30px; display: grid; gap: 20px; }
  .blk { min-width: 0; }
  .sh { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: start; }
  .sh-n { font-size: 64px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.82; grid-row: span 4; padding-top: 4px; }
  .sh-n.film { background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--fg); }
  .eyebrow { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .sh h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.035em; text-wrap: balance; }
  .lede { margin: 2px 0 0; max-width: 64ch; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; padding: 3px 7px; border: 1px solid var(--line-strong); white-space: nowrap; }
  .chip.src { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .lab { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .panel { border: 1px solid var(--line-strong); background: var(--surface); padding: 16px; min-width: 0; }
  .panel + .panel { margin-top: 14px; }
  .ptitle { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 15px; letter-spacing: -0.01em; }
  .ptitle small { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--muted); margin-left: auto; }
  .fld + .fld { margin-top: 16px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .opt { appearance: none; text-align: left; border: 1px solid var(--line-strong); background: var(--bg); padding: 10px 12px; display: grid; gap: 2px; border-radius: 0; }
  .opt:hover { border-color: var(--fg); }
  .opt b { font-size: 1em; }
  .opt span { font-size: 11.5px; }
  .opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .opt[aria-pressed="true"] .muted { color: inherit; opacity: 0.7; }
  .rng { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
  .rng input { width: 100%; accent-color: var(--fg); }
  .rng output { font-family: var(--mono); font-size: 12.5px; text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--mono); font-size: 12px; border-radius: 0; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .chk input { accent-color: var(--fg); width: 15px; height: 15px; }
  .txt { width: 100%; border: 1px solid var(--line-strong); background: var(--bg); padding: 9px 11px; border-radius: 0; }
  .txt:focus { outline: none; border-color: var(--fg); }
  select.txt { appearance: auto; }
  .hint { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .hint.bad { color: var(--bad); }
  .hint.good { color: var(--good); }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .acts .note { font-size: 12px; color: var(--muted); }
  .empty { border: 1px dashed var(--line-strong); padding: 26px 18px; color: var(--muted); text-align: center; }

  /* 표 */
  .tbl-w { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: rgba(128,128,128,0.08); }
  tr.on td { background: var(--hi); color: var(--hi-fg); }
  html[data-tone="ink"] tr.on td, html[data-tone="night"] tr.on td { background: rgba(198,255,74,0.16); color: var(--fg); }
  tr.dis td { opacity: 0.5; }
  .bar { position: relative; height: 8px; background: var(--line); min-width: 60px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
  .bar.film i { background: var(--film); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
  .sig { display: inline-block; font-size: 11.5px; padding: 2px 7px; white-space: nowrap; font-weight: 600; }
  .sig.g { color: var(--good); background: var(--good-bg); }
  .sig.w { color: var(--warn); background: var(--warn-bg); }
  .sig.b { color: var(--bad); background: var(--bad-bg); }

  /* 깔때기 */
  .fun { display: grid; gap: 6px; }
  .fun-r { display: grid; grid-template-columns: 112px minmax(0,1fr) 46px; gap: 10px; align-items: center; font-size: 12.5px; }
  .fun-r .bar { height: 18px; }
  .fun-r .bar i { background: var(--fg); }
  .fun-r:last-child .bar i { background: var(--film); outline: 1px solid var(--fg); }
  .fun-r b { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

  /* 도킹 막대 */
  .dk { display: grid; gap: 4px; }
  .dk-r { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0,1fr) 76px 52px; gap: 10px; align-items: center; font-size: 12.5px; padding: 4px 0; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
  .dk-r[aria-pressed="true"] { background: rgba(128,128,128,0.12); }
  .dk-r .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dk-t { position: relative; height: 16px; background: var(--line); }
  .dk-t i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
  .dk-t i.ref { background: repeating-linear-gradient(45deg, var(--fg) 0 3px, transparent 3px 6px); outline: 1px solid var(--fg); }
  .dk-t em { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 1px dashed var(--muted); }
  .dk-axis { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0,1fr) 76px 52px; gap: 10px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .dk-axis div { display: flex; justify-content: space-between; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 14px; height: 8px; margin-right: 6px; background: var(--fg); vertical-align: 0; }
  .legend i.ref { background: repeating-linear-gradient(45deg, var(--fg) 0 3px, transparent 3px 6px); outline: 1px solid var(--fg); }
  .legend i.ln { width: 0; height: 12px; border-left: 1px dashed var(--muted); background: none; margin: 0 8px 0 4px; vertical-align: -2px; }

  /* 구조식 */
  .mol { display: block; width: 100%; height: 100%; max-width: 100%; }
  .molbox { max-width: 100%; width: 100%; }
  .molbox.thumb { width: 64px; }
  .molbox { border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; overflow: hidden; }
  .molbox .fallback { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding: 8px; word-break: break-all; }
  .thumb { width: 64px; height: 44px; }
  .twin { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  .smi { font-family: var(--mono); font-size: 11px; word-break: break-all; color: var(--muted); }

  /* 점수 게이지 */
  .gauge { display: grid; gap: 6px; }
  .gauge-h { display: flex; justify-content: space-between; align-items: baseline; }
  .gauge-h b { font-family: var(--mono); font-size: 26px; letter-spacing: -0.02em; }
  .gauge-t { position: relative; height: 14px; background: var(--line); }
  .gauge-t i { position: absolute; inset: 0 auto 0 0; background: var(--film); outline: 1px solid var(--fg); }
  .gauge-t em { position: absolute; top: -5px; bottom: -5px; border-left: 1.5px solid var(--fg); }
  .gauge-t em span { position: absolute; top: 20px; left: -14px; font-family: var(--mono); font-size: 9.5px; font-style: normal; color: var(--muted); white-space: nowrap; }
  .gauge-sp { height: 14px; }
  .why { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .why li { padding-left: 14px; position: relative; }
  .why li::before { content: "·"; position: absolute; left: 4px; }
  .why li:last-child { color: var(--fg); font-family: var(--mono); font-size: 11.5px; }

  /* 서류 · 도장 */
  .doc { border: 1px solid var(--fg); background: var(--surface); padding: 20px 22px; position: relative; overflow: hidden; }
  .doc h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.02em; }
  .doc dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 14px 0 0; font-size: 13px; }
  .doc dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  .doc dd { margin: 0; min-width: 0; word-break: break-word; }
  .stamp {
    position: absolute; right: 18px; top: 18px; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; text-align: center;
    transform: rotate(-12deg); font-weight: 700; font-size: 13px; line-height: 1.2; color: #080b09;
    background: var(--film); box-shadow: inset 0 0 0 3px #080b09, inset 0 0 0 6px rgba(255,255,255,0.6), inset 0 0 0 7.5px #080b09;
  }
  .stamp small { display: block; font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.08em; }
  .stamp.bad { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 3px var(--bad); }

  /* 임상 */
  .ph { display: grid; gap: 10px; }
  .ph-r { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-strong); background: var(--bg); }
  .ph-r b { font-size: 15px; }
  .ph-r .res { font-size: 12.5px; }
  .ph-r[data-r="pass"] { border-color: var(--good); }
  .ph-r[data-r="fail"] { border-color: var(--bad); }

  /* 포장 */
  .pk { display: grid; place-items: center; height: 168px; background: var(--raise); border: 1px solid var(--line); }
  .pill { position: relative; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; color: #080b09; letter-spacing: 0.04em; }
  .pill.tablet { width: 104px; height: 104px; border-radius: 50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), 0 0 0 1px #080b09; }
  .pill.tablet::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 1px solid rgba(8,11,9,0.4); }
  .pill.capsule { width: 150px; height: 58px; border-radius: 29px; box-shadow: 0 0 0 1px #080b09; overflow: hidden; }
  .pill.capsule::before { content: ""; position: absolute; inset: 0 50% 0 0; background: var(--film); }
  .pill.capsule span { position: relative; }
  .pill.vial { width: 64px; height: 120px; box-shadow: 0 0 0 1px #080b09; margin-top: 14px; }
  .pill.vial::before { content: ""; position: absolute; top: -18px; left: 10px; right: 10px; height: 18px; background: #080b09; }
  .pill.patch { width: 120px; height: 96px; box-shadow: 0 0 0 1px #080b09, inset 0 0 0 10px rgba(255,255,255,0.45); }

  /* 진행 중 작업 */
  .job { border: 1px solid var(--fg); padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
  .job-h { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .job .bar { height: 6px; }
  .job .bar i { background: var(--film); transition: width .12s linear; outline: 1px solid var(--fg); }

  /* 배치: 시트 · 분할 · 콘솔 · 노트 · 결과 먼저 · 데크 */
  .m-split { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
  .m-split .col-a { display: grid; gap: 20px; position: sticky; top: 0; }
  .m-split .col-b { display: grid; gap: 14px; min-width: 0; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line-strong); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 10px 16px; font-weight: 600; margin-bottom: -1px; border-radius: 0; }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--fg); }
  .tabs button .mono { font-size: 10.5px; color: var(--muted); margin-left: 6px; }
  .dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line-strong); padding: 12px 0; }
  .cell { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; }
  .cell-g { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 14px; text-align: right; border-right: 1px solid var(--line-strong); padding-right: 12px; }
  .cell-g b { display: block; color: var(--fg); font-weight: 600; }
  .m-board .ctl-strip { border-top: 1px solid var(--line-strong); padding-top: 18px; }
  .m-board .ctl-strip .panel { background: transparent; border-style: dashed; }
  .m-deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .m-deck .wide { grid-column: 1 / -1; }
  .m-deck .card { border: 1px solid var(--line-strong); background: var(--surface); padding: 18px; min-width: 0; }
  .m-deck .card .panel { border: 0; padding: 0; background: transparent; }
  .m-deck .card-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; }

  /* 로그 */
  .log { grid-area: log; border-left: 1px solid var(--line-strong); background: var(--surface); display: none; min-height: 0; flex-direction: column; }
  .shell[data-log="drawer"] .log, .shell.log-open .log { display: flex; }
  .strip { grid-area: strip; display: none; border-top: 1px solid var(--line-strong); background: var(--surface); max-height: 132px; overflow: auto; }
  .shell[data-log="strip"]:not(.log-open) .strip { display: block; }
  .log-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .log-b { overflow: auto; padding: 8px 0; flex: 1; min-height: 0; }
  .ln { display: grid; grid-template-columns: 50px 36px minmax(0, 1fr); gap: 6px; padding: 3px 14px; font-family: var(--mono); font-size: 10.5px; line-height: 1.45; }
  .ln .d { color: var(--muted); }
  .ln .dir { font-weight: 600; }
  .ln .dir.s { color: var(--good); }
  .ln .ev { word-break: break-word; }
  .ln .ev i { font-style: normal; color: var(--muted); }
  .strip .ln { padding-left: 30px; }

  .toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; background: var(--fg); color: var(--bg); font-size: 13px; }

  /* ── 미리보기 도구(시안 고르기) ── */
  .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #080b09; color: #f1f1e9; border-top: 1px solid rgba(241,241,233,0.32);
    padding: 9px max(16px, env(safe-area-inset-right, 0px)) calc(9px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
  }
  .tool-btn { background: transparent; color: #f1f1e9; border: 1px solid rgba(241,241,233,0.32); padding: 6px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; border-radius: 0; }
  .tool-btn:hover { border-color: #f1f1e9; }
  .tools :focus-visible { outline-color: #c6ff4a; }
  .pick-w { position: relative; flex: 0 1 300px; min-width: 0; }
  .pick-w::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #9da59a; pointer-events: none; }
  #vpick { appearance: none; -webkit-appearance: none; width: 100%; padding: 6px 28px 6px 10px; border: 1px solid rgba(241,241,233,0.32); border-radius: 0; background: transparent; color: #f1f1e9; font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; }
  #vpick option { background: #0f140f; color: #f1f1e9; }
  .vcount { color: #9da59a; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .videa { color: #c9cfc4; font-family: var(--sans); font-size: 12px; letter-spacing: 0; min-width: 0; flex: 1 1 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys { display: flex; gap: 12px; color: #9da59a; font-size: 10px; text-transform: uppercase; white-space: nowrap; }
  .keys kbd { font-family: var(--mono); font-size: 10px; color: #f1f1e9; border: 1px solid rgba(241,241,233,0.32); padding: 1px 5px; margin-right: 4px; }

  /* ── 학급 전광판: 다른 모둠의 공개 소식(market:news) ── */
  .board { grid-area: board; position: relative; display: flex; align-items: stretch; min-width: 0; border-bottom: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); --b-line: var(--line); --b-muted: var(--muted); --up: var(--good); --dn: var(--bad); }
  .board.dk { --bg: #0b0d0a; --surface: #121711; --fg: #f1f1e9; --muted: #9da59a; --line: rgba(241,241,233,0.14); --line-strong: rgba(241,241,233,0.3);
    --b-line: rgba(241,241,233,0.16); --b-muted: #9da59a; --up: #8dff5a; --dn: #ff6b4a; --hi: #c6ff4a; background: #0b0d0a; color: #f1f1e9; }
  .board.dk.bd-floor { background: #0d1f14; }
  .board.bd-film { background: var(--film); color: #080b09; --b-muted: #3d4540; }
  .board.bd-crawl { background: var(--bg); }
  .bd-in { flex: 1; min-width: 0; padding: 9px 0 9px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; align-content: center; }
  .bd-ctl { flex: none; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px 12px; border-left: 1px solid var(--b-line); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--b-muted); text-transform: uppercase; }
  .live i { width: 7px; height: 7px; background: var(--dn); border-radius: 50%; }
  .board:not(.paused) .live i { animation: blink 1.4s steps(2) infinite; }
  .tool { background: transparent; color: inherit; border: 1px solid var(--line-strong); padding: 3px 8px; font-family: var(--mono); font-size: 10.5px; border-radius: 0; white-space: nowrap; }
  .tool:hover { border-color: currentColor; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .inkd { display: inline-block; width: 9px; height: 9px; flex: none; margin-right: 6px; }
  .mq { overflow: hidden; min-width: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
  .mq.static { overflow-x: auto; display: flex; gap: 22px; -webkit-mask-image: none; mask-image: none; }
  .mq-track { display: flex; width: max-content; animation: mq 40s linear infinite; }
  .mq-track.rev { animation-direction: reverse; }
  .mq-seg { display: flex; align-items: center; gap: 28px; padding-right: 28px; }
  .board.paused .mq-track, .mq:hover .mq-track, .mq:focus-within .mq-track { animation-play-state: paused; }
  @keyframes mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes blink { 50% { opacity: 0.2; } }
  .ni { appearance: none; border: 0; background: transparent; color: inherit; padding: 2px 0; display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; text-align: left; font-size: 13px; border-radius: 0; min-width: 0; max-width: 100%; }
  .ni b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .ni-t { font-family: var(--mono); font-size: 11px; color: var(--b-muted, var(--muted)); }
  .ni-c { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  .ni.bad b { color: var(--dn, var(--bad)); }
  .ni.fresh { background: var(--hi); color: #080b09; padding-inline: 6px; }
  .ni.fresh b, .ni.fresh .ni-c, .ni.fresh .ni-t { color: #080b09; }
  .ni:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .b-sub { min-width: 0; overflow: hidden; display: flex; }
  .thin .ni, .thin .tp { font-size: 12.5px; }
  .tp { appearance: none; border: 0; background: transparent; color: inherit; display: inline-flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 13px; white-space: nowrap; padding: 2px 0; }
  .tp b { font-weight: 600; }

  .led { font-family: var(--mono); font-weight: 600; letter-spacing: 0.06em;
    -webkit-mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); -webkit-mask-size: 3px 3px; mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); mask-size: 3px 3px; }
  .bd-led .bd-in { padding-block: 14px; }
  .led-i { appearance: none; border: 0; background: transparent; color: #ffb21a; font-size: 22px; padding: 0; white-space: nowrap; text-shadow: 0 0 8px rgba(255,178,26,0.55); }
  .led-i.r { color: #ff5a3c; text-shadow: 0 0 8px rgba(255,90,60,0.55); }
  .led-i.g { color: #8dff5a; text-shadow: 0 0 8px rgba(141,255,90,0.5); }

  .flap { display: grid; gap: 3px; padding-right: 8px; }
  .fl-r { appearance: none; border: 0; background: transparent; color: inherit; display: grid; grid-template-columns: 104px 92px minmax(0, 1fr) 84px; gap: 10px; align-items: center; text-align: left; padding: 0; font-size: 13px; }
  .fl-h { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; color: var(--b-muted); text-transform: uppercase; }
  .fc { display: inline-grid; place-items: center; width: 18px; height: 22px; margin-right: 2px; background: #1c211b; border-top: 1px solid #2f362d; font-style: normal; font-family: var(--mono); font-weight: 600; font-size: 13px; color: #f6f1d0; position: relative; }
  .fc::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid #0b0d0a; }
  .fl-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #f6f1d0; }
  .fl-r.bad .fl-txt { color: var(--dn); }
  .fl-r.flip .fc { animation: flip 0.45s steps(4) 2; }
  @keyframes flip { 50% { transform: scaleY(0.1); } }

  .brk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding-right: 8px; }
  .brk-l { background: var(--fg); color: var(--bg); font-weight: 700; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  .brk.bad .brk-l { background: var(--bad); color: #fff; }
  .brk-b { appearance: none; border: 0; background: transparent; color: inherit; text-align: left; display: grid; gap: 2px; padding: 0; min-width: 0; }
  .brk-b b { font-size: 20px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brk-b span { font-size: 12px; color: var(--b-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brk-d { display: flex; gap: 4px; }
  .brk-d i { width: 16px; height: 3px; background: var(--line-strong); }
  .brk-d i.on { background: var(--fg); }

  .fm { display: flex; align-items: center; gap: 12px; min-width: 0; padding-right: 8px; }
  .fm-b { appearance: none; border: 0; background: transparent; color: inherit; display: flex; gap: 10px; align-items: baseline; min-width: 0; flex: 1; text-align: left; padding: 4px 0; white-space: nowrap; overflow: hidden; }
  .fm-b b { font-size: 15px; }
  .fm-b .muted { overflow: hidden; text-overflow: ellipsis; color: #3d4540; }
  .fm .muted { color: #3d4540; }

  .rk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-right: 8px; }
  .rk-c { appearance: none; border: 1px solid var(--line-strong); background: var(--bg); color: inherit; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 8px 10px; text-align: left; border-radius: 0; min-width: 0; }
  .rk-c.me, .cd.me, .vs-s.me { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .rk-n { font-size: 26px; font-weight: 700; line-height: 1; grid-row: span 2; letter-spacing: -0.04em; }
  .rk-t { display: flex; align-items: center; gap: 2px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .rk-t small { font-family: var(--mono); color: var(--b-muted); margin-left: 6px; }

  function signals(p) {

  function pay(v, what) {
    if (S.cash + 1e-9 < v) { toast(`연구비가 모자랍니다. ${what}에 ${MX(v)}가 필요해요. 위의 '연구비 신청'으로 받을 수 있습니다.`); return false; }

    if (n <= 5) { S.declared = false; S.patent = null; }
    if (n <= 6) { S.ind = null; }
    if (n <= 7) { S.trials = { phase1: null, phase2: null, phase3: null }; }
    if (n <= 8) { S.final = null; }
  }

  /* 작업 진행 — game-server 가 job:update 로 보내는 단계를 흉내 낸다 */
  function runJob(label, phases, ms, done) {
    if (busy) return;
    busy = { label, pct: 0, ph: phases[0] };
    tab = "res";
    render();
    const t0 = performance.now();
    const tick = () => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      busy.pct = Math.round(k * 100);
      busy.ph = phases[Math.min(phases.length - 1, Math.floor(k * phases.length))];
      for (const el of document.querySelectorAll("[data-job-bar]")) el.style.width = busy.pct + "%";
      for (const el of document.querySelectorAll("[data-job-ph]")) el.textContent = `${busy.ph} · ${busy.pct}%`;
      if (k < 1) requestAnimationFrame(tick);
      else { busy = null; done(); save(); render(); }
    };
    requestAnimationFrame(tick);
  }
  const jobBox = () => busy ? `<div class="job" role="status"><div class="job-h"><b>${esc(busy.label)}</b><span data-job-ph>${esc(busy.ph)} · ${busy.pct}%</span></div><div class="bar"><i data-job-bar style="width:${busy.pct}%"></i></div></div>` : "";

  /* ── 구조식(SmilesDrawer) ── */
  const molCache = new Map();
  const dark = () => VAR.tone === "ink" || VAR.tone === "night";
  function mol(smiles, w, h, cls = "") {
    const key = smiles + "|" + w + "|" + h + "|" + dark();
    const box = `<div class="molbox ${cls}" style="aspect-ratio:${w} / ${h}">`;
    if (molCache.has(key)) return `${box}${molCache.get(key)}</div>`;
    return `${box}<svg class="mol" data-smiles="${esc(smiles)}" data-w="${w}" data-h="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="구조식"></svg></div>`;
  }
  function drawMols() {
    const SD = window.SmilesDrawer;
    for (const el of document.querySelectorAll("svg[data-smiles]")) {
      const smi = el.getAttribute("data-smiles"), w = +el.dataset.w, h = +el.dataset.h;
      const key = smi + "|" + w + "|" + h + "|" + dark();
      el.removeAttribute("data-smiles");
      if (!SD) { el.outerHTML = `<span class="fallback">${esc(smi)}</span>`; continue; }
      try {
        const sd = new SD.SmiDrawer({ width: w, height: h, padding: 6, bondThickness: 1.1, compactDrawing: false, fontSizeLarge: 7, fontSizeSmall: 5 });
        sd.draw(smi, el, dark() ? "dark" : "light", () => {
          el.removeAttribute("style"); el.removeAttribute("width"); el.removeAttribute("height"); el.setAttribute("class", "mol");
          /* 그린 분자의 실제 범위로 viewBox 를 다시 잡아 상자 안에 맞춘다 */
          try { const b = el.getBBox(); if (b.width && b.height) el.setAttribute("viewBox", `${b.x - 6} ${b.y - 6} ${b.width + 12} ${b.height + 12}`); } catch (e) {}
          el.setAttribute("preserveAspectRatio", "xMidYMid meet");
          molCache.set(key, el.outerHTML);
        }, () => { el.outerHTML = `<span class="fallback">${esc(smi)}</span>`; });
      } catch (e) { el.outerHTML = `<span class="fallback">${esc(smi)}</span>`; }
    }
  }

  /* ── 위 띠 · 사이드바 · 기록 ── */
  function renderTop() {
    $("top").innerHTML = `
      <div class="brand"><svg aria-hidden="true"><use href="#mark"></use></svg>CRISTA <small>파이프라인 랩</small></div>

      <div class="top-r">
        <button type="button" class="kv rankc" data-team="me"><span>시가총액 순위</span><b>${rankOf("me")}위 · $${pxK("me").toFixed(2)}M</b></button>
        <div class="kv cash"><span>연구비</span><b>${M(S.cash)}</b></div>

        <button type="button" class="btn sm" data-act="logtoggle" aria-pressed="${logOpen}">메시지 기록</button>
      </div>`;
  }
  function stepBtn(st, numLabel) {
    const s = state(st.n);
    const meta = `<span class="st-m"><span class="${s === "done" ? "ok" : ""}">${stLabel[s]}</span><span>${st.cost ? MX(st.cost) : "무료"}</span></span>`;
    return `<li><button type="button" class="st" data-go="${st.n}" data-s="${s}" ${s === "cur" ? 'aria-current="step"' : ""} aria-label="${st.n}단계 ${esc(st.t)} · ${stLabel[s]}">
      <span class="st-n">${numLabel}</span><span class="st-t">${esc(st.t)}</span><span class="st-s">${esc(st.sub)}</span>${meta}</button></li>`;
  }
  function renderSide() {
    const doneN = STEPS.filter((s) => S.done[s.n]).length;
    let nav;
    if (VAR.side === "phase") {
      nav = PHASES.map((p) => {
        const items = STEPS.filter((s) => s.ph === p.n);

        return `<div class="grp"><p class="grp-h"><b>${p.n}.</b>${p.t}<span>${d}/${items.length}</span></p><ol class="steps">${items.map((s, i) => stepBtn(s, `${p.n}.${i + 1}`)).join("")}</ol></div>`;
      }).join("");
    } else {
      const head = VAR.side === "ledger" ? `<div class="lg-head"><span>No.</span><span>단계</span><span>상태</span><span style="text-align:right">비용</span></div>` : "";
      nav = head + `<ol class="steps">${STEPS.map((s) => stepBtn(s, VAR.side === "chip" ? String(s.n) : s.n + ".")).join("")}</ol>`;
    }
    $("side").innerHTML = `
      <p class="side-h">${VAR.side === "chip" ? "단계" : "신약 개발 파이프라인 · 8단계"}</p>
      <nav>${nav}</nav>

  function renderLog() {
    const lines = S.log.length ? S.log.map((l) => `<div class="ln"><span class="d">${esc(l.d)}</span><span class="dir ${l.dir === "S2C" ? "s" : ""}">${l.dir === "S2C" ? "← S" : "→ C"}</span><span class="ev">${esc(l.ev)} <i>${esc(l.msg)}</i></span></div>`).join("")
      : `<div class="ln"><span></span><span></span><span class="ev"><i>단계를 실행하면 game-server와 주고받는 메시지가 여기에 쌓입니다.</i></span></div>`;

  /* ── 단계별 화면: head · ctl · res · act ── */
  const T = () => TARGETS[S.tid];
  const disease = () => D.diseases.find((d) => d.name === S.disease) || D.diseases[0];
  function head(n, eyebrow, lede, chips) {
    const st = STEPS[n - 1];
    const num = VAR.side === "phase" ? `${st.ph}.${STEPS.filter((s) => s.ph === st.ph).indexOf(st) + 1}` : n + ".";
    return `<header class="sh"><div class="sh-n ${VAR.tone === "film" ? "film" : ""}" aria-hidden="true">${num}</div>
      <p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(st.t)}</h1><p class="lede">${lede}</p>
      <div class="chips">${chips.map((c, i) => `<span class="chip ${i === 0 ? "src" : ""}">${esc(c)}</span>`).join("")}</div></header>`;
  }

  function funnel() {
    const all = D.compounds, tid = S.tid;
    const lib = all.filter((c) => S.lib[c.lib]);
    const mt = lib.filter((c) => c.mw <= S.mwMax && c.tpsa <= S.tpsaMax);
    const r5 = mt.filter((c) => c.ro5 <= S.ro5Max);
    const al = S.noAlerts ? r5.filter((c) => !c.al.length) : r5;
    const q = al.filter((c) => c.qed >= S.qedMin).sort((a, b) => (b.sc[tid] || 0) - (a.sc[tid] || 0));
    const sel = q.slice(0, S.topN);
    return { total: all.length, library: lib.length, mwTpsa: mt.length, ro5: r5.length, alerts: al.length, selected: sel.length, sel: sel.map((c) => c.id) };
  }
  const leadC = () => CMP.get(S.lead);
  const leadKcal = () => { const r = S.dock && S.dock.find((d) => d.id === S.lead); return r ? r.kcal : null; };

  const STEP = {
    1: {
      head: () => head(1, "Stage 1 · 표적 탐색실", "질환을 고르면 Open Targets가 매긴 연관 표적 순위가 나옵니다. 결정구조가 준비된 표적이어야 3단계에서 도킹할 수 있어요.",
        ["source: dataset", "experiment:request · stage 1", "Open Targets Platform v4", `수집 ${(D.meta.dat || "").slice(0, 10)}`]),
      ctl: () => `<div class="panel"><span class="lab">질환</span><div class="opts">${D.diseases.map((d) => `
        <button type="button" class="opt" data-act="disease" data-v="${esc(d.name)}" aria-pressed="${S.disease === d.name}">
          <b>${esc(d.name)}</b><span class="mono muted">${esc(d.mondo)}</span><span class="muted">${esc(d.en)}</span><span class="mono muted">연관 표적 ${d.assoc.toLocaleString("ko-KR")}</span></button>`).join("")}</div></div>`,
      res: () => {
        const d = disease();
        return `<div class="panel"><p class="ptitle">${esc(d.name)} 연관 표적 상위 ${d.targets.length} <small>행을 눌러 표적 고르기</small></p><div class="tbl-w"><table>
          <thead><tr><th class="num">순위</th><th>유전자</th><th>이름</th><th>종합 점수</th><th class="num">유전</th><th class="num">약물</th><th class="num">문헌</th><th>결정구조</th><th>도킹</th></tr></thead><tbody>
          ${d.targets.map((t) => {

              <td class="mono">${esc(t.pdbId || "—")}</td><td>${ok ? `<span class="sig g">준비됨</span>` : `<span class="sig w">구조 없음</span>`}</td></tr>`;
          }).join("")}</tbody></table></div></div>`;

      ctl: () => `<div class="panel">

        </tbody></table></div>` : `<div class="empty">조건을 모두 통과한 분자가 없습니다. 분자량이나 TPSA 상한을 올려 보세요.</div>`}</div>`;
      },
      act: () => `<div class="acts"><button type="button" class="btn pri" data-act="s2" ${busy ? "disabled" : ""}>스크리닝 실행 <span class="cost">${MX(R.cost.htvs)}</span></button>
        ${S.screen ? `<button type="button" class="btn" data-go="3">3단계 도킹으로 →</button>` : `<span class="note">다시 실행하면 비용이 다시 듭니다.</span>`}</div>`
    },
    3: {
      head: () => head(3, "Stage 3 · AI 도킹 서버실", `${T().label}(${T().pdb}) 포켓에 후보를 넣어 결합 자유에너지를 잽니다. 기준 리간드 ${T().ref}와 견주어 결합력 p를 매겨요.`,
        ["source: vina", "experiment:request · stage 3", "bio-worker · AutoDock Vina", `비용 ${MX(R.cost.docking)}`]),
      ctl: () => {
        const t = T(), cands = S.screen ? S.screen.sel : [];

          <dt class="muted">PDB</dt><dd style="margin:0">${t.pdb} · ${t.gene}</dd><dt class="muted">기준 리간드</dt><dd style="margin:0">${t.ref} · ${f2(t.refKcal)} kcal/mol</dd>
          <dt class="muted">재도킹 RMSD</dt><dd style="margin:0">${t.rmsd.toFixed(2)} Å ${t.rmsd <= 2 ? "· 방법 검증 통과" : ""}</dd><dt class="muted">CNS 표적</dt><dd style="margin:0">${t.cns ? "예 — 뇌 노출이 효능에 들어감" : "아니오"}</dd></dl></div>
          <div class="panel"><p class="ptitle">도킹할 후보 <small>${S.pick.length} / 5</small></p>
          ${cands.map((id, i) => { const c = CMP.get(id); return `<label class="chk"><input type="checkbox" id="pk${i}" data-act="pick" data-v="${id}" ${S.pick.includes(id) ? "checked" : ""}> ${esc(c.n)} <span class="mono muted">${(c.sc[S.tid] || 0).toFixed(3)}</span></label>`; }).join("")}
          <p class="hint">기준 리간드 ${t.ref}는 비교를 위해 늘 함께 도킹합니다.</p></div>`;
      },
      res: () => {
        if (!S.dock) return `${jobBox()}<div class="empty">후보를 골라 도킹을 실행하면 결합 자유에너지(kcal/mol)와 결합력 p가 여기에 나옵니다.</div>`;
        const t = T(), lo = -14, hi = -4, x = (k) => Math.max(0, Math.min(100, ((hi - k) / (hi - lo)) * 100));
        const rows = S.dock.slice().sort((a, b) => a.kcal - b.kcal);
        const fc = CMP.get(S.focus) || null;
        const focusSmiles = fc ? fc.s : t.refSmiles;
        return `${jobBox()}<div class="panel"><p class="ptitle">결합 자유에너지 <small>막대가 길수록 강하게 결합</small></p>
          <div class="dk-axis"><span></span><div><span>${hi}</span><span>${(hi + lo) / 2}</span><span>${lo} kcal/mol</span></div><span style="text-align:right">ΔG</span><span style="text-align:right">p</span></div>
          <div class="dk">${rows.map((r) => `<button type="button" class="dk-r" data-act="focus" data-v="${r.id}" aria-pressed="${S.focus === r.id}">

            <span class="mono" style="text-align:right">${f2(r.kcal)}</span><span class="mono" style="text-align:right">${strength(r.kcal, t.refKcal).toFixed(2)}</span></button>`).join("")}</div>

    5: {

    }
  };

  /* ── 배치 ── */
  function compose() {
    const P = STEP[S.step], h = P.head(), c = P.ctl(), r = P.res(), a = P.act();
    const B = (k, html) => `<section class="blk" data-blk="${k}">${html}</section>`;
    const n = S.step;
    switch (VAR.main) {
      case "split": return `${h}<div class="m-split"><div class="col-a">${B("ctl", c)}${B("act", a)}</div><div class="col-b">${B("res", r)}</div></div>`;
      case "console": return `${h}<div><div class="tabs" role="tablist">
          <button type="button" role="tab" data-act="tab" data-v="set" aria-selected="${tab === "set"}">설정<span class="mono">입력</span></button>
          <button type="button" role="tab" data-act="tab" data-v="res" aria-selected="${tab === "res"}">결과<span class="mono">${busy ? "실행 중" : "출력"}</span></button></div>
          <div style="padding-top:18px">${tab === "set" ? B("ctl", c) : B("res", r)}</div></div><div class="dock">${B("act", a)}</div>`;
      case "notebook": return `${h}
          <div class="cell"><div class="cell-g"><b>In [${n}.1]</b>입력</div>${B("ctl", c)}</div>
          <div class="cell"><div class="cell-g"><b>Run [${n}.2]</b>실행</div><div style="padding-top:8px">${B("act", a)}</div></div>
          <div class="cell"><div class="cell-g"><b>Out [${n}.3]</b>출력</div>${B("res", r)}</div>`;
      case "board": return `<div class="m-board" style="display:grid;gap:20px">${h}${B("res", r)}${B("act", a)}<div class="ctl-strip"><span class="lab">조건 바꾸기</span>${B("ctl", c)}</div></div>`;
      case "deck": return `${h}<div class="m-deck"><div class="card"><p class="card-h"><span>입력</span><span>${n}.1</span></p>${B("ctl", c)}</div>
          <div class="card"><p class="card-h"><span>실행</span><span>${n}.2</span></p>${B("act", a)}<p class="hint" style="margin-top:14px">${esc(STEPS[n - 1].sub)} · 결과는 아래 카드에 남습니다.</p></div>
          <div class="card wide"><p class="card-h"><span>결과</span><span>${n}.3</span></p>${B("res", r)}</div></div>`;
      default: return `${h}${B("ctl", c)}${B("res", r)}${B("act", a)}`;
    }
  }
  function renderMain(keepScroll) {
    const m = $("main"), st = m.scrollTop;
    m.innerHTML = `<div class="wrap">${compose()}</div>`;
    if (keepScroll) m.scrollTop = st;
    drawMols();
  }
  function render(keep = true) {
    const ae = document.activeElement, fid = ae && ae.id;
    renderTop(); renderSide(); renderMain(keep); renderLog();
    if (fid && $(fid) && !$(fid).disabled) $(fid).focus({ preventScroll: true });
  }
  /* 슬라이더 · 글자 입력은 결과 칸만 다시 그려 입력 중인 칸을 지킨다 */
  function refresh(k) {
    const P = STEP[S.step];
    for (const el of document.querySelectorAll(`[data-blk="${k}"]`)) el.innerHTML = P[k]();
    drawMols();
  }

  function go(n) {
    if (!unlocked(n)) { toast(`${n - 1}단계를 먼저 끝내야 ${n}단계가 열립니다.`); return; }
    if (busy) { toast("실행 중인 작업이 끝나면 옮겨 갈 수 있어요."); return; }
    S.step = n; tab = "set"; save(); render(false); $("main").scrollTop = 0;
  }

  /* ── 행동 ── */
  function act(a, v, el) {
    switch (a) {
      case "grant": {
        const G = [["VC 샌드힐 밸리 시드 투자", 1.0], ["정부 신약 과제 연구비", 1.5]];
        if (S.grants >= G.length) { toast("이 미리보기에서 받을 수 있는 연구비를 다 받았습니다."); return; }
        const [what, amt] = G[S.grants++]; S.cash = Math.round((S.cash + amt) * 1000) / 1000;
        log("S2C", "funds:granted", `${what} +${M(amt)}`); myNews(S.grants === 1 ? "investment" : "grant"); toast(`${what} ${M(amt)}를 받았습니다.`); break;
      }
      case "logtoggle": logOpen = !logOpen; $("shell").classList.toggle("log-open", logOpen); break;
      case "tab": tab = v; break;
      case "bpause": bPaused = !bPaused; break;
      case "brot": rot = Math.max(0, rot + (+v) + 40); rotAt = Date.now() + 8000; break;
      case "bfold": bOpen = !bOpen; break;
      case "bfilter": bFilter = v; break;
      case "tclose": openTeam = null; break;
      case "disease": {
        if (S.disease === v) return;
        S.disease = v; const d = disease(); const t = d.targets.find((x) => x.dockingTargetId) || d.targets[0];
        S.target = t.symbol; S.tid = t.dockingTargetId || S.tid; S.pop = null; S.ep = null; resetFrom(1); break;
      }
      case "target": {
        const t = disease().targets.find((x) => x.symbol === v); S.target = v;
        if (t.dockingTargetId && t.dockingTargetId !== S.tid) { S.tid = t.dockingTargetId; S.pop = null; S.ep = null; resetFrom(1); }
        break;
      }
      case "s1": {
        log("C2S", "experiment:request", `stage 1 · ${S.disease} → ${S.target}`);
        runJob("Stage 1 · 표적 근거 조회", ["queued", "dataset 조회", "결과 정리"], 700, () => {
          log("S2C", "job:result", `source dataset · ${S.target} · PDB ${T().pdb}`); finish(1); S.step = 2; tab = "set";
        });
        return;
      }
      case "lib": S.lib[v] = el.checked; break;
      case "noal": S.noAlerts = el.checked; break;
      case "ro5": S.ro5Max = +v; break;
      case "topn": S.topN = +v; break;
      case "s2": {
        if (!pay(R.cost.htvs, "스크리닝")) { render(); return; }
        const f = funnel();
        log("C2S", "experiment:request", `stage 2 · ${T().gene} · MW≤${S.mwMax} TPSA≤${S.tpsaMax} Ro5≤${S.ro5Max}`);
        runJob("Stage 2 · RDKit 물성 깔때기", ["queued", "물성 계산", "필터", "점수 정렬"], 1100, () => {
          resetFrom(2); S.screen = f; S.pick = f.sel.slice(0, 3); finish(2);
          log("S2C", "job:result", `source dataset · ${f.total} → ${f.selected} · funnel`);
        });
        return;
      }
      case "pick": {
        if (el.checked) { if (S.pick.length >= 5) { el.checked = false; toast("한 번에 5개까지 도킹할 수 있어요."); return; } S.pick.push(v); }
        else S.pick = S.pick.filter((x) => x !== v);
        break;
      }
      case "s3": {
        if (!pay(R.cost.docking, "도킹")) { render(); return; }
        const t = T();
        log("C2S", "experiment:request", `stage 3 · ${t.pdb} · ${S.pick.length}+1 ligands`);
        runJob(`Stage 3 · Vina 도킹 · ${t.pdb}`, ["queued", "수용체 준비", "리간드 3D 생성", "Vina 탐색 exhaustiveness 8", "포즈 정리"], 1800, () => {
          resetFrom(3);
          S.dock = [{ id: "__ref", name: t.ref + " (기준)", kcal: t.refKcal, ref: true }].concat(S.pick.map((id) => { const c = CMP.get(id); return { id, name: c.n, kcal: c.vk[S.tid] ?? -6 }; }));
          S.focus = S.pick[0]; finish(3);
          const best = Math.min(...S.dock.filter((d) => !d.ref).map((d) => d.kcal));
          if (best <= -7 && (S.mk.best.me == null || best < S.mk.best.me)) { S.mk.best.me = best; myNews("docking", { kcal: best }); }
          log("S2C", "job:result", `source vina · best ${f2(Math.min(...S.dock.filter((d) => !d.ref).map((d) => d.kcal)))} kcal/mol`);
        });
        return;
      }
      case "focus": S.focus = v === "__ref" ? null : v; break;
      case "s4": {
        if (!pay(R.cost.admet, "ADMET 예측")) { render(); return; }
        log("C2S", "experiment:request", `stage 4 · predict · ${S.dock.length - 1} molecules`);
        runJob("Stage 4 · ADMET-AI v2 예측", ["queued", "predict", "신호 정리"], 1300, () => {
          S.admet = true; const best = S.dock.filter((d) => !d.ref).sort((a, b) => a.kcal - b.kcal)[0]; S.lead = best && best.id;
          log("S2C", "job:result", "source admet-ai · signals ready");
        });
        return;
      }
      case "lead": S.lead = v; resetFrom(5); delete S.done[4]; break;
      case "s4lead": {
        finish(4); S.step = 5; tab = "set";
        if (!S.code) S.code = (S.ticker.replace(/[^A-Z]/g, "").slice(0, 3) || "CRX") + "-101";
        if (!S.mech) S.mech = `${T().gene} 억제제 — ${T().disease}`;
        break;
      }
      case "declare": S.declared = true; log("C2S", "pipeline:declare", `${S.code} · ${S.mech}`); log("S2C", "pipeline:program", `${S.code} 선언됨`); toast(`${S.code} 프로그램을 선언했습니다.`); break;
      case "patent": {
        if (!pay(R.cost.patent, "특허 출원")) { render(); return; }
        log("C2S", "pipeline:patent", `${S.code} · ${leadC().n}`);
        runJob("물질특허 출원 · 시청 · 특허청", ["접수", "선행 특허 대조", "원장 등록"], 900, () => {
          S.patent = { no: `KR-${10 + S.day % 90}-${String(1000 + Math.floor(Math.random() * 8999))}`, day: S.day }; finish(5); myNews("patent");
          log("S2C", "pipeline:patent-ledger", `${S.patent.no} 공개 원장 등록`);
        });
        return;
      }
      case "form": if (S.form !== v) { S.form = v; if (S.ind) { S.ind = null; resetFrom(6); toast("제형을 바꿔 IND를 새로 내야 합니다."); } } break;
      case "dose": {
        const nd = +v; if (S.dose === nd) return;
        if (S.ind && S.ind.pass && S.p1dose && nd > S.p1dose) { S.trials = { phase1: null, phase2: null, phase3: null }; delete S.done[7]; toast("1상 통과 용량보다 올려서 1상부터 다시 합니다."); }
        S.dose = nd; break;
      }
      case "ind": {
        if (!pay(R.cost.ind, "IND 신청")) { render(); return; }
        const sc = score(leadC(), leadKcal(), S.tid, S.form, S.dose, S.pop);
        log("C2S", "pipeline:formulate", `${FORM[S.form]}`); log("C2S", "pipeline:ind", `${S.dose} mg · ${S.pop}`);
        runJob("IND 심사 · FDA", ["접수", "전임상 자료 검토", "판정"], 1100, () => {
          S.day += R.days.ind; S.ind = { pass: sc.S >= 35, S: sc.S, day: S.day };
          if (S.ind.pass) { finish(6); S.p1dose = null; }
          myNews(S.ind.pass ? "indPass" : "indHold");
          log("S2C", "pipeline:step-result", `IND ${S.ind.pass ? "승인" : "임상 보류"} · S ${sc.S.toFixed(1)}`);
        });
        return;
      }
      case "amend": S.step = 6; delete S.done[7]; toast("용량을 바꾼 뒤 7단계로 돌아오세요. 용량 변경은 무료입니다."); break;
      case "trial": {
        const k = v; if (!pay(R.cost[k], "임상")) { render(); return; }
        log("C2S", "pipeline:trial", `${S.code} · ${k}`);
        runJob(`${{ phase1: "임상 1상", phase2: "임상 2상", phase3: "임상 3상" }[k]} · 대학병원`, ["등록", "투약", "추적 관찰", "판정"], 1500, () => {
          const sc = score(leadC(), leadKcal(), S.tid, S.form, S.dose, S.pop), r = R.noise[k], n = Math.floor(Math.random() * (2 * r + 1)) - r;
          const E = Math.max(0, sc.E + n), Sv = Math.max(0, sc.S + n), th = R.th[k];
          const pass = (th.e == null || E >= th.e) && (th.s == null || Sv >= th.s);
          S.day += R.days[k]; S.trials[k] = { pass, E, S: Sv, n };
          if (k === "phase1" && pass) S.p1dose = S.dose;
          if (k === "phase3" && pass) finish(7);
          myNews(k + (pass ? "Pass" : "Fail"));
          log("S2C", "pipeline:step-result", `${k} ${pass ? "통과" : "실패"} · E ${E.toFixed(1)} S ${Sv.toFixed(1)} (n ${n})`);
        });
        return;
      }
      case "shape": S.shape = v; break;
      case "color": S.color = v; break;
      case "final": {
        if (!pay(R.cost.final, "최종 허가")) { render(); return; }
        log("C2S", "pipeline:final", `${S.brand} · ${S.shape}/${S.color}`);
        runJob("최종 허가 심사 · FDA", ["접수", "서류 검토", "허가"], 1200, () => {
          S.day += R.days.final; S.final = { day: S.day, spent: Math.round((6 + [1, 1.5].slice(0, S.grants).reduce((a, b) => a + b, 0) - S.cash) * 1000) / 1000 }; finish(8);
          myNews("approval", { brand: S.brand, mult: R.approvalMult[S.form] });
          log("S2C", "pipeline:approved", `${S.brand} 허가 · 증권거래소 리포트`);
        });
        return;
      }
      case "again": { const keep = { company: S.company, ticker: S.ticker, cash: S.cash, day: S.day, grants: S.grants, log: S.log, mk: S.mk }; S = Object.assign(fresh(), keep); log("C2S", "pipeline:new", "새 프로그램"); break; }
    }
    save(); render();
  }

  /* ── 이벤트 ── */
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g && !g.disabled) { go(+g.dataset.go); return; }
    const tm = e.target.closest("[data-team]");
    if (tm && !e.target.closest("[data-act]")) { openTeam = tm.dataset.team; renderDrawer(); return; }
    const a = e.target.closest("[data-act]");
    if (!a || a.disabled || a.tagName === "INPUT") return;
    act(a.dataset.act, a.dataset.v, a);
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act]")) { e.preventDefault(); act(e.target.dataset.act, e.target.dataset.v, e.target); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("input[type=checkbox][data-act]")) act(t.dataset.act, t.dataset.v, t);
    else if (t.matches("select[data-sel]")) { S[t.dataset.sel] = t.value; save(); refresh("res"); }
    else if (t.id === "co-name") { S.company = t.value.trim() || "한빛바이오"; save(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.num) {
      const v = +t.value; S[t.dataset.num] = v;
      const o = t.parentElement.querySelector("output"); if (o) o.textContent = t.dataset.num === "qedMin" ? v.toFixed(2) : v;
      save(); refresh("res");
    } else if (t.dataset.txt) {
      S[t.dataset.txt] = t.dataset.txt === "code" ? t.value.toUpperCase() : t.value;
      if (t.dataset.txt === "code") t.value = S.code;
      save(); refresh("res"); refresh("act");
      const h = document.querySelector(`[data-hint="${t.dataset.txt}"]`);
      if (h && t.dataset.txt === "code") { const ok = /^[A-Z]{2,4}-\d{3}$/.test(S.code); h.className = "hint " + (S.code ? (ok ? "good" : "bad") : ""); h.textContent = !S.code ? "영문 대문자 2~4자 + '-' + 숫자 3자리 (예: CRX-101)" : ok ? "쓸 수 있는 코드명입니다." : "형식이 맞지 않습니다. 예: CRX-101"; }
      if (h && t.dataset.txt === "brand") h.textContent = S.brand.trim() ? `${S.brand.trim().length} / 20자` : "1~20자";
    } else if (t.id === "co-name") {
      S.company = t.value; const lat = t.value.replace(/[^A-Za-z]/g, "").toUpperCase();
      S.ticker = lat.length >= 3 ? lat.slice(0, 4) : S.ticker; const tk = document.querySelector(".tick"); if (tk) tk.textContent = S.ticker; save();
    }
  });

  /* ── 전광판 고르기 ── */
  const pick = $("vpick");
  pick.innerHTML = BOARDS.map((b, i) => `<option value="${b.id}">${pad(i + 1)} ${esc(b.name)}</option>`).join("");
  function applyBase() {
    const sh = $("shell");
    document.documentElement.dataset.tone = VAR.tone;
    Object.assign(sh.dataset, { side: VAR.side, main: VAR.main, top: VAR.top, log: VAR.log, fill: VAR.fill, scale: VAR.scale });
  }
  function show(id) {
    BV = BOARDS.find((b) => b.id === id) || BOARDS[0];
    pick.value = BV.id;
    $("vcount").textContent = `${BV.id.slice(1)} / ${BOARDS.length}`;
    $("videa").textContent = BV.idea;
    rot = 0;
    try { history.replaceState(null, "", "#" + BV.id); } catch (e) {}
    try { localStorage.setItem("crista-board-variant", BV.id); } catch (e) {}
    renderBoard(); renderDrawer();
  }
  const step = (d) => { const i = BOARDS.indexOf(BV); show(BOARDS[(i + d + BOARDS.length) % BOARDS.length].id); };
  $("vprev").addEventListener("click", () => step(-1));
  $("vnext").addEventListener("click", () => step(1));
  pick.addEventListener("change", () => show(pick.value));
  $("vreset").addEventListener("click", () => { if (busy) return; S = fresh(); save(); tab = "set"; openTeam = null; render(false); toast("처음부터 다시 시작합니다. 연구비 $6.0M · 주가 $10.00"); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openTeam) { openTeam = null; renderDrawer(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, select, textarea")) return;
    if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
  });

  /* 다른 모둠 소식은 7~11초마다, 돌려 보는 전광판은 5초마다 넘어간다. 멈추기 · 탭 숨김이면 쉰다. */
  let nextAt = Date.now() + 4000, rotAt = Date.now() + 5000;
  setInterval(() => {
    if (bPaused || document.hidden) return;
    const now = Date.now();
    let dirty = false;
    if (now >= nextAt) {
      rivalTick(); save(); nextAt = now + 7000 + Math.random() * 4000; dirty = true;
      if (BV.type === "toast") { toastId = S.mk.news[0].id; setTimeout(() => { toastId = 0; renderBoard(); }, 4500); }
      renderTop();
      if (openTeam) renderDrawer();
    }
    if (now >= rotAt) { rotAt = now + 5000; if (ROT.has(BV.type)) { rot++; dirty = true; } }
    if (dirty) renderBoard();
  }, 500);

  if (!S.mk || !S.mk.cnt) S.mk = seedMarket();
  if (!S.pop) S.pop = TRIAL[S.tid].pops[0];
  if (!S.ep) S.ep = TRIAL[S.tid].eps[0];
  const _render = render;
  render = function (k) {
    if (!S.pop || !TRIAL[S.tid].pops.includes(S.pop)) S.pop = TRIAL[S.tid].pops[0];
    if (!S.ep || !TRIAL[S.tid].eps.includes(S.ep)) S.ep = TRIAL[S.tid].eps[0];
    _render(k); renderBoard(); renderDrawer();
  };
  applyBase();
  render(false);
  let saved = null; try { saved = localStorage.getItem("crista-board-variant"); } catch (e) {}
  const h = location.hash.slice(1);
  show(BOARDS.some((b) => b.id === h) ? h : BOARDS.some((b) => b.id === saved) ? saved : BOARDS[0].id);
})();
</script>

<title>Crista 다음 넘기기 30안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 위 = Gemini 4 Argon(High)과의 협의 요약(진단 · 원칙 · 추천 조합), 끈끈한 막대 = 묶음 바로가기 · 상태 타임라인(잠김 → 할 일 남음 → 계산 중 → 넘어갈 수 있음 → 넘긴 뒤) · 기기,
     아래 = 6묶음 × 5 카드. 카드 안은 ③ 작업 화면(둥근 섬)의 축소 모형 — 시안이 바꾸는 자리만 또렷하게, 나머지는 회색 뼈대로 둔다.
     색 · 글꼴은 apps/web/src/styles.css 의 Crista 토큰. 앱처럼 밝은 박막 톤 하나로 고정한다(다른 design/*-30 시안과 같다). */
  :root {
    --bg: #f1f1e9; --surface: #fbfbf6; --raise: #e7e8de; --raise-2: #dcddd2; --fg: #080b09; --muted: #5b6358; --faint: #8d948a;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32); --ghost: rgba(8, 11, 9, 0.075); --ghost-2: rgba(8, 11, 9, 0.12);
    --hi: #c6ff4a; --hi-fg: #080b09; --hi-soft: rgba(198, 255, 74, 0.42);
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14); --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11);
    --night: #0b0d0a; --led: #ffcf5a;
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --g1: radial-gradient(ellipse 110% 75% at 40% -5%, #d4c7f1, transparent 85%), radial-gradient(ellipse 95% 60% at 75% 110%, #dce5ee, transparent 90%), #f1ecef;
    --g2: linear-gradient(135deg, #ded6f4, #f1e9e2, #d5eadd);
    --g3: radial-gradient(ellipse 145% 55% at 10% 100%, #bfe1dc, transparent 90%), linear-gradient(125deg, #dae5f5, #f1ebd9 75%);
    --g4: radial-gradient(ellipse 95% 85% at 0% 20%, #f1ccb9, transparent 80%), radial-gradient(ellipse 90% 85% at 100% 95%, #c7e5d9, transparent 80%), #f4ece5;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--hi-fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .page { max-width: 1520px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  .hd { display: grid; gap: 10px; max-width: 820px; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--film); box-shadow: 0 0 0 1px var(--fg); }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; }
  h1 em { font-style: normal; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--fg); }
  .lede { margin: 0; color: var(--muted); max-width: 68ch; }
  .lede b { color: var(--fg); font-weight: 600; }

  /* 협의 요약 */
  .talk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tk { background: var(--surface); border-radius: 20px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .tk h2 { margin: 0; font-size: 15px; letter-spacing: -0.01em; display: flex; gap: 8px; align-items: baseline; }
  .tk h2 small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
  .tk ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: k; }
  .tk li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: 13px; line-height: 1.5; }
  .tk li::before { counter-increment: k; content: counter(k); font-family: var(--mono); font-size: 11px; font-weight: 600; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); margin-top: 1px; }
  .tk li b { font-weight: 700; }
  .tk li .who { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
  .tk.rec { background: var(--fg); color: var(--bg); }
  .tk.rec li::before { background: var(--hi); color: var(--hi-fg); }
  .tk.rec h2 small, .tk.rec .who { color: #b9c0b5; }
  .tk.rec a { color: var(--hi); text-decoration: none; font-family: var(--mono); font-weight: 600; }
  .tk.rec a:hover { text-decoration: underline; }

  /* 끈끈한 막대 */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .bar-r { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .jump { display: flex; flex-wrap: wrap; gap: 4px 14px; min-width: 0; }
  .jump .jg { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .jump .jg > span { font-size: 11.5px; font-weight: 700; margin-right: 4px; }
  .jump a { font-family: var(--mono); font-size: 11px; text-decoration: none; padding: 2px 6px; border-radius: 999px; color: var(--muted); border: 1px solid transparent; }
  .jump a:hover { border-color: var(--line-strong); color: var(--fg); }
  .jump a.on { background: var(--fg); color: var(--bg); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: var(--raise); }
  .seg button { appearance: none; border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--muted); }
  .seg button i { font-style: normal; font-family: var(--mono); font-size: 10px; margin-right: 4px; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg.sm button { padding: 3px 8px; font-size: 11px; }
  .seg.sm { background: var(--bg); }
  .lbl { font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .picks { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
  .picks output { font-family: var(--mono); font-size: 12px; }
  .btn { appearance: none; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }

  /* 묶음 · 카드 */
  .sec { display: grid; gap: 14px; scroll-margin-top: 120px; }
  .sec-h { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .sec-h h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  .sec-h h2 b { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-right: 6px; }
  .sec-h p { margin: 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); gap: 14px; }
  .grid[data-dev="ph"] { grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  .card { background: var(--surface); border-radius: 22px; padding: 14px; display: grid; gap: 10px; align-content: start; scroll-margin-top: 120px; min-width: 0; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s ease; }
  .card[data-picked="true"] { box-shadow: inset 0 0 0 2px var(--fg), 0 0 0 4px var(--hi-soft); }
  .ch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .cn { font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -0.04em; padding-top: 2px; }
  .ch h3 { margin: 0; font-size: 16px; letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance; }
  .ch .one { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .src { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
  .src span { font-family: var(--mono); font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
  .src span.g { background: #e5ecff; border-color: #9fb3e6; color: #24418a; }
  .src span.c { background: #ffe8d6; border-color: #e4b18c; color: #8a4517; }
  .pick { appearance: none; border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pick[aria-pressed="true"] { background: var(--hi); border-color: var(--fg); }
  .cbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .cm { overflow-x: auto; border-radius: 18px; }
  .grid[data-dev="pc"] .cm > .mk { min-width: 600px; }
  .home-grid[data-dev="pc"] .cm > .mk { min-width: 760px; }
  .cd { margin: 0; display: grid; gap: 4px; font-size: 12.5px; }
  .cd div { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; }
  .cd dt { color: var(--muted); font-weight: 600; font-size: 11.5px; padding-top: 1px; }
  .cd dd { margin: 0; min-width: 0; }
  .cd dd.weak { color: var(--bad); }

  /* ── 작업 화면 축소 모형(.mk = 1440 · .ph = 폰 390) ── */
  .mk { position: relative; display: grid; grid-template-columns: 122px minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; grid-template-areas: "top top" "led led" "side head" "side body"; gap: 6px; padding: 7px; background: var(--raise); border-radius: 18px; font-size: 11px; line-height: 1.45; min-height: 400px; overflow: hidden; }
  .mk-top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 10px; color: var(--muted); }
  .mk-top b { color: var(--fg); font-size: 11px; }
  .mk-top .mono { margin-left: auto; color: var(--fg); }
  .mk-led { grid-area: led; background: var(--night); color: var(--led); border-radius: 8px; padding: 3px 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mk-led b { color: var(--hi); font-weight: 600; }
  .mk-side { grid-area: side; background: var(--surface); border-radius: 14px; padding: 6px; display: grid; gap: 5px; align-content: start; min-width: 0; position: relative; }
  .mk-nm { border: 1px solid var(--line-strong); border-radius: 9px; text-align: center; font-weight: 700; padding: 3px; font-size: 11px; }
  .mk-g { border-radius: 10px; padding: 4px 2px 2px; display: grid; gap: 1px; }
  .mk-g[data-g="1"] { background: var(--g1); } .mk-g[data-g="2"] { background: var(--g2); } .mk-g[data-g="3"] { background: var(--g3); } .mk-g[data-g="4"] { background: var(--g4); }
  .mk-g[data-lock] { filter: saturate(0.45); opacity: 0.8; }
  .mk-gh { display: flex; gap: 4px; align-items: baseline; padding: 0 5px; font-weight: 700; font-size: 10.5px; }
  .mk-gh i { font-style: normal; font-family: var(--mono); font-size: 9px; color: var(--muted); }
  .mk-gh span { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--muted); font-weight: 500; }
  .st { display: grid; grid-template-columns: 21px minmax(0, 1fr) auto; gap: 3px; align-items: center; padding: 3px 5px; border-radius: 7px; font-size: 10px; min-height: 20px; position: relative; }
  .st .n { font-family: var(--mono); font-size: 9px; font-weight: 600; }
  .st .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .k { font-size: 9px; display: inline-flex; align-items: center; gap: 2px; }
  .st.cur { background: var(--fg); color: var(--bg); }
  .st.lk { color: var(--faint); }
  .mk-head { grid-area: head; background: var(--surface); border-radius: 14px; padding: 7px 9px; display: grid; gap: 6px; min-width: 0; position: relative; }
  .hbar { display: flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
  .hno { font-family: var(--mono); font-size: 10.5px; font-weight: 600; border: 1px solid var(--fg); border-radius: 999px; padding: 0 7px; background: var(--film); line-height: 18px; }
  .h1 { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; white-space: nowrap; }
  .tabs { margin-left: auto; display: flex; gap: 1px; flex-wrap: nowrap; min-width: 0; overflow: hidden; }
  .hr { margin-left: auto; display: inline-flex; gap: 7px; align-items: center; }
  .tb { padding: 3px 5px; border-radius: 7px; font-weight: 600; font-size: 9.5px; white-space: nowrap; display: inline-flex; gap: 3px; align-items: baseline; color: var(--fg); }
  .tb i { font-style: normal; font-family: var(--mono); font-size: 9px; color: var(--muted); }
  .tb.on { background: var(--hi); }
  .tb.on i { color: var(--fg); }
  .tb.dim { color: var(--faint); }
  .mk-body { grid-area: body; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 6px; align-content: start; min-width: 0; }
  .mk-body.one { grid-template-columns: minmax(0, 1fr); }
  .isl { background: var(--surface); border-radius: 14px; padding: 8px 9px; display: grid; gap: 6px; align-content: start; min-width: 0; position: relative; }
  .ih { font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .ih::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
  .ih.tm::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg); }
  .ih small { margin-left: auto; font-weight: 500; font-size: 9.5px; color: var(--muted); }
  .wcap { font-size: 10px; color: var(--muted); font-weight: 600; }
  .skp { background: var(--bg); border-radius: 10px; padding: 7px; display: grid; gap: 5px; }
  .sk { height: 6px; border-radius: 3px; background: var(--ghost); }
  .bub { display: grid; gap: 3px; max-width: 82%; }
  .bub.me { justify-self: end; }
  .bub .sk { height: 14px; border-radius: 8px; }
  .bub small { font-size: 8.5px; color: var(--faint); }
  .mk-dock { grid-column: 1 / -1; }
  .mk-ov { position: absolute; inset: 0; background: rgba(8, 11, 9, 0.34); border-radius: 14px; display: grid; place-items: center; padding: 12px; z-index: 3; }
  .mk-toast { position: absolute; right: 8px; top: 8px; z-index: 4; max-width: 70%; }
  .mk-float { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; }

  /* 시안이 그리는 또렷한 부품 */
  .b { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 10.5px; border: 1px solid var(--line-strong); background: transparent; white-space: nowrap; line-height: 1.3; color: var(--fg); }
  .b.ink { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .b.lime { background: var(--hi); border-color: var(--fg); }
  .b.film { background: var(--film); border-color: transparent; }
  .b.off { border-style: dashed; color: var(--muted); background: transparent; }
  .b.lg { padding: 7px 14px; font-size: 12px; }
  .b.xl { padding: 9px 18px; font-size: 13px; }
  .b.wide { width: 100%; justify-content: center; }
  .b small { font-weight: 500; font-size: 9.5px; opacity: 0.8; }
  .b .mono { font-size: 9.5px; }
  button.b, [data-go] { cursor: pointer; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 7px; font-size: 9.5px; font-weight: 600; background: var(--raise); white-space: nowrap; }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .pill.lime { background: var(--hi); }
  .pill.ink { background: var(--fg); color: var(--bg); }
  .key { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; background: var(--fg); color: var(--hi); font-size: 8px; font-weight: 700; flex: none; }
  .box { border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; background: var(--surface); }
  .box.paper { background: var(--bg); }
  .box.ink { background: var(--fg); color: var(--bg); }
  .box.lime { background: var(--hi); }
  .box.film { background: var(--film); }
  .box.line { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .box.dash { box-shadow: none; outline: 1px dashed var(--line-strong); outline-offset: -1px; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .row.sp { justify-content: space-between; flex-wrap: nowrap; }
  .tt { font-weight: 700; font-size: 11.5px; }
  .tt.lg { font-size: 13px; }
  .tt.xl { font-size: 16px; letter-spacing: -0.02em; }
  .mu { color: var(--muted); font-size: 10px; }
  .box.ink .mu { color: #b9c0b5; }
  .ck { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .ck li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 5px; align-items: center; font-size: 10.5px; }
  .ck li > i { font-style: normal; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; font-weight: 700; box-shadow: inset 0 0 0 1.3px var(--line-strong); }
  .ck li.ok > i { background: var(--fg); color: var(--hi); box-shadow: none; }
  .ck li.run > i { box-shadow: inset 0 0 0 1.3px var(--warn); color: var(--warn); }
  .ck li.ok span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .ck li em { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .bar-p { height: 6px; border-radius: 3px; background: var(--ghost-2); overflow: hidden; position: relative; }
  .bar-p > i { position: absolute; inset: 0 auto 0 0; background: var(--fg); border-radius: 3px; }
  .bar-p.film > i { background: var(--film); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .bar-p.lime > i { background: var(--hi); box-shadow: inset 0 0 0 1px var(--fg); }
  .av { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 8.5px; font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 1.2px var(--fg); flex: none; }
  .av.on { background: var(--hi); }
  .av.dim { opacity: 0.4; }
  .avs { display: inline-flex; }
  .avs .av + .av { margin-left: -4px; }
  .av.xs { width: 13px; height: 13px; font-size: 7px; }
  .arw { font-family: var(--mono); color: var(--muted); }
  .hl { animation: hl 2.4s ease-in-out infinite; }
  @keyframes hl { 0%, 100% { box-shadow: 0 0 0 0 rgba(198, 255, 74, 0); } 50% { box-shadow: 0 0 0 4px rgba(198, 255, 74, 0.85); } }
  .spin { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--warn); border-right-color: transparent; animation: sp 1s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .lockic { width: 9px; height: 10px; flex: none; }
  .ring { width: 26px; height: 26px; flex: none; }
  .sep { width: 1px; align-self: stretch; background: var(--line-strong); }
  .vsep { height: 1px; background: var(--line); }

  /* 폰 모형 — 앱의 ≤ 860px 모양: 위 띠 → 단계 칩 줄 → 머리 섬 → 작업대 → 모둠 공유. */
  .ph { width: 300px; max-width: 100%; height: 600px; margin: 0 auto; border-radius: 36px; border: 6px solid var(--fg); background: var(--raise); position: relative; overflow: hidden; font-size: 11px; line-height: 1.45; }

  return `<svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--ghost-2)" stroke-width="3"/>${p > 0 ? '' : '<!--'}<circle cx="13" cy="13" r="${r}" fill="none" stroke="${on ? 'var(--fg)' : 'var(--warn)'}" stroke-width="3" stroke-dasharray="${(c * p) / 100} ${c}" transform="rotate(-90 13 13)" stroke-linecap="round"/>${p > 0 ? '' : '-->'}${on ? '<circle cx="13" cy="13" r="7.5" fill="var(--hi)"/><path d="M9.4 13.2l2.5 2.5 4.8-5" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' : '<rect x="9.5" y="12" width="7" height="5.4" rx="1.1" fill="var(--muted)"/><path d="M11 12.1v-1.3a2 2 0 0 1 4 0v1.3" fill="none" stroke="var(--muted)" stroke-width="1.2"/>'}</svg>`;
}
function checklist(c, opt = {}) {
  return `<ul class="ck">${c.cond.map((x) => `<li class="${x.s}"><i>${x.s === 'ok' ? '✓' : x.s === 'run' ? '▸' : x.key ? '<b>!</b>' : ''}</i><span>${x.key ? '<b>열쇠</b> · ' : ''}${x.t}${opt.at ? ` <em>${x.at}</em>` : ''}</span><em>${x.v}</em></li>`).join('')}</ul>`;
}
/* '다음 단계' 단추 하나 — 상태마다 문구 · 모양이 바뀐다. 넘어갈 수 있을 때 누르면 '넘긴 뒤'로 간다. */
function nextBtn(c, o = {}) {
  const cls = (t) => `b ${t}${o.size ? ` ${o.size}` : ''}${o.wide ? ' wide' : ''}`;
  if (c.after) return `<span class="${cls('off')}">${o.afterText ?? '① 도킹 1건 하면 2.2 열려요'}</span>`;
  if (c.ready) return `<button type="button" class="${cls(o.tone ?? 'lime')}${o.pulse ? ' hl' : ''}" data-go="after">${o.readyText ?? `2.1 분자 도킹으로 ${ARW}`}</button>`;
  if (c.run) return `<span class="${cls('off')}"><span class="spin"></span>${o.runText ?? '스크리닝 계산 중 · 62%'}</span>`;
  if (c.lock) return `<button type="button" class="${cls('off')}" data-go="todo">${LOCK} ${o.lockText ?? '1.1 표적 확정부터'}</button>`;
  return `<button type="button" class="${cls('off')}" data-go="run">${o.todoText ?? '③ 스크리닝 1회 하면 열려요'}</button>`;
}

/* ── 기본 칸(시안이 바꾸지 않는 자리) — 회색 뼈대 ── */
function defTabs(c) {
  if (c.after) return `<div class="tabs">${TOOLS_21.map((w, i) => `<span class="tb${i === 0 ? ' on' : ''}"><i>${w.n}</i>${w.t}</span>`).join('')}</div>`;
  return tabsWith(c);
}
function tabsWith(c, o = {}) {
  const ws = o.walks ?? c.walks;
  const cur = o.cur ?? c.cur;
  return `<div class="tabs"${o.style ? ` style="${o.style}"` : ''}>${ws.map((w) => `<span class="tb${w.i === cur ? ' on' : ''}${o.hl === w.i ? ' hl' : ''}"><i>${w.s === 'done' ? '✓' : w.n}</i>${w.t}</span>`).join('')}${o.end ?? ''}</div>`;
}
function sideRows(c, o = {}) {
  const cur = c.after ? '2.1' : '1.2';
  return [1, 2, 3, 4].map((g) => {
    const rows = STEPS.filter((s) => s.g === g);
    const done = rows.filter((s) => c.side[s.id] === 'done').length;
    const lockG = rows.every((s) => !c.side[s.id] || c.side[s.id] === 'lock');
    return `<div class="mk-g" data-g="${g}"${lockG ? ' data-lock' : ''}><div class="mk-gh"><i>${g}</i>${GROUPS[g]}<span>${done}/${rows.length}</span></div>${rows.map((s) => {
      const state = c.side[s.id] ?? 'lock';
      if (o.row) { const r = o.row(s, state, cur); if (r) return r; }
      const extra = o.extra ? o.extra(s, state) : '';
      const sub = o.sub ? o.sub(s, state) : '';
      return `<div class="st${s.id === cur ? ' cur' : ''}${state === 'lock' ? ' lk' : ''}"><span class="n">${s.id}</span><span class="t">${s.t}</span><span class="k">${state === 'done' ? '✓' : state === 'run' ? '▸' : state === 'lock' ? LOCK : ''}${extra}</span>${sub ? `<span class="st-sub">${sub}</span>` : ''}</div>`;
    }).join('')}</div>`;
  }).join('');
}
function defSide(c, o = {}) { return `<div class="mk-nm">가람제약</div>${sideRows(c, o)}`; }
function phChips(c, o = {}) {
  const cur = c.after ? '2.1' : '1.2';
  return `<div class="ph-chips">${STEPS.slice(0, 4).map((s) => {
    const state = c.side[s.id] ?? 'lock';
    if (o.chip) { const r = o.chip(s, state, cur); if (r) return r; }
    return `<span class="st${s.id === cur ? ' cur' : ''}${state === 'lock' ? ' lk' : ''}" data-g="${s.g}"><span class="n">${s.id}</span><span class="t">${s.t}</span><span class="k">${state === 'done' ? '✓' : state === 'lock' ? LOCK : ''}${o.extra ? o.extra(s) : ''}</span></span>`;
  }).join('')}</div>`;
}
function defMine(c, o = {}) {
  let body;
  if (c.after) body = `<div class="wcap">① 구조 바꿔 다시 도킹 · 대기열 5개</div><div class="skp">${sks(88, 64, 76)}</div><div class="skp">${sks(54, 70)}</div>`;
  else if (c.lock) body = `<div class="wcap">① 미션 브리핑 · 읽기만</div><div class="skp">${sks(90, 72, 84, 40)}</div>`;
  else if (c.run) body = `<div class="wcap">③ 스크리닝 실행</div><div class="skp">${sks(70)}${bar(62)}${sks(46)}</div><div class="skp">${sks(80, 58)}</div>`;
  else if (c.ready) body = c.noHand ? `<div class="wcap">④ 분자 쇼핑 · 찜 4개</div><div class="skp">${sks(86, 70)}</div><div class="skp">${sks(78, 62)}</div>` : `<div class="wcap">⑤ 넘기기 · 연구 노트</div><div class="skp">${sks(86, 70)}</div><div class="skp">${sks(78, 62)}</div>`;
  else body = `<div class="wcap">② 모둠 기준 회의 · 4/6 합의</div><div class="skp">${sks(84, 60)}</div><div class="skp">${sks(76, 52)}</div><div class="skp">${sks(68)}</div>`;
  return `<section class="isl">${o.top ?? ''}<div class="ih">나의 작업대</div>${o.head ?? ''}${body}${o.bottom ?? ''}</section>`;
}
function defTeam(c, o = {}) {
  const body = o.body ?? `<div class="bub"><small>나래</small>${sk(100)}</div><div class="bub me"><small>가람</small>${sk(100)}</div><div class="bub"><small>다온</small>${sk(100)}</div>`;
  return `<section class="isl">${o.top ?? ''}<div class="ih tm">모둠 공유<small>▤ 공유 자료</small></div>${o.head ?? ''}${body}${o.bottom ?? ''}</section>`;
}
function led(c, text) {
  return `<div class="mk-led">${text ?? (c.after ? '◆ 가람제약 1.2 스크리닝 완료 — 2.1 도킹 시작 ▲ 0.8%  ◆ 세움제약 2.2 특허 후보 지정' : '◆ 세움제약 2.2 특허 후보 지정 ▲ 1.2%  ◆ 한빛바이오 1.2 스크리닝 134개 통과')}</div>`;
}

/* 한 장 그리기 — 시안은 칸(slot)만 돌려준다. 폰 덮어쓰기는 v.ph. */
function frame(v, st, dev, pop) {
  const c = ctx(st, pop);
  c.noHand = !!v.noHand;
  let s = v.r(c, dev) || {};
  if (dev === 'ph' && v.ph) s = { ...s, ...(v.ph(c) || {}) };
  const step = c.step;
  const hbar = s.hbar ?? `<div class="hbar">${s.headLead ?? ''}<span class="hno">${step.id}</span><span class="h1">${step.t}</span>${s.headMid ?? ''}${s.tabs === undefined ? defTabs(c) : s.tabs}${s.headRight ? `<span class="hr">${s.headRight}</span>` : ''}</div>`;
  const head = `<header class="mk-head">${hbar}${s.headBelow ?? ''}${s.headPop ?? ''}</header>`;
  const body = s.body ?? `${s.mine === undefined ? defMine(c) : s.mine}${s.team === undefined ? defTeam(c) : s.team}`;
  const bodyCls = `mk-body${s.bodyCls ? ` ${s.bodyCls}` : ''}`;
  const layers = `${s.float ? `<div class="mk-float">${s.float}</div>` : ''}${s.overlay ? `<div class="mk-ov">${s.overlay}</div>` : ''}${s.toast ? `<div class="mk-toast">${s.toast}</div>` : ''}`;
  if (dev === 'ph') {
    return `<div class="ph" data-st="${st}"><div class="ph-scr">
      <div class="ph-top"><b>가람제약</b><span class="mono">${MONEY.bal}</span></div>
      ${s.led ?? led(c)}
      ${s.phSide ?? phChips(c)}
      ${head}
      <div class="${bodyCls}">${body}${s.dockIn ? `<div class="mk-dock">${s.dockIn}</div>` : ''}</div>
    </div>${s.dock ? `<div class="ph-dock">${s.dock}</div>` : ''}${layers}</div>`;
  }
  return `<div class="mk" data-st="${st}">
    <div class="mk-top"><b>가람제약</b><span>FFCA · 기업가치 1위</span><span class="mono">연구비 ${MONEY.bal} · D+42</span></div>
    ${s.led ?? led(c)}
    <nav class="mk-side">${s.side ?? defSide(c)}</nav>
    ${head}
    <div class="${bodyCls}">${body}${s.dock || s.dockIn ? `<div class="mk-dock">${s.dock ?? s.dockIn}</div>` : ''}${layers}</div>
  </div>`;
}

function renderTalk() {
  const li = (x) => `<li><span>${x[0]}<span class="who">${x[1]}</span></span></li>`;
  document.getElementById('lede').innerHTML = "가람제약 모둠이 <b>1.2 화합물 스크리닝을 마치고 2.1 분자 도킹으로 넘어가는 장면</b> 하나로 30가지를 견준다. 위 막대에서 상태를 바꾸면 30개가 함께 바뀌고, 카드마다 따로 바꿀 수도 있다. 모형에서 <b>또렷한 부분이 시안이 바꾸는 자리</b>이고 회색 뼈대는 그대로 두는 자리다. 라임 단추를 누르면 '넘긴 뒤'로 간다. 꼬리표 <b>G·A1</b> 은 Gemini 4 Argon(High)의 안, <b>C</b> 는 Claude 의 안이다.";
  document.getElementById('talk').innerHTML = `
    <div class="tk"><h2>진단 <small>Gemini · Claude 합의</small></h2><ol>${TALK.diag.map(li).join('')}</ol></div>
    <div class="tk"><h2>원칙 <small>어느 시안이든</small></h2><ol>${TALK.rules.map(li).join('')}</ol></div>
    <div class="tk rec"><h2>추천 조합 <small>${TALK.recSub ?? ''}</small></h2><ol>${TALK.rec.map(li).join('')}</ol>${TALK.recNote ?? ''}</div>`;
}

/* ── 페이지 ── */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장 못 해도 화면은 그대로 */ } },
};
const state = { st: 'todo', dev: store.get('nf30:dev', innerWidth < 700 ? 'ph' : 'pc'), per: {}, pop: {}, picks: new Set(store.get('nf30:picks', [])) };
if (!DEVS.some(([id]) => id === state.dev)) state.dev = 'pc';
/* 처음 열 때 — 카드마다 그 시안이 가장 잘 보이는 상태로. 위 막대에서 상태를 고르면 모두 같이 맞춘다. */
V.forEach((v) => { if (v.focus) state.per[v.id] = v.focus; if (v.popInit) state.pop[v.id] = true; });

function segHTML(list, cur, attr) {
  return list.map(([id, label], i) => `<button type="button" ${attr}="${id}" aria-pressed="${id === cur}">${attr === 'data-gst' || attr === 'data-cst' ? `<i>${i + 1}</i>` : ''}${label}</button>`).join('');
}
function renderCard(v) {
  const el = document.getElementById(`v${v.id}`);
  if (!el) return;
  const st = state.per[v.id] ?? state.st;
  el.querySelector('.cm').innerHTML = frame(v, st, v.phoneOnly ? 'ph' : state.dev, !!state.pop[v.id]);
  el.querySelector('.cstate').innerHTML = segHTML(STATES, st, 'data-cst');
}
function srcTag(src) {
  return `<span class="src">${src.map((x) => `<span class="${x[0] === 'G' ? 'g' : 'c'}" title="${x[0] === 'G' ? `Gemini 4 Argon(High) 1차 답 ${x.slice(2)}` : 'Claude 제안'}">${x}</span>`).join('')}</span>`;
}
function renderAll() {
  renderHome();
  document.getElementById('jump').innerHTML = '<div class="jg"><span>★</span><a href="#home">합의안</a></div>' + FAMS.map((f) => `<div class="jg"><span>${f.k} ${f.name.split(' — ')[0]}</span>${V.filter((v) => v.fam === f.k).map((v) => `<a href="#v${v.id}">${v.id}</a>`).join('')}</div>`).join('');
  document.getElementById('secs').innerHTML = FAMS.map((f) => `
    <section class="sec" id="f${f.k}">
      <div class="sec-h"><h2><b>${f.k}</b>${f.name}</h2><p>${f.desc}</p></div>
      <div class="grid" data-dev="${state.dev}">
        ${V.filter((v) => v.fam === f.k).map((v) => `
          <article class="card" id="v${v.id}" data-picked="${state.picks.has(v.id)}">
            <div class="ch"><span class="cn">${v.id}</span><div><h3>${v.name}${srcTag(v.src)}</h3><p class="one">${v.one}</p></div>
              <button type="button" class="pick" data-pick="${v.id}" aria-pressed="${state.picks.has(v.id)}">${state.picks.has(v.id) ? '★ 고름' : '☆ 고르기'}</button></div>
            <div class="cbar"><div class="seg sm cstate" role="group" aria-label="${v.id} 상태"></div>${v.phoneOnly ? '<span class="mu">폰 모형 고정</span>' : ''}</div>
            <div class="cm"></div>
            <dl class="cd"><div><dt>자리</dt><dd>${v.where}</dd></div><div><dt>걸음 탭</dt><dd>${v.tabs}</dd></div><div><dt>약점</dt><dd class="weak">${v.weak}</dd></div></dl>
          </article>`).join('')}
      </div>
    </section>`).join('');
  V.forEach(renderCard);
  document.getElementById('gstate').innerHTML = segHTML(STATES, state.st, 'data-gst');
  document.getElementById('gdev').innerHTML = segHTML(DEVS, state.dev, 'data-gdev');
  showPicks();
}
function showPicks() {
  const list = [...state.picks].sort();
  document.getElementById('picked').textContent = list.length ? list.join(' · ') : '없음';
  document.querySelectorAll('.jump a').forEach((a) => a.classList.toggle('on', state.picks.has(a.getAttribute('href').slice(2))));
}
const byId = (id) => V.find((v) => v.id === id);

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-go]');
  if (!t) return;
  if (t.dataset.gst) {
    state.st = t.dataset.gst; state.per = { R: state.st }; state.pop = {};
    document.getElementById('gstate').innerHTML = segHTML(STATES, state.st, 'data-gst');
    V.forEach(renderCard);
    renderHome();
    return;
  }
  if (t.dataset.gdev) { state.dev = t.dataset.gdev; store.set('nf30:dev', state.dev); renderAll(); return; }
  const card = t.closest('.card');
  const id = card?.id.slice(1);
  if (id === 'R' && (t.dataset.cst || t.dataset.go)) { state.per.R = t.dataset.cst ?? t.dataset.go; renderHome(); return; }
  if (t.dataset.cst && card) { state.per[id] = t.dataset.cst; state.pop[id] = false; renderCard(byId(id)); return; }
  if (t.dataset.pop && card) { state.pop[id] = t.dataset.pop === '1'; renderCard(byId(id)); return; }
  if (t.dataset.go && card) { state.per[id] = t.dataset.go; state.pop[id] = false; renderCard(byId(id)); return; }
  if (t.dataset.pick) {
    const pid = t.dataset.pick;
    state.picks.has(pid) ? state.picks.delete(pid) : state.picks.add(pid);
    store.set('nf30:picks', [...state.picks]);
    t.setAttribute('aria-pressed', String(state.picks.has(pid)));
    t.textContent = state.picks.has(pid) ? '★ 고름' : '☆ 고르기';
    card.dataset.picked = String(state.picks.has(pid));
    showPicks();
    return;
  }
  if (t.id === 'clear') { state.picks.clear(); store.set('nf30:picks', []); renderAll(); return; }
  if (t.id === 'copy') {
    const out = document.getElementById('picked');
    const text = `design/next-flow-30.html 고른 시안: ${[...state.picks].sort().join(' · ') || '없음'}`;
    const done = () => { t.textContent = '복사함'; setTimeout(() => { t.textContent = '번호 복사'; }, 1400); };
    try { navigator.clipboard.writeText(text).then(done, () => selectText(out)); } catch { selectText(out); }
  }
});
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

renderTalk();
renderAll();
</script>

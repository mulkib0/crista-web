    b += `</g>`;
    b += `<line x1="24" x2="${24 + s}" y1="276" y2="276" stroke="var(--ink)" stroke-width="2" fill="none"/><line x1="24" x2="24" y1="271" y2="281" stroke="var(--ink)" stroke-width="2" fill="none"/><line x1="${24 + s}" x2="${24 + s}" y1="271" y2="281" stroke="var(--ink)" stroke-width="2" fill="none"/>`;
    b += `<text x="${24 + s + 6}" y="280" font-size="12" class="t-m">1 Å</text>`;
    b += `<line x1="24" x2="44" y1="36" y2="36" stroke="var(--ink)" stroke-width="3" fill="none"/><text x="50" y="40" font-size="12">결정구조 속 원래 자리(정답)</text>`;
    b += `<line x1="250" x2="270" y1="36" y2="36" stroke="var(--me)" stroke-width="2" stroke-dasharray="5 3" fill="none"/><text x="276" y="40" font-size="12">다시 도킹한 자리</text>`;
    b += `<line x1="410" x2="426" y1="36" y2="36" stroke="var(--bad)" stroke-width="1" fill="none"/><text x="432" y="40" font-size="12">어긋남</text>`;
    /* 게이지 */
    const gy = (v) => 280 - (Math.min(v, 4) / 4) * 240, gx = 600;
    b += `<rect x="${gx}" y="${gy(2)}" width="40" height="${gy(0) - gy(2)}" fill="var(--good-bg)" stroke="var(--line-strong)" stroke-width="1"/>`;
    b += `<rect x="${gx}" y="${gy(4)}" width="40" height="${gy(2) - gy(4)}" fill="var(--bad-bg)" stroke="var(--line-strong)" stroke-width="1"/>`;
    [0, 1, 2, 3, 4].forEach((v) => { b += `<text x="${gx - 8}" y="${gy(v) + 4}" text-anchor="end" font-size="12" class="t-m">${v} Å</text>`; });
    b += `<line x1="${gx - 4}" x2="${gx + 64}" y1="${gy(2)}" y2="${gy(2)}" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="5 3" fill="none"/>`;
    b += `<text x="${gx + 68}" y="${gy(2) + 4}" font-size="12" font-weight="600">기준 2 Å</text>`;
    b += `<text x="${gx + 48}" y="${gy(1) + 4}" font-size="11.5" fill="var(--good)" style="fill:var(--good)">믿을 만함</text>`;
    b += `<text x="${gx + 48}" y="${gy(3) + 4}" font-size="11.5" fill="var(--bad)" style="fill:var(--bad)">방법 다시</text>`;
    b += `<polygon points="${gx - 2},${gy(r)} ${gx - 14},${gy(r) - 7} ${gx - 14},${gy(r) + 7}" fill="var(--me)"/>`;
    b += `<rect x="${gx}" y="${gy(r) - 2}" width="40" height="4" fill="var(--me)"/>`;
    b += `<text x="${gx + 20}" y="22" text-anchor="middle" font-size="12" class="t-m t-mu">RMSD</text>`;
    b += `<text x="${gx + 20}" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="${ok ? "var(--good)" : "var(--bad)"}" style="fill:${ok ? "var(--good)" : "var(--bad)"}">${f2(r)} Å ${ok ? "≤ 2 → 통과 ✓" : "> 2 → 실패 ✕"}</text>`;
    return CV.svg(W, H, b, "재도킹 자세와 결정구조 자세를 겹친 그림과 RMSD 게이지");
  }

  /* ───────────── 09 점수 카드 ───────────── */
  function v9() {
    const cards = DK.map((d, i) => {
      const tro = d === TRO, lead = EX.lead && d.id === EX.lead.id;
      const tag = d.ref ? "기준 리간드 · 실제 쓰이는 약" : isCRX(d) ? "ACHE 를 겨냥해 설계(사내 합성)" : "당뇨약 — PPAR 작용제";
      return `<div class="s3-card ${tro ? "warn" : ""}">
        <div class="top"><span class="rk">#${i + 1}</span><span class="vz-chip">${esc(d.ref ? "기준" : isCRX(d) ? d.id : "ChEMBL 승인약")}</span></div>
        ${CV.mol(d.c.s, 220, 140)}
        <h4>${esc(d.ref ? "도네페질 (기준)" : d.name)}</h4>
        <div class="g">${mn(d.kcal)} <small>kcal/mol</small></div>
        <div class="pb" aria-hidden="true"><i style="width:${(d.p * 100).toFixed(1)}%"></i></div>
        <div class="pt">결합력 p ${f2(d.p)}</div>
        <p>${esc(tag)}</p>
        ${tro ? `<span class="stamp">점수 1위 ≠ 리드</span><p>ACHE 가 아니라 PPAR(당 대사 수용체)을 겨냥해 만든 약이다. 실제로는 간 손상 때문에 2000년 미국 시장에서 철수했다.</p>` : ""}
        ${lead ? `<span class="vz-sig good">● 2.2 에서 리드로 뽑힘</span>` : ""}
      </div>`;
    }).join("");
    return `<div class="s3-cards">${cards}</div>
      <p class="vz-note">도킹 점수는 컴퓨터가 계산한 <b>예측</b>이지 실험으로 잰 값이 아니다. 1위 분자도 '무엇을 겨냥해 만들었나', '몸속에서 안전한가'를 따로 봐야 한다.</p>`;
  }

  /* ───────────── 10 순위의 함정 ───────────── */
  function v10() {
    const W = 800, H = 380, lo = -12.95, hi = -11.7, Yr = (i) => 76 + i * 52, Yg = (g) => 66 + ((g - lo) / (hi - lo)) * 268, xL = 300, xR = 560;
    let b = "";
    b += `<text x="${xL}" y="30" text-anchor="middle" font-size="13" font-weight="700">순위표</text><text x="${xL}" y="48" text-anchor="middle" font-size="11.5" class="t-mu">늘 같은 간격으로 보인다</text>`;
    b += `<text x="${xR}" y="30" text-anchor="middle" font-size="13" font-weight="700">실제 ΔG 눈금</text><text x="${xR}" y="48" text-anchor="middle" font-size="11.5" class="t-mu">간격 그대로</text>`;
    b += `<line x1="${xR}" x2="${xR}" y1="${Yg(lo)}" y2="${Yg(hi)}" stroke="var(--ink)" stroke-width="1.4" fill="none"/>`;
    for (let g = -12.9; g <= -11.69; g += 0.2) {
      b += `<line x1="${xR}" x2="${xR + 6}" y1="${Yg(g)}" y2="${Yg(g)}" stroke="var(--ink)" stroke-width="1" fill="none"/>`;
      b += `<text x="${xR + 10}" y="${Yg(g) + 4}" font-size="11.5" class="t-m t-mu">${mn(g, 1)}</text>`;
    }
    DK.forEach((d, i) => {
      const yl = Yr(i), yr = Yg(d.kcal), c = colOf(d);
      b += `<line x1="${xL + 8}" y1="${yl}" x2="${xR - 8}" y2="${yr}" stroke="${c}" stroke-width="${d.ref ? 2 : 1.5}" ${d.ref ? 'stroke-dasharray="5 3"' : ""} fill="none"/>`;
      b += `<circle cx="${xL}" cy="${yl}" r="7" fill="${c}"/><circle cx="${xR}" cy="${yr}" r="5" fill="${c}" stroke="var(--paper)" stroke-width="1"/>`;
      b += `<text x="${xL - 16}" y="${yl + 4}" text-anchor="end" font-size="12.5" font-weight="600">${i + 1}위 ${esc(short(d))} <tspan class="t-m" font-weight="400">${mn(d.kcal)}</tspan></text>`;
      if (i > 0) {
        const gap = d.kcal - DK[i - 1].kcal;
        b += `<text x="${xL - 16}" y="${(Yr(i - 1) + yl) / 2 + 4}" text-anchor="end" font-size="11" class="t-m" fill="${gap > 0.5 ? "var(--bad)" : "var(--muted)"}" style="fill:${gap > 0.5 ? "var(--bad)" : "var(--muted)"}">↕ ${f2(gap)}</text>`;
      }
    });
    const rest = DK.slice(1), ya = Yg(Math.min(...rest.map((d) => d.kcal))), yb = Yg(Math.max(...rest.map((d) => d.kcal)));
    const span = Math.max(...rest.map((d) => d.kcal)) - Math.min(...rest.map((d) => d.kcal));
    b += `<path d="M${xR + 56},${ya - 4} h8 V${yb + 4} h-8" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`;
    b += `<text x="${xR + 72}" y="${(ya + yb) / 2 - 4}" font-size="12" font-weight="600">2~6위 5개가</text><text x="${xR + 72}" y="${(ya + yb) / 2 + 12}" font-size="12" font-weight="600">${f2(span)} 안에 몰림</text>`;
    b += `<text x="${xR + 72}" y="${Yg(TRO.kcal) + 4}" font-size="12" class="t-mu">혼자 ${f2(rest[0].kcal - TRO.kcal)} 앞섬</text>`;
    return `${CV.svg(W, H, b, "도킹 순위표와 실제 결합 자유에너지 간격을 잇는 기울기 그림")}
      <p class="vz-note">순위만 보면 2위와 6위가 멀어 보이지만 실제 차이는 ${f2(span)} kcal/mol 뿐이다. 도킹 점수는 계산으로 얻은 예측이라 이렇게 작은 차이로는 순서를 믿기 어렵다. 그래서 '기준 근처인가'만 보고, 진짜 고르기는 다음 단계(ADMET)에서 다른 잣대로 한다.</p>`;
  }

  window.VIZ[3] = [
    {
      name: "에너지 우물",
      kind: "실물 은유 · 작은 배수",
      idea: "분자마다 ΔG 만큼 깊은 우물을 파고 공을 바닥에 놓아, 음수가 클수록 우물이 깊다는 것을 한 줄로 견준다.",
      learn: "ΔG 는 음수일수록(우물이 깊을수록) 떼어 내기 어렵다 = 더 단단히 붙는다.",
      render: v1
    },
    V2,
    {
      name: "자물쇠-열쇠 단면",
      kind: "실물 은유 · 단면도",
      idea: "ACHE 의 깊은 골짜기 주머니를 잘라 보고, 꼭 맞는 도네페질과 헐렁한 히스타민이 벽에 몇 곳 닿는지 견준다.",
      learn: "주머니 벽 여러 곳에 맞물리는 분자일수록 ΔG 가 더 음수가 된다. 작고 헐렁한 분자는 거의 점수가 없다.",
      render: v3
    },
    {
      name: "상호작용 지도",
      kind: "2D 상호작용도 · 켜고 끄기",
      idea: "LigPlot 처럼 도네페질을 가운데 두고 ACHE 잔기 6곳과의 접촉을 종류별 선으로 그린 뒤, 종류마다 켜고 꺼 본다.",
      learn: "결합은 여러 작은 당김(π 쌓임 · 수소결합 · 양이온-π · 소수성)이 모인 것이고, 그 합이 ΔG 다.",
      render: v4,
      mount: V4mount
    },
    {
      name: "수심계 눈금",
      kind: "세로 게이지 · 이정표",
      idea: "0 에서 −14 까지 한 수심계에 히스타민 · p=0 선 · 라이브러리 가운데값 · 기준 · 도킹 1위를 이정표처럼 꽂는다.",
      learn: "우리 후보가 220종 전체에서 얼마나 깊은 자리에 있는지, 그리고 점수가 매겨지는 구간(p=0 ~ p=1)이 어디인지 안다.",
      render: v5
    },
    V6,
    {
      name: "10배 계단",
      kind: "로그 눈금 · 계단",
      idea: "ΔG 를 해리 상수 Kd 로 바꿔, ΔG 가 1.36 더 음수가 될 때마다 필요한 양이 10배씩 줄어드는 계단을 그린다.",
      learn: "ΔG 의 작은 차이가 '얼마나 적은 양으로 붙는가'에서는 몇 배 차이가 된다(로그 관계).",
      render: v7
    },
    {
      name: "RMSD 겹쳐 보기",
      kind: "겹침 비교 · 슬라이더",
      idea: "결정구조 속 기준 리간드 자리와 다시 도킹한 자리를 겹치고, 어긋남(RMSD)을 밀어 보며 2 Å 기준을 넘는지 본다.",
      learn: "재도킹 RMSD 0.82 Å ≤ 2 Å 이면 이 도킹 방법이 정답 자리를 찾아낸다는 뜻이라, 다른 분자의 점수도 믿고 쓴다.",
      render: () => `<div class="s3-v8-p">${v8plot(T.rmsd)}</div>
        <div class="s3-ctl"><label for="s3-v8-r">어긋남(RMSD) 바꿔 보기 — <span class="t-m" data-k="r">${f2(T.rmsd)} Å</span></label>
        <input type="range" class="vz-rng" id="s3-v8-r" min="0" max="4" step="0.01" value="${T.rmsd}">
        <div class="vz-row"><button type="button" class="vz-btn" id="s3-v8-real">실제 값 ${f2(T.rmsd)} Å (${esc(T.pdb)})</button></div>
        <p class="vz-note">재도킹 = 결정구조에 이미 들어 있던 기준 리간드를 빼냈다가 다시 도킹해서 원래 자리를 찾는지 보는 시험. RMSD(평균 어긋남) = √(원자마다 어긋난 거리² 의 평균). 원자 위치는 모식(예시)이고, RMSD 값은 그린 점에서 그대로 계산했다.</p></div>`,
      mount: (el) => {
        const r = el.querySelector("#s3-v8-r"), p = el.querySelector(".s3-v8-p"), lab = el.querySelector('[data-k="r"]'), bt = el.querySelector("#s3-v8-real");
        const set = (v) => { p.innerHTML = v8plot(v); lab.textContent = `${f2(v)} Å`; };
        const on = () => set(+r.value), rb = () => { r.value = T.rmsd; set(T.rmsd); };
        r.addEventListener("input", on); bt.addEventListener("click", rb);
        return () => { r.removeEventListener("input", on); bt.removeEventListener("click", rb); };
      }
    },
    {
      name: "점수 카드",
      kind: "카드 · 구조식",
      idea: "도킹한 6분자를 구조식 · ΔG · 결합력 p · 출신(무엇을 겨냥한 분자인가)이 적힌 카드로 늘어놓는다.",
      learn: "점수는 예측이지 측정이 아니다. 도킹 1위 Troglitazone 은 당뇨약이라 ACHE 리드가 될 수 없다.",
      render: v9
    },
    {
      name: "순위의 함정",
      kind: "기울기 그림 · 간격 비교",
      idea: "같은 간격의 순위표와 실제 ΔG 눈금을 선으로 이어, 2~6위가 0.1 kcal/mol 안에 몰려 있음을 드러낸다.",
      learn: "순위만 보면 차이가 커 보이지만 실제 간격은 아주 작다. 작은 점수 차이로 줄 세우지 말고 기준과 견준다.",
      render: v10
    }
  ];
})();

</script>
<script>/* viz-4.js */
/* 2.2 ADMET 예측 · 리드 — 시각화 시안 10종 */
(function () {
  "use strict";
  const CV = window.CV, { EX, esc, f1, f2, R } = CV;

  /* ── 이 파일 전용 도우미 ── */
  const AD = EX.admet, LEAD = EX.lead, TID = EX.tid;
  const POP = (EX.ind && EX.ind.pop) || CV.TRIAL[TID].pops[0];
  const isCRX = (a) => /^CRX-ACHE-/.test(a.id);
  const isLead = (a) => !!LEAD && a.id === LEAD.id;
  const own = (a) => a.c.t === TID;                     /* ACHE 를 겨냥해 만든 분자인가 */
  const nm = (a) => isCRX(a) ? "CRX-" + a.id.slice(-2) : String(a.name).split(" (")[0];
  const sub = (a) => isCRX(a) ? String(a.name).replace(/^도네페질 /, "").replace(/ 유도체$/, "") : "당뇨약 · PPAR 작용제";
  const colOf = (a) => isLead(a) ? "var(--me)" : own(a) ? "var(--ink)" : "var(--daon)";
  const LV = CV.LV, TONE = CV.tone, RTONE = CV.riskTone;
  const MARK = { good: "●", warn: "▲", bad: "■" };
  const toneOf = (k, v) => k === "herg" || k === "hep" ? RTONE[v] : k === "ro5" ? (v === 0 ? "good" : v === 1 ? "warn" : "bad") : TONE[v];
  const textOf = (k, v) => k === "ro5" ? `위반 ${v}` : LV[v];
  const chip = (tone, t) => `<span class="vz-sig ${tone}">${MARK[tone]} ${esc(t)}</span>`;
  const SIG = [
    { k: "oral", t: "경구 흡수", rule: "TPSA ≤ 140 · RotB ≤ 10 · Ro5 위반" },
    { k: "bbb", t: "뇌 노출", rule: "TPSA ≤ 90 · MW ≤ 450 · HBD ≤ 3" },
    { k: "herg", t: "심장 hERG", rule: "염기성 아민 + cLogP 2.5 / 3.7" },
    { k: "hep", t: "간독성", rule: "구조 경고 · cLogP > 3 & TPSA < 75" },
    { k: "td", t: "경피 투과", rule: "MW ≤ 500 · cLogP 1~4" }
  ];
  const bindAll = (el, sel, ev, fn) => { const L = [...el.querySelectorAll(sel)]; L.forEach((b) => b.addEventListener(ev, fn)); return () => L.forEach((b) => b.removeEventListener(ev, fn)); };
  const pick = (id) => AD.find((a) => a.id === id) || AD[0];
  const picker = (v, cur) => AD.map((a) => `<button type="button" class="vz-btn" id="s4-v${v}-${a.id.replace(/[^A-Za-z0-9]/g, "")}" data-m="${esc(a.id)}" aria-pressed="${a.id === cur}">${esc(nm(a))}${isLead(a) ? " · 리드" : ""}</button>`).join("");

  CV.css("s4", `
    .s4-tw { overflow-x: auto; border: 1px solid var(--line-strong); }
    .s4-tbl { border-collapse: collapse; width: 100%; min-width: 780px; font-size: 12.5px; background: var(--surface); }
    .s4-tbl th, .s4-tbl td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
    .s4-tbl thead th { font-weight: 600; background: var(--raise); vertical-align: bottom; }
    .s4-tbl thead small { display: block; font-family: var(--mono); font-size: 10px; font-weight: 400; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    .s4-tbl td.n { font-family: var(--mono); text-align: right; white-space: nowrap; }
    .s4-tbl tr.lead td { background: var(--film-3); }
    .s4-tbl tr.lead td:first-child { box-shadow: inset 4px 0 0 var(--me); }
    .s4-tbl .nm b { display: block; }
    .s4-tbl .nm span { font-size: 11px; color: var(--muted); }
    .s4-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
    .s4-cards > div { border: 1px solid var(--line-strong); background: var(--paper); padding: 9px; display: grid; gap: 5px; align-content: start; }
    .s4-cards > div.lead { border: 2px solid var(--me); }
    .s4-cards > div.out { border-style: dashed; }
    .s4-cards h4 { margin: 0; font-size: 13px; display: flex; gap: 6px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
    .s4-cards p { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
    .s4-ctl { display: grid; gap: 8px; }
    .s4-sl { display: grid; gap: 2px; }
    .s4-sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 600; }
    .s4-sl .val { font-family: var(--mono); font-weight: 600; }
    .s4-read { font-size: 12.5px; padding: 9px 10px; border: 1px solid var(--line); background: var(--paper); margin: 0; }

    .s4-rowwrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .s4-sigs { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .s4-sigs > span { display: grid; gap: 2px; justify-items: start; }
    .s4-sigs .vz-lab { font-size: 10px; }
    .s4-sigs em { font-style: normal; font-size: 11px; color: var(--muted); }
    .s4-sl .vz-svg { max-width: 520px; }
  `);

  /* ───────────── 01 BOILED-Egg ───────────── */
  function v1() {

    b += `</g>`;
    b += `<text x="${X(-1.3)}" y="${Y(118)}" font-size="12.5" font-weight="600">흰자 — 장에서 잘 흡수(근사)</text>`;
    b += `<text x="${X(1.1)}" y="${Y(20)}" font-size="12.5" font-weight="600" fill="var(--warn)" style="fill:var(--warn)">노른자 — 뇌까지 들어감(근사)</text>`;

    b += hline(140, "게임 규칙 · 경구 TPSA ≤ 140");
    b += hline(90, "게임 규칙 · 뇌 노출 TPSA ≤ 90");
    b += `<line x1="${X(5)}" x2="${X(5)}" y1="40" y2="404" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>`;

    for (let t = 0; t <= 150; t += 30) { b += `<line x1="68" x2="74" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ink)" stroke-width="1" fill="none"/><text x="63" y="${Y(t) + 4}" text-anchor="end" font-size="12" class="t-m">${t}</text>`; }
    b += `<text x="434" y="450" text-anchor="middle" font-size="12.5">cLogP — 기름에 녹는 정도 →</text>`;

    if (tro) b += `<text x="${X(tro.c.logp) + 14}" y="${Y(tro.c.tpsa) + 20}" font-size="12.5" font-weight="600" fill="var(--daon)" style="fill:var(--daon)">${esc(nm(tro))}</text>`;

  /* ───────────── 02 물성 레이더 ───────────── */
  const AX = [
    { k: "logp", t: "지용성", min: -2, max: 6, lo: -0.7, hi: 5, d: 2 },
    { k: "mw", t: "크기", min: 0, max: 620, lo: 150, hi: 500, d: 1 },
    { k: "tpsa", t: "극성", min: 0, max: 160, lo: 20, hi: 130, d: 1 },
    { k: "rotb", t: "유연성", min: 0, max: 12, lo: 0, hi: 9, d: 0 },
    { k: "hbd", t: "HBD", min: 0, max: 8, lo: 0, hi: 5, d: 0 },
    { k: "hba", t: "HBA", min: 0, max: 14, lo: 0, hi: 10, d: 0 }
  ];
  function radar(a) {
    const cx = 112, cy = 116, Rr = 74, n = AX.length;
    const ang = (i) => ((-90 + (360 / n) * i) * Math.PI) / 180;
    const rr = (ax, v) => Rr * Math.max(0.04, Math.min(1.1, (v - ax.min) / (ax.max - ax.min)));
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const ring = (f) => AX.map((ax, i) => pt(i, f(ax)).map((v) => v.toFixed(1)).join(",")).join(" L");
    let b = "";
    [0.5, 1].forEach((q) => { b += `<polygon points="${ring(() => Rr * q).replace(/ L/g, " ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
    AX.forEach((ax, i) => { const [x, y] = pt(i, Rr); b += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" fill="none"/>`; });
    b += `<path d="M${ring((ax) => rr(ax, ax.hi))} Z M${ring((ax) => rr(ax, ax.lo))} Z" fill="var(--film-1)" fill-rule="evenodd" stroke="var(--line-strong)" stroke-width="1"/>`;
    b += `<polygon points="${ring((ax) => rr(ax, a.c[ax.k])).replace(/ L/g, " ")}" fill="var(--ink)" fill-opacity="0.07" stroke="${colOf(a)}" stroke-width="2"/>`;
    const outs = [];
    AX.forEach((ax, i) => {
      const v = a.c[ax.k], [x, y] = pt(i, rr(ax, v)), bad = v < ax.lo || v > ax.hi;
      if (bad) { outs.push(`${ax.t} ${v.toFixed(ax.d)}`); b += `<rect x="${(x - 5).toFixed(1)}" y="${(y - 5).toFixed(1)}" width="10" height="10" fill="var(--bad)"/>`; }
      else b += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${colOf(a)}"/>`;
      const [lx, ly] = pt(i, Rr + 16), anc = Math.abs(lx - cx) < 5 ? "middle" : lx > cx ? "start" : "end";
      b += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anc}" font-size="12" ${bad ? 'font-weight="700" fill="var(--bad)" style="fill:var(--bad)"' : ""}>${ax.t}</text>`;
    });
    return { svg: CV.svg(226, 232, b, `${a.name} 물성 레이더`), outs };
  }
  function v2() {

  /* ───────────── 03 신호등 표 ───────────── */

  /* ───────────── 04 몸속 여행 지도 ───────────── */
  function v4map(a) {

    const arrow = (x1, y1, x2, y2, lab, pct) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="${1 + 3 * pct}" marker-end="url(#s4m)" fill="none"/><text x="${(x1 + x2) / 2 + 8}" y="${(y1 + y2) / 2 - 6}" font-size="11.5" class="t-m">${esc(lab)}</text>`;

    b += arrow(200, 64, 252, 64, "", 1);
    b += organ(252, 26, 220, 110, "장 — 피로 넘어간다");
    b += `<text x="262" y="70" font-size="12.5">경구 흡수 ${esc(LV[s.oral])} · ${esc(a.n.oral.split(" — ")[1] || "")}</text>`;
    b += bar(262, 82, 200, P.A, TONE[s.oral]);
    b += `<text x="262" y="110" font-size="12.5" class="t-m">흡수 계수 A = ${f2(P.A)}</text>`;
    b += `<text x="262" y="128" font-size="11.5" class="t-mu">100 중 ${Math.round(P.A * 100)} 만 피에 닿는다</text>`;
    b += arrow(472, 80, 524, 110, "", P.A);
    /* 혈액 */
    b += organ(524, 60, 150, 70, "피를 타고");
    b += `<text x="534" y="104" font-size="12" class="t-mu">몸 구석구석으로</text>`;
    /* 뇌 · 심장 · 간 */
    const toOrgan = (y, w) => `<polyline points="599,130 630,130 630,${y} 623,${y}" fill="none" stroke="var(--ink)" stroke-width="${w}" marker-end="url(#s4m)"/>`;
    b += toOrgan(202, 1 + 3 * P.B) + toOrgan(286, 1.6) + toOrgan(370, 1.6);
    b += organ(120, 170, 500, 64, "뇌 — 여기서 약효가 난다 (ACHE 는 CNS 표적)");
    b += `<text x="130" y="214" font-size="12.5">뇌 노출 ${esc(LV[s.bbb])} · ${esc(a.n.bbb.split(" — ")[1] || "")}</text>`;
    b += bar(396, 203, 120, P.B, TONE[s.bbb]);
    b += `<text x="610" y="214" text-anchor="end" font-size="12.5" class="t-m">B = ${f2(P.B)}</text>`;
    b += organ(120, 254, 500, 64, "심장 — hERG 통로를 막으면 박동이 흔들린다");
    b += `<text x="130" y="298" font-size="12.5">hERG 위험 ${esc(LV[s.herg])} · ${esc(a.n.herg.split(" — ")[1] || "")}</text>`;
    b += `<text x="610" y="298" text-anchor="end" font-size="12.5" class="t-m">위험 +${f2(P.hergR)}</text>`;
    b += organ(120, 338, 500, 64, "간 — 약을 부수다 상할 수 있다");
    b += `<text x="130" y="382" font-size="12.5">간독성 위험 ${esc(LV[s.hep])} · ${esc(a.n.hep.split(" — ")[1] || "")}</text>`;
    b += `<text x="610" y="382" text-anchor="end" font-size="12.5" class="t-m">위험 +${f2(P.hepR)}</text>`;
    /* 두 결과 */
    b += `<rect x="640" y="170" width="228" height="104" fill="var(--film-3)" stroke="var(--ink)" stroke-width="1.4"/>`;
    b += `<text x="650" y="192" font-size="11.5" class="t-m t-mu">E = (0.3+0.7p) × A × B × De × 100</text>`;
    b += `<text x="650" y="228" font-size="28" font-weight="700" class="t-m">${f1(a.sc.E)}</text>`;
    b += `<text x="650" y="252" font-size="11.5" class="t-mu">p ${f2(a.p)} · A ${f2(P.A)} · B ${f2(P.B)} · De ${f2(P.De)}</text>`;
    b += `<rect x="640" y="286" width="228" height="116" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/>`;
    b += `<text x="650" y="308" font-size="11.5" class="t-m t-mu">S = 100 − Dt × (1+심장+간) × K</text>`;
    b += `<text x="650" y="344" font-size="28" font-weight="700" class="t-m">${f1(a.sc.S)}</text>`;
    b += `<text x="650" y="368" font-size="11.5" class="t-mu">Dt ${P.Dt} × ${f2(P.Rk)} × ${f2(P.K)} = ${f1(P.Dt * P.Rk * P.K)} 깎임</text>`;
    b += `<text x="650" y="390" font-size="11.5" font-weight="600" fill="${a.sc.S >= R.th.ind.s ? "var(--good)" : "var(--bad)"}" style="fill:${a.sc.S >= R.th.ind.s ? "var(--good)" : "var(--bad)"}">${a.sc.S >= R.th.ind.s ? `IND 기준 ${R.th.ind.s} 넘음` : `IND 기준 ${R.th.ind.s} 못 넘음`}</text>`;
    return CV.svg(W, H, b, `${a.name} 가 몸속에서 지나는 길`);
  }
  const V4 = {
    name: "몸속 여행 지도",

    }
  };

  /* ───────────── 05 규칙 눈금자 ───────────── */
  function v5() {
    const W = 880, X0 = 240, X1 = 836;
    const ROWS = [
      { t: "경구 흡수 — TPSA", sub: "", k: "tpsa", lo: 0, hi: 160, unit: "Å²", d: 1, cuts: [{ v: 140, lab: "140 넘으면 '나쁨'" }] },
      { t: "뇌 노출 — TPSA", sub: "", k: "tpsa", lo: 0, hi: 160, unit: "Å²", d: 1, cuts: [{ v: 90, lab: "90 넘으면 '높음' 아님" }, { v: 120, lab: "120 넘으면 '낮음'" }] },
      { t: "뇌 노출 — 분자량 MW", sub: "", k: "mw", lo: 100, hi: 620, unit: "Da", d: 1, cuts: [{ v: 450, lab: "450 넘으면 '높음' 아님" }, { v: 500, lab: "500 · Ro5 경계" }] },
      { t: "심장 hERG — cLogP", sub: "염기성 아민이 있을 때만", k: "logp", lo: 0, hi: 6, unit: "", d: 2, cuts: [{ v: 2.5, lab: "2.5 넘으면 '보통'" }, { v: 3.7, lab: "3.7 넘으면 '높음'" }] },
      { t: "간독성 — cLogP", sub: "구조 경고가 없을 때", k: "logp", lo: 0, hi: 6, unit: "", d: 2, cuts: [{ v: 3, lab: "3 넘고 TPSA < 75 면 '보통'" }] },
      { t: "경피 투과 — cLogP", sub: "", k: "logp", lo: 0, hi: 6, unit: "", d: 2, cuts: [{ v: 1, lab: "1 아래면 '부적합'" }, { v: 4, lab: "4 넘으면 '부적합'" }] }
    ];

    /* ── 03 선언 → 출원 → 공개 흐름도(공개 범위 두 줄) ── */
    {

      kind: "흐름도 · 공개 범위 두 줄 · 단계 재생",

      render: () => {

          ${node(1, 10, y0, "리드 확정", "2.2 ADMET 결과", false)}
          ${node(2, 160, y0, "프로그램 선언", "코드명 · 기전 · 무료", true)}
          ${node(3, 160, y1, "공개 서랍에 코드명", `${P.code} 보임`, false)}
          ${node(4, 310, y0, "물질특허 출원", `${M(R.cost.patent)} · D+${P.day}`, true)}

          ${node(7, 610, y0, "3.2 IND 열림", "특허 분자로만", false)}`;
        return `<div class="s5-flow" id="s5-v3-flow">${CV.svg(W, H, body, "선언에서 공개까지 흐름도")}</div>
          <div class="vz-row"><button type="button" class="vz-btn" id="s5-v3-prev">← 이전</button><button type="button" class="vz-btn" id="s5-v3-play">처음부터 재생</button><button type="button" class="vz-btn" id="s5-v3-next">다음 →</button></div>

          [[2, 3], "선언하는 순간 다른 모둠의 공개 서랍에 우리 코드명이 뜹니다. 분자 구조는 아직 비밀입니다."],

        });

    /* ── 06 구조 지문(바코드) ── */
    {
      name: "구조 지문",

      idea: "SMILES(분자를 한 줄 글자로 적은 것)를 글자마다 막대로 바꿔 지문처럼 늘어놓고, 기준 약 도네페질과 다른 글자만 형광으로 칠합니다.",
      learn: "이미 알려진 약(도네페질)은 특허를 못 받는다 — 원자 하나라도 다른 '새 분자'여야 우리 것이 될 수 있다.",
      render: () => {
        const list = [
          { n: `${T.ref} — 이미 팔리는 약(기준)`, s: REF.s, ref: true },
          { n: `${P.code} 리드 · ${L.name}`, s: L.c.s, me: true },
          ...EX.dock.filter((d) => !d.ref && d.id !== L.id && d.c.t === TID).map((d) => ({ n: d.name, s: d.c.s }))
        ];
        const W = 760, x0 = 16, bw = 13.4, rowH = 74;
        const colOf = (ch) => /[Nn]/.test(ch) ? "var(--me)" : /O/.test(ch) ? "var(--mirp)" : /[FlI]|C(?=l)/.test(ch) ? "var(--seum)" : /[Cc]/.test(ch) ? "var(--ink)" : "var(--line-strong)";
        const atom = (s, k) => /[A-Za-z]/.test(s[k]);
        const rows = list.map((r, ri) => {
          const y = 18 + ri * rowH, d = r.ref ? null : diff(REF.s, r.s);
          const bars = [...r.s].map((ch, k) => {
            const x = x0 + k * bw, hit = d && k >= d.i && k < d.endB, tall = atom(r.s, k);
            const isCl = ch === "C" && r.s[k + 1] === "l";
            return `${hit ? `<rect x="${x - 1}" y="${y + 14}" width="${bw}" height="44" fill="var(--hi)"/>` : ""}
              <rect x="${x + 1.5}" y="${y + (tall ? 18 : 30)}" width="${bw - 4.5}" height="${tall ? 24 : 12}" fill="${isCl ? "var(--seum)" : colOf(ch)}"/>
              <text x="${x + bw / 2 - 0.5}" y="${y + 55}" text-anchor="middle" font-size="11" class="t-m">${esc(ch)}</text>`;
          }).join("");
          const n = d ? Math.max(d.endB - d.i, 1) : 0;
          const tag = r.ref ? "기준 · 특허 불가(이미 알려짐)" : r.me ? `다른 글자 ${n}자 → 새 분자` : `다른 글자 ${n}자`;
          return `${tx(x0, y + 8, r.n, `font-size="12.5" font-weight="${r.me ? 700 : 500}"`)}${tx(W - 10, y + 8, tag, `font-size="11.5" text-anchor="end" class="${r.me ? "" : "t-mu"}" ${r.me ? 'style="fill:var(--me)" font-weight="600"' : ""}`)}${bars}`;
        }).join("");
        const H = 18 + list.length * rowH + 6;
        return `${CV.svg(W, H, rows, "SMILES 지문 비교")}
          <div class="vz-row"><span class="vz-chip" style="border-color:var(--ink)">C · c 탄소</span><span class="vz-chip" style="color:var(--me);border-color:var(--me)">N · n 질소</span><span class="vz-chip" style="color:var(--mirp);border-color:var(--mirp)">O 산소</span><span class="vz-chip" style="color:var(--seum);border-color:var(--seum)">F · Cl 할로젠</span><span class="vz-chip">짧은 막대 = 고리 번호 · 괄호</span><span class="vz-chip" style="background:var(--hi)">형광 = 도네페질과 다른 곳</span></div>
          <div class="vz-cols"><div style="max-width:360px"><span class="vz-lab">${esc(T.ref)}(기준)</span>${CV.mol(REF.s, 260, 150)}</div><div style="max-width:360px"><span class="vz-lab">${esc(P.code)} 리드 — 벤젠 고리의 C 하나가 N 으로</span>${CV.mol(L.c.s, 260, 150)}</div></div>`;
      }
    },

            : p.kind === "ghost" ? `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--paper)" stroke="var(--me)" stroke-width="1.6" stroke-dasharray="2 2"/>`
            : p.kind === "far" ? `<circle cx="${x}" cy="${y}" r="6" fill="var(--muted)"/>`
            : `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--ink)"/>`;
          const lx = p.la === "end" ? x - 10 : p.la === "start" ? x + 10 : x;
          return `${shape}${tx(lx, y + p.dy, p.n, `font-size="12" text-anchor="${p.la}" ${p.kind === "far" ? 'class="t-mu"' : ""}`)}`;
        }).join("");
        const big = 160;
        const realFence = `<g class="s5-f" data-f="real"><path d="M${cx - big} ${cy} a${big} ${big} 0 1 0 ${2 * big} 0 a${big} ${big} 0 1 0 ${-2 * big} 0 Z M${rx - 26} ${ry} a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z" fill="var(--good-bg)" fill-rule="evenodd" stroke="var(--good)" stroke-width="2.2" stroke-dasharray="9 4"/>
          ${tx(cx + 104, cy + 150, "울타리: 계열 전체 청구", `font-size="12.5" font-weight="600" style="fill:var(--good)"`)}
          ${tx(rx, ry + 46, "구멍 = 이미 알려진 분자", `font-size="11.5" style="fill:var(--bad)" text-anchor="middle"`)}</g>`;
        const gameFence = `<g class="s5-f" data-f="game" style="display:none"><circle cx="${cx}" cy="${cy}" r="30" fill="var(--good-bg)" stroke="var(--good)" stroke-width="2.2" stroke-dasharray="9 4"/>

        return `<div class="vz-row" role="group" aria-label="울타리 종류"><button type="button" class="vz-btn" data-f="real" aria-pressed="true">실제 특허 — 계열 청구</button><button type="button" class="vz-btn" data-f="game" aria-pressed="false">게임 규칙 — 분자 하나</button></div>

    {
      name: "전광판 반응",

      render: () => {
        const ev = [
          ["물질특허 등록", "patent"], ["IND 승인", "indPass"], ["1상 통과", "phase1Pass"], ["2상 통과", "phase2Pass"], ["3상 통과", "phase3Pass"],

        const rows = ev.map(([lab, k], i) => {

      <path d="M${x(dev)} ${y - 6} V${y + h + 4}" stroke="var(--ink)" stroke-width="2"/>${tx(x(dev), y - 10, "허가 · 판매 시작", `font-size="12" text-anchor="middle"`)}

<script>/* viz-6.js */
/* 3.2 제형 · IND 신청 — 시각화 시안 10종 */
(function () {
  "use strict";
  const CV = window.CV, { EX, esc, f1, f2, R } = CV;
  const T = EX.t, L = EX.lead, P = EX.program, I = EX.ind, B0 = EX.base, TID = EX.tid;
  const FORMS = ["oral", "iv", "transdermal"], DOSES = [10, 50, 100];
  const FS = { oral: "경구", iv: "정맥", transdermal: "경피" };
  const TH = R.th;
  const M = (v) => `$${v.toFixed(3)}M`;
  const tx = (x, y, s, a = "") => `<text x="${x}" y="${y}" ${a}>${esc(s)}</text>`;
  const G = (f, d) => EX.grid.find((g) => g.form === f && g.dose === d);
  const sc = (f, d, c = L.c, kcal = L.kcal, pop = I.pop) => CV.score(c, kcal, TID, f, d, pop);
  /* 흔들림 전 예상 점수로 어디까지 갈 수 있나 */
  function reach(E, S) {
    if (S < TH.ind.s) return { k: 0, t: "IND 보류", tone: "bad" };
    if (S < TH.phase1.s) return { k: 1, t: "IND까지", tone: "warn" };
    if (E < TH.phase2.e) return { k: 2, t: "1상까지", tone: "warn" };
    if (E < TH.phase3.e || S < TH.phase3.s) return { k: 3, t: "2상까지", tone: "warn" };
    return { k: 4, t: "3상까지", tone: "good" };
  }
  const gates = (E, S) => [
    ["IND", `S ≥ ${TH.ind.s}`, S >= TH.ind.s],
    ["1상", `S ≥ ${TH.phase1.s}`, S >= TH.phase1.s],
    ["2상", `E ≥ ${TH.phase2.e}`, E >= TH.phase2.e],
    ["3상", `E ≥ ${TH.phase3.e} · S ≥ ${TH.phase3.s}`, E >= TH.phase3.e && S >= TH.phase3.s]
  ];
  const lamps = (E, S) => gates(E, S).map(([a, b, ok]) => `<span class="vz-sig ${ok ? "good" : "bad"}">${ok ? "✓" : "✕"} ${a} · ${b}</span>`).join("");
  /* 모양으로도 제형 구분: 경구 원 · 정맥 네모 · 경피 세모 */
  const shape = (f, x, y, r, fill, stroke = "var(--ink)", sw = 1.6) =>
    f === "oral" ? `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`
      : f === "iv" ? `<rect x="${x - r * 0.9}" y="${y - r * 0.9}" width="${r * 1.8}" height="${r * 1.8}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`
      : `<path d="M${x} ${y - r * 1.1} L${x + r * 1.05} ${y + r * 0.75} L${x - r * 1.05} ${y + r * 0.75} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  const FCOL = { oral: "var(--me)", iv: "var(--daon)", transdermal: "var(--seum)" };
  const rk = B0.parts.Rk;

  CV.css("s6", `
    .s6-ctl { display: grid; gap: 10px; }
    .s6-ctl .vz-row > .vz-lab { min-width: 64px; }
    .s6-ctl select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 0; max-width: 100%; }
    .s6-f { min-width: 0; font-family: var(--mono); font-size: 12.5px; background: var(--paper); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 4px; overflow-x: auto; }
    .s6-f div { white-space: nowrap; }
    .s6-f b { font-weight: 600; }
    .s6-f .hl { background: var(--hi); padding: 0 3px; }
    .s6-doc { border: 1px solid var(--line-strong); background: var(--paper); padding: 16px 18px; display: grid; gap: 12px; position: relative; }
    .s6-doc h3 { margin: 0; font-family: var(--serif); font-size: 19px; }
    .s6-ck { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .s6-ck li { display: grid; grid-template-columns: 22px minmax(92px, max-content) minmax(0, 1fr); gap: 4px 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: baseline; font-size: 13px; }
    .s6-ck li > b:first-child { width: 18px; height: 18px; display: inline-grid; place-items: center; background: var(--good); color: var(--paper); font-size: 11px; }
    .s6-ck li span { color: var(--muted); font-size: 12px; }
    .s6-ck li em { font-style: normal; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
    .s6-stamp { position: absolute; right: 14px; top: 10px; width: 96px; transform: rotate(-10deg); pointer-events: none; opacity: 0.92; }
    .s6-memo { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
    .s6-memo b { color: var(--warn); }
    .s6-cap { font-size: 13.5px; margin: 0; min-height: 2.6em; }
    .s6-beam, .s6-pan { transition: transform 0.55s cubic-bezier(.3,.7,.3,1); transform-box: view-box; }
    @media (prefers-reduced-motion: reduce) { .s6-beam, .s6-pan { transition: none; } }
  `);

  /* ── 04 시소 몸통 ── */
  const SEE = { cx: 380, cy: 196, half: 220 };
  function seeState(f, d) {
    const r = sc(f, d), th = Math.max(-20, Math.min(20, -(r.E - r.S) * 0.3));
    const a = (th * Math.PI) / 180;
    const L1 = [SEE.cx - SEE.half * Math.cos(a), SEE.cy - SEE.half * Math.sin(a)], R1 = [SEE.cx + SEE.half * Math.cos(a), SEE.cy + SEE.half * Math.sin(a)];
    return { r, th, L1, R1 };
  }
  function seeBody(f, d) {
    const { r, th, L1, R1 } = seeState(f, d);
    const pan = (id, p, v, lab, col) => {
      const h = Math.max(4, v * 0.62);
      return `<g class="s6-pan" id="${id}" style="transform:translate(${f1(p[0])}px,${f1(p[1])}px)">
        <path d="M0 0 L-46 46 M0 0 L46 46" stroke="var(--line-strong)" stroke-width="1.2"/>
        <rect data-blk x="-34" y="${46 - h}" width="68" height="${h}" fill="${col}"/>
        <path d="M-52 46 H52" stroke="var(--ink)" stroke-width="3"/>
        <text data-val x="0" y="66" text-anchor="middle" font-size="14" font-weight="700" class="t-m">${esc(lab + " " + f1(v))}</text></g>`;
    };
    const yS = CV.scale([0, 100], [330, 40]);
    const scaleBar = (x, v, lab, ths, anchor) => `<rect x="${x - 5}" y="40" width="10" height="290" fill="var(--raise)" stroke="var(--line)"/>
      ${ths.map(([k, t]) => `<path d="M${x - 14} ${yS(t)} H${x + 14}" stroke="var(--ink)" stroke-dasharray="3 2"/>${tx(anchor === "end" ? x - 18 : x + 18, yS(t) + 4, `${k} ${t}`, `font-size="11" class="t-m" text-anchor="${anchor}"`)}`).join("")}
      <rect data-bar x="${x - 5}" y="${yS(v)}" width="10" height="${330 - yS(v)}" fill="var(--ink)"/>
      ${tx(x, 26, lab, `font-size="12.5" font-weight="600" text-anchor="middle"`)}${tx(x, 350, "0", `font-size="11" class="t-m t-mu" text-anchor="middle"`)}`;
    return `${scaleBar(50, r.E, "효능 E", [["2상", TH.phase2.e], ["3상", TH.phase3.e]], "start")}
      ${scaleBar(710, r.S, "안전 S", [["IND", TH.ind.s], ["1상", TH.phase1.s], ["3상", TH.phase3.s]], "end")}
      <path d="M${SEE.cx} ${SEE.cy} L${SEE.cx - 30} ${SEE.cy + 70} H${SEE.cx + 30} Z" fill="var(--ink)"/>
      <path d="M${SEE.cx - 150} ${SEE.cy + 70} H${SEE.cx + 150}" stroke="var(--ink)" stroke-width="2"/>
      <text id="s6-v4-dose" x="${SEE.cx}" y="${SEE.cy + 94}" text-anchor="middle" font-size="14" font-weight="700" class="t-m">${esc(`${FS[f]} ${d} mg`)}</text>
      <g class="s6-beam" id="s6-v4-beam" style="transform-origin:${SEE.cx}px ${SEE.cy}px;transform:rotate(${f1(th)}deg)">
        <rect x="${SEE.cx - SEE.half}" y="${SEE.cy - 5}" width="${SEE.half * 2}" height="10" fill="var(--muted)"/></g>
      <circle cx="${SEE.cx}" cy="${SEE.cy}" r="6" fill="var(--hi)" stroke="var(--ink)" stroke-width="2"/>
      ${pan("s6-v4-pl", L1, r.E, "E", "var(--me)")}${pan("s6-v4-pr", R1, r.S, "S", "var(--good)")}`;
  }

  /* ── 06 혈중 농도 곡선 몸통 ── */
  function pkBody(dose) {
    const W = 760, x = CV.scale([0, 24], [70, 604]), y = CV.scale([0, 72], [300, 30]);
    const Dt = R.doseT[dose];
    const shapeF = {
      iv: (t) => (t < 0.15 ? t / 0.15 : Math.exp(-(t - 0.15) / 5)),
      oral: (t) => { const v = (u) => Math.exp(-0.2 * u) - Math.exp(-1.2 * u); const tm = Math.log(6) / 1; return v(t) / v(tm); },
      transdermal: (t) => (1 - Math.exp(-t / 3)) / (1 - Math.exp(-8))
    };
    const lim = [["IND 한계", 65 / rk, "var(--bad)"], ["1상 한계", 50 / rk, "var(--warn)"], ["3상 한계", 45 / rk, "var(--good)"]];
    const curves = FORMS.map((f) => {

          ${box(8, rows.oral - 22, 72, 44, "입", "정제 · 캡슐")}${box(110, rows.oral - 22, 96, 44, "위 · 장", "녹아서 흡수")}${box(236, rows.oral - 22, 96, 44, "간", "첫 통과 걸러짐")}
          ${ar(`M80 ${rows.oral} H108`, "oral")}${ar(`M206 ${rows.oral} H234`, "oral")}${ar(`M332 ${rows.oral} C400 ${rows.oral} 400 ${rows.iv} 438 ${rows.iv - 20}`, "oral")}
          ${box(8, rows.iv - 22, 96, 44, "정맥 주사", "핏줄로 바로")}${ar(`M104 ${rows.iv} H438`, "iv")}${tx(270, rows.iv - 10, "중간 단계 없음 → 한꺼번에 몰림", `font-size="11.5" text-anchor="middle" class="t-mu"`)}
          ${box(8, rows.transdermal - 22, 96, 44, "피부 패치", "붙여 두기")}${box(134, rows.transdermal - 22, 120, 44, "피부 층", "천천히 스며듦")}
          ${ar(`M104 ${rows.transdermal} H132`, "transdermal")}${ar(`M254 ${rows.transdermal} C380 ${rows.transdermal} 400 ${rows.iv} 438 ${rows.iv + 20}`, "transdermal")}
          ${box(440, rows.iv - 50, 110, 100, "혈액", "온몸을 돎", "var(--film-2)")}
          <rect x="586" y="${rows.iv - 70}" width="14" height="140" fill="url(#s6-bbb)" stroke="var(--ink)"/>
          <defs><pattern id="s6-bbb" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--paper)"/><rect width="3" height="6" fill="var(--ink)"/></pattern></defs>
          ${tx(593, rows.iv - 78, "뇌 관문(BBB)", `font-size="12" font-weight="600" text-anchor="middle"`)}
          <path d="M550 ${rows.iv} H644" stroke="var(--ink)" stroke-width="3" marker-end="url(#s6-ar10)"/>
          ${box(646, rows.iv - 40, 124, 80, `뇌 · ${T.gene}`, "알츠하이머 표적", "var(--film-3)")}
          ${tx(593, rows.iv + 96, `뇌 노출 B ${R.bbb[s.bbb].toFixed(2)} (${CV.LV[s.bbb]})`, `font-size="12" class="t-m" font-weight="600" text-anchor="middle"`)}
          ${tx(593, rows.iv + 112, `TPSA ${f1(L.c.tpsa)} ≤ 90 · MW ${f1(L.c.mw)} ≤ 450 · HBD ${L.c.hbd} ≤ 3`, `font-size="11" class="t-m t-mu" text-anchor="middle"`)}
          ${tx(593, rows.iv + 128, "CNS 표적이라 B 가 효능에 곱해짐", `font-size="11" class="t-mu" text-anchor="middle"`)}`;
        return `${CV.svg(W, H, body, "약이 몸속 표적까지 가는 길")}
          <p class="vz-note">TPSA(분자 표면의 극성 넓이)가 작고 크기가 알맞아 이 분자는 경구 흡수 '${esc(CV.LV[s.oral])}' · 경피 '${esc(CV.LV[s.td])}' · 뇌 노출 '${esc(CV.LV[s.bbb])}' 입니다. 선 굵기는 몰리는 정도(K)의 느낌을 나타낸 그림입니다.</p>`;
      }
    }
  ];

  /* 05 실험실 결과 */
  function s6Lab(f, d, id, pop) {
    const a = EX.admet.find((x) => x.id === id) || EX.admet.find((x) => x.id === L.id);
    const r = CV.score(a.c, a.kcal, TID, f, d, pop), p = r.parts;
    const W = 720, x = CV.scale([0, 100], [70, 700]);
    const g = (y, v, lab, ths) => `${tx(10, y + 13, lab, `font-size="13" font-weight="700"`)}<rect x="70" y="${y}" width="630" height="18" fill="var(--raise)"/>
      <rect x="70" y="${y}" width="${x(v) - 70}" height="18" fill="var(--ink)"/>
      ${ths.map(([k, t], i) => `<path d="M${x(t)} ${y - 6} V${y + 24}" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="3 2"/>${tx(x(t), i % 2 ? y - 10 : y + 37, `${k} ${t}`, `font-size="11" class="t-m" text-anchor="middle" style="fill:var(--bad)"`)}`).join("")}
      ${tx(Math.min(x(v) + 6, 660), y + 13, f1(v), `font-size="13" class="t-m" font-weight="700" ${x(v) + 6 > 660 ? 'style="fill:var(--paper)"' : ""}`)}`;
    const body = `${g(26, r.E, "효능 E", [["2상", TH.phase2.e], ["3상", TH.phase3.e]])}${g(104, r.S, "안전 S", [["IND", TH.ind.s], ["1상", TH.phase1.s], ["3상", TH.phase3.s]])}`;
    const offNote = a.c.t !== TID ? `${a.name}은(는) ${T.gene}를 겨냥해 만든 분자가 아닙니다(${/troglitazone/i.test(a.name) ? "당뇨약 · PPAR 표적" : "다른 표적의 분자"}). 공식은 도킹 숫자만 보므로 점수가 좋아 보여도, 2.2에서 리드로 고르지 않았고 특허도 없어 IND에 낼 수 없습니다.` : "";
    const popNote = p.cns && !p.brainPop ? `${T.gene}는 원래 뇌 표적(CNS)이라 환자군을 바꿔도 B 가 그대로 곱해집니다 — 이 표적에선 환자군이 점수를 바꾸지 않아요.` : "";
    return `${CV.svg(W, 156, body, "효능과 안전 게이지")}
      <div class="s6-f"><div>E = 100 × (0.3 + 0.7 × <b>p ${p.p.toFixed(3)}</b>) × <b>A ${p.A.toFixed(2)}</b> × <b>B ${p.B.toFixed(2)}</b> × <b>De ${p.De.toFixed(2)}</b> = <span class="hl">${f1(r.E)}</span></div>
      <div>S = max(0, 100 − <b>Dt ${p.Dt}</b> × (1 + <b>hERG ${p.hergR.toFixed(2)}</b> + <b>간 ${p.hepR.toFixed(2)}</b>) × <b>K ${p.K.toFixed(2)}</b>) = <span class="hl">${f1(r.S)}</span></div>
      <div style="color:var(--muted)">신호 · 경구 ${esc(CV.LV[r.s.oral])} · 경피 ${esc(CV.LV[r.s.td])} · 뇌 노출 ${esc(CV.LV[r.s.bbb])} · hERG ${esc(CV.LV[r.s.herg])} · 간 ${esc(CV.LV[r.s.hep])} · ΔG ${f2(a.kcal)}</div></div>
      <div class="vz-row">${lamps(r.E, r.S)}</div>${offNote ? `<p class="vz-note" style="color:var(--warn)">${esc(offNote)}</p>` : ""}${popNote ? `<p class="vz-note">${esc(popNote)}</p>` : ""}`;
  }

  /* 09 사다리(단계 k 까지 보임) */
  function s6Ladder(k) {
    const tr = EX.trials, b10 = G(I.form, EX.finalDose);
    const rungs = ["출발", "IND", "1상", "2상", "3상", "허가"];
    const req = ["", `S ≥ ${TH.ind.s}`, `S ≥ ${TH.phase1.s}`, `E ≥ ${TH.phase2.e}`, `E ≥ ${TH.phase3.e} · S ≥ ${TH.phase3.s}`, `D+${EX.approval.day}`];
    const yR = (i) => 394 - i * 66;
    /* 각 칸 값 · 통과 */
    const A = [null, { v: `S ${f1(I.S)}`, ok: I.pass }, { v: `S ${f1(tr[0].S)}`, ok: tr[0].pass }, null, null, null];
    const Bv = [null, { v: `S ${f1(b10.S)}`, ok: b10.S >= TH.ind.s }, { v: `S ${f1(tr[1].S)}`, ok: tr[1].pass }, { v: `E ${f1(tr[2].E)}`, ok: tr[2].pass },
      { v: `E ${f1(tr[3].E)} · S ${f1(tr[3].S)}`, ok: tr[3].pass }, { v: EX.approval.brand, ok: true }];
    const reachOf = (V) => { let r = 0; for (let i = 1; i < V.length; i++) { if (!V[i]) break; if (!V[i].ok) return { top: r, fail: i }; r = i; } return { top: r, fail: -1 }; };
    const ladder = (x0, V, title, col) => {
      const rr = reachOf(V), top = Math.min(rr.top, k), failShown = rr.fail >= 0 && k >= rr.fail;
      const rails = `<path d="M${x0} ${yR(0) + 10} V${yR(5) - 14} M${x0 + 90} ${yR(0) + 10} V${yR(5) - 14}" stroke="var(--ink)" stroke-width="3"/>`;
      const rs = rungs.map((_, i) => { const v = V[i], shown = i <= k && v, ok = v && v.ok;
        return `<path d="M${x0} ${yR(i)} H${x0 + 90}" stroke="${shown ? (ok ? "var(--good)" : "var(--bad)") : "var(--line-strong)"}" stroke-width="${shown ? 4 : 2}"/>
          ${shown ? tx(x0 < 380 ? x0 - 10 : x0 + 100, yR(i) + 4, `${ok ? "✓" : "✕"} ${v.v}`, `font-size="12" class="t-m" font-weight="600" text-anchor="${x0 < 380 ? "end" : "start"}" style="fill:var(--${ok ? "good" : "bad"})"`) : ""}`; }).join("");
      const cy = yR(top) - 14;
      const who = `<circle cx="${x0 + 45}" cy="${cy}" r="11" fill="${col}" stroke="var(--ink)" stroke-width="1.5"/>`;
      const stopMark = failShown ? `${tx(x0 + 45, yR(rr.fail) - 8, "멈춤", `font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--bad)"`)}` : "";
      return `${tx(x0 + 45, 22, title, `font-size="13" font-weight="700" text-anchor="middle"`)}${rails}${rs}${who}${stopMark}`;
    };
    const mid = rungs.map((r, i) => `${tx(380, yR(i) - 2, r, `font-size="13.5" font-weight="700" text-anchor="middle"`)}${tx(380, yR(i) + 14, req[i], `font-size="11" class="t-m t-mu" text-anchor="middle"`)}`).join("");
    return `${mid}${ladder(190, A, `경구 ${I.dose} mg (처음)`, "var(--hi)")}${ladder(480, Bv, `경구 ${EX.finalDose} mg (바꾼 뒤)`, "var(--film-2)")}`;
  }
})();

</script>
<script>/* viz-7.js */
/* 4.1 임상 1 · 2 · 3상 — 시각화 시안 10종 */
(function () {
  "use strict";
  const CV = window.CV, { EX, esc, f1, R } = CV;
  const MX = CV.MX;

  /* ── 이 파일 도우미 ── */
  const TR = EX.trials, LEAD = EX.lead;
  const POP = EX.ind ? EX.ind.pop : CV.TRIAL[EX.tid].pops[0];
  const PH = ["phase1", "phase2", "phase3"];
  const PHL = { phase1: "1상", phase2: "2상", phase3: "3상" };
  const FORMS = [["oral", "경구"], ["iv", "정맥주사"], ["transdermal", "경피"]];
  const DOSES = [["10", "10 mg"], ["50", "50 mg"], ["100", "100 mg"]];
  const sc = (form, dose) => CV.score(LEAD.c, LEAD.kcal, EX.tid, form, +dose, POP);
  const r1 = (v) => Math.round(v * 10) / 10;
  const pc = (p) => (p * 100).toFixed(1) + "%";
  const sgn = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
  const rule = (k) => { const th = R.th[k]; return [th.e != null ? `E ≥ ${th.e}` : "", th.s != null ? `S ≥ ${th.s}` : ""].filter(Boolean).join(" · "); };
  /* 흔들림 n 은 −r..+r 정수가 모두 같은 확률로 나오고, E 와 S 에 같은 n 이 더해진다(게임 규칙 그대로) */
  function outs(E, S, k) {
    const r = R.noise[k], th = R.th[k], o = [];
    for (let n = -r; n <= r; n++) {
      const e = Math.max(0, r1(E + n)), s = Math.max(0, r1(S + n));
      o.push({ n, e, s, pass: (th.e == null || e >= th.e) && (th.s == null || s >= th.s) });
    }
    return o;
  }
  function prob(b, k) { const o = outs(b.E, b.S, k), ok = o.filter((x) => x.pass).length; return { ok, tot: o.length, p: ok / o.length }; }
  const frac = (q) => `${q.ok}/${q.tot}`;
  /* 글자: s 는 이스케이프한다 */
  const T = (x, y, s, a = "") => `<text x="${x}" y="${y}" ${a}>${esc(s)}</text>`;
  const btns = (id, key, items, cur) => items.map(([v, l]) =>
    `<button type="button" class="vz-btn" id="${id}-${v}" data-${key}="${v}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join("");
  /* 버튼 묶음 연결: data-<key> 버튼을 누르면 state[key] 를 바꾸고 다시 그린다 */
  function wire(el, keys, state, draw, extra) {
    const out = el.querySelector("[data-out]");
    const on = (e) => {
      const b = e.target.closest("button"); if (!b || !el.contains(b)) return;
      for (const k of keys) if (b.dataset[k] != null) {
        state[k] = b.dataset[k];
        el.querySelectorAll(`button[data-${k}]`).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        if (extra) extra(state, k);
        out.innerHTML = draw(state); return;
      }
    };
    el.addEventListener("click", on);
    return () => el.removeEventListener("click", on);
  }
  const tone = (pass) => (pass ? "var(--good)" : "var(--bad)");
  const mark = (pass) => (pass ? "✓" : "✕");

  CV.css("s7", `
    .s7-ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .s7-ctl [role="group"] { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .s7-ctl .vz-lab { margin-right: 4px; }
    .s7-read { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; margin: 0; }
    .s7-read b { font-weight: 600; }
    .s7-hist { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
    .s7-src { font-size: 11px; color: var(--muted); margin: 0; max-width: 90ch; }
    .s7-sl { display: grid; gap: 4px; max-width: 520px; }
    .s7-sl label { font-size: 12.5px; font-weight: 600; }
    .s7-sl input { margin: 0; }
  `);

  /* ───────── 1. 세 관문 허들 ───────── */
  function v1() {
    const W = 880, H = 410, y0 = 300, yk = 2.05, Y = (v) => y0 - v * yk;
    const P = [
      { k: "phase1", q: "안전한가?", who: "건강한 지원자 소수", cols: [
        { m: "S", lab: "50 mg", v: TR[0].S, chk: true, pass: TR[0].pass },
        { m: "S", lab: "10 mg", v: TR[1].S, chk: true, pass: TR[1].pass },
        { m: "E", lab: "10 mg", v: TR[1].E, chk: false }] },
      { k: "phase2", q: "효과가 있나?", who: "환자 소수", cols: [
        { m: "E", lab: "10 mg", v: TR[2].E, chk: true, pass: TR[2].pass },
        { m: "S", lab: "10 mg", v: TR[2].S, chk: false }] },
      { k: "phase3", q: "많은 환자에게 둘 다?", who: "환자 다수", cols: [
        { m: "E", lab: "10 mg", v: TR[3].E, chk: true, pass: TR[3].pass },
        { m: "S", lab: "10 mg", v: TR[3].S, chk: true, pass: TR[3].pass }] }
    ];
    let b = "";
    P.forEach((p, i) => {
      const px = 20 + i * 290, pw = 260, th = R.th[p.k];
      b += `<rect x="${px}" y="8" width="${pw}" height="372" fill="var(--paper)" stroke="var(--line)"/>`;
      b += T(px + 12, 30, `${PHL[p.k]} · ${p.q}`, 'font-size="16" font-weight="700"');
      b += T(px + 12, 49, p.who, 'font-size="12" class="t-mu"');
      b += T(px + 12, 68, `기준 ${rule(p.k)}`, 'font-size="12.5" class="t-m" font-weight="600"');
      for (const v of [0, 50, 100]) {
        b += `<line x1="${px + 34}" x2="${px + pw - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="2 4"' : ""}/>`;
        b += T(px + 28, Y(v) + 4, v, 'font-size="11" class="t-m t-mu" text-anchor="end"');
      }
      const tags = new Set();
      p.cols.forEach((c, j) => {
        const cx = px + 134 + (j - (p.cols.length - 1) / 2) * 66, bw = 34;
        const fill = c.chk ? tone(c.pass) : "var(--raise)";
        b += `<rect x="${cx - bw / 2}" y="${Y(c.v)}" width="${bw}" height="${y0 - Y(c.v)}" fill="${fill}" ${c.chk ? "" : 'stroke="var(--line-strong)" stroke-dasharray="3 3"'}/>`;
        /* 허들 아래에서 멈춘 막대는 숫자를 막대 안에 쓴다(가로대와 겹치지 않게) */
        b += c.chk && !c.pass ? T(cx, Y(c.v) + 18, `${f1(c.v)}`, 'font-size="12" class="t-m" text-anchor="middle" font-weight="700" style="fill:var(--paper)"') + T(cx, Y(c.v) + 34, "✕", 'font-size="12" text-anchor="middle" font-weight="700" style="fill:var(--paper)"')
          : T(cx, Y(c.v) - 6, `${f1(c.v)}${c.chk ? " " + mark(c.pass) : ""}`, `font-size="12" class="t-m" text-anchor="middle" font-weight="600"`);
        b += T(cx, y0 + 17, `${c.m === "E" ? "효능 E" : "안전 S"}`, 'font-size="12" text-anchor="middle" font-weight="600"');
        b += T(cx, y0 + 32, c.chk ? c.lab : `${c.lab} · 안 봄`, 'font-size="11" class="t-m t-mu" text-anchor="middle"');
        const t = c.chk ? (c.m === "E" ? th.e : th.s) : null;
        if (t != null) {
          /* 허들: 기준 높이의 가로대 + 다리 둘 */
          const hy = Y(t);
          b += `<line x1="${cx - 28}" x2="${cx + 28}" y1="${hy}" y2="${hy}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 3"/>`;
          b += `<rect x="${cx - 27}" y="${hy - 3}" width="54" height="6" fill="var(--ink)" fill-opacity="0.85"/>`;
          b += `<line x1="${cx - 24}" x2="${cx - 24}" y1="${hy}" y2="${y0}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${cx + 24}" x2="${cx + 24}" y1="${hy}" y2="${y0}" stroke="var(--ink)" stroke-width="1.5"/>`;
          tags.add(t);
        }
      });
      /* 기준 숫자표는 상자 오른쪽 끝에 한 번씩 */
      for (const t of tags) {
        b += `<line x1="${px + 34}" x2="${px + pw - 32}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ink)" stroke-opacity="0.35" stroke-dasharray="2 3"/>`;
        b += `<rect x="${px + pw - 30}" y="${Y(t) - 9}" width="28" height="17" fill="var(--hi)"/>` + T(px + pw - 16, Y(t) + 4, t, 'font-size="12" class="t-m" text-anchor="middle" font-weight="700"');
      }
      b += `<line x1="${px + 10}" x2="${px + pw - 10}" y1="${y0 + 44}" y2="${y0 + 44}" stroke="var(--line)"/>`;
      b += T(px + 12, y0 + 64, `${R.days[p.k]}일 · ${MX(R.cost[p.k])} · 흔들림 ±${R.noise[p.k]}`, 'font-size="12" class="t-m"');
      if (i < 2) b += `<path d="M${px + pw + 6} 190 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    });
    b += T(20, 402, "관문마다 묻는 것이 다르고, 마지막 3상은 두 기준을 함께 · 더 높게(S 50 → 55) 묻는다. 기간 · 비용도 두 배씩 는다.", 'font-size="12.5" class="t-mu"');
    return CV.svg(W, H, b, "임상 세 관문의 기준 높이와 우리 약의 결과");
  }

  /* ───────── 2. 흔들림 띠 ───────── */
  function band(st) {
    const b = sc(st.f, st.d), W = 880, X0 = 150, X1 = 770, X = (v) => X0 + (Math.max(0, Math.min(100, v)) / 100) * (X1 - X0);
    const indOk = b.S >= R.th.ind.s;
    let y = 92, body = "", probs = [], last = y;
    body += T(16, 24, `${CV.FORM_SHORT[st.f]} ${st.d} mg 예상값 — 효능 E ${f1(b.E)} · 안전 S ${f1(b.S)}`, 'font-size="14" font-weight="700"');
    body += T(864, 24, indOk ? `IND 기준 S ≥ ${R.th.ind.s} 통과` : `IND 기준 S ≥ ${R.th.ind.s} 미달 — 임상 시작 불가`, `font-size="12" text-anchor="end" font-weight="600" fill="${tone(indOk)}" style="fill:${tone(indOk)}"`);
    for (const k of PH) {
      const th = R.th[k], r = R.noise[k], o = outs(b.E, b.S, k), q = prob(b, k), ms = [];
      if (th.e != null) ms.push(["E", b.E, th.e, "e"]);
      if (th.s != null) ms.push(["S", b.S, th.s, "s"]);
      probs.push(q.p);
      body += T(16, y + 4, PHL[k], 'font-size="15" font-weight="700"');
      body += T(16, y + 22, `흔들림 ±${r}`, 'font-size="11.5" class="t-m t-mu"');

  /* ───────── 3. 100번 굴려 보기 ───────── */
  function roll(k, rand, times = 100) {

  function simSVG(st) {

  }
  function v3() {

  function passCount(st) { const b = sc("oral", st.d), o = outs(b.E, b.S, st.k); return st.c.reduce((a, x, i) => a + (o[i].pass ? x : 0), 0); }

  /* ───────── 4. 여유와 확률 ───────── */
  /* 여유 m = 예상값 − 기준. 통과하려면 n ≥ −m 인 정수 n 이 나와야 한다. */
  const cnt = (m, r) => Math.max(0, Math.min(2 * r + 1, r + 1 - Math.ceil(-m - 1e-9)));
  function curveSVG(m) {
    const W = 880, X0 = 70, X1 = 820, Y0 = 300, Y1 = 76, X = (v) => X0 + ((v + 12) / 24) * (X1 - X0), Y = (p) => Y0 - p * (Y0 - Y1);

    for (let v = -12; v <= 12; v += 2) s += T(X(v), Y0 + 18, v > 0 ? "+" + v : v, 'font-size="11" class="t-m t-mu" text-anchor="middle"');
    s += `<line x1="${X(0)}" x2="${X(0)}" y1="${Y1 - 12}" y2="${Y0}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s += T(X(0), Y1 - 18, "여유 0 = 예상값이 기준과 같음", 'font-size="11.5" text-anchor="middle" font-weight="600"');

    s += `<line x1="${X0}" x2="${X0 + 30}" y1="20" y2="20" stroke="var(--ink)" stroke-width="2.5"/>` + T(X0 + 36, 24, "1 · 2상 흔들림 ±6 (13가지)", 'font-size="12"');
    s += `<line x1="${X0 + 230}" x2="${X0 + 260}" y1="20" y2="20" stroke="var(--me)" stroke-width="2.5" stroke-dasharray="7 4"/>` + T(X0 + 266, 24, "3상 흔들림 ±4 (9가지)", 'font-size="12"');
    s += `<rect x="${X0 + 452}" y="14" width="10" height="10" fill="var(--bad)"/>` + T(X0 + 468, 24, "슬라이더 위치", 'font-size="12"');

      const ly = Y0 + 66 + i * 19;
      s += `<circle cx="${X0 + 8}" cy="${ly - 4}" r="8" fill="${tone(pr > 0.5)}"/>` + T(X0 + 8, ly, i + 1, 'font-size="10.5" text-anchor="middle" font-weight="700" style="fill:var(--paper)"');
      s += T(X0 + 24, ly, `${p.lab} = 여유 ${p.m > 0 ? "+" : ""}${f1(p.m)} → ${cnt(p.m, p.r)}/${2 * p.r + 1} = ${pc(pr)}`, `font-size="12" class="t-m" style="fill:${tone(pr > 0.5)}"`);

  /* ───────── 5. E · S 궤적 평면 ───────── */
  const REG = { ind: { e: 0, s: R.th.ind.s }, phase1: { e: 0, s: R.th.phase1.s }, phase2: { e: R.th.phase2.e, s: 0 }, phase3: { e: R.th.phase3.e, s: R.th.phase3.s } };

  function planeSVG(st) {
    const W = 880, H = 480, X0 = 70, X1 = 470, Y0 = 440, Y1 = 40, X = (v) => X0 + (v / 100) * (X1 - X0), Y = (v) => Y0 - (v / 100) * (Y0 - Y1);

      const left = g.E > 85, below = g.form === "iv" && g.S > 4;

    const gy = AP.day / 365;
    s += T(16, Y + 20, "이 게임", 'font-size="13" font-weight="700"') + `<rect x="${X0}" y="${Y + 6}" width="${YX(gy) - X0}" height="20" fill="var(--ink)"/>` + T(YX(gy) + 8, Y + 21, `${AP.day}일 ≈ ${gy.toFixed(1)}년`, 'font-size="12" class="t-m" font-weight="600"');
    s += T(16, Y + 54, "실제 신약", 'font-size="13" font-weight="700"') + `<rect x="${X0}" y="${Y + 40}" width="${YX(10) - X0}" height="20" fill="var(--muted)"/><rect x="${YX(10)}" y="${Y + 40}" width="${YX(15) - YX(10)}" height="20" fill="var(--muted)" fill-opacity="0.35" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
    s += T(YX(15) - 6, Y + 55, "10~15년", 'font-size="12" class="t-m" text-anchor="end" font-weight="700"');
    s += T(16, H - 6, "둘 다 임상이 가장 길다. 게임은 발견 단계를 며칠로 줄였지만, 실제로는 분자를 찾는 데만 몇 년이 걸린다.", 'font-size="12.5" font-weight="600"');
    return CV.svg(W, H, s, "게임 일정과 실제 신약 개발 기간 비교") + `<p class="s8-src">실제 기간은 대략값 — PhRMA, Biopharmaceutical Research &amp; Development: The Process Behind New Medicines (2015): 평균 10~15년, 임상 6~7년, 심사 0.5~2년. 약마다 크게 다르다.</p>`;
  }

  /* ───────── 10. 지름길 회고 ───────── */
  function v10() {
    const b50 = sc(FORM0, 50), q1 = prob(b50, "phase1"), q3 = prob(b50, "phase3");
    const tries = Math.round(1 / q1.p); /* 1상 통과까지 평균 시도 횟수(기댓값 = 1/p) */
    const pre = EX.ind.day, preM = R.cost.htvs + R.cost.docking + R.cost.admet + R.cost.patent + R.cost.ind;
    const routes = [
      { t: "실제로 간 길", sub: "50 mg 실패 → 10 mg", segs: [["pre", pre], ...TR.map((t) => [t.pass ? "ok" : "bad", R.days[t.k]]), ["fin", R.days.final]],
        end: `${AP.day}일 · ${MX(AP.spent)} · 허가 ✓`, ok: true },
      { t: "IND 때 10 mg 였다면", sub: "실패 없이", segs: [["pre", pre], ...TR.filter((t) => t.pass).map((t) => ["ok", R.days[t.k]]), ["fin", R.days.final]],
        end: `${AP.day - R.days.phase1}일 · ${MX(Math.round((AP.spent - R.cost.phase1) * 1000) / 1000)} · 허가 ✓`, ok: true },
      { t: "50 mg 로 계속 다시", sub: `1상 평균 ${tries}번 시도`, segs: [["pre", pre], ...Array.from({ length: tries }, (_, i) => [i < tries - 1 ? "bad" : "ok", R.days.phase1]), ["ok", R.days.phase2], ["bad", R.days.phase3]],
        end: `평균 ${(pre + tries * R.days.phase1 + R.days.phase2 + R.days.phase3).toLocaleString("en-US")}일 · ${MX(Math.round((preM + tries * R.cost.phase1 + R.cost.phase2 + R.cost.phase3) * 1000) / 1000)} · 3상 실패 ✕`, ok: false }
    ];
    const W = 880, H = 400, X0 = 170, X1 = 860, Dm = 1800, X = (d) => X0 + (d / Dm) * (X1 - X0);
    let s = "";
    for (let d = 0; d <= Dm; d += 300) s += `<line x1="${X(d)}" x2="${X(d)}" y1="30" y2="300" stroke="var(--line)" stroke-dasharray="2 4"/>` + T(X(d), 22, `D+${d}`, 'font-size="11" class="t-m t-mu" text-anchor="middle"');
    const FL = { pre: "var(--raise)", ok: "var(--good)", bad: "var(--bad)", fin: "var(--hi)" };
    routes.forEach((r, i) => {
      const y = 56 + i * 84; let d = 0;
      s += T(16, y + 14, r.t, 'font-size="13.5" font-weight="700"') + T(16, y + 31, r.sub, 'font-size="11.5" class="t-mu"');
      for (const [k, len] of r.segs) { s += `<rect x="${X(d)}" y="${y}" width="${X(d + len) - X(d)}" height="22" fill="${FL[k]}" stroke="var(--paper)" stroke-width="0.8"/>`; d += len; }
      s += T(X(d), y + 42, r.end, `font-size="12" class="t-m" text-anchor="end" font-weight="700" style="fill:${tone(r.ok)}"`);
    });
    /* 경고 신호 */
    s += `<line x1="${X(pre)}" x2="${X(pre)}" y1="40" y2="300" stroke="var(--warn)" stroke-width="2"/>`;
    s += `<rect x="${X(pre) + 6}" y="300" width="560" height="44" fill="var(--warn-bg)"/>`;
    s += T(X(pre) + 14, 318, `경고 신호 D+${pre}: IND 때 S ${f1(EX.ind.S)} — IND 기준 ${R.th.ind.s} 은 넘었지만 1상 기준 ${R.th.phase1.s} 아래`, 'font-size="12" font-weight="700" style="fill:var(--warn)"');
    s += T(X(pre) + 14, 336, `50 mg 는 1상 통과 ${q1.ok}/${q1.tot}, 3상(S ≥ ${R.th.phase3.s})은 ${q3.ok}/${q3.tot} — 다시 해도 끝내 막힌다`, 'font-size="12" class="t-m" style="fill:var(--warn)"');
    s += T(16, 376, "다음 단계 기준을 미리 내다보면 실패 한 번(90일 · $0.300M)을 아낄 수 있었다. 실패에서 원인을 찾아 바꾼 것이 허가로 이어졌다.", 'font-size="12.5" font-weight="600"');
    s += `<rect x="16" y="386" width="10" height="10" fill="var(--good)"/>` + T(30, 395, "통과", 'font-size="11"') + `<rect x="70" y="386" width="10" height="10" fill="var(--bad)"/>` + T(84, 395, "실패", 'font-size="11"') + `<rect x="124" y="386" width="10" height="10" fill="var(--raise)" stroke="var(--line-strong)"/>` + T(138, 395, "1.1~3.2", 'font-size="11"') + `<rect x="196" y="386" width="10" height="10" fill="var(--hi)"/>` + T(210, 395, "허가 심사", 'font-size="11"');
    return CV.svg(W, H + 6, s, "실제 경로와 다른 두 경로의 기간 · 비용 비교");
  }

  window.VIZ[8] = [
    { name: "품목 허가증", kind: "실물 서류 · 도장",
      idea: "허가증의 한 줄 한 줄 옆에 그 증거가 나온 단계 꼬리표(1.1~4.2)를 붙여, 도장 하나가 무엇을 묶은 것인지 보여 준다.",
      learn: "최종 허가는 새 실험이 아니라 지금까지 모은 모든 증거를 한 장으로 묶은 결과다.",
      render: v1 },
    { name: "증거 바인더", kind: "탭 서류철 · 넘겨 보기",
      idea: "서류철 탭 8장(표적 · 스크리닝 · 도킹 · ADMET · 특허 · IND · 임상 · 신청)을 넘기며 각 장이 증명하는 한 문장과 실제 값을 본다.",
      learn: "단계마다 증명하는 것이 하나씩 쌓여야 심사관이 '팔아도 된다'고 판단할 수 있다.",
      render: v2, mount: (el) => wire(el, ["p"], { p: "4.2" }, (st) => page(st.p)) },
    { name: "여정 노선도", kind: "지하철 노선도 · 날짜 띠",
      idea: "8개 역(1.1~4.2)을 노선도로 잇고 4.1 의 실패 되돌이를 그린 뒤, 같은 역을 실제 날짜 띠 위로 옮겨 시간이 어디에 몰렸는지 보여 준다.",
      learn: "앞의 여섯 단계는 42일 만에 지나갔고, 시간 대부분은 사람에게 시험하는 임상에 들었다.",
      render: v3 },
    { name: "220 → 1 점 지도", kind: "점 지도 · 소모 회고",
      idea: "분자 220개를 칸 하나씩 그리고, 각 분자가 멈춘 단계(관문 · 상위 10 · 도킹 · ADMET)로 칠해 끝까지 간 1개를 찾는다.",
      learn: "허가받은 약 하나 뒤에는 중간에 멈춘 분자 219개가 있다.",
      render: v4 },
    { name: "제형 바꿔 보기", kind: "원그래프 · what-if",
      idea: "제형 · 용량을 바꾸면 시장 점유 기본값(12% × 제형 배율)과 임상 통과 확률이 함께 바뀌고, 둘을 곱한 기대 점유를 보여 준다.",
      learn: "점유 배율이 높은 제형이라도 임상을 넘지 못하면 0 — 시장과 안전을 함께 따져야 한다.",
      render: v5, mount: (el) => wire(el, ["f", "d"], { f: FORM0, d: String(AP.dose) }, whatSVG) },
    { name: "포장 미리보기", kind: "실물 · 브랜드 인쇄",
      idea: "브랜드 이름을 직접 입력하고 정제 · 캡슐 · 바이알 · 패치 포장을 골라 보며, 허가 제형과 맞는 포장인지 확인한다.",
      learn: "허가가 나야 코드명이 브랜드 이름으로 공개되고, 포장은 허가받은 제형을 따라야 한다.",
      render: v6, mount: m6 },
    { name: "주가 반응", kind: "계단 선 그래프 · LED 헤드라인",
      idea: "특허 · IND · 임상 통과 · 실패 · 허가 때마다 주가 지수가 오르내린 계단을 그리고, 허가 헤드라인을 전광판 글씨로 띄운다.",
      learn: "허가 하루의 주가 반응(▲15.6%)이 가장 크고, 그 크기는 제형 배율에 따라 달라진다.",
      render: v7 },
    { name: "연구비 영수증", kind: "영수증 · 비율 띠",
      idea: "1.1~4.2 에 쓴 돈을 날짜와 함께 영수증 한 장에 적고, 합계 · 남은 돈 · 걸린 날 · 분자 수와 쓴 돈의 몫을 띠로 보여 준다.",
      learn: "처음 $6.000M 중 $2.800M 을 썼고, 그중 대부분이 임상이었다.",
      render: v8 },
    { name: "시간 비교", kind: "비율 막대 · 같은 눈금",
      idea: "게임 822일과 실제 신약 개발(대략 10~15년)을 비율 막대와 같은 년 눈금으로 두 번 견준다.",
      learn: "둘 다 임상이 가장 길지만, 실제 신약은 게임보다 훨씬 오래 걸린다.",
      render: v9 },
    { name: "지름길 회고", kind: "비교 타임라인 · 회고",
      idea: "실제로 간 길, IND 때 10 mg 였다면, 50 mg 로 계속 다시 했다면 — 세 경로의 날짜 · 돈 · 결과를 같은 눈금에 놓는다.",
      learn: "다음 단계 기준을 미리 내다보면 실패를 줄이고, 실패했을 땐 원인을 바꿔야 허가에 닿는다.",
      render: v10 }
  ];
})();

</script>
<script>
(() => {
  "use strict";
  const CV = window.CV, { esc, pad, STEPS, PHASES, EX, MX } = CV;
  const $ = (id) => document.getElementById(id);
  const list = (n) => (window.VIZ[n] || []);

  /* 상태: 단계 n(1~8) · 시안 v(0~9) · 모아 보기 */
  let n = 3, v = 0, all = false, cleanups = [];
  const fromHash = () => {
    const m = /^#s([1-8])(?:v(\d{1,2})|(all))?$/.exec(location.hash || "");
    if (!m) return;
    n = +m[1]; v = m[2] ? Math.max(0, Math.min(9, +m[2] - 1)) : 0; all = !!m[3];
  };
  fromHash();
  try { if (!location.hash) { const r = JSON.parse(localStorage.getItem("crista-step-viz") || "null"); if (r) { n = r.n; v = r.v; all = r.all; } } } catch (e) {}
  const save = () => { try { localStorage.setItem("crista-step-viz", JSON.stringify({ n, v, all })); } catch (e) {} };

  /* 예시 실행에서 단계까지 걸린 날짜 · 남은 연구비(위 띠) */
  const dayAt = { 1: 0, 2: 0, 3: 2, 4: 4, 5: EX.program.day, 6: EX.ind ? EX.ind.day : 0, 7: EX.trials.length ? EX.trials[EX.trials.length - 1].day : 0, 8: EX.approval.day };
  const spentAt = (k) => {
    const c = CV.R.cost; let s = 0;
    if (k >= 2) s += c.htvs; if (k >= 3) s += c.docking; if (k >= 4) s += c.admet; if (k >= 5) s += c.patent; if (k >= 6) s += c.ind;
    if (k >= 7) s += EX.trials.reduce((a, t) => a + t.cost, 0); if (k >= 8) s += c.final; return s;
  };

  /* LED 띠: 다른 모둠 소식(정적 예시) */
  const NEWS = [
    ["세움제약 SEU-904 임상 2상 통과", "g", "▲ 8.0%"], ["다온테라퓨틱스 도킹 신기록 -10.90 kcal/mol", "", "▲ 6.4%"],
    ["미르파마 MIR-810 임상 보류", "r", "▼ 4.0%"], ["세움제약 연구 설비 건설", "", "▲ 2.0%"], ["미르파마 유상증자 공시", "r", "▼ 3.0%"],
    ["시가총액 1위 바뀜 — 세움제약", "", ""]
  ];
  const seg = () => `<div class="ui-mq-seg">${NEWS.map(([t, c, d]) => `<span class="ui-led ${c}">${esc(t)}${d ? "  " + d : ""}</span>`).join("")}</div>`;
  $("mq").innerHTML = seg() + seg();

  function renderSide() {
    $("side").innerHTML = `<p class="ui-side-h">신약 개발 파이프라인 · 8단계</p>` + PHASES.map((p) => {
      const items = STEPS.filter((s) => s.ph === p.n);
      return `<div class="ui-grp"><p class="ui-grp-h"><b>${p.n}.</b>${esc(p.t)}</p><ol class="ui-steps">${items.map((s) =>
        `<li><button type="button" class="ui-st" data-step="${s.n}" ${s.n === n ? 'aria-current="step"' : ""} aria-label="${s.code} ${esc(s.t)}">
          <span class="ui-st-n">${s.code}</span><span class="ui-st-t">${esc(s.t)}</span><span class="ui-st-s">${esc(s.sub)} · 시안 ${list(s.n).length}</span></button></li>`).join("")}</ol></div>`;
    }).join("") + `<div class="ui-side-foot"><span>예시 실행 <b>알츠하이머 → ACHE</b></span><span>리드 <b>${esc(EX.lead ? EX.lead.name : "—")}</b></span><span>모든 시안이 같은 값을 그립니다</span></div>`;
  }

  function cardHTML(it, i, compact) {
    let body;
    try { body = it.render(); } catch (e) { body = `<p class="ui-err">그리기 오류: ${esc(e.message)}</p>`; console.error(e); }
    return `<article class="ui-card" data-i="${i}">
      <header class="ui-card-h" ${compact ? `data-open="${i}" role="button" tabindex="0" aria-label="${pad(i + 1)} ${esc(it.name)} 크게 보기"` : ""}>
        <span class="ui-no">${n}.${pad(i + 1)}</span><h2>${esc(it.name)}</h2><span class="ui-kind">${esc(it.kind || "")}</span>
        <p class="ui-idea">${esc(it.idea || "")}</p></header>
      <div class="ui-card-b"><div class="vz" data-vz="${i}">${body}</div></div>
      <footer class="ui-card-f"><b>배우는 것</b><span>${esc(it.learn || "")}</span></footer></article>`;
  }

  function mountAll() {
    for (const c of cleanups) { try { c && c(); } catch (e) {} }
    cleanups = [];
    for (const el of document.querySelectorAll("[data-vz]")) {
      const it = list(n)[+el.dataset.vz];
      if (it && it.mount) { try { cleanups.push(it.mount(el)); } catch (e) { console.error(e); } }
    }
    CV.drawMols($("wrap"));
  }

  function renderMain() {
    const st = STEPS[n - 1], L = list(n);
    v = Math.max(0, Math.min(L.length - 1, v));
    const head = `<header class="ui-sh"><div class="ui-sh-n" aria-hidden="true">${st.code}</div>
      <p class="ui-eyebrow">${esc(PHASES[st.ph - 1].n + ". " + PHASES[st.ph - 1].t)} · ${esc(st.sub)} · ${st.cost ? MX(st.cost) : "무료"}</p>
      <h1>${esc(st.t)}</h1><p class="ui-q">${esc(st.q)}</p></header>`;
    const tabs = `<nav class="ui-vtabs" aria-label="${st.code} 시각화 시안">${L.map((it, i) =>
      `<button type="button" class="ui-vt" data-v="${i}" aria-pressed="${!all && i === v}"><span>${n}.${pad(i + 1)}</span><b>${esc(it.name)}</b></button>`).join("")}
      <button type="button" class="ui-vt ui-all" data-all="1" aria-pressed="${all}"><span>ALL</span><b>10종 모아 보기</b></button></nav>`;
    const body = !L.length ? `<p class="ui-err">이 단계의 시안 파일을 불러오지 못했습니다.</p>`
      : all ? `<div class="ui-grid-all">${L.map((it, i) => cardHTML(it, i, true)).join("")}</div>` : cardHTML(L[v], v, false);
    $("wrap").innerHTML = head + tabs + body;
    mountAll();
    $("kv-d").textContent = "D+" + dayAt[n];
    $("kv-c").textContent = MX(CV.R.startCash - spentAt(n));
  }

  function renderTools() {
    $("vpick").innerHTML = STEPS.map((s) => `<optgroup label="${s.code} ${esc(s.t)}">${list(s.n).map((it, i) =>
      `<option value="${s.n}:${i}" ${s.n === n && i === v ? "selected" : ""}>${s.n}.${pad(i + 1)} ${esc(it.name)}</option>`).join("")}</optgroup>`).join("");
    $("vcount").textContent = all ? `${STEPS[n - 1].code} · 10종 모아 보기` : `${STEPS[n - 1].code} · ${pad(v + 1)} / ${pad(list(n).length)}`;
    $("vall").setAttribute("aria-pressed", String(all));
  }

  function go(nn, vv, aa, keepScroll) {
    n = Math.max(1, Math.min(8, nn)); v = vv; all = aa;
    const h = `#s${n}${all ? "all" : "v" + pad(v + 1)}`;
    try { if (location.hash !== h) history.replaceState(null, "", h); } catch (e) {}
    save(); renderSide(); renderMain(); renderTools();
    if (!keepScroll) $("main").scrollTop = 0;
  }

  document.addEventListener("click", (e) => {
    const s = e.target.closest("[data-step]"); if (s) return go(+s.dataset.step, 0, all);
    const t = e.target.closest(".ui-vt[data-v]"); if (t) return go(n, +t.dataset.v, false);
    if (e.target.closest(".ui-vt[data-all]")) return go(n, v, !all);
    const o = e.target.closest("[data-open]"); if (o) return go(n, +o.dataset.open, false);
  });
  document.addEventListener("keydown", (e) => {
    const o = e.target.closest && e.target.closest("[data-open]");
    if (o && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return go(n, +o.dataset.open, false); }
  });
  $("sprev").onclick = () => go(n - 1, 0, all);
  $("snext").onclick = () => go(n + 1, 0, all);
  $("vprev").onclick = () => go(n, (v + 9) % 10, false);
  $("vnext").onclick = () => go(n, (v + 1) % 10, false);
  $("vall").onclick = () => go(n, v, !all);
  $("vpick").onchange = (e) => { const [a, b] = e.target.value.split(":").map(Number); go(a, b, false); };
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

  go(n, v, all, true);

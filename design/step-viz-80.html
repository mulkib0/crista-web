<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Crista 단계 시각화</title>
<meta name="description" content="전광판 01 화면의 8단계(1.1~4.2)마다 학생 이해를 돕는 시각화 시안 10종씩, 모두 80종.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* 레이아웃: 전광판 01 화면(위 띠 · LED 띠 · 왼쪽 4묶음 사이드바 1.1~4.2) 그대로, 오른쪽 작업 영역에 '그 단계의 시각화 시안'을 띄운다.
     아래 검은 띠는 시안 고르기 도구. 색은 Crista 브랜드(잉크 · 페이퍼 · 라임) + 05 박막 간섭색, 모서리는 각지게.
     01 화면이 밝은 박막 톤 하나로 정해져 있어 이 시안집도 그 한 가지 모습으로 고정한다(어두운 곳은 LED 띠와 도구 띠뿐). */
  :root {
    --paper: #f1f1e9; --surface: #f8f8f2; --raise: #e7e8de; --ink: #080b09; --muted: #5b6358;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --hi: #c6ff4a; --led: #ffb21a; --led-r: #ff5a3c; --led-g: #8dff5a; --night: #0b0d0a; --night-2: #151a14; --night-fg: #f1f1e9; --night-muted: #9da59a;
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14); --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11);
    --me: #183080; --seum: #007868; --daon: #a048c8; --mirp: #d88828;
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-1: #ffd3ea; --film-2: #cdeaff; --film-3: #e4ffc0; --film-4: #ffe2c2; --film-5: #e6d4ff;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
    --side-w: 272px;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .ui-page { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }

  /* ── 위 띠 ── */
  .ui-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line-strong); background: var(--paper); }
  .ui-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.03em; font-size: 17px; }
  .ui-brand svg { width: 20px; height: 20px; }
  .ui-brand small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-co { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--line); font-weight: 600; }
  .ui-co .ui-tick { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 2px 6px; border: 1px solid var(--line-strong); font-weight: 500; }
  .top-r { margin-left: auto; display: flex; gap: 18px; align-items: center; }
  .ui-kv { display: grid; line-height: 1.2; }
  .ui-kv span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-kv b { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── LED 흐르는 띠(전광판 01) ── */
  .ui-board { display: flex; align-items: stretch; background: var(--night); color: var(--night-fg); border-bottom: 1px solid var(--line-strong); min-width: 0; }
  .ui-bd-in { flex: 1; min-width: 0; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
  .ui-mq-track { display: flex; width: max-content; animation: mq 46s linear infinite; }
  .ui-board:hover .ui-mq-track { animation-play-state: paused; }
  .ui-mq-seg { display: flex; align-items: center; gap: 34px; padding-right: 34px; }
  .ui-led { font-family: var(--mono); font-weight: 600; letter-spacing: 0.06em; font-size: 19px; white-space: nowrap; color: var(--led); text-shadow: 0 0 8px rgba(255, 178, 26, 0.55);
    -webkit-mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); -webkit-mask-size: 3px 3px; mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); mask-size: 3px 3px; }
  .ui-led.r { color: var(--led-r); text-shadow: 0 0 8px rgba(255, 90, 60, 0.55); }
  .ui-led.g { color: var(--led-g); text-shadow: 0 0 8px rgba(141, 255, 90, 0.5); }
  .ui-bd-ctl { flex: none; display: flex; align-items: center; gap: 6px; padding-block: 6px; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-left: 1px solid rgba(241, 241, 233, 0.16); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--night-muted); text-transform: uppercase; }
  .ui-bd-ctl i { width: 7px; height: 7px; background: var(--led-r); border-radius: 50%; animation: blink 1.4s steps(2) infinite; }
  @keyframes mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ── 본문: 사이드바 + 작업 영역 ── */
  .ui-shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 0; }
  .ui-side { overflow: auto; border-right: 1px solid var(--line-strong); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 4px; }
  .ui-side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .ui-grp { display: grid; gap: 2px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ui-grp:last-of-type { border-bottom: 0; }
  .ui-grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; }
  .ui-grp-h b { font-family: var(--mono); font-size: 0.9em; }
  .ui-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .ui-st { appearance: none; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; border-radius: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); column-gap: 8px; padding: 8px 8px 8px 14px; }
  .ui-st:hover { background: rgba(128, 128, 128, 0.1); }
  .ui-st-n { font-family: var(--mono); font-weight: 600; font-size: 12px; grid-row: span 2; line-height: 1.6; }
  .ui-st-t { font-weight: 600; line-height: 1.35; }
  .ui-st-s { font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .ui-st[aria-current="step"] { background: var(--film); }
  .ui-side-foot { margin-top: auto; padding-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: grid; gap: 6px; }
  .ui-side-foot b { color: var(--ink); font-weight: 600; }

  .ui-main { overflow: auto; min-width: 0; }
  .ui-wrap { max-width: 1240px; padding-block: 24px 48px; padding-left: 30px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
  .ui-sh { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: start; }
  .ui-sh-n { font-size: 64px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.82; grid-row: span 3; padding-top: 4px; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--ink); }
  .ui-eyebrow { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-sh h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.035em; text-wrap: balance; }
  .ui-q { margin: 2px 0 0; font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

  /* 시안 고르기 탭 01~10 */
  .ui-vtabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0; border: 1px solid var(--line-strong); background: var(--surface); }
  .ui-vt { appearance: none; border: 0; box-shadow: inset -1px -1px 0 var(--line); background: transparent; border-radius: 0; padding: 8px 10px; display: grid; gap: 1px; text-align: left; min-width: 0; }
  .ui-vt span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
  .ui-vt b { font-size: 12.5px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
  .ui-vt:hover { background: rgba(128, 128, 128, 0.08); }
  .ui-vt[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ui-vt[aria-pressed="true"] span { color: var(--hi); }
  .ui-vt.ui-all { box-shadow: inset 1px 0 0 var(--line-strong), inset 0 -1px 0 var(--line); }

  /* 시안 한 장 */
  .ui-card { border: 1px solid var(--line-strong); background: var(--surface); min-width: 0; display: grid; }
  .ui-card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ui-card-h .ui-no { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; background: var(--ink); color: var(--hi); }
  .ui-card-h h2 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
  .ui-card-h .ui-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .ui-card-h .ui-idea { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; max-width: 80ch; }
  .ui-card-b { padding: 18px 16px; min-width: 0; overflow-x: auto; }
  .ui-card-f { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-top: 1px dashed var(--line-strong); font-size: 13px; }
  .ui-card-f b { flex: none; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; background: var(--hi); }
  .ui-grid-all { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .ui-grid-all .ui-card-h { cursor: pointer; }
  .ui-grid-all .ui-card-h:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
  .ui-grid-all .ui-card-b { padding: 14px 12px; }
  .ui-err { color: var(--bad); font-family: var(--mono); font-size: 12px; }

  /* ── 시안이 함께 쓰는 부품 ── */
  .vz { display: grid; gap: 14px; min-width: 0; font-size: 13px; }
  .vz-svg { display: block; width: 100%; height: auto; max-width: 100%; overflow: visible; font-family: var(--sans); }
  .vz-svg text { fill: var(--ink); }
  .vz-svg .t-m { font-family: var(--mono); }
  .vz-svg .t-mu { fill: var(--muted); }
  .vz-lab { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .vz-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .vz-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .vz-note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 72ch; }
  .vz-chip { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--line-strong); white-space: nowrap; }
  .vz-sig { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; white-space: nowrap; }
  .vz-sig.good { color: var(--good); background: var(--good-bg); }
  .vz-sig.warn { color: var(--warn); background: var(--warn-bg); }
  .vz-sig.bad { color: var(--bad); background: var(--bad-bg); }
  .vz-btn { appearance: none; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 0; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
  .vz-btn:hover { border-color: var(--ink); }
  .vz-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .vz-rng { width: 100%; accent-color: var(--ink); }
  .molbox { width: 100%; max-width: 100%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; overflow: hidden; }
  .molbox .mol { display: block; width: 100%; height: 100%; }
  .molbox .fallback { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding: 8px; word-break: break-all; }

  /* ── 아래 도구 띠 ── */
  .ui-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--night); color: var(--night-fg); border-top: 1px solid rgba(241, 241, 233, 0.32);
    padding-top: 9px; padding-bottom: calc(9px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--mono); font-size: 11px; }
  .ui-tool-btn { background: transparent; color: var(--night-fg); border: 1px solid rgba(241, 241, 233, 0.32); padding: 6px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; border-radius: 0; }
  .ui-tool-btn:hover { border-color: var(--night-fg); }
  .ui-tools :focus-visible { outline-color: var(--hi); }
  .ui-pick-w { position: relative; flex: 0 1 300px; min-width: 0; }
  .ui-pick-w::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--night-muted); pointer-events: none; }
  #vpick { appearance: none; -webkit-appearance: none; width: 100%; padding: 6px 28px 6px 10px; border: 1px solid rgba(241, 241, 233, 0.32); border-radius: 0; background: transparent; color: var(--night-fg); font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; }
  #vpick option, #vpick optgroup { background: var(--night-2); color: var(--night-fg); }
  .ui-vcount { color: var(--night-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ui-keys { margin-left: auto; display: flex; gap: 12px; color: var(--night-muted); font-size: 10px; white-space: nowrap; }
  .ui-keys kbd { font-family: var(--mono); font-size: 10px; color: var(--night-fg); border: 1px solid rgba(241, 241, 233, 0.32); padding: 1px 5px; margin-right: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .ui-mq-track, .ui-bd-ctl i { animation: none !important; }
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
  @media (max-width: 1100px) { .ui-grid-all { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) {
    .ui-shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .ui-side { border-right: 0; border-bottom: 1px solid var(--line-strong); flex-direction: row; overflow-x: auto; padding-block: 8px; gap: 6px; }
    .ui-side-h, .ui-side-foot, .ui-grp-h, .ui-st-s { display: none; }
    .ui-grp { display: contents; }
    .ui-steps { display: flex; gap: 6px; }
    .ui-st { grid-template-columns: auto auto; white-space: nowrap; padding: 6px 10px; border: 1px solid var(--line); column-gap: 6px; }
    .ui-st-n { grid-row: auto; }
    .ui-wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-block: 16px 32px; }
    .ui-sh-n { font-size: 44px; }
    .ui-sh h1 { font-size: 22px; }
    .ui-q { font-size: 15px; }
    .top-r .ui-kv:not(.ui-cash) { display: none; }
    .ui-led { font-size: 16px; }
    .ui-keys { display: none; }
    .ui-vtabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #sprev, #snext, #vall { display: none; }
    .ui-pick-w { flex: 1 1 160px; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 40 40">
      <path d="M31.5 7.5A15.5 15.5 0 1 0 31.5 32.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M27.2 12.2A10.7 10.7 0 1 0 27.2 27.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>

<div class="ui-page">
  <header class="ui-top">
    <div class="ui-brand"><svg aria-hidden="true"><use href="#mark"></use></svg>CRISTA <small>파이프라인 랩</small></div>
    <div class="ui-co"><span id="co-name">크리스타바이오</span><span class="ui-tick">CRX</span></div>
    <div class="top-r">
      <div class="ui-kv"><span>예시 표적</span><b id="kv-t">ACHE · 4EY7</b></div>
      <div class="ui-kv"><span>게임 날짜</span><b id="kv-d">D+0</b></div>
      <div class="ui-kv ui-cash"><span>연구비</span><b id="kv-c">$6.000M</b></div>
    </div>
  </header>
  <section class="ui-board" aria-label="학급 전광판 · 다른 모둠 소식">
    <div class="ui-bd-in"><div class="ui-mq-track" id="mq"></div></div>
    <div class="ui-bd-ctl"><i aria-hidden="true"></i>LIVE</div>
  </section>
  <div class="ui-shell">
    <aside class="ui-side" id="side" aria-label="파이프라인 단계"></aside>
    <main class="ui-main" id="main"><div class="ui-wrap" id="wrap"></div></main>
  </div>
  <div class="ui-tools">
    <button type="button" class="ui-tool-btn" id="sprev" aria-label="이전 단계">↑ 단계</button>
    <button type="button" class="ui-tool-btn" id="snext" aria-label="다음 단계">↓ 단계</button>
    <button type="button" class="ui-tool-btn" id="vprev" aria-label="이전 시안">← 시안</button>
    <button type="button" class="ui-tool-btn" id="vnext" aria-label="다음 시안">시안 →</button>
    <div class="ui-pick-w"><label class="sr" for="vpick">시안 고르기</label><select id="vpick"></select></div>

    <span class="ui-keys" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd>단계</span><span><kbd>←</kbd><kbd>→</kbd>시안</span><span><kbd>A</kbd>모아 보기</span></span>
  </div>

/* 단계 시각화 시안의 공통 바탕 — 규칙 · 예시 실행 · 그리기 도구.
   규칙 값은 pipeline-board-30-variants.html(= packages/game-rules 사본)에서 그대로 옮겼다.
   DOM 을 건드리지 않으므로 node 에서도 불러 시험할 수 있다(window 만 흉내 내면 된다). */
(function () {
  "use strict";
  const D = window.DD || { diseases: [], compounds: [], meta: {} };
  const CMP = new Map(D.compounds.map((c) => [c.id, c]));

  /* ── 글자 · 숫자 ── */
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const f1 = (v) => Number(v).toFixed(1);
  const f2 = (v) => Number(v).toFixed(2);
  const f3 = (v) => Number(v).toFixed(3);
  const MX = (v) => `$${v.toFixed(3)}M`;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  /* 선형 눈금: scale([d0, d1], [r0, r1])(v) */
  const scale = (dom, rng) => (v) => rng[0] + ((v - dom[0]) / (dom[1] - dom[0])) * (rng[1] - rng[0]);
  /* 받침에 맞춘 조사: josa("ACHE", "을", "를") */
  const josa = (w, a, b) => { const c = String(w).charCodeAt(String(w).length - 1) - 0xac00; return c >= 0 && c <= 11171 && c % 28 ? a : b; };
  /* 고정 씨앗 난수 — 미리보기가 열 때마다 같은 그림이 되도록 */
  const rng = (seed = 7) => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };

  /* ── 규칙(game-rules 사본) ── */
  const TARGETS = {
    "ache-4ey7": { gene: "ACHE", label: "아세틸콜린에스테라아제", pdb: "4EY7", disease: "알츠하이머병", ref: "도네페질", refSmiles: "COc1cc2c(cc1OC)C(=O)C(CC1CCN(Cc3ccccc3)CC1)C2", cns: true, refKcal: -11.84, rmsd: 0.82 },
    "egfr-1m17": { gene: "EGFR", label: "상피세포 성장인자 수용체", pdb: "1M17", disease: "비소세포폐암", ref: "엘로티닙", refSmiles: "C#Cc1cccc(Nc2ncnc3cc(OCCOC)c(OCCOC)cc23)c1", cns: false, refKcal: -7.24, rmsd: 1.33 },
    "dpp4-1x70": { gene: "DPP4", label: "디펩티딜 펩티다아제-4", pdb: "1X70", disease: "2형 당뇨병", ref: "시타글립틴", refSmiles: "NC(CC(=O)N1CCn2c(nnc2C(F)(F)F)C1)Cc1cc(F)c(F)cc1F", cns: false, refKcal: -9.02, rmsd: 0.8 },
    "cox2-3ln1": { gene: "PTGS2", label: "사이클로옥시게나아제-2", pdb: "3LN1", disease: "류마티스 관절염", ref: "세레콕시브", refSmiles: "Cc1ccc(-c2cc(C(F)(F)F)nn2-c2ccc(S(N)(=O)=O)cc2)cc1", cns: false, refKcal: -12.26, rmsd: 0.51 }
  };
  const TRIAL = {
    "ache-4ey7": { pops: ["경도 알츠하이머병 환자", "중등도~중증 알츠하이머병 환자", "경도인지장애(MCI) 환자"], eps: ["인지 기능 점수(ADAS-Cog) 변화", "일상 생활 기능(ADCS-ADL) 변화", "임상의 종합 평가(CIBIC-plus)"] },
    "egfr-1m17": { pops: ["EGFR 변이 양성 국소진행성 · 전이성 비소세포폐암 환자", "백금 기반 화학요법 후 재발 비소세포폐암 환자", "뇌전이를 동반한 EGFR 변이 비소세포폐암 환자"], eps: ["무진행 생존기간(PFS)", "객관적 반응률(ORR · RECIST 1.1)", "전체 생존기간(OS)"], brain: ["뇌전이를 동반한 EGFR 변이 비소세포폐암 환자"] },
    "dpp4-1x70": { pops: ["메트포르민 단독요법으로 혈당이 조절되지 않는 2형 당뇨병 환자", "신기능 저하를 동반한 2형 당뇨병 환자", "식이 · 운동요법 중인 초기 2형 당뇨병 환자"], eps: ["24주 시점 당화혈색소(HbA1c) 변화량", "공복 혈장 포도당(FPG) 변화량", "식후 2시간 혈당(PPG) 변화량"] },
    "cox2-3ln1": { pops: ["중등도~중증 활동성 류마티스 관절염 성인 환자", "기존 NSAID 위장관 부작용 위험군 관절염 환자", "급성 염증성 관절 통증 환자"], eps: ["ACR20 반응 달성률(24주)", "관절 통증 시각아날로그척도(VAS) 변화", "건강평가설문 장애지수(HAQ-DI) 변화"] }
  };
  const R = {
    cost: { htvs: 0.05, docking: 0.05, admet: 0.05, patent: 0.05, ind: 0.1, phase1: 0.3, phase2: 0.6, phase3: 1.2, final: 0.1 },
    days: { ind: 30, phase1: 90, phase2: 180, phase3: 360, final: 60 },
    absorption: { oral: { good: 1, moderate: 0.75, poor: 0.45 }, iv: 1, transdermal: { suitable: 0.85, unsuitable: 0.4 } },
    bbb: { high: 1, moderate: 0.7, low: 0.35 },
    doseE: { 10: 0.6, 50: 0.85, 100: 1 }, doseT: { 10: 10, 50: 30, 100: 55 },
    risk: { herg: { low: 0, moderate: 0.3, high: 0.6 }, hep: { low: 0, moderate: 0.25, high: 0.6 } },
    peak: { oral: 1, iv: 1.25, transdermal: 0.75 },
    th: { ind: { e: null, s: 35 }, phase1: { e: null, s: 50 }, phase2: { e: 40, s: null }, phase3: { e: 45, s: 55 } },
    noise: { phase1: 6, phase2: 6, phase3: 4 },
    approvalMult: { oral: 1.3, iv: 1, transdermal: 1.15 },
    startCash: 6
  };
  const FORM = { oral: "경구용 정제 · 캡슐", iv: "정맥주사제", transdermal: "경피 패치 · 비강 스프레이" };
  const FORM_SHORT = { oral: "경구", iv: "정맥주사", transdermal: "경피" };
  const ALERT = { aromatic_amine: "방향족 아민", nitro_aromatic: "방향족 니트로" };
  const LV = { good: "좋음", moderate: "보통", poor: "나쁨", high: "높음", low: "낮음", suitable: "적합", unsuitable: "부적합" };

  function signals(p) {
    const v = (p.mw > 500) + (p.logp > 5) + (p.hbd > 5) + (p.hba > 10);
    const oral = v === 0 && p.tpsa <= 140 && p.rotb <= 10 ? "good" : v <= 1 && p.tpsa <= 140 ? "moderate" : "poor";
    const bbb = p.tpsa <= 90 && p.mw <= 450 && p.hbd <= 3 ? "high" : p.tpsa <= 120 && p.mw <= 500 ? "moderate" : "low";
    const herg = p.ba > 0 && p.logp >= 3.7 ? "high" : p.ba > 0 && p.logp >= 2.5 ? "moderate" : "low";
    const hep = p.al.length ? "high" : p.logp > 3 && p.tpsa < 75 ? "moderate" : "low";
    const td = p.mw <= 500 && p.logp >= 1 && p.logp <= 4 ? "suitable" : "unsuitable";
    return { ro5: v, oral, bbb, herg, hep, td };
  }
  function notes(p, s) {
    return {
      ro5: `Ro5 위반 ${s.ro5} — MW ${p.mw.toFixed(1)} · cLogP ${f2(p.logp)} · HBD ${p.hbd} · HBA ${p.hba}`,
      oral: `경구 흡수 ${LV[s.oral]} — TPSA ${p.tpsa.toFixed(1)} · RotB ${p.rotb} · Ro5 위반 ${s.ro5}`,
      bbb: `뇌 노출 ${LV[s.bbb]} — TPSA ${p.tpsa.toFixed(1)} · MW ${p.mw.toFixed(1)} · HBD ${p.hbd}`,
      herg: p.ba === 0 ? "hERG 위험 낮음 — 염기성 아민 없음" : `hERG 위험 ${LV[s.herg]} — 염기성 아민 ${p.ba} · cLogP ${f2(p.logp)}`,
      hep: s.hep === "high" ? `간독성 위험 높음 — 구조 경고(${p.al.map((a) => ALERT[a] || a).join(" · ")})` : `간독성 위험 ${LV[s.hep]} — 구조 경고 없음 · cLogP ${f2(p.logp)} · TPSA ${p.tpsa.toFixed(1)}`,
      td: `경피 투과 ${LV[s.td]} — MW ${p.mw.toFixed(1)} · cLogP ${f2(p.logp)} (1~4)`
    };
  }
  /* 결합력 p: 기준 리간드보다 4.5 kcal/mol 약하면 0, 0.5 더 강하면 1 */
  const strength = (kcal, ref) => Math.min(1, Math.max(0, (ref + 4.5 - kcal) / 5));
  /* 효능 E · 안전 S 와 그 재료(parts)를 함께 돌려준다 */
  function score(c, kcal, tid, form, dose, pop) {
    const t = TARGETS[tid], s = signals(c);
    const brainPop = !!(TRIAL[tid].brain && TRIAL[tid].brain.includes(pop));
    const cns = t.cns || brainPop;
    const p = strength(kcal, t.refKcal);
    const A = form === "iv" ? 1 : form === "oral" ? R.absorption.oral[s.oral] : R.absorption.transdermal[s.td];
    const B = cns ? R.bbb[s.bbb] : 1;
    const De = R.doseE[dose], Dt = R.doseT[dose];
    const hergR = R.risk.herg[s.herg], hepR = R.risk.hep[s.hep];
    const Rk = 1 + hergR + hepR;
    const K = R.peak[form];
    const E = Math.round(100 * (0.3 + 0.7 * p) * A * B * De * 10) / 10;
    const S = Math.round(Math.max(0, 100 - Dt * Rk * K) * 10) / 10;
    return { E, S, s, parts: { p, A, B, De, Dt, hergR, hepR, Rk, K, cns, brainPop } };
  }

  const STEPS = [
    { n: 1, code: "1.1", t: "질환 · 표적 선정", short: "표적", sub: "Open Targets · 표적 탐색실", ph: 1, cost: 0,
      q: "어떤 단백질을 막으면 이 병이 나을까?" },
    { n: 2, code: "1.2", t: "화합물 스크리닝", short: "스크리닝", sub: "ChEMBL · RDKit 깔때기", ph: 1, cost: R.cost.htvs,
      q: "220개 분자 중 약이 될 만한 것만 어떻게 추릴까?" },
    { n: 3, code: "2.1", t: "분자 도킹", short: "도킹", sub: "AutoDock Vina · 서버실", ph: 2, cost: R.cost.docking,
      q: "후보 분자는 표적의 주머니에 얼마나 단단히 붙을까?" },
    { n: 4, code: "2.2", t: "ADMET 예측 · 리드", short: "ADMET", sub: "ADMET-AI v2 · ADMET실", ph: 2, cost: R.cost.admet,
      q: "잘 붙는 분자가 몸속에서도 안전하게 잘 돌아다닐까?" },
    { n: 5, code: "3.1", t: "선언 · 물질특허", short: "특허", sub: "시청 · 특허청 창구", ph: 3, cost: R.cost.patent,
      q: "우리가 찾은 분자를 어떻게 우리 것으로 지킬까?" },
    { n: 6, code: "3.2", t: "제형 · IND 신청", short: "IND", sub: "FDA 규제심사청", ph: 3, cost: R.cost.ind,
      q: "어떤 모양 · 얼마의 양으로 사람에게 처음 시험할까?" },
    { n: 7, code: "4.1", t: "임상 1 · 2 · 3상", short: "임상", sub: "대학병원 임상센터", ph: 4, cost: R.cost.phase1 + R.cost.phase2 + R.cost.phase3,
      q: "사람에게 안전하고, 정말 효과가 있을까?" },
    { n: 8, code: "4.2", t: "최종 허가", short: "허가", sub: "FDA 규제심사청", ph: 4, cost: R.cost.final,
      q: "환자에게 팔아도 된다는 허가를 받을 수 있을까?" }
  ];
  const PHASES = [{ n: 1, t: "발견" }, { n: 2, t: "최적화" }, { n: 3, t: "개발 · 규제" }, { n: 4, t: "임상 · 허가" }];

  /* ── 예시 실행: 알츠하이머 → ACHE(4EY7) 로 한 모둠이 1.1~4.2 를 밟은 결과 ──
     모든 시안이 같은 값을 그리므로, 시안끼리 공정하게 견줄 수 있다. */
  function buildExample() {
    const tid = "ache-4ey7", t = TARGETS[tid];
    const disease = D.diseases.find((d) => d.tid === tid) || D.diseases[0];
    const target = disease ? disease.targets.find((x) => x.dockingTargetId === tid) : null;

    /* 1.2 스크리닝: 단계마다 어떤 분자가 떨어졌는지 기록 */
    const P = { lib: Object.keys(D.meta.counts || {}), mwMax: 500, tpsaMax: 140, ro5Max: 1, noAlerts: true, qedMin: 0.3, topN: 10 };
    const gates = [
      { key: "lib", label: "라이브러리", rule: "고른 라이브러리 3종", test: (c) => P.lib.includes(c.lib) },
      { key: "mwTpsa", label: "MW · TPSA", rule: `분자량 ≤ ${P.mwMax} Da · TPSA ≤ ${P.tpsaMax} Å²`, test: (c) => c.mw <= P.mwMax && c.tpsa <= P.tpsaMax },
      { key: "ro5", label: "Ro5", rule: `Lipinski 위반 ≤ ${P.ro5Max}개`, test: (c) => c.ro5 <= P.ro5Max },
      { key: "alerts", label: "구조 경고", rule: "방향족 아민 · 니트로 빼기", test: (c) => !c.al.length },
      { key: "qed", label: "QED", rule: `QED ≥ ${P.qedMin}`, test: (c) => c.qed >= P.qedMin }
    ];
    const failAt = new Map();
    for (const c of D.compounds) {
      const i = gates.findIndex((g) => !g.test(c));
      failAt.set(c.id, i); /* -1 = 모두 통과 */
    }
    const passed = D.compounds.filter((c) => failAt.get(c.id) === -1).sort((a, b) => (b.sc[tid] || 0) - (a.sc[tid] || 0));
    const sel = passed.slice(0, P.topN);
    const stages = [{ key: "all", label: "전체", rule: "ChEMBL · ZINC · 사내 합성", n: D.compounds.length }];
    let alive = D.compounds.length;
    gates.forEach((g, i) => { alive -= D.compounds.filter((c) => failAt.get(c.id) === i).length; stages.push({ key: g.key, label: g.label, rule: g.rule, n: alive }); });
    stages.push({ key: "top", label: `점수 상위 ${P.topN}`, rule: `${t.gene} 스크리닝 점수 순`, n: sel.length });

    /* 2.1 도킹: 후보 상위 5 + 기준 리간드 */
    /* 기준 리간드와 같은 분자는 늘 함께 도킹하므로 후보에서 뺀다 */
    const picks = sel.filter((c) => c.s !== t.refSmiles).slice(0, 5);
    const ref = { id: "REF", n: `${t.ref} (기준)`, s: t.refSmiles, ref: true };
    const dock = picks.map((c) => ({ id: c.id, c, name: c.n, kcal: c.vk[tid], p: strength(c.vk[tid], t.refKcal), ref: false }))
      .concat([{ id: "REF", c: ref, name: ref.n, kcal: t.refKcal, p: strength(t.refKcal, t.refKcal), ref: true }])
      .sort((a, b) => a.kcal - b.kcal);

    /* 2.2 ADMET · 리드: 경구 50 mg · 첫 환자군에서 min(E, S) 가 가장 큰 분자 */
    const pop = TRIAL[tid].pops[0], ep = TRIAL[tid].eps[0];
    const admet = dock.filter((d) => !d.ref).map((d) => {
      const s = signals(d.c);
      return { id: d.id, c: d.c, name: d.name, kcal: d.kcal, p: d.p, s, n: notes(d.c, s), sc: score(d.c, d.kcal, tid, "oral", 50, pop) };
    });
    /* 이 표적을 겨냥해 만든 계열(c.t === tid)을 먼저 본다. 도킹 1위 Troglitazone 은 당뇨약(PPAR)이라 리드에서 빠지는 예시가 된다. */
    const byBalance = (a, b) => Math.min(b.sc.E, b.sc.S) - Math.min(a.sc.E, a.sc.S) || b.sc.E - a.sc.E;
    const lead = admet.filter((a) => a.c.t === tid).sort(byBalance)[0] || admet.slice().sort(byBalance)[0];

    /* 3.1 선언 · 특허 */
    const program = { company: "크리스타바이오", ticker: "CRX", code: "CRX-101", mech: `${t.gene} 선택적 가역 억제제`,
      plabel: `${lead ? lead.name.split(" ")[0] : ""} 계열 화합물`, patentNo: "KR-37-4821", day: 12 };

    /* 3.2 제형 · IND: 고른 값 + 모든 조합의 점수판 */
    const form = "oral", dose = 50;
    const base = lead ? score(lead.c, lead.kcal, tid, form, dose, pop) : null;
    const grid = [];
    if (lead) for (const f of Object.keys(FORM)) for (const d of [10, 50, 100]) {
      const r = score(lead.c, lead.kcal, tid, f, d, pop);
      grid.push({ form: f, dose: d, E: r.E, S: r.S, ind: r.S >= R.th.ind.s });
    }
    const ind = base ? { form, dose, pop, ep, E: base.E, S: base.S, pass: base.S >= R.th.ind.s, day: program.day + R.days.ind } : null;

    /* 4.1 임상: 흔들림을 고정값으로 둔 한 이야기.
       50 mg 1상이 안전 기준(S ≥ 50)에 못 미쳐 떨어지고 → FDA 에서 10 mg 로 바꿔(무료) → 1 · 2 · 3상을 통과한다. */
    const trials = [];
    let finalDose = dose;
    if (base) {
      let day = ind.day;
      const run = (k, d, n, note) => {
        const r = score(lead.c, lead.kcal, tid, form, d, pop);
        const E = Math.max(0, Math.round((r.E + n) * 10) / 10), S = Math.max(0, Math.round((r.S + n) * 10) / 10), th = R.th[k];
        const pass = (th.e == null || E >= th.e) && (th.s == null || S >= th.s);
        day += R.days[k];
        trials.push({ k, label: { phase1: "1상", phase2: "2상", phase3: "3상" }[k], dose: d, base: { E: r.E, S: r.S }, n, E, S, pass, th, day, cost: R.cost[k], note });
      };
      run("phase1", 50, 3, "건강한 지원자 · 안전 확인");
      finalDose = 10; /* 실패 뒤 FDA 에서 용량 변경(무료 · 0일) */
      run("phase1", 10, -2, "같은 프로토콜 · 10 mg 로 다시");
      run("phase2", 10, 1, "환자 소수 · 효능 확인");
      run("phase3", 10, -1, "환자 다수 · 효능 + 안전");
    }

    /* 4.2 허가 */

      el.querySelector("[data-cap]").textContent = mode === "score" ? "점수만 보면 ACHE 는 꼴찌(8위)다. '다음 단계 기준'으로 바꿔 보자." : "도킹할 수 있느냐로 줄 세우면 ACHE 가 1위. 점수 1위 APP 는 구조만 있어 멈춘다.";
    };
    btns.forEach((x) => x.addEventListener("click", () => set(x.dataset.mode)));
  }

  /* ── 03 내 점수 만들기 ── */
  const W3 = [1, 1, 1, 1];
  function v3svg(w) {
    const sw = w.reduce((a, x) => a + x, 0), W = 800, top = 40, rh = 36, H = top + 8 * rh + 50, bx = 130, bw = 440;
    if (!sw) return CV.svg(W, 120, tx(8, 40, "가중치를 하나 이상 올려 주세요.", { fs: 14, w: 600 }), "가중치 없음");
    const rows = T8.map((t) => {
      const seg = EV.map((e, k) => (w[k] * t[e.k]) / sw);
      return { t, seg, s: seg.reduce((a, x) => a + x, 0) };
    }).sort((a, b) => b.s - a.s);
    let b = tx(8, 22, "내 순위", { cls: "t-mu", fs: 11.5 }) + tx(bx, 22, "내 점수 = 근거 × 가중치의 평균 (0 ~ 1)", { cls: "t-mu", fs: 11.5 }) + tx(bx + bw + 76, 22, "도킹", { cls: "t-mu", fs: 11.5 });
    for (const v of [0, 0.25, 0.5, 0.75, 1]) {
      b += `<line x1="${bx + v * bw}" x2="${bx + v * bw}" y1="${top - 4}" y2="${top + 8 * rh}" stroke="var(--line)" stroke-width="1"/>` + tx(bx + v * bw, top + 8 * rh + 14, String(v), { a: "middle", cls: "t-m t-mu", fs: 11 });
    }
    rows.forEach((r, i) => {
      const y = top + i * rh, tr = tierOf(r.t), ready = tr === "ready";
      if (ready) b += `<rect x="0" y="${y}" width="${W}" height="${rh}" fill="var(--hi)" fill-opacity=".45"/>`;
      b += tx(8, y + 23, `${i + 1}위`, { cls: "t-m", w: 600, fs: 12.5 }) + tx(46, y + 23, r.t.symbol, { cls: "t-m", w: 600, fs: 13 });
      let x = bx;
      r.seg.forEach((v, k) => {
        const ww = v * bw;
        if (ww > 0.2) b += `<rect x="${x.toFixed(1)}" y="${y + 8}" width="${ww.toFixed(1)}" height="20" fill="${EV[k].c}" stroke="var(--surface)" stroke-width="1"/>`;
        if (ww > 34) b += tx(x + ww / 2, y + 22, EV[k].t, { a: "middle", fs: 11, w: 600, fill: "var(--paper)" });
        x += ww;
      });
      b += tx(bx + bw + 12, y + 23, r.s.toFixed(3), { cls: "t-m", fs: 12.5, w: 600 });
      b += `<line x1="${bx + r.t.overallScore * bw}" x2="${bx + r.t.overallScore * bw}" y1="${y + 4}" y2="${y + 32}" stroke="var(--ink)" stroke-width="2"/>`;
      b += chip(bx + bw + 76, y + 7, 100, tr, true);
    });
    const ache = rows.findIndex((r) => r.t.symbol === "ACHE") + 1;
    b += tx(8, H - 6, `지금 가중치로 ACHE 는 ${ache}위 · 세로 검은 선은 Open Targets 종합 점수 · 도킹 준비됨은 늘 ACHE 하나뿐`, { fs: 12.5, w: 600 });
    return CV.svg(W, H, b, "가중치를 바꾼 내 표적 점수 누적 막대");
  }
  function v3mount(el) {
    const w = W3.slice(), box = el.querySelector("[data-plot]");
    const draw = () => {
      EV.forEach((e, k) => { el.querySelector(`#s1-v3-w${k}`).value = w[k]; el.querySelector(`[data-out="${k}"]`).textContent = "× " + w[k]; });
      box.innerHTML = v3svg(w);
    };
    EV.forEach((e, k) => el.querySelector(`#s1-v3-w${k}`).addEventListener("input", (ev) => { w[k] = +ev.target.value; draw(); }));
    el.querySelectorAll("[data-pre]").forEach((x) => x.addEventListener("click", () => { x.dataset.pre.split(",").forEach((v, k) => (w[k] = +v)); draw(); }));
  }

  /* ── 04 질환-유전자 망 ── */
  const ANG = { APP: -100, PSEN1: 100, PSEN2: -42, APOE: 42, ABCA7: -142, SORL1: 142, GRIN1: 180, ACHE: 0 };
  const netR = (s) => 60 + (0.92 - s) * 720;
  function infoHTML(t) {
    const tr = tierOf(t), T = TIER[tr];
    return `<h4><span class="mono">${esc(t.symbol)}</span><span style="font-weight:500">${esc(KO[t.symbol])}</span><span class="vz-chip">종합 ${t.overallScore.toFixed(3)} · ${scoreRank(t)}위</span><span class="vz-sig ${T.k}">${T.g} ${T.t}${t.pdbId ? " · PDB " + esc(t.pdbId) : ""}</span></h4>${evBars(t)}`;
  }
  function v4() {
    const W = 760, H = 540, cx = 380, cy = 270, rnd = CV.rng(11);
    let b = "";
    /* 나머지 연관 표적 — 점 하나 = 50개 */
    const rest = AZ.assoc - T8.length, nd = Math.round(rest / 50);
    let placed = 0, guard = 0;
    while (placed < nd && guard++ < 20000) {
      const x = 6 + rnd() * (W - 12), y = 6 + rnd() * (H - 12), d = Math.hypot(x - cx, y - cy);
      if (d < 300) continue;
      b += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="var(--muted)" fill-opacity=".35"/>`; placed++;
    }
    for (const s of [0.8, 0.7]) {
      const r = netR(s);
      b += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line-strong)" stroke-dasharray="3 4" stroke-width="1"/>` + tx(cx + 4, cy - r - 4, `점수 ${s}`, { cls: "t-m t-mu", fs: 11 });
    }
    const pts = T8.map((t) => { const a = (ANG[t.symbol] * Math.PI) / 180, r = netR(t.overallScore); return { t, a, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; });
    for (const p of pts) b += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="${tierOf(p.t) === "ready" ? "var(--good)" : "var(--ink)"}" stroke-opacity="${tierOf(p.t) === "ready" ? 1 : 0.55}" stroke-width="${(1 + (p.t.overallScore - 0.6) * 18).toFixed(1)}"/>`;
    b += `<circle cx="${cx}" cy="${cy}" r="52" fill="var(--ink)"/>` + tx(cx, cy - 6, "알츠하이머", { a: "middle", fs: 14, w: 700, fill: "var(--paper)" }) + tx(cx, cy + 13, `연관 ${n0(AZ.assoc)}`, { a: "middle", cls: "t-m", fs: 11.5, fill: "var(--hi)" });
    for (const p of pts) {
      const tr = tierOf(p.t), T = TIER[tr], lx = p.x + Math.cos(p.a) * 30, ly = p.y + Math.sin(p.a) * 30 + 4, anc = Math.cos(p.a) > 0.3 ? "start" : Math.cos(p.a) < -0.3 ? "end" : "middle";
      const shape = tr === "ready" ? `<rect x="${p.x - 15}" y="${p.y - 15}" width="30" height="30" fill="var(--good)" stroke="var(--ink)" stroke-width="1.5"/>` + tx(p.x, p.y + 5, "✓", { a: "middle", fs: 14, w: 700, fill: "var(--paper)" })
        : tr === "pdb" ? `<rect x="${p.x - 12}" y="${p.y - 12}" width="24" height="24" fill="var(--paper)" stroke="var(--warn)" stroke-width="2"/>` + tx(p.x, p.y + 4, "△", { a: "middle", fs: 11, fill: "var(--warn)" })
          : `<circle cx="${p.x}" cy="${p.y}" r="12" fill="var(--paper)" stroke="var(--bad)" stroke-width="2" stroke-dasharray="3 2"/>` + tx(p.x, p.y + 4, "✗", { a: "middle", fs: 11, fill: "var(--bad)" });
      b += `<g class="s1-node" data-node="${p.t.symbol}" tabindex="0" role="button" aria-label="${p.t.symbol} 종합 ${p.t.overallScore.toFixed(3)} ${T.t}">${shape}` +
        tx(lx, ly - (anc === "middle" ? (Math.sin(p.a) < 0 ? 8 : -6) : 0), p.t.symbol, { a: anc, cls: "t-m", w: 700, fs: 13 }) +
        tx(lx, ly + 14 - (anc === "middle" ? (Math.sin(p.a) < 0 ? 8 : -6) : 0), p.t.overallScore.toFixed(2), { a: anc, cls: "t-m t-mu", fs: 11 }) + `</g>`;
    }
    b += tx(8, 20, "가운데에 가까울수록 연관 근거가 강하다 · 선 굵기 = 종합 점수", { fs: 12, w: 600 });
    b += tx(8, H - 10, `흐린 점 하나 = 연관 표적 50개 (나머지 ${n0(rest)}개는 점수가 더 낮다)`, { cls: "t-mu", fs: 11.5 });
    return `${CV.svg(W, H, b, "알츠하이머와 연관 표적의 관계망")}
      <div class="vz-row"><span class="vz-sig good">✓ 도킹 준비됨</span><span class="vz-sig warn">△ 구조만 있음</span><span class="vz-sig bad">✗ 구조 없음</span><span class="vz-note">점을 가리키거나 눌러 근거를 보세요.</span></div>
      <div class="s1-info" data-info aria-live="polite">${infoHTML(T8.find((t) => t.symbol === "ACHE"))}</div>`;
  }
  function v4mount(el) {
    const info = el.querySelector("[data-info]");
    const show = (g) => { const t = T8.find((x) => x.symbol === g.dataset.node); if (t) info.innerHTML = infoHTML(t); };
    el.querySelectorAll("[data-node]").forEach((g) => {
      g.addEventListener("mouseenter", () => show(g));
      g.addEventListener("focus", () => show(g));
      g.addEventListener("click", () => show(g));
    });
  }

  /* ── 05 자물쇠와 열쇠 ── */
  function lock(cx, top, t) {
    const tr = tierOf(t), ready = tr === "ready";
    const body = tr === "ready" ? "var(--good-bg)" : tr === "pdb" ? "var(--paper)" : "var(--raise)";
    const stroke = tr === "none" ? 'stroke="var(--muted)" stroke-dasharray="5 4"' : 'stroke="var(--ink)"';
    let s = `<path d="M${cx - 24} ${top + 52} V${top + 32} A24 24 0 0 1 ${cx + 24} ${top + 32} V${top + 52}" fill="none" ${stroke} stroke-width="7"/>`;
    s += `<rect x="${cx - 40}" y="${top + 50}" width="80" height="66" fill="${body}" ${stroke} stroke-width="2"/>`;
    if (tr === "none") s += tx(cx, top + 92, "?", { a: "middle", fs: 26, w: 700, fill: "var(--muted)" });
    else s += `<circle cx="${cx}" cy="${top + 75}" r="8" fill="var(--ink)"/><path d="M${cx - 5} ${top + 78} L${cx - 8} ${top + 100} H${cx + 8} L${cx + 5} ${top + 78} Z" fill="var(--ink)"/>`;
    if (ready) {
      s += `<rect x="${cx + 2}" y="${top + 72}" width="70" height="7" fill="var(--good)"/><rect x="${cx + 44}" y="${top + 79}" width="6" height="7" fill="var(--good)"/><rect x="${cx + 56}" y="${top + 79}" width="6" height="5" fill="var(--good)"/>`;
      s += `<circle cx="${cx + 84}" cy="${top + 75}" r="14" fill="var(--good)"/><circle cx="${cx + 84}" cy="${top + 75}" r="5" fill="var(--surface)"/>`;
      s += tx(cx + 84, top + 104, "도네페질", { a: "middle", fs: 11, w: 700, fill: "var(--good)" });
    } else if (tr === "pdb") {
      s += `<rect x="${cx + 48}" y="${top + 72}" width="34" height="7" fill="none" stroke="var(--warn)" stroke-dasharray="3 2" stroke-width="1.5"/><circle cx="${cx + 84}" cy="${top + 75}" r="12" fill="none" stroke="var(--warn)" stroke-dasharray="3 2" stroke-width="1.5"/>`;
      s += tx(cx + 84, top + 80, "?", { a: "middle", fs: 13, w: 700, fill: "var(--warn)" });
    }
    s += tx(cx, top + 140, t.symbol, { a: "middle", cls: "t-m", w: 700, fs: 14 });
    s += tx(cx, top + 157, `점수 ${t.overallScore.toFixed(2)} · ${scoreRank(t)}위`, { a: "middle", cls: "t-m t-mu", fs: 11.5 });
    const T = TIER[tr];
    s += tx(cx, top + 175, `${T.g} ${tr === "ready" ? "4EY7 · 열쇠 있음" : tr === "pdb" ? `${t.pdbId} · 열쇠 본 없음` : "구멍 모양 모름"}`, { a: "middle", fs: 12, w: 600, fill: `var(--${T.k})` });
    return s;
  }
  function v5() {
    const W = 800, ch = 196, H = 2 * ch + 76;
    let b = "";
    T8.forEach((t, i) => { b += lock(100 + (i % 4) * 200 - 20, 6 + Math.floor(i / 4) * ch, t); });
    const y = 2 * ch + 22;
    b += `<line x1="0" x2="${W}" y1="${y - 12}" y2="${y - 12}" stroke="var(--line-strong)" stroke-width="1"/>`;
    b += tx(8, y + 6, "자물쇠 = 표적 단백질 · 구멍 = 약이 붙는 주머니 · 열쇠 = 기준 약(이미 맞는 분자)", { fs: 12.5, w: 600 });
    b += tx(8, y + 26, "결정구조(PDB)는 구멍 모양을 원자 단위로 찍은 사진. 구멍 모양과 기준 열쇠가 다 있어야 새 열쇠(후보)를 시험할 수 있다.", { cls: "t-mu", fs: 12 });
    b += tx(8, y + 46, "점수 순으로 놓았다. 열쇠가 꽂힌 자물쇠는 점수 꼴찌 ACHE 하나.", { fs: 12.5, w: 600 });
    return CV.svg(W, H, b, "자물쇠와 열쇠로 본 표적 8개");
  }

  /* ── 06 관문 4개 ── */
  const GATES = [
    { t: "질환 연관", r: "Open Targets 상위 8", ok: () => true, v: (t) => t.overallScore.toFixed(2) },
    { t: "약 주머니", r: "작은 분자가 붙을 자리", ok: (t) => !!t.smPocket, v: (t) => (t.smPocket ? "있음" : "없음") },
    { t: "결정구조", r: "PDB 좌표가 있음", ok: (t) => !!t.pdbId, v: (t) => t.pdbId || "없음" },
    { t: "도킹 준비", r: "기준 약 + 재도킹 검증", ok: (t) => !!t.dockingTargetId, v: (t) => (t.dockingTargetId ? `${REF.ref} · ${REF.rmsd}Å` : "없음") }
  ];
  const failGate = (t) => GATES.findIndex((g) => !g.ok(t));
  function v6svg(stage) {
    const W = 820, top = 92, rh = 34, H = top + 8 * rh + 30, gx = (k) => 160 + k * 132;
    let alive = T8.length, b = "";
    b += tx(8, 22, "표적", { cls: "t-mu", fs: 11.5 });
    const counts = GATES.map((g, k) => (alive = T8.filter((t) => { const f = failGate(t); return f === -1 || f > k; }).length));
    GATES.forEach((g, k) => {
      const on = k < stage;
      b += `<rect x="${gx(k)}" y="6" width="124" height="78" fill="${on ? "var(--ink)" : "var(--raise)"}"/>`;
      b += tx(gx(k) + 8, 24, `관문 ${k + 1}`, { cls: "t-m", fs: 11, fill: on ? "var(--hi)" : "var(--muted)" });
      b += tx(gx(k) + 8, 42, g.t, { fs: 13.5, w: 700, fill: on ? "var(--paper)" : "var(--ink)" });
      b += tx(gx(k) + 8, 58, g.r, { fs: 11, fill: on ? "var(--paper)" : "var(--muted)" });
      b += tx(gx(k) + 8, 77, on ? `남은 표적 ${counts[k]}개` : "아직 안 봄", { cls: "t-m", fs: 11.5, w: 600, fill: on ? "var(--hi)" : "var(--muted)" });
    });
    b += tx(700, 42, "결과", { fs: 13.5, w: 700 }) + tx(700, 58, "3단계로?", { fs: 11, cls: "t-mu" });
    T8.forEach((t, i) => {
      const y = top + i * rh, f = failGate(t), dead = f !== -1 && f < stage;
      b += `<line x1="0" x2="${W}" y1="${y + rh}" y2="${y + rh}" stroke="var(--line)" stroke-width="1"/>`;
      b += tx(8, y + 22, t.symbol, { cls: "t-m", w: 600, fs: 13, fill: dead ? "var(--muted)" : "var(--ink)" }) + tx(70, y + 22, t.overallScore.toFixed(2), { cls: "t-m t-mu", fs: 11.5 });
      GATES.forEach((g, k) => {
        const x = gx(k), seen = k < stage, after = f !== -1 && k > f;
        if (!seen) { b += `<rect x="${x}" y="${y + 5}" width="124" height="${rh - 10}" fill="var(--raise)"/>` + tx(x + 62, y + 22, "?", { a: "middle", fs: 12, fill: "var(--muted)" }); return; }
        if (after) { b += tx(x + 62, y + 22, "—", { a: "middle", fs: 12, fill: "var(--muted)" }); return; }
        const ok = g.ok(t);
        b += `<rect x="${x}" y="${y + 5}" width="124" height="${rh - 10}" fill="var(--${ok ? "good" : "bad"}-bg)" stroke="var(--${ok ? "good" : "bad"})" stroke-width="1"/>`;
        b += tx(x + 8, y + 22, ok ? "✓" : "✗", { fs: 13, w: 700, fill: `var(--${ok ? "good" : "bad"})` }) + tx(x + 24, y + 22, esc(g.v(t)), { cls: "t-m", fs: 11, fill: `var(--${ok ? "good" : "bad"})` });
      });
      const done = stage >= 4 || dead;
      const res = !done ? "…" : f === -1 ? "✓ 통과" : `✗ 관문 ${f + 1}에서 멈춤`;
      b += tx(700, y + 22, res, { fs: 12, w: 600, fill: !done ? "var(--muted)" : f === -1 ? "var(--good)" : "var(--bad)" });
    });
    b += tx(8, H - 8, stage >= 4 ? `8 → ${counts.join(" → ")}개. 점수가 높아도 앞 관문에서 막히면 끝이다. 남는 표적은 ACHE 하나.` : `관문 ${stage}까지 봤다. 남은 표적 ${counts[stage - 1]}개.`, { fs: 12.5, w: 600 });
    return CV.svg(W, H, b, "표적이 3단계로 가기 위한 관문 4개");
  }
  function v6mount(el) {
    const box = el.querySelector("[data-plot]"), btns = el.querySelectorAll("[data-st]"), play = el.querySelector("#s1-v6-play");
    let timer = null;
    const set = (s) => { btns.forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.st === s))); box.innerHTML = v6svg(s); };
    const stop = () => { if (timer) clearInterval(timer); timer = null; play.setAttribute("aria-pressed", "false"); };
    btns.forEach((x) => x.addEventListener("click", () => { stop(); set(+x.dataset.st); }));
    play.addEventListener("click", () => {
      stop();
      if (CV.reduced()) return set(4);
      let s = 1; set(s); play.setAttribute("aria-pressed", "true");
      timer = setInterval(() => { s++; set(s); if (s >= 4) stop(); }, 1100);
    });
    return stop;
  }

  /* ── 07 질환에서 구조까지 ── */
  function chainBox(k, v, d, why, cls = "", mono = false, extra = "") {
    return `<div class="s1-ch ${cls}"><span class="k">${k}</span><span class="v${mono ? " mono" : ""}">${v}</span>${extra}<span class="d">${d}</span>${why ? `<span class="why">${why}</span>` : ""}</div>`;
  }
  function v7() {
    const ache = T8.find((t) => t.symbol === "ACHE"), app = T8[0];
    const ok = `<div class="s1-chain" aria-label="ACHE 로 이어지는 사슬">
      ${chainBox("① 질환", "알츠하이머", `${esc(AZ.mondo)} · 연관 표적 ${n0(AZ.assoc)}개`, "기억력이 떨어지는 뇌 질환")}
      ${chainBox("② 표적", "ACHE", `${esc(REF.label)} · 종합 ${ache.overallScore.toFixed(2)} (${scoreRank(ache)}위)`, "뇌의 신호 물질(아세틸콜린)을 분해한다. 막으면 신호가 오래 남는다.", "", true)}
      ${chainBox("③ 기준 약", esc(REF.ref), `결정 리간드 · ${f2(REF.refKcal)} kcal/mol`, "이미 이 표적에 붙는 약. 새 분자를 견줄 잣대.", "", false, CV.mol(REF.refSmiles, 200, 110))}
      ${chainBox("④ 결정구조", esc(REF.pdb), `재도킹 RMSD ${REF.rmsd} Å ≤ 2 Å · 검증 통과`, "약이 붙은 주머니를 원자 단위로 찍은 사진(PDB).", "ok", true)}
      ${chainBox("⑤ 다음 단계", "1.2 스크리닝", `분자 ${CV.D.compounds.length}개를 ACHE 점수로`, "사슬이 끝까지 이어져 다음으로 간다.", "ok")}
    </div>`;

  const DCOL = { "알츠하이머": "var(--me)", "비소세포폐암": "var(--seum)", "2형 당뇨": "var(--daon)", "류마티스 관절염": "var(--mirp)" };
  function v9() {

    const yl = CV.scale([0, 0.9], [380, 290]);      /* 아래 칸: 0 ~ 0.90 */
    const sy = (v) => (v >= 0.94 ? yu(v) : yl(v));

    for (const v of [0, 0.3, 0.6, 0.9]) b += `<line x1="${x0}" x2="${x1}" y1="${yl(v)}" y2="${yl(v)}" stroke="var(--line)" stroke-width="1"/>` + (v < 0.9 ? tx(x0 - 6, yl(v) + 4, v.toFixed(1), { a: "end", cls: "t-m t-mu", fs: 11 }) : "");

    b += `<rect x="${x0 - 4}" y="270" width="${x1 - x0 + 8}" height="14" fill="var(--surface)"/>`;

    b += tx(x0 + 6, 281, "≈ 축 끊김: 위 칸은 0.94 ~ 1.00 을 크게 펼침 (0.90 ~ 0.94 에는 점이 없다)", { cls: "t-mu", fs: 11 });
    for (const v of [0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]) b += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${yl(0)}" y2="${yl(0) + 5}" stroke="var(--ink)" stroke-width="1"/>` + tx(sx(v), yl(0) + 18, v.toFixed(2), { a: "middle", cls: "t-m t-mu", fs: 11 });
    b += `<line x1="${x0}" x2="${x1}" y1="${yl(0)}" y2="${yl(0)}" stroke="var(--ink)" stroke-width="1"/>`;
    b += tx((x0 + x1) / 2, H - 6, "종합 점수(Open Targets) →", { a: "middle", cls: "t-mu", fs: 11.5 });
    b += tx(12, 24, "약물 근거 ↑", { cls: "t-mu", fs: 11.5 });
    const all = [];
    CV.D.diseases.forEach((d) => d.targets.forEach((t) => all.push({ d, t })));
    all.sort((a, b) => !!a.t.dockingTargetId - !!b.t.dockingTargetId);
    const rd = [];
    for (const { d, t } of all) {
      const x = sx(t.overallScore), y = sy(t.drugScore), c = DCOL[d.name], ready = !!t.dockingTargetId;
      const lab = `${t.symbol} · ${d.name} · 종합 ${t.overallScore.toFixed(3)} · 약물 ${t.drugScore.toFixed(3)}${ready ? " · 도킹 준비됨" : ""}`;
      const shape = ready ? `<path d="M${x} ${y - 8} L${x + 8} ${y} L${x} ${y + 8} L${x - 8} ${y} Z" fill="${c}" stroke="var(--ink)" stroke-width="2"/>` : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${c}" fill-opacity=".75" stroke="var(--surface)" stroke-width="1"/>`;
      b += `<g class="s1-node" data-pt="${esc(lab)}" tabindex="${ready ? 0 : -1}">${shape}<title>${esc(lab)}</title></g>`;

      b += tx(bx + 8, by + 1, near.map((p) => p.t.symbol).join(" · "), { cls: "t-m", w: 700, fs: 12 });

      <div class="vz-row">${Object.entries(DCOL).map(([k, c]) => `<span class="vz-chip"><i class="s1-sw" style="background:${c}"></i>${esc(k)}</span>`).join("")}<span class="vz-chip">◆ 도킹 준비됨 · ● 그 밖</span></div>

  }

  const mk = (o = {}) => Object.assign({ libs: LIBS.slice(), on: {}, th: Object.fromEntries(PROPS.map((p) => [p.k, p.def])), ro5: null, alerts: false, sort: "sc", topN: 10 }, o);

      steps.push({ k, label: gateLabel(k, C), n: alive.length, a: alive.filter(isA).length });

  /* ── 공용 화면 조각 ── */
  /* 지표 하나의 분포(작은 막대) + 문턱선 + 정답 분자 눈금 */
  function hist(k, C, W = 230, H = 40, big = false) {
    const p = PK[k], [lo, hi] = p.d, nb = big ? 28 : 20, bw = (hi - lo) / nb, on = big || C.on[k], t = C.th[k];
    const bins = Array.from({ length: nb }, () => [0, 0]);
    for (const c of DC) { const i = CV.clamp(Math.floor((CV.clamp(c[k], lo, hi - 1e-9) - lo) / bw), 0, nb - 1); bins[i][isA(c) ? 1 : 0]++; }
    const mx = Math.max(...bins.map((b) => b[0] + b[1])), top = big ? 18 : 2, bot = big ? H - 46 : H - 9, sx = CV.scale([lo, hi], [big ? 44 : 0, big ? W - 10 : W]), sy = (n) => ((bot - top) * n) / mx;
    const keep = (v) => (p.dir === "max" ? v <= t : v >= t);
    let s = "";
    bins.forEach(([o, a], i) => {
      const x0 = sx(lo + i * bw) + 0.6, x1 = sx(lo + (i + 1) * bw) - 0.6, mid = lo + (i + 0.5) * bw, k2 = !on || keep(mid);
      const ho = sy(o), ha = sy(a);
      s += `<rect x="${x0.toFixed(1)}" y="${(bot - ho).toFixed(1)}" width="${(x1 - x0).toFixed(1)}" height="${ho.toFixed(1)}" fill="${k2 ? "var(--ink)" : "var(--line-strong)"}" fill-opacity="${k2 ? 0.78 : 0.5}"/>`;
      if (a) s += `<rect x="${x0.toFixed(1)}" y="${(bot - ho - ha).toFixed(1)}" width="${(x1 - x0).toFixed(1)}" height="${ha.toFixed(1)}" fill="var(--hi)" stroke="var(--ink)" stroke-width="${big ? 1.2 : 0.8}"/>`;
    });
    s += `<line x1="${sx(lo)}" x2="${sx(hi)}" y1="${bot}" y2="${bot}" stroke="var(--ink)" stroke-width="1"/>`;
    for (const c of DC) if (isA(c)) s += `<line x1="${sx(CV.clamp(c[k], lo, hi)).toFixed(1)}" x2="${sx(CV.clamp(c[k], lo, hi)).toFixed(1)}" y1="${bot + 2}" y2="${bot + (big ? 9 : 7)}" stroke="var(--ink)" stroke-width="${big ? 2 : 1.5}"/>`;
    if (on) {
      const x = sx(CV.clamp(t, lo, hi));
      const shadeX = p.dir === "max" ? x : sx(lo), shadeW = p.dir === "max" ? sx(hi) - x : x - sx(lo);
      s += `<rect x="${shadeX.toFixed(1)}" y="${top - 2}" width="${Math.max(0, shadeW).toFixed(1)}" height="${bot - top + 2}" fill="var(--bad-bg)"/>`;
      s += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${top - 4}" y2="${bot + 2}" stroke="var(--bad)" stroke-width="${big ? 2 : 1.6}" stroke-dasharray="4 3"/>`;
      if (big) s += tx(x + (p.dir === "max" ? -6 : 6), top + 8, `${p.dir === "max" ? "← 남김 · 버림 →" : "← 버림 · 남김 →"}`, { a: p.dir === "max" ? "end" : "start", fs: 11.5, w: 700, fill: "var(--bad)" });
    }
    if (big) {
      for (const v of CV.ticks(lo, hi, 6)) s += tx(sx(v), bot + 22, p.fmt(v), { a: "middle", cls: "t-m t-mu", fs: 11 });
      s += tx(sx(lo) - 6, top + 4, `${mx}`, { a: "end", cls: "t-m t-mu", fs: 10.5 }) + tx(sx(lo) - 6, bot, "0", { a: "end", cls: "t-m t-mu", fs: 10.5 });
      s += tx((sx(lo) + sx(hi)) / 2, H - 6, `${p.ab} ${p.u ? "(" + p.u + ")" : ""} — ${p.what}`, { a: "middle", cls: "t-mu", fs: 11.5 });
      s += tx(sx(lo), 11, "분자 수", { cls: "t-mu", fs: 10.5 });
    }
    return CV.svg(W, H, s, `${p.ab} 분포`);
  }

  /* 점수판: 남은 수 · 정답 몇 개 · 농축도 · 상위 N 안의 정답 */
  function tiles(r, C) {
    const dots = Array.from({ length: NA }, (_, i) => `<i class="${i < r.a ? "on" : ""}"></i>`).join("");
    const lost = NA - r.a;
    return `<div class="s2-tiles" role="status" aria-live="polite">
      <div class="s2-tile"><span class="vz-lab">남은 분자</span><b>${r.alive.length}<small> / ${DC.length}</small></b><span class="s">${pct(DC.length - r.alive.length, DC.length)}% 걸러냄</span></div>
      <div class="s2-tile ${lost ? (lost >= 4 ? "bad" : "") : "good"}"><span class="vz-lab">알츠하이머 약 계열</span><b>${r.a}<small> / ${NA} 남음</small></b><div class="s2-dots" aria-hidden="true">${dots}</div></div>
      <div class="s2-tile ${r.ef >= 3 ? "good" : ""}"><span class="vz-lab">농축도</span><b>${efTxt(r.ef)}</b><span class="s">약 계열 비율이 처음보다 몇 배 진해졌나</span></div>
      <div class="s2-tile"><span class="vz-lab">도킹 후보 상위 ${C.topN}</span><b>${r.ta}<small> / ${r.top.length} 약 계열</small></b><span class="s">${esc(SORTS[C.sort].l)}</span></div>
    </div>`;
  }
  /* 내가 고른 기준 순서대로 줄어드는 막대 */
  function funnel(r, W = 640) {
    const st = r.steps, rh = 30, lw = 150, bw = W - lw - 150, H = st.length * rh + 6;
    let s = "";
    st.forEach((x, i) => {
      const y = i * rh + 3, w = Math.max(2, (x.n / DC.length) * bw), d = i ? st[i - 1].n - x.n : 0, da = i ? st[i - 1].a - x.a : 0;
      s += tx(lw - 8, y + 17, esc(x.label), { a: "end", cls: i ? "t-m" : "", fs: 11.5, w: 600 });
      s += `<rect x="${lw}" y="${y + 4}" width="${w.toFixed(1)}" height="18" fill="var(--ink)" fill-opacity="${i === st.length - 1 ? 1 : 0.72}"/>`;
      const aw = Math.max(0, (x.a / DC.length) * bw);
      if (x.a) s += `<rect x="${lw}" y="${y + 4}" width="${Math.max(3, aw).toFixed(1)}" height="18" fill="var(--hi)" stroke="var(--ink)" stroke-width="1"/>`;
      s += tx(lw + w + 6, y + 17, `${x.n}`, { cls: "t-m", fs: 12, w: 700 });
      if (i) s += tx(W - 4, y + 17, `${d ? "−" + d : "−0"}${da ? ` (약 계열 −${da})` : ""}`, { a: "end", cls: "t-m", fs: 11.5, w: da ? 700 : 400, fill: da ? "var(--bad)" : "var(--muted)" });
    });
    return CV.svg(W, H, s, "내가 고른 기준으로 줄어드는 분자 수");
  }
  const topChips = (r) => r.top.length ? `<div class="s2-top">${r.top.map((c, i) => `<span class="vz-chip${isA(c) ? " a" : ""}">${i + 1}. ${esc(c.n.split(" (")[0])}</span>`).join("")}</div>` : `<p class="vz-note">남은 분자가 없습니다. 기준을 조금 풀어 보세요.</p>`;
  const legendA = `<p class="vz-note"><span class="vz-chip" style="background:var(--hi);border-color:var(--ink)">노란 칸</span> = 알츠하이머 약 계열(시판 약 6 + 사내 유도체 6). 실제 연구에서도 이미 아는 약으로 거르기 기준이 쓸 만한지 확인한다.</p>`;

  /* 기준 고르는 판(여러 시안이 같이 씀). id 로 컨트롤 id 를 나눈다. */
  function ctl(id, C, o = {}) {
    const keys = o.keys || PROPS.map((p) => p.k);
    const rows = keys.map((k) => {
      const p = PK[k], on = !!C.on[k];
      return `<div class="s2-g ${on ? "" : "off"}" data-row="${k}">
        <input type="checkbox" id="s2-${id}-on-${k}" data-c="on:${k}" ${on ? "checked" : ""} aria-label="${p.l} 기준 쓰기">
        <label class="s2-gl" for="s2-${id}-th-${k}">${p.l} <span class="t-m">${p.ab}</span> ${p.dir === "max" ? "최대" : "최소"}${o.hist ? `<small>${esc(p.why)}</small>` : ""}</label>
        <output data-o="${k}">${on ? (p.dir === "max" ? "≤ " : "≥ ") + p.fmt(C.th[k]) : "안 씀"}</output>
        <div class="wide"><input class="vz-rng" type="range" id="s2-${id}-th-${k}" data-c="th:${k}" min="${p.d[0]}" max="${p.d[1]}" step="${p.st}" value="${C.th[k]}" ${on ? "" : "disabled"}>${o.hist ? `<div data-h="${k}">${hist(k, C)}</div>` : ""}</div>
      </div>`;
    }).join("");
    const extra = o.basic ? "" : `
      <div class="s2-g ${C.ro5 == null ? "off" : ""}" data-row="ro5"><span></span><span class="s2-gl">Lipinski 위반 허용<small>${o.hist ? "MW &gt; 500 · cLogP &gt; 5 · HBD &gt; 5 · HBA &gt; 10 중 몇 개까지 봐줄까" : ""}</small></span><span></span>
        <div class="wide s2-seg" role="group" aria-label="Lipinski 위반 허용">${[null, 0, 1, 2].map((v) => `<button type="button" class="vz-btn" id="s2-${id}-ro5-${v == null ? "x" : v}" data-c="ro5:${v == null ? "x" : v}" aria-pressed="${C.ro5 === v}">${v == null ? "안 씀" : v + "개까지"}</button>`).join("")}</div></div>
      <div class="s2-g ${C.alerts ? "" : "off"}" data-row="alerts"><input type="checkbox" id="s2-${id}-al" data-c="alerts" ${C.alerts ? "checked" : ""}><label class="s2-gl" for="s2-${id}-al">구조 경고 조각 빼기<small>${o.hist ? "방향족 아민 · 니트로처럼 몸속에서 독성 물질로 바뀌기 쉬운 조각(32개 분자)" : ""}</small></label><span></span></div>`;
    const libs = o.basic ? "" : `<div class="s2-g" data-row="lib"><span></span><span class="s2-gl">라이브러리</span><span></span><div class="wide s2-seg">${LIBS.map((l, i) => `<label class="vz-btn" style="display:inline-flex;gap:5px;align-items:center" for="s2-${id}-lib${i}"><input type="checkbox" id="s2-${id}-lib${i}" data-c="lib:${esc(l)}" ${C.libs.includes(l) ? "checked" : ""}>${esc(LSHORT[l])} ${CV.D.meta.counts[l]}</label>`).join("")}</div></div>`;
    const rank = o.rank === false ? "" : `<div class="s2-g" data-row="rank"><span></span><label class="s2-gl" for="s2-${id}-sort">도킹 후보를 줄 세우는 기준</label><span></span>
        <div class="wide" style="display:flex;flex-wrap:wrap;gap:6px"><select id="s2-${id}-sort" data-c="sort" class="vz-btn" style="font-weight:500">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}" ${C.sort === k ? "selected" : ""}>${esc(s.l)}</option>`).join("")}</select>
        <span class="s2-seg" role="group" aria-label="상위 몇 개">${[5, 10, 20].map((v) => `<button type="button" class="vz-btn" id="s2-${id}-top-${v}" data-c="top:${v}" aria-pressed="${C.topN === v}">상위 ${v}</button>`).join("")}</span></div></div>`;
    return `<div class="s2-ctl" data-ctl="${id}">${libs}${rows}${extra}${rank}</div>`;
  }
  /* 판의 입력 → C 를 바꾸고 화면 표시를 맞춘 뒤 onChange */
  function bindCtl(root, id, C, onChange) {
    const box = root.querySelector(`[data-ctl="${id}"]`);
    if (!box) return () => {};
    const sync = () => {
      for (const p of PROPS) {
        const row = box.querySelector(`[data-row="${p.k}"]`); if (!row) continue;
        const on = !!C.on[p.k];
        row.classList.toggle("off", !on);
        row.querySelector(`[data-c="on:${p.k}"]`).checked = on;
        const rg = row.querySelector(`[data-c="th:${p.k}"]`); rg.disabled = !on; rg.value = C.th[p.k];
        row.querySelector(`[data-o="${p.k}"]`).textContent = on ? (p.dir === "max" ? "≤ " : "≥ ") + p.fmt(C.th[p.k]) : "안 씀";
        const h = row.querySelector(`[data-h="${p.k}"]`); if (h) h.innerHTML = hist(p.k, C);
      }
      box.querySelectorAll('[data-c^="ro5:"]').forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.c === "ro5:x" ? null : +b.dataset.c.slice(4)) === C.ro5)));
      const r5 = box.querySelector('[data-row="ro5"]'); if (r5) r5.classList.toggle("off", C.ro5 == null);
      const al = box.querySelector('[data-c="alerts"]'); if (al) { al.checked = C.alerts; box.querySelector('[data-row="alerts"]').classList.toggle("off", !C.alerts); }
      box.querySelectorAll('[data-c^="lib:"]').forEach((b) => (b.checked = C.libs.includes(b.dataset.c.slice(4))));
      box.querySelectorAll('[data-c^="top:"]').forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.c.slice(4) === C.topN)));
      const so = box.querySelector('[data-c="sort"]'); if (so) so.value = C.sort;
    };
    const act = (e) => {
      const t = e.target.closest("[data-c]"); if (!t || !box.contains(t)) return;
      const [a, b] = t.dataset.c.split(/:(.*)/s);
      if (a === "on") C.on[b] = t.checked;
      else if (a === "th") { C.th[b] = +t.value; if (!C.on[b]) C.on[b] = true; }
      else if (a === "ro5") { if (e.type !== "click") return; C.ro5 = b === "x" ? null : +b; }
      else if (a === "alerts") C.alerts = t.checked;
      else if (a === "lib") C.libs = LIBS.filter((l) => box.querySelector(`[data-c="lib:${CSS.escape(l)}"]`).checked);
      else if (a === "sort") C.sort = t.value;
      else if (a === "top") { if (e.type !== "click") return; C.topN = +b; }
      sync(); onChange();
    };
    box.addEventListener("input", act); box.addEventListener("change", act); box.addEventListener("click", (e) => { const t = e.target.closest('[data-c^="ro5:"], [data-c^="top:"]'); if (t) act(e); });
    return sync;
  }
  const presetBar = (id) => `<div class="s2-presets"><span class="vz-lab">빠른 시작</span>${Object.entries(PRESETS).map(([k, p]) => `<button type="button" class="vz-btn" id="s2-${id}-pre-${k}" data-pre="${k}">${esc(p.l)}</button>`).join("")}</div>`;

  /* ─────────── 01 기준 설계실 ─────────── */
  function v1() {
    const C = PRESETS.game.c(), r = run(C);
    return `<p class="s2-q">220개 중 3단계 도킹에 보낼 후보를 고른다. <b>어떤 기준을 켜고, 문턱을 어디에 둘지</b> 직접 정해 보자. 약 계열 12개를 지키면서 나머지를 많이 걸러낼수록 좋은 기준이다.</p>
      ${presetBar("v1")}
      <div class="s2-two"><div>${ctl("v1", C, { hist: true })}</div>
      <div style="display:grid;gap:12px" data-res>${v1res(r, C)}</div></div>`;
  }
  const v1res = (r, C) => `${tiles(r, C)}<div><span class="vz-lab">내 기준을 차례로 지나며 남은 분자(노란 막대 = 약 계열)</span>${funnel(r)}</div>
    <div><span class="vz-lab">3단계로 보낼 상위 ${C.topN} · ${esc(SORTS[C.sort].l)}</span>${topChips(r)}</div>${legendA}`;
  function v1mount(el) {
    const C = PRESETS.game.c();
    const draw = () => { el.querySelector("[data-res]").innerHTML = v1res(run(C), C); };
    const sync = bindCtl(el, "v1", C, draw);
    el.querySelectorAll("[data-pre]").forEach((b) => b.addEventListener("click", () => { Object.assign(C, PRESETS[b.dataset.pre].c()); sync(); draw(); }));
  }

  /* ─────────── 02 분포 보고 문턱 정하기 ─────────── */
  function v2view(k, t) {
    const p = PK[k], C = mk({ on: { [k]: 1 } }); C.th[k] = t;
    const r = run(C), lostA = DC.filter((c) => isA(c) && !gateFn(k, C)(c));
    return `${hist(k, C, 820, 290, true)}
      <p class="s2-out">이 문턱 하나로 <b>${r.alive.length}</b>개가 남고(−${DC.length - r.alive.length}), 약 계열 <b>${r.a} / ${NA}</b>, 농축도 <b>${efTxt(r.ef)}</b>.
      ${lostA.length ? `<br><span style="color:var(--bad);font-weight:600">버려지는 약 계열: ${lostA.map((c) => `${esc(c.n.split(" (")[0])}(${p.fmt(c[k])})`).join(", ")}</span>` : `<br><span style="color:var(--good);font-weight:600">약 계열은 하나도 버리지 않는다.</span>`}</p>`;
  }
  function v2() {
    const k = "tpsa", p = PK[k];
    return `<p class="s2-q">지표를 하나 고르고 <b>분포를 본 다음</b> 문턱을 정해 '내 기준표'에 담자. 노란 칸(약 계열)이 어디 몰려 있는지가 힌트다.</p>
      <div class="s2-tabs" role="group" aria-label="지표 고르기">${PROPS.map((q) => `<button type="button" class="vz-btn" id="s2-v2-tab-${q.k}" data-tab="${q.k}" aria-pressed="${q.k === k}">${q.l} ${q.ab}</button>`).join("")}</div>
      <div class="s2-tip" data-tip><b>${p.ab} · ${p.l}</b> — ${esc(p.what)} ${esc(p.why)}</div>
      <div data-view>${v2view(k, p.def)}</div>
      <div class="vz-row"><label for="s2-v2-th" class="vz-lab" style="margin:0">문턱</label><input class="vz-rng" style="flex:1;min-width:160px" type="range" id="s2-v2-th" min="${p.d[0]}" max="${p.d[1]}" step="${p.st}" value="${p.def}"><output class="t-m" data-o style="font-family:var(--mono);font-weight:600;min-width:64px">${p.dir === "max" ? "≤" : "≥"} ${p.fmt(p.def)}</output>
        <button type="button" class="vz-btn" id="s2-v2-add" data-add style="background:var(--ink);color:var(--paper)">내 기준표에 담기</button></div>
      <div style="display:grid;gap:8px;border-top:1px dashed var(--line-strong);padding-top:10px"><div class="vz-row"><span class="vz-lab" style="margin:0">내 기준표</span><button type="button" class="vz-btn" id="s2-v2-clear" data-clear>비우기</button></div><div data-list>${v2list({})}</div></div>`;
  }
  function v2list(set) {
    const ks = Object.keys(set);
    if (!ks.length) return `<p class="vz-note">아직 담은 기준이 없습니다. 지표마다 문턱을 정해 담아 보세요. 담은 기준은 모두 함께(그리고) 적용됩니다.</p>`;
    const C = mk({ on: Object.fromEntries(ks.map((k) => [k, 1])) }); ks.forEach((k) => (C.th[k] = set[k]));
    const r = run(C);
    return `<div class="s2-top">${ks.map((k) => `<span class="vz-chip" style="font-size:12px">${esc(gateLabel(k, C))}</span>`).join("")}</div>${tiles(r, C)}`;
  }
  function v2mount(el) {
    let k = "tpsa"; const set = {};
    const rg = el.querySelector("#s2-v2-th"), o = el.querySelector("[data-o]");
    const show = () => { const p = PK[k]; o.textContent = `${p.dir === "max" ? "≤" : "≥"} ${p.fmt(+rg.value)}`; el.querySelector("[data-view]").innerHTML = v2view(k, +rg.value); };
    el.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
      k = b.dataset.tab; const p = PK[k];
      el.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      el.querySelector("[data-tip]").innerHTML = `<b>${p.ab} · ${p.l}</b> — ${esc(p.what)} ${esc(p.why)}`;
      rg.min = p.d[0]; rg.max = p.d[1]; rg.step = p.st; rg.value = set[k] ?? p.def; show();
    }));
    rg.addEventListener("input", show);
    el.querySelector("[data-add]").addEventListener("click", () => { set[k] = +rg.value; el.querySelector("[data-list]").innerHTML = v2list(set); });
    el.querySelector("[data-clear]").addEventListener("click", () => { for (const x of Object.keys(set)) delete set[x]; el.querySelector("[data-list]").innerHTML = v2list(set); });
  }

  /* ─────────── 03 화학 공간에 울타리 치기 ─────────── */
  const AX = ["mw", "logp", "tpsa", "hbd", "rotb", "qed"];
  const G3 = { W: 820, H: 430, x0: 64, x1: 800, y0: 22, y1: 380 };
  function v3plot(ax, ay, box, lip) {
    const { W, H, x0, x1, y0, y1 } = G3, px = PK[ax], py = PK[ay];
    const sx = CV.scale(px.d, [x0, x1]), sy = CV.scale(py.d, [y1, y0]);
    let s = "";

  /* ───────────── 02 ΔG → p 변환기 ───────────── */

  }

  /* ───────────── 08 재도킹 RMSD 겹쳐 보기 ───────────── */
  const V8 = (() => {
    const A = [];
    const ring = (cx, cy, r = 1.4, rot = 30) => { const s = A.length; for (let i = 0; i < 6; i++) { const a = ((60 * i + rot) * Math.PI) / 180; A.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return s; };
    const ra = ring(-6.2, 0, 1.4, 0), extra1 = A.push([-7.8, 2.6]) - 1, extra2 = A.push([-7.8, -2.6]) - 1;
    const l1 = A.push([-3.9, 0.9]) - 1, l2 = A.push([-2.6, 0]) - 1;

    b += draw(V8.A, "var(--ink)", 3, "");

<style>
  /* 레이아웃: 위 띠(제목 · 시안 탭 01~10) → 무대(걸어 다니는 사옥 지구 캔버스 + RPG 창 겹) → 시안 설명(무엇을 실제 화면에 가져갈지).
     게임 화면이라 어두운 한 가지 모습으로만 간다. 색은 Crista 잉크 · 라임, 창은 쯔꾸르 기본 창 파랑. */
  :root {
    --bg: #0d1210; --panel: #151c18; --raise: #1d2621; --fg: #eef1e8; --muted: #9aa597; --faint: #5d685a;
    --line: rgba(238, 241, 232, 0.12);
    --hi: #c6ff4a; --hi-fg: #0b0d0a;

    --mono: "GalmuriMono11", "Galmuri11", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.55; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

  header.top p { margin: 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .tabs button { flex: none; font-family: var(--pixel); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
  .tabs button b { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--hi); color: var(--hi-fg); border-color: var(--hi); }

  .tabs button:focus-visible, .stage:focus-visible, .win button:focus-visible, .ctl:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

  .stage { position: relative; height: clamp(440px, 74vh, 760px); border-radius: 10px; overflow: hidden; background: #3c6a2e; border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
  .stage canvas.world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
  .stage.shake { animation: shake 0.42s steps(2) 1; }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translate(-5px, 2px); } 50% { transform: translate(4px, -3px); } 75% { transform: translate(-2px, 3px); } }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--pixel); }
  #ui > * { pointer-events: auto; }
  #ui .pass { pointer-events: none; }

  .info { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
  .info section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .info h2 { font-family: var(--pixel); font-size: 15px; margin: 0 0 6px; text-wrap: balance; }
  .info h3 { font-family: var(--pixel); font-size: 12px; color: var(--muted); font-weight: 400; margin: 0 0 8px; letter-spacing: 0.04em; }
  .info p { margin: 0 0 8px; max-width: 68ch; }
  .info ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd { font-family: var(--mono); font-size: 11px; background: var(--raise); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--fg); }
  @media (max-width: 760px) { .info { grid-template-columns: 1fr; } .stage { height: clamp(420px, 68vh, 640px); } }

  /* ---------- 쯔꾸르 창(windowskin) ---------- */
  .win { position: absolute; color: #fff; font-family: var(--pixel); font-size: 14px; line-height: 1.7; text-shadow: 1px 1px 0 #000; background: linear-gradient(180deg, var(--win-top), var(--win-bot)); border: 2px solid var(--win-edge); border-radius: 6px; box-shadow: 0 0 0 2px var(--win-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 6px 18px rgba(0, 0, 0, 0.35); padding: 10px 14px; max-width: calc(100% - 16px); box-sizing: border-box; }
  .win.dq { background: rgba(0, 0, 0, 0.92); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 2px #000; }
  .win.paper { background: var(--paper); color: var(--paper-ink); text-shadow: none; border: 2px solid var(--paper-ink); border-radius: 4px; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35); }
  .win.mmo { background: rgba(6, 10, 8, 0.72); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 6px; box-shadow: none; font-size: 12px; }
  .win.gb { background: #cadc9f; color: #0f380f; text-shadow: none; border: 3px solid #0f380f; border-radius: 2px; box-shadow: 0 0 0 3px #9bbc0f; }
  .win h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: #ffe27a; }
  .win.paper h4, .win.gb h4 { color: var(--stamp); }
  .win .sub { opacity: 0.72; font-size: 12px; }
  .win button { font: inherit; color: inherit; text-shadow: inherit; background: none; border: 0; cursor: pointer; }

  .msg { left: 50%; transform: translateX(-50%); bottom: 12px; width: min(760px, calc(100% - 16px)); min-height: 112px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
  .msg.top { bottom: auto; top: 12px; }
  .msg .face { flex: none; width: 96px; height: 96px; image-rendering: pixelated; border-radius: 4px; background: rgba(255, 255, 255, 0.1); }
  .msg .mbody { min-width: 0; flex: 1; }
  .msg .mname { display: inline-block; font-size: 13px; color: #ffe27a; margin-bottom: 2px; }
  .win.paper .mname, .win.gb .mname { color: var(--stamp); }
  .msg .mtext { margin: 0; white-space: pre-wrap; font-size: 15px; }
  .msg .more { position: absolute; right: 14px; bottom: 6px; font-style: normal; font-size: 12px; opacity: 0; }
  .msg.done:not(.ask) .more { opacity: 1; animation: bob 0.7s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  @media (max-width: 520px) { .msg .face { width: 64px; height: 64px; } .msg .mtext { font-size: 13px; } .msg { min-height: 92px; } }

  .choice { right: 12px; bottom: 136px; min-width: 160px; padding: 6px; display: grid; gap: 2px; }
  .list { display: grid; gap: 2px; }
  .list button { display: block; width: 100%; text-align: left; padding: 3px 12px; border-radius: 4px; position: relative; }
  .list button[disabled] { opacity: 0.42; cursor: default; }
  .list button.on { background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); animation: cur 1s ease-in-out infinite; }
  .win.dq .list button.on { background: none; box-shadow: none; animation: none; }
  .win.dq .list button.on::before { content: "▶"; position: absolute; left: -2px; animation: bob 0.6s steps(2) infinite; }
  .win.paper .list button.on, .win.gb .list button.on { background: rgba(40, 40, 40, 0.12); box-shadow: inset 0 0 0 1px var(--paper-ink); animation: none; }
  @keyframes cur { 50% { background: rgba(255, 255, 255, 0.08); } }

  .banner { top: 18px; left: 0; padding: 6px 48px 6px 18px; background: linear-gradient(90deg, rgba(0, 0, 0, 0.72) 60%, rgba(0, 0, 0, 0)); color: #fff; font-size: 18px; text-shadow: 1px 1px 0 #000; animation: bannerIn 3s ease forwards; }
  .banner small { display: block; font-size: 11px; opacity: 0.75; }
  @keyframes bannerIn { 0% { opacity: 0; transform: translateX(-20px); } 12%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .toast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); }
  .prompt { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font-family: var(--pixel); font-size: 13px; background: var(--paper); color: var(--paper-ink); border: 2px solid var(--paper-ink); border-radius: 4px; padding: 6px 12px; cursor: pointer; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35); max-width: calc(100% - 32px); }
  .prompt kbd { background: var(--paper-ink); color: var(--paper); border: 0; }

  .stampfx { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .stampfx div { font-family: var(--pixel); font-weight: 700; font-size: 34px; color: var(--stamp); border: 5px double var(--stamp); border-radius: 8px; padding: 10px 22px; text-align: center; background: rgba(248, 248, 240, 0.86); transform: rotate(-8deg); animation: stampIn 0.5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .stampfx small { display: block; font-size: 15px; color: var(--paper-ink); }
  @keyframes stampIn { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
  .flash { position: absolute; inset: 0; background: #fff; animation: flash 0.5s ease-out forwards; pointer-events: none; }
  @keyframes flash { from { opacity: 0.9; } to { opacity: 0; } }

  .pad { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: 120px; height: 120px; display: none; }
  .pad button, .abtn button { position: absolute; width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.6); background: rgba(0, 0, 0, 0.42); color: #fff; font-family: var(--pixel); font-size: 14px; }
  .abtn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 100px; height: 90px; display: none; }
  .abtn button { width: 48px; height: 48px; border-radius: 50%; }
  @media (pointer: coarse) { .pad, .abtn { display: block; } .prompt { bottom: 140px; } }

  .ctl { font-family: var(--pixel); font-size: 12px; background: var(--paper); color: var(--paper-ink); border: 2px solid var(--paper-ink); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .ctl.hi { background: var(--hi); }

  /* 이름 입력(05) */
  .slots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .slots span { width: 22px; height: 28px; display: grid; place-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.55); font-size: 17px; }
  .slots span.cur { border-bottom-color: #ffe27a; animation: cur 0.8s steps(2) infinite; }
  .kgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; }
  .kgrid button { padding: 4px 0; text-align: center; border-radius: 4px; font-size: 15px; min-width: 0; }
  .kgrid button.on { background: rgba(255, 255, 255, 0.22); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
  .kgrid button.cmd { font-size: 12px; color: #ffe27a; }

  /* 에디터(06) */
  .ed-bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: #d9d6cc; border-bottom: 1px solid #8f8a7c; color: #222; font-size: 12px; overflow-x: auto; }
  .ed-bar button { font: inherit; padding: 4px 8px; border: 1px solid #8f8a7c; background: #efece4; border-radius: 3px; cursor: pointer; flex: none; color: #222; }
  .ed-bar button[aria-pressed="true"] { background: #3a5fcd; color: #fff; border-color: #22398a; }
  .ed-bar .sep { width: 1px; height: 22px; background: #8f8a7c; margin: 0 4px; flex: none; }
  .ed-bar .play { margin-left: auto; background: #2f6f2a; color: #fff; border-color: #1c4419; }
  .ed-side { position: absolute; left: 0; top: 40px; bottom: 0; width: 212px; background: #e9e6dd; border-right: 1px solid #8f8a7c; color: #222; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-size: 12px; }
  .ed-side h5 { margin: 0; padding: 6px 8px; font-size: 11px; background: #cfcbbf; font-weight: 400; }
  .ed-side .pal { overflow: auto; background: #fff; }
  .ed-side canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
  .ed-side pre { margin: 0; padding: 8px; font-family: var(--mono); font-size: 11px; line-height: 1.6; white-space: pre; overflow-x: auto; }
  .ed-ev { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 70px); overflow: auto; background: #efece4; color: #222; text-shadow: none; border: 1px solid #555; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); padding: 0; }
  .ed-ev header { background: #3a5fcd; color: #fff; padding: 6px 10px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  .ed-ev .cmds { font-family: var(--mono); font-size: 12px; line-height: 1.75; background: #fff; margin: 10px; border: 1px solid #aaa; padding: 8px 10px; white-space: pre-wrap; }
  .ed-ev .cmds .k { color: #1e4fd8; } .ed-ev .cmds .b { color: #9b2c9b; } .ed-ev .cmds .s { color: #b82010; } .ed-ev .cmds .m { color: #777; }
  .ed-ev .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 10px 10px; font-size: 12px; }
  @media (max-width: 640px) { .ed-side { display: none; } }

  /* 학급 멀티(09) */
  .chatlog { left: 10px; bottom: 58px; width: min(380px, calc(100% - 20px)); max-height: 168px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .chatlog p { margin: 0; line-height: 1.6; }
  .chatlog .sys { color: #c6ff4a; } .chatlog .reg { color: #ffb21a; }
  .phrases { left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; }
  .phrases button { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .roster { right: 10px; top: 10px; width: 188px; }
  .roster p { margin: 0; font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; display: inline-block; flex: none; border: 1px solid rgba(0, 0, 0, 0.6); }
  @media (max-width: 640px) { .roster { display: none; } .chatlog { max-height: 110px; } }
  @media (pointer: coarse) { .phrases { left: 140px; right: 120px; } .chatlog { bottom: 140px; } }

  /* 퀘스트 HUD(10) */
  .quest { left: 10px; top: 10px; width: min(270px, calc(100% - 20px)); }
  .quest ol { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
  .quest li { display: flex; gap: 8px; } .quest li i { font-style: normal; width: 14px; flex: none; }
  .quest li.done { opacity: 0.55; text-decoration: line-through; } .quest li.now { color: #ffe27a; }
  .mini { right: 10px; top: 10px; padding: 6px; }
  .mini canvas { display: block; image-rendering: pixelated; width: 160px; height: 104px; }
  .mini p { margin: 4px 0 0; font-size: 11px; text-align: center; }
  @media (max-width: 560px) { .mini canvas { width: 120px; height: 78px; } .quest { width: 200px; font-size: 12px; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>사옥 지구 <i>RPG 만들기</i> 시안 10종</h1>
    <p>② 사옥 지구(Phaser · 실제 아틀라스)를 쯔꾸르 문법으로 다시 그렸어요. 모든 시안에서 걷고, 사옥 문 앞에서 들어갈 수 있어요. 숫자 · 이름은 예시예요.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="시안" id="tabs"></nav>
  <div class="stage" id="stage" tabindex="0" aria-label="사옥 지구 — 방향키 · WASD 로 걷고, 문 앞에서 Z · E · 스페이스">
    <canvas class="world" id="world"></canvas>
    <div id="ui"></div>
    <div class="pad" id="pad" aria-hidden="true">

      <button style="left:40px;top:80px" data-dir="south">▼</button>
    </div>
    <div class="abtn" id="abtn" aria-hidden="true">
      <button style="right:0;top:0" data-act="ok">A</button>
      <button style="left:0;bottom:0" data-act="menu">B</button>
    </div>
  </div>
  <div class="info">
    <section>
      <h3 id="v-no">시안 01</h3>
      <h2 id="v-title"></h2>
      <p id="v-concept"></p>
      <div class="keys"><span><kbd>←↑↓→</kbd> <kbd>WASD</kbd> 걷기</span><span><kbd>Z</kbd> <kbd>E</kbd> <kbd>Space</kbd> 조사 · 결정</span><span><kbd>X</kbd> <kbd>Esc</kbd> 메뉴 · 취소</span><span>바닥 누르기 = 그 칸까지 걷기</span></div>
    </section>
    <section>
      <h3>실제 화면에 가져갈 것</h3>
      <ul id="v-take"></ul>
    </section>
  </div>
</div>

function frameOf(a) {

function stepActor(g, a, dir) {

function tick(dt) {

function render() {
  const g = G; if (!g || !cssW) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;

  let z = typeof g.zoom === 'number' ? g.zoom : g.zoom === 'fit' ? Math.min(vw / W, vh / H) : (vh >= 600 ? 2 : vh >= 430 ? 1.5 : 1.25);
  if (vw < 520 && g.zoom == null) z = Math.min(z, 1.5);
  g.zoomNow = z;
  const viewW = vw / z, viewH = vh / z;
  let cx, cy;
  if (g.camOverride) { cx = g.camOverride.x - viewW / 2; cy = g.camOverride.y - viewH / 2; }
  else { cx = g.me.x - viewW / 2; cy = g.me.y - 24 - viewH / 2; }
  cx = viewW >= W ? (W - viewW) / 2 : Math.max(0, Math.min(W - viewW, cx));
  cy = viewH >= H ? (H - viewH) / 2 : Math.max(0, Math.min(H - viewH, cy));

  ctx.drawImage(g.ground, 0, 0);
  V.drawUnder?.(ctx, g);
  const items = props(g);
  if (!g.hideActors) for (const a of [g.me, ...g.npcs]) if (a.avatar) items.push({ y: a.y + 0.5, draw: (c) => drawActor(c, g, a) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw(ctx);
  V.drawOver?.(ctx, g);
  ctx.restore();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { tick(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

/* ---------- 입력 ---------- */
const KEYDIR = { ArrowUp: 'north', KeyW: 'north', ArrowDown: 'south', KeyS: 'south', ArrowLeft: 'west', KeyA: 'west', ArrowRight: 'east', KeyD: 'east' };
const isOk = (e) => ['KeyZ', 'KeyE', 'Space', 'Enter', 'NumpadEnter'].includes(e.code);
const isBack = (e) => ['KeyX', 'Escape', 'Backspace'].includes(e.code);
function stageActive() { const r = stage.getBoundingClientRect(); return r.bottom > 80 && r.top < window.innerHeight - 80; }
window.addEventListener('keydown', (e) => {
  const g = G; if (!g) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') { if (e.key === 'Escape') { const top = g.keyStack[g.keyStack.length - 1]; top?.(e); } return; }
  if (!stageActive()) return;
  const top = g.keyStack[g.keyStack.length - 1];
  if (top) { if (top(e) !== false) e.preventDefault(); return; }
  if (KEYDIR[e.code]) { e.preventDefault(); if (!held.includes(KEYDIR[e.code])) held.push(KEYDIR[e.code]); return; }
  if (g.lockN) return;
  if (isOk(e)) { e.preventDefault(); if (!e.repeat) okPressed(); }
  else if (e.code === 'KeyX' || e.code === 'Escape') { if (V.menu) { e.preventDefault(); V.menu(g); } }
});
window.addEventListener('keyup', (e) => { const d = KEYDIR[e.code]; if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); } });
window.addEventListener('blur', () => { held.length = 0; });
document.querySelectorAll('#pad button').forEach((b) => {
  const d = b.dataset.dir;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!held.includes(d)) held.push(d); });
  const up = () => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});
document.querySelectorAll('#abtn button').forEach((b) => b.addEventListener('pointerdown', (e) => {
  e.preventDefault(); const g = G; if (!g) return;
  const fake = { code: b.dataset.act === 'ok' ? 'KeyZ' : 'KeyX', key: b.dataset.act === 'ok' ? 'z' : 'Escape', preventDefault() {} };
  const top = g.keyStack[g.keyStack.length - 1];
  if (top) top(fake);
  else if (!g.lockN) b.dataset.act === 'ok' ? okPressed() : V.menu?.(g);
}));
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  const g = G; if (!g) return;
  stage.focus({ preventScroll: true });
  const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const w = g.toWorld(px, py);
  if (V.pointer?.(g, 'down', w, e, px, py)) { drag = true; return; }
  if (g.lockN || !g.me.avatar) return;
  const c = Math.floor(w.x / TILE), rr = Math.floor(w.y / TILE);
  const plot = plotAt(g, c, rr) ?? doorAt(g, c, rr);
  const goal = plot ? { c: PLOTS[plot - 1].doorCol, r: PLOTS[plot - 1].doorRow } : { c, r: rr };
  if (plot && g.me.c === goal.c && g.me.r === goal.r && !g.me.moving) { g.me.dir = 'north'; interact(plot); return; }
  g.me.path = findPath(g, { c: g.me.c, r: g.me.r }, goal);
  g.pending = plot;
});
canvas.addEventListener('pointermove', (e) => { if (!drag || !G) return; const r = stage.getBoundingClientRect(); V.pointer?.(G, 'move', G.toWorld(e.clientX - r.left, e.clientY - r.top), e); });
window.addEventListener('pointerup', () => { if (drag && G) V.pointer?.(G, 'up'); drag = null; });

function okPressed() {
  const g = G, me = g.me; if (me.moving || !me.avatar) return;
  const [dc, dr] = DIRV[me.dir], fc = me.c + dc, fr = me.r + dr;
  const npc = g.npcs.find((n) => (n.c === fc && n.r === fr) || (n.moving && n.tc === fc && n.tr === fr));
  if (npc) { npc.dir = { north: 'south', south: 'north', east: 'west', west: 'east' }[me.dir]; (V.talk || defaultTalk)(g, npc); return; }
  const plot = doorAt(g, me.c, me.r) ?? plotAt(g, fc, fr);

}
function interact(plot) { const g = G; if (g.lockN) return; (V.interact || ((gg, p) => hqDialog(gg, p, V.skin || '')))(g, plot); }
function defaultTalk(g, n) { return message(g, { skin: V.skin || '', face: n.avatar, name: `${n.name} · ${ROLE[n.avatar]}`, text: n.line }); }

let promptEl = null;
function updatePrompt() {

  const t = g.team(g.near);

  if (!promptEl || !promptEl.isConnected) { promptEl = el('<button type="button" class="prompt"></button>'); promptEl.addEventListener('click', () => interact(G.near)); ui.append(promptEl); }

/* ---------- 창 ---------- */
function listCtl(root, items, { onPick, onCancel, onMove, cols = 1, start = 0 } = {}) {
  let sel = Math.max(0, start);
  while (items[sel]?.disabled && sel < items.length - 1) sel++;
  root.innerHTML = '';
  const btns = items.map((it, i) => {
    const b = el(`<button type="button" ${it.disabled ? 'aria-disabled="true"' : ''}>${it.html ?? esc(it.label)}</button>`);
    if (it.disabled) b.classList.add('dis'), (b.style.opacity = '0.42');
    b.addEventListener('mouseenter', () => set(i));
    b.addEventListener('click', (e) => { e.stopPropagation(); set(i); pick(); });
    root.append(b); return b;
  });
  function set(i) { sel = i; btns.forEach((b, j) => b.classList.toggle('on', j === sel)); onMove?.(items[sel], sel); }
  function pick() { if (items[sel].disabled) { onPick?.(items[sel], sel, true); return; } onPick?.(items[sel], sel, false); }
  set(sel);
  return {
    key(e) {
      const n = items.length;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') set((sel + cols) % n);
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') set((sel - cols + n) % n);
      else if (cols > 1 && (e.code === 'ArrowRight' || e.code === 'KeyD')) set((sel + 1) % n);
      else if (cols > 1 && (e.code === 'ArrowLeft' || e.code === 'KeyA')) set((sel - 1 + n) % n);
      else if (isOk(e)) pick();
      else if (isBack(e)) onCancel?.();
      return true;
    },
    get sel() { return sel; },
  };
}

function message(g, { skin = '', face = null, name = '', text, choices = null, pos = 'bottom', auto = 0, cancel = null } = {}) {
  return new Promise((res) => {
    g.lock(true);
    const box = el(`<div class="win ${skin} msg ${pos === 'top' ? 'top' : ''}" role="dialog" aria-live="polite">${face ? '<canvas class="face"></canvas>' : ''}<div class="mbody">${name ? `<b class="mname">${esc(name)}</b>` : ''}<p class="mtext"></p></div><i class="more">▼</i></div>`);
    ui.append(box);
    if (face) drawFace(box.querySelector('.face'), face);
    const p = box.querySelector('.mtext');
    let i = 0, done = false, chooser = null, ctl = null, closed = false;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const timer = setInterval(() => { i += 1; p.textContent = text.slice(0, i); if (i >= text.length) reveal(); }, reduce ? 1 : 30);
    function reveal() {
      if (done) return; clearInterval(timer); p.textContent = text; done = true; box.classList.add('done');
      if (choices) {
        box.classList.add('ask');
        chooser = el(`<div class="win ${skin} choice"><div class="list"></div></div>`);
        if (pos === 'top') chooser.style.bottom = 'auto', (chooser.style.top = `${box.offsetHeight + 24}px`);
        else chooser.style.bottom = `${box.offsetHeight + 22}px`;
        ui.append(chooser);
        ctl = listCtl(chooser.querySelector('.list'), choices.map((c) => (typeof c === 'string' ? { label: c } : c)), { onPick: (_, k, dis) => !dis && finish(k), onCancel: () => finish(cancel ?? choices.length - 1) });
      } else if (auto) g.later(() => finish(null), auto);
    }
    function finish(v) { if (closed) return; closed = true; clearInterval(timer); pop(); box.remove(); chooser?.remove(); g.lock(false); res(v); }
    function advance() { if (!done) return reveal(); if (!choices) finish(null); }
    box.addEventListener('click', advance);
    const pop = g.pushKeys((e) => { if (ctl && done) return ctl.key(e); if (isOk(e) || e.code === 'Escape' || e.code === 'KeyX') advance(); return true; });
  });
}

function registerForm(g, t, skin) {

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%">
        <label style="display:grid;gap:2px;font-size:12px">스타트업 이름<input id="rf-name" maxlength="14" autocomplete="off" style="font:inherit;font-size:15px;padding:4px 6px;border:2px solid currentColor;border-radius:3px;background:rgba(255,255,255,.92);color:#282828"></label>
        <label style="display:grid;gap:2px;font-size:12px">티커(영문 3~4자)<input id="rf-ticker" maxlength="4" autocomplete="off" style="font:inherit;font-family:var(--mono);font-size:15px;padding:4px 6px;border:2px solid currentColor;border-radius:3px;background:rgba(255,255,255,.92);color:#282828;text-transform:uppercase"></label>

      <div style="display:flex;gap:8px;justify-content:flex-end;width:100%"><button type="button" class="ctl" data-x>나중에</button><button type="submit" class="ctl hi">설립 등기</button></div>
    </form>`);

      const m = checkName(name) || checkTicker(ticker, g.teams);
      if (m) { err.textContent = m; return; }
      done({ name, ticker, slogan: sl.value.trim() });
    });
  });
}

async function hqDialog(g, plot, skin = '') {
  const t = g.team(plot), mine = plot === g.state.myPlot;
  const head = t.name ? `「${t.name}」 ${t.ticker}` : `${t.plot}모둠 사옥`;

    } else await message(g, { skin, name: head, text: `${t.slogan ? `“${t.slogan}”\n` : ''}입주 ${t.members}/${t.cap} · 다른 모둠의 사옥이에요. 공개 정보(이름 · 티커)만 보여요.` });

    const c = await message(g, { skin, name: `${head} · 입주 ${t.members}/${t.cap}`, text: '이 사옥에 입사할까요?\n입사하면 이 사옥이 우리 모둠이 되고, 바꾸려면 선생님께 말해야 해요.', choices: ['입사하기', '다른 사옥 보기'] });

    if (!g.alive) return;
    dy.path = findPath(g, { c: dy.c, r: dy.r }, { c: 15, r: 20 }); dy.balloon = { kind: '!', at: g.time, dur: 1.4 };
    for (const n of g.npcs.slice(1, 4)) { n.script = true; n.path = findPath(g, { c: n.c, r: n.r }, { c: 12 + Math.floor(Math.random() * 6), r: 21 }); }
    await g.wait(700);
    const fl = el('<div class="flash"></div>'); ui.append(fl); g.later(() => fl.remove(), 600);

    this.confetti = Array.from({ length: 70 }, () => ({ x: 14 * TILE + 16 + (Math.random() - 0.5) * 60, y: 17 * TILE, vx: (Math.random() - 0.5) * 140, vy: -80 - Math.random() * 160, c: INKS[Math.floor(Math.random() * 8)], life: 2.4 }));
    await stampFx(g, '새벽바이오 SBIO');
    if (!g.alive) return;
    const get = el(`<div class="win" style="left:50%;top:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap;max-width:calc(100% - 16px)"><canvas style="width:32px;height:48px;image-rendering:pixelated"></canvas><span>「새벽바이오」 <b style="color:#ffe27a">SBIO</b> 간판을 달았다!</span></div>`);
    const cv = get.querySelector('canvas'); const f = F['building/owner-team-3'] || F['building/owner-team-1']; cv.width = f[2]; cv.height = f[3]; cv.getContext('2d').drawImage(ATLAS, f[0], f[1], f[2], f[3], 0, 0, f[2], f[3]);

    g.camOverride = { x: g.me.x, y: g.me.y - 24 }; this.pan = { to: { x: LED.col0 * TILE + 96, y: LED.row0 * TILE + 40 } };
    await g.wait(900);
    if (!g.alive) return;
    await message(g, { pos: 'bottom', name: '광장 전광판', text: '새벽바이오 SBIO 설립 등기 — 학급 모두에게 소식이 갔어요.', auto: 1800 });
    this.pan = { to: { x: g.me.x, y: g.me.y - 24 } };

  frame(g, dt) {
    if (this.pan && g.camOverride) { g.camOverride.x += (this.pan.to.x - g.camOverride.x) * Math.min(1, dt * 4); g.camOverride.y += (this.pan.to.y - g.camOverride.y) * Math.min(1, dt * 4); }

    phrases.forEach(([t, k]) => { const b = el(`<button type="button">${esc(t)}</button>`); b.addEventListener('click', () => this.say(g, g.me, t, k)); bar.append(b); });

    roster.innerHTML = '<h4 style="color:#c6ff4a">접속 7명</h4>' + Object.entries(byTeam).sort().map(([p, names]) => { const t = g.team(+p); return `<p><i class="dot" style="background:${t ? INKS[t.ink - 1] : '#606060'}"></i>${esc(t ? t.name || `${t.plot}모둠` : '입사 전')} · ${esc(names.join(', '))}</p>`; }).join('');
    this.next = 1.2;

VARIANTS.push({
  id: 'v10', title: '퀘스트 · 미니맵 · 길 안내', skin: 'paper',
  concept: '왼쪽 위 퀘스트 창이 지구에서 할 일을 순서대로 보여 주고, 지금 할 일까지 바닥에 점선 길이 깔려요. 화면 밖이면 가장자리 화살표가 방향을 가리켜요. 오른쪽 위 미니맵에는 친구들과 사옥이 점으로. 창은 지구의 종이 팻말과 같은 모양이에요.',
  take: ['지금 위 띠의 안내 문장(d-help)을 퀘스트 4줄로 — 한 줄만 노랗게', '처음 들어온 학생에게 ‘우리 사옥까지 14칸’ 점선 — 길을 헤매지 않는다', '미니맵은 Phaser 미니 카메라 하나로 만들 수 있다(새 그림 없음)'],
  setup(g) {
    this.q = el('<div class="win paper quest"></div>');
    this.mini = el('<div class="win paper mini"><canvas width="160" height="104"></canvas><p></p></div>');
    ui.append(this.q, this.mini);
    this.path = []; this.recalc(g); this.drawQuest(g);
    g.banner('사옥 지구', '점선을 따라 우리 사옥으로');
  },
  steps(g) {
    const t = g.myTeam(), atDoor = g.near === t.plot;
    return [
      { label: '캐릭터 고르기 — CSO', done: true },
      { label: '입사할 사옥 고르기 — 3모둠', done: true },
      { label: t.name ? `등기 — 「${t.name}」 ${t.ticker}` : atDoor ? '문 앞이에요 — E 로 등기' : '우리 사옥으로 가서 스타트업 이름 등기', done: !!t.name },
      { label: t.name ? '사옥에 들어가기 — 작업 화면' : '작업 화면(③)으로', done: false },
    ];
  },
  drawQuest(g) {
    const st = this.steps(g); const now = st.findIndex((s) => !s.done);
    this.q.innerHTML = `<h4>사옥 지구 — 할 일</h4><ol>${st.map((s, i) => `<li class="${s.done ? 'done' : i === now ? 'now' : ''}"><i>${s.done ? '✓' : i === now ? '▶' : '·'}</i><span>${esc(s.label)}</span></li>`).join('')}</ol>`;
    this.q.querySelector('.now')?.style.setProperty('color', '#b82010');
  },
  recalc(g) {
    const s = PLOTS[g.state.myPlot - 1];
    this.path = findPath(g, { c: g.me.c, r: g.me.r }, { c: s.doorCol, r: s.doorRow });
    this.mini.querySelector('p').textContent = this.path.length ? `우리 사옥까지 ${this.path.length}칸` : '우리 사옥 문 앞';
  },
  stepped(g) { this.recalc(g); this.drawQuest(g); },
  near(g) { this.drawQuest(g); },
  registered(g) { this.drawQuest(g); g.banner('퀘스트 완료', '설립 등기'); },
  drawOver(c, g) {
    const off = Math.floor(g.time * 6) % 2;
    this.path.forEach((p, i) => { if ((i + off) % 2) return; c.fillStyle = '#282828'; c.fillRect(p.c * TILE + 12, p.r * TILE + 12, 8, 8); c.fillStyle = '#c6ff4a'; c.fillRect(p.c * TILE + 13, p.r * TILE + 13, 6, 6); });
    const s = PLOTS[g.state.myPlot - 1];
    const bob = Math.round(Math.sin(g.time * 5) * 3);
    c.fillStyle = '#282828'; c.beginPath(); c.moveTo(s.doorCol * TILE + 6, s.doorRow * TILE - 18 + bob); c.lineTo(s.doorCol * TILE + 26, s.doorRow * TILE - 18 + bob); c.lineTo(s.doorCol * TILE + 16, s.doorRow * TILE - 6 + bob); c.fill();
    c.fillStyle = '#c6ff4a'; c.beginPath(); c.moveTo(s.doorCol * TILE + 9, s.doorRow * TILE - 16 + bob); c.lineTo(s.doorCol * TILE + 23, s.doorRow * TILE - 16 + bob); c.lineTo(s.doorCol * TILE + 16, s.doorRow * TILE - 8 + bob); c.fill();
  },
  drawScreen(c, g, w, h) {
    const s = PLOTS[g.state.myPlot - 1], p = g.toScreen(s.doorCol * TILE + 16, s.doorRow * TILE + 16);
    if (p.x < 20 || p.x > w - 20 || p.y < 20 || p.y > h - 20) {
      const cx = w / 2, cy = h / 2, a = Math.atan2(p.y - cy, p.x - cx);
      const m = 36, ex = Math.max(m, Math.min(w - m, cx + Math.cos(a) * w)), ey = Math.max(m + 70, Math.min(h - m, cy + Math.sin(a) * h));
      c.save(); c.translate(ex, ey); c.rotate(a);
      c.fillStyle = '#282828'; c.beginPath(); c.moveTo(16, 0); c.lineTo(-10, -13); c.lineTo(-10, 13); c.fill();
      c.fillStyle = '#c6ff4a'; c.beginPath(); c.moveTo(11, 0); c.lineTo(-7, -9); c.lineTo(-7, 9); c.fill();
      c.restore();
    }
    const mc = this.mini.querySelector('canvas').getContext('2d'); mc.imageSmoothingEnabled = false;
    mc.drawImage(g.ground, 0, 0, 160, 104);
    for (const t of g.teams) { const q = PLOTS[t.plot - 1]; mc.fillStyle = '#282828'; mc.fillRect(q.col0 * 4 - 1, q.row0 * 4 - 1, 14, 14); mc.fillStyle = INKS[t.ink - 1]; mc.fillRect(q.col0 * 4, q.row0 * 4, 12, 12); }
    for (const n of g.npcs) { mc.fillStyle = '#F8F8F0'; mc.fillRect(Math.round(n.x / 8) - 1, Math.round(n.y / 8) - 2, 3, 3); }
    mc.fillStyle = Math.floor(g.time * 3) % 2 ? '#c6ff4a' : '#282828'; mc.fillRect(Math.round(g.me.x / 8) - 2, Math.round(g.me.y / 8) - 3, 5, 5);
    mc.strokeStyle = 'rgba(40,40,40,.8)'; mc.lineWidth = 1; mc.strokeRect(g.cam.x / 8 + 0.5, g.cam.y / 8 + 0.5, g.cam.w / 8, g.cam.h / 8);
  },
});

/* ================= 탭 · 전환 ================= */
const tabs = document.getElementById('tabs');
VARIANTS.forEach((v, i) => {
  const b = el(`<button type="button" role="tab" id="tab-${v.id}" aria-selected="false"><b>${String(i + 1).padStart(2, '0')}</b>${esc(v.title)}</button>`);
  b.addEventListener('click', () => { start(i); try { history.replaceState(null, '', `#${v.id}`); } catch {} });
  tabs.append(b);
});
function start(i) {
  if (G) { G.alive = false; for (const t of G.timers) clearTimeout(t); }
  V?.unmount?.(G);
  ui.innerHTML = ''; promptEl = null; held.length = 0; stage.classList.remove('shake');
  V = VARIANTS[i];
  for (const k of ['open', 'confetti', 'pan', 'sprites']) delete V[k];
  G = makeGame(V);
  bakeGround(G);
  tabs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i)));
  tabs.children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  document.getElementById('v-no').textContent = `시안 ${String(i + 1).padStart(2, '0')} / 10`;
  document.getElementById('v-title').textContent = V.title;
  document.getElementById('v-concept').textContent = V.concept;
  document.getElementById('v-take').innerHTML = V.take.map((t) => `<li>${esc(t)}</li>`).join('');
  try { localStorage.setItem('district-rpg-tab', String(i)); } catch {}
  V.setup?.(G);
  updatePrompt();
}
function boot() {
  resize();
  const fromHash = VARIANTS.findIndex((v) => `#${v.id}` === location.hash);
  let saved = 0; try { saved = +(localStorage.getItem('district-rpg-tab') || 0); } catch {}
  start(fromHash >= 0 ? fromHash : Number.isFinite(saved) && saved < VARIANTS.length ? saved : 0);
  requestAnimationFrame(loop);
}
const fontsReady = document.fonts ? Promise.all([document.fonts.load('12px Galmuri11'), document.fonts.load('12px GalmuriMono11')]).catch(() => {}) : Promise.resolve();
Promise.all([new Promise((r) => (ATLAS.complete ? r() : (ATLAS.onload = r))), fontsReady]).then(boot);
})();
</script>

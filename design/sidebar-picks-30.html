<title>Crista 사이드바 3안 × 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 고른 세 시안(01 진행 레일 · 21 보드게임 길 · 28 묶음 박막 색)을 묶음별 구역으로 나누고, 구역마다 10가지 버전을 카드 격자로 놓는다.
     카드 안은 본문 바탕(--raise) 위 272px 사이드바 섬. 색 · 글꼴은 apps/web/src/styles.css 의 Crista 토큰. 앱처럼 밝은 박막 톤 하나로 고정한다. */
  :root {
    --bg: #f1f1e9; --surface: #fbfbf6; --raise: #e7e8de; --raise-2: #dcddd2; --fg: #080b09; --muted: #5b6358;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --hi: #c6ff4a; --hi-fg: #080b09; --hi-soft: rgba(198, 255, 74, 0.35);
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14);
    --night: #0b0d0a; --night-muted: #9da59a;
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-v: linear-gradient(180deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-1: #ffd3ea; --film-2: #cdeaff; --film-3: #e4ffc0; --film-4: #ffe2c2; --film-5: #e6d4ff;
    /* 묶음 색 — 박막 한 색씩(옅은 바탕) + 같은 색의 짙은 판(선 · 글자) */
    --t1: color-mix(in srgb, #ffd3ea 62%, #fbfbf6); --t2: color-mix(in srgb, #cdeaff 62%, #fbfbf6); --t3: color-mix(in srgb, #e4ffc0 70%, #fbfbf6); --t4: color-mix(in srgb, #ffe2c2 66%, #fbfbf6);
    --d1: #b0386f; --d2: #2a6aa0; --d3: #4a7d18; --d4: #a65c14;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--hi-fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .page { max-width: 1480px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  .hd { display: grid; gap: 10px; max-width: 760px; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--film); box-shadow: 0 0 0 1px var(--fg); }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; }
  h1 em { font-style: normal; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--fg); }
  .lede { margin: 0; color: var(--muted); max-width: 66ch; }
  .lede b { color: var(--fg); font-weight: 600; }

  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .jump { display: flex; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
  .jump .jg { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .jump .jg > span { font-size: 11.5px; font-weight: 700; margin-right: 4px; }
  .jump a { font-family: var(--mono); font-size: 11px; text-decoration: none; padding: 2px 6px; border-radius: 999px; color: var(--muted); border: 1px solid transparent; }
  .jump a:hover { border-color: var(--line-strong); color: var(--fg); }
  .jump a.on { background: var(--fg); color: var(--bg); }
  .picks { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
  .picks output { font-family: var(--mono); font-size: 12px; }
  .btn { appearance: none; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }

  .sec { display: grid; gap: 14px; scroll-margin-top: 64px; }
  .sec-h { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-top: 1px solid var(--line-strong); padding-top: 18px; }
  .sec-h h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  .sec-h h2 span { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-right: 8px; }
  .sec-h p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; align-items: start; }
  .card { background: var(--surface); border-radius: 22px; padding: 14px; display: grid; gap: 10px; min-width: 0; scroll-margin-top: 64px; border: 1px solid transparent; }
  .card.picked { border-color: var(--fg); box-shadow: 0 0 0 3px var(--hi); }
  .ch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
  .cn { font-family: var(--mono); font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--raise); white-space: nowrap; }
  .ct { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
  .why { grid-column: 2 / 4; margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .star { appearance: none; border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; font-size: 11.5px; padding: 2px 9px; white-space: nowrap; }
  .star[aria-pressed="true"] { background: var(--hi); border-color: var(--fg); font-weight: 700; }
  .stage { background: var(--raise); border-radius: 16px; padding: 14px; display: flex; gap: 12px; justify-content: center; align-items: flex-start; min-width: 0; overflow: hidden; }

  /* ── 사이드바 섬 — 지금 화면(styles.css)의 값 ── */
  .sb { background: var(--surface); border-radius: 26px; padding: 18px 12px; display: grid; gap: 14px; width: 272px; max-width: 100%; flex: none; align-content: start; }
  .side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 0 10px; }
  .groups { display: grid; gap: 16px; }
  .grp { display: grid; gap: 4px; min-width: 0; }
  .grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0; padding-left: 10px; font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .grp-h b { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); }
  .grp-h span { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; margin-left: auto; padding-right: 10px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .st { appearance: none; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; border-radius: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 8px; padding: 7px 10px; align-items: baseline; transition: background-color .18s ease; }
  .st:hover { background: var(--bg); }
  .st-n { font-family: var(--mono); font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .st-t { font-weight: 600; line-height: 1.35; min-width: 0; }
  .st-s { grid-column: 2 / 4; font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .st-k { font-family: var(--mono); font-size: 12px; }
  .st[aria-current="step"] { background: var(--hi); color: var(--hi-fg); }
  .st[aria-current="step"] .st-s { color: rgba(8, 11, 9, 0.66); }
  .st[data-state="locked"] { opacity: 0.55; }
  .st[data-state="locked"][aria-current="step"] { opacity: 1; }
  .side-foot { padding: 4px 10px 0; display: grid; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .side-team { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--fg); font-family: var(--sans); font-size: 12px; }
  .side-team .badge { font-family: var(--mono); font-size: 10px; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 999px; margin-left: 4px; color: var(--muted); }

  /* ════ 01 진행 레일 — 공통 ════ */
  .rl { --rx: 21px; --rw: 2px; --on: var(--fg); --off: var(--line); }
  .rl .groups { gap: 0; }
  .rl .grp { gap: 0; }
  .rl .grp-h { position: relative; padding: 10px 10px 4px 42px; }
  .rl .grp-h span { padding-right: 0; }
  .rl .grp-h::before, .rl li::before { content: ""; position: absolute; left: var(--rx); top: 0; bottom: 0; width: var(--rw); transform: translateX(-50%); background: var(--off); z-index: 1; }
  .rl .grp[data-g="1"] .grp-h::before { display: none; }
  .rl .grp-h[data-s="done"]::before { background: var(--on); }
  .rl .steps { gap: 0; }
  .rl li { position: relative; }
  .rl li[data-state="done"]::before { background: var(--on); }
  .rl li[data-state="running"]::before { background: linear-gradient(var(--on) 50%, transparent 50%), var(--off); }
  .rl li[data-i="0"]::before { top: 50%; }
  .rl li[data-i="8"]::before { bottom: 50%; }
  .rl .st { grid-template-columns: 22px 30px minmax(0, 1fr); align-items: center; }
  .rl .st-n { grid-column: 2; grid-row: 1; }
  .rl .st-t { grid-column: 3; grid-row: 1; }
  .rl .st-s { grid-column: 3; grid-row: 2; margin: 0; }
  .rl .nd { grid-column: 1; grid-row: 1 / 3; justify-self: center; position: relative; z-index: 2; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--on); background: var(--surface); }
  .rl .nd[data-s="done"] { background: var(--on); }
  .rl .nd[data-s="running"] { background: var(--hi); width: 14px; height: 14px; border-color: var(--fg); }
  .rl .nd[data-s="locked"] { border-style: dashed; border-color: var(--line-strong); }

  /* r2 지하철 노선도 */
  .r2 .grp { --on: var(--deep); --off: color-mix(in srgb, var(--deep) 22%, transparent); }
  .r2 .rl { --rw: 5px; }
  .r2 .grp-h { color: var(--deep); }
  .r2 .grp-h b { color: var(--deep); }
  .r2 .grp-h::after { content: ""; position: absolute; left: var(--rx); top: calc(50% + 3px); width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--fg); transform: translate(-50%, -50%); z-index: 2; }
  .r2 .grp[data-g="1"] .grp-h::after { display: none; }
  .r2 .nd { border-width: 3px; }
  .r2 .nd[data-s="locked"] { border-style: solid; border-color: color-mix(in srgb, var(--deep) 35%, var(--surface)); }
  .r2 .nd[data-s="running"] { border-color: var(--deep); }

  /* r3 진행 막대 노드 */
  .r3 .rl { --rw: 4px; }
  .r3 .nd { width: 14px; height: 14px; }
  .r3 .nd[data-s="running"] { width: 12px; height: 32px; border-radius: 6px; background: linear-gradient(var(--fg) var(--p), var(--surface) var(--p)); border-color: var(--fg); box-shadow: 0 0 0 3px var(--hi); }
  .r3 .st-s b { font-weight: 600; color: var(--fg); }

  /* r4 번호를 품은 역 */
  .r4 .rl { --rx: 25px; }
  .r4 .rl .grp-h { padding-left: 50px; }
  .r4 .st { grid-template-columns: 30px minmax(0, 1fr); }
  .r4 .st-t, .r4 .st-s { grid-column: 2; }
  .r4 .nd { width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
  .r4 .nd[data-s="done"] { color: var(--surface); }
  .r4 .nd[data-s="running"] { width: 30px; height: 30px; }
  .r4 .nd[data-s="locked"] { color: var(--muted); }
  .r4 .st[aria-current="step"] .nd { box-shadow: 0 0 0 3px var(--hi); }

  /* r5 오른쪽 레일 */
  .r5 .rl { --rx: calc(100% - 21px); }
  .r5 .rl .grp-h { padding: 10px 42px 4px 10px; }
  .r5 .st { grid-template-columns: 30px minmax(0, 1fr) 22px; }
  .r5 .st-n { grid-column: 1; } .r5 .st-t, .r5 .st-s { grid-column: 2; }
  .r5 .nd { grid-column: 3; }
  .r5 .st[aria-current="step"] { border-radius: 14px 0 0 14px; margin-right: -12px; width: calc(100% + 12px); padding-right: 22px; }

  /* r6 박막 레일 */
  .r6 .rl { --rw: 6px; --on: var(--fg); }
  .r6 li[data-state="done"]::before, .r6 .grp-h[data-s="done"]::before { background: var(--film-v); background-size: 100% 900%; background-position: 0 var(--bp, 0%); box-shadow: 0 0 0 1px var(--fg); }
  .r6 li[data-state="running"]::before { background: linear-gradient(transparent 50%, var(--off) 50%), var(--film-v); background-size: 100% 100%, 100% 900%; background-position: 0 0, 0 var(--bp); box-shadow: 0 -0.5px 0 1px var(--fg); }
  .r6 .nd[data-s="done"] { background: var(--film); border-color: var(--fg); }
  .r6 .nd { width: 14px; height: 14px; }

  /* r7 점선 미래 · 맥박 점 */
  .r7 .rl { --off: repeating-linear-gradient(var(--line-strong) 0 3px, transparent 3px 7px); }
  .r7 li[data-state="running"]::before { background: linear-gradient(var(--on) 50%, transparent 50%), repeating-linear-gradient(var(--line-strong) 0 3px, transparent 3px 7px); }
  .r7 .nd[data-s="locked"] { border: 2px dotted var(--line-strong); }
  .r7 .st[data-state="locked"] { opacity: 0.8; }
  .r7 .st[data-state="locked"] .st-t { font-weight: 500; color: var(--muted); }
  .r7 .nd[data-s="running"] { animation: beat 1.8s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { box-shadow: 0 0 0 0 rgba(198, 255, 74, 0.9), 0 0 0 0 var(--fg); } 50% { box-shadow: 0 0 0 5px rgba(198, 255, 74, 0.5), 0 0 0 6px rgba(8, 11, 9, 0.12); } }

  /* r8 세로 묶음 이름 */
  .r8 .grp { grid-template-columns: 24px minmax(0, 1fr); align-items: stretch; }
  .r8 .vl { writing-mode: vertical-rl; display: flex; align-items: center; justify-content: flex-start; gap: 6px; padding: 8px 0; border-right: 1.5px solid var(--fg); border-radius: 8px 0 0 8px; margin: 4px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .r8 .vl b { font-family: var(--mono); font-size: 10.5px; writing-mode: horizontal-tb; color: var(--muted); }
  .r8 .vl em { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--muted); writing-mode: horizontal-tb; margin-top: auto; }
  .r8 .grp[data-gs="lock"] .vl { border-right-style: dashed; border-color: var(--line-strong); color: var(--muted); }
  .r8 .groups { gap: 6px; }

  /* r9 게임 날짜 눈금 */
  .r9 .rl { --rx: 64px; }
  .r9 .rl .grp-h { padding-left: 82px; }
  .r9 .st { grid-template-columns: 38px 16px minmax(0, 1fr); }
  .r9 .dy { grid-column: 1; grid-row: 1 / 3; font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; white-space: nowrap; }
  .r9 .dy.run { color: var(--fg); font-weight: 600; }
  .r9 .nd { grid-column: 2; }
  .r9 .st-t { grid-column: 3; } .r9 .st-s { grid-column: 3; }
  .r9 .st-t small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-right: 5px; font-weight: 600; }
  .r9 .st[aria-current="step"] .st-t small, .r9 .st[aria-current="step"] .dy { color: var(--fg); }
  .r9 .today { margin: 0 10px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--raise); }

  /* r10 조밀 레일 */
  .r10 .st { padding: 4px 10px; }
  .r10 .st-s { display: none; }
  .r10 .st[aria-current="step"] { padding: 8px 10px; }
  .r10 .st[aria-current="step"] .st-s { display: block; }
  .r10 .nd { width: 9px; height: 9px; border-width: 1.5px; }
  .r10 .nd[data-s="running"] { width: 11px; height: 11px; }
  .r10 .rl .grp-h { padding-top: 6px; padding-bottom: 2px; font-size: 12px; }

  /* ════ 21 보드게임 길 — 공통 ════ */
  .bd { position: relative; width: 248px; max-width: 100%; }
  .bd > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .bd .bg { fill: none; stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 3 4; }
  .bd .fg { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .bd .fp { fill: none; stroke: var(--fg); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0 10; }
  .nb { position: absolute; appearance: none; border: 0; background: transparent; display: flex; gap: 8px; align-items: center; text-align: left; padding: 0 10px 0 0; border-radius: 999px; z-index: 1; }
  .nb .pin { flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; background: var(--surface); border: 2px solid var(--fg); }
  .nb[data-state="done"] .pin { background: var(--fg); color: var(--bg); }
  .nb[data-state="locked"] .pin { border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
  .nb[data-state="running"] .pin { background: var(--film); }
  .nb[aria-current="step"] { background: var(--hi); }
  .nb[aria-current="step"] .pin { box-shadow: 0 0 0 3px var(--hi); }
  .nb .lb { font-size: 12.5px; font-weight: 600; line-height: 1.25; display: grid; min-width: 0; }
  .nb .lb small { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--muted); }
  .nb[aria-current="step"] .lb small { color: rgba(8, 11, 9, 0.66); }
  .nb[data-state="locked"] .lb { color: var(--muted); }
  .nb[data-state="locked"][aria-current="step"] .lb { color: var(--fg); }
  .sign { position: absolute; right: 0; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--muted); background: var(--surface); padding: 0 4px; z-index: 1; }
  .p-note { margin: 0; padding: 0 10px; font-size: 11.5px; color: var(--muted); }
  .p-note b { color: var(--fg); }

  /* p3 징검다리 타일 */
  .p3 .nb { padding: 0; border-radius: 12px; }
  .p3 .nb .pin { border-radius: 12px; width: 100%; height: 100%; display: flex; gap: 6px; justify-content: flex-start; padding: 0 10px; font-family: var(--sans); font-size: 12px; font-weight: 600; text-align: left; line-height: 1.2; }
  .p3 .nb .pin b { font-family: var(--mono); font-size: 10.5px; flex: none; }
  .p3 .nb[data-state="done"] .pin { background: var(--fg); color: var(--bg); }
  .p3 .nb[aria-current="step"] .pin { background: var(--hi); color: var(--fg); border-color: var(--fg); box-shadow: none; }
  .p3 .nb[data-state="running"]:not([aria-current]) .pin { background: var(--film); }

  /* p4 말과 발자국 */
  .p4 .pawn { position: absolute; z-index: 3; width: 22px; height: 30px; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(8, 11, 9, 0.25)); }
  .p4 .pawn path, .p4 .pawn circle { fill: var(--fg); stroke: var(--hi); stroke-width: 1.5; }
  .p4 .nb[data-state="done"] .pin { background: var(--surface); color: var(--fg); }

  /* p5 묶음 섬과 다리 */
  .isles { display: grid; justify-items: start; }
  .isle { background: var(--tint); padding: 10px 12px 10px 10px; width: 210px; max-width: 100%; display: grid; gap: 4px; }
  .isle:nth-child(4n+1) { border-radius: 34px 44px 30px 48px; }

  .c1 .st:hover, .c10 .st:hover, .c3 .st:hover, .c4 .st:hover, .c5 .grp[data-on] .st:hover, .c8 .st:hover, .c9 .st:hover { background: rgba(255, 255, 255, 0.6); }
  .cc .st[aria-current="step"] { background: var(--fg); color: var(--bg); }
  .cc .st[aria-current="step"] .st-s { color: var(--night-muted); }

  /* c2 색 점과 번호 알약 */
  .c2 .grp-h::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tint); box-shadow: inset 0 0 0 2px var(--deep); align-self: center; }

  .c5 .groups { gap: 6px; }

  .c7 .grp[data-gs="lock"] { background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(var(--ang), var(--line-strong), var(--line)) border-box; }

  /* c8 큰 색 숫자 */
  .c8 .groups { gap: 6px; }

  .c8 .gh8 { display: flex; align-items: flex-end; gap: 8px; padding: 0 10px; margin: 0; }
  .c8 .gh8 b { font-size: 34px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.9; color: var(--deep); }
  .c8 .gh8 strong { font-size: 13px; padding-bottom: 2px; }
  .c8 .gh8 span { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); padding-bottom: 3px; }
  .c8 .st-n { color: var(--deep); }

  /* c9 빛나는 완료 */

  .c9 .grp[data-gs="run"] { background: linear-gradient(180deg, var(--tint), color-mix(in srgb, var(--tint) 30%, var(--surface))); }

  @keyframes flow { to { background-position: 300% 0; } }

  /* c10 본문 머리와 같은 색 */
  .head10 { flex: 1; min-width: 0; border-radius: 22px; background: var(--surface); padding: 14px; display: grid; gap: 10px; align-content: start; }
  .head10 .tagg { justify-self: start; font-family: var(--mono); font-size: 10.5px; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--fg); box-shadow: inset 0 0 0 1px var(--deep); }
  .head10 .hn { display: flex; gap: 10px; align-items: flex-end; }

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="filmGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd3ea"/><stop offset=".3" stop-color="#cdeaff"/><stop offset=".55" stop-color="#e4ffc0"/><stop offset=".8" stop-color="#ffe2c2"/><stop offset="1" stop-color="#e6d4ff"/></linearGradient></defs></svg>

<div class="page">
  <header class="hd">
    <p class="eyebrow">작업 화면 · 파이프라인 단계 섬 · 2차</p>
    <h1>고른 세 시안 <em>×10</em></h1>
    <p class="lede">앞 30종에서 고른 <b>01 진행 레일</b> · <b>21 보드게임 길</b> · <b>28 묶음마다 박막 한 색</b>을 각각 10가지로 펼쳤습니다. 견본 상황은 그대로입니다. 세움제약이 1.1~2.1을 마쳤고, 김하린 님이 2.2를 돌리는 중(62%)이며, 3.1부터 잠겨 있습니다. 단계를 눌러 보고, 마음에 드는 버전은 <b>고르기</b>로 표시하세요. 섞어 쓰고 싶은 조합(예: 레일 + 묶음 색)도 번호로 알려 주시면 됩니다.</p>
  </header>
  <div class="bar">
    <nav class="jump" id="jump" aria-label="버전 바로 가기"></nav>
    <div class="picks"><span>고른 버전</span><output id="picks">없음</output><button class="btn" type="button" id="copy">번호 복사</button></div>
  </div>
  <div id="secs" style="display:grid;gap:34px"></div>
</div>

<script>
const ST = [
  { id: '1.1', g: 1, t: '질환 · 표적 선정', meta: 'Open Targets 근거', state: 'done', s: 'EGFR · 비소세포폐암', day: 'D+4' },
  { id: '1.2', g: 1, t: '화합물 스크리닝', meta: 'ChEMBL · RDKit 깔때기', state: 'done', s: '후보 2,418 → 12', day: 'D+11' },
  { id: '2.1', g: 2, t: '분자 도킹', meta: 'AutoDock Vina · PLIP', state: 'done', s: '리드 3개 · −9.4 kcal/mol', day: 'D+19' },
  { id: '2.2', g: 2, t: 'ADMET 예측 · 특허 후보', meta: 'ADMET-AI v2', state: 'running', pct: 62, by: '김하린', day: 'D+23' },
  { id: '3.1', g: 3, t: '선언 · 물질특허', meta: 'RDKit 물성 · 서류 심사', state: 'locked', need: '2.2' },
  { id: '3.2', g: 3, t: '전임상 · 동물실험', meta: '윤리 심의 · 교육용 모의 판정', state: 'locked', need: '3.1' },
  { id: '3.3', g: 3, t: '제형 · IND 신청', meta: '서류 심사 · 교육용 모의 판정', state: 'locked', need: '3.2' },
  { id: '4.1', g: 4, t: '임상 1 · 2 · 3상', meta: '교육용 모의 판정', state: 'locked', need: '3.3' },
  { id: '4.2', g: 4, t: '최종 허가', meta: '규칙 · 서류 심사', state: 'locked', need: '4.1' },
];
const GT = { 1: '발견', 2: '최적화', 3: '개발 · 규제', 4: '임상 · 허가' };
const WORD = { done: '완료', running: '진행 중', ready: '할 수 있음', locked: '잠김' };
const MARK = { done: '✓', running: '▸', ready: '', locked: '🔒' };
const MEM = [{ n: '김하린', r: 'CSO' }, { n: '박서준', r: 'CEO' }, { n: '이도윤', r: 'CTO' }];
const TEAM = '세움제약';
const byId = (id) => ST.find((s) => s.id === id);
const inG = (g) => ST.filter((s) => s.g === g);
const doneOf = (g) => inG(g).filter((s) => s.state === 'done').length;
const gInfo = (g) => {
  const it = inG(g), d = doneOf(g), r = it.find((s) => s.state === 'running');
  return { p: Math.round(((d + (r ? r.pct / 100 : 0)) / it.length) * 100), gs: d === it.length ? 'done' : it.some((s) => s.state !== 'locked') ? 'run' : 'lock' };
};
const subTxt = (s) => (s.state === 'running' ? `${s.by} · ${s.pct}%` : s.state === 'locked' ? '잠김' : s.s ?? s.meta);
const cur = (s, st) => (s.id === st.cur ? ' aria-current="step"' : '');
const gStyle = (g) => `--tint:var(--t${g});--deep:var(--d${g});--p:${gInfo(g).p}%`;

function row(s, st, o = {}) {
  return `<button type="button" class="st" data-step="${s.id}" data-state="${s.state}"${cur(s, st)}>`
    + (o.lead ? o.lead(s, st) : `<span class="st-n">${s.id}</span>`)
    + `<span class="st-t">${o.title ? o.title(s, st) : s.t}</span>`
    + (o.noMark ? '' : `<span class="st-k" aria-label="${WORD[s.state]}">${o.mark ? o.mark(s, st) : MARK[s.state]}</span>`)
    + `<span class="st-s">${o.sub ? o.sub(s, st) : subTxt(s)}</span></button>`;
}
const list = (items, st, o) => `<ol class="steps">${items.map((s) => { const i = ST.indexOf(s); return `<li data-state="${s.state}" data-i="${i}" style="--bp:${i * 12.5}%">${row(s, st, o)}</li>`; }).join('')}</ol>`;
const grpWrap = (g, st, inner) => `<div class="grp" data-g="${g}" data-gs="${gInfo(g).gs}"${byId(st.cur).g === g ? ' data-on' : ''} style="${gStyle(g)}">${inner}</div>`;
const grpHead = (g, extra = '') => `<p class="grp-h"${extra}><b>${g}</b> ${GT[g]} <span data-p="${gInfo(g).p}%">${doneOf(g)}/${inG(g).length}</span></p>`;
const grp = (g, st, o = {}) => grpWrap(g, st, grpHead(g) + list(inG(g), st, o));
const foot = () => `<div class="side-foot"><div class="side-team">${MEM.map((m) => `<span><b>${m.n}</b><span class="badge">${m.r}</span></span>`).join('')}</div><span>3학년 2반 · 모둠 6개</span><span>계산 워커 실제 계산(compute)</span></div>`;
function side(st, o = {}) {
  return `<nav class="sb${o.cls ? ' ' + o.cls : ''}" aria-label="파이프라인 단계">${o.top ? o.top(st) : ''}<p class="side-h">${TEAM} · 신약 파이프라인</p>`
    + `${o.mid ? o.mid(st) : ''}<div class="groups">${[1, 2, 3, 4].map((g) => (o.group ? o.group(g, st) : grp(g, st, o))).join('')}</div>${o.after ? o.after(st) : ''}${o.foot === false ? '' : foot()}</nav>`;
}

/* ── 01 레일 — 묶음 머리 줄에도 선을 이어 그린다 ── */
const nd = (s, inner = '') => `<span class="nd" data-s="${s.state}" style="--p:${s.pct ?? 0}%">${inner}</span>`;
function rail(st, o = {}) {
  const ro = { noMark: true, lead: o.lead || ((s) => nd(s) + `<span class="st-n">${s.id}</span>`), sub: o.sub, title: o.title };
  return side(st, { cls: 'rl', mid: o.mid, group: o.group ? (g) => o.group(g, st, ro) : (g) => grpWrap(g, st, grpHead(g, ` data-s="${inG(g)[0].state === 'locked' ? 'locked' : 'done'}"`) + list(inG(g), st, ro)) });
}

/* ── 21 길 — 좌표를 받아 선 · 칸을 그린다 ── */
function smooth(p) {
  if (p.length < 2) return p.length ? `M${p[0][0]} ${p[0][1]}` : '';
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
const straight = (p) => p.map((q, i) => `${i ? 'L' : 'M'}${q[0]} ${q[1]}`).join(' ');
function board(st, o) {
  const pos = ST.map((s, i) => o.pos(i));
  const ri = ST.findIndex((s) => s.state === 'running');
  const line = o.curve ? smooth : straight;
  const nw = o.nw ?? 32, nh = o.nh ?? 32;
  const nodes = ST.map((s, i) => {
    const [x, y] = pos[i];
    const pin = o.pin ? o.pin(s, st) : s.state === 'running' && o.pct !== false ? `${s.pct}%` : s.id;
    const lb = o.label === false ? '' : `<span class="lb" style="max-width:${Math.max(60, 248 - x - nw / 2 - 18 - (o.rpad || 0))}px">${s.t}${s.id === st.cur && o.sub !== false ? `<small>${subTxt(s)}</small>` : ''}</span>`;
    return `<button type="button" class="nb" data-step="${s.id}" data-state="${s.state}"${cur(s, st)} style="left:${x - nw / 2}px;top:${y - nh / 2}px" aria-label="${s.id} ${s.t} · ${WORD[s.state]}" title="${s.id} ${s.t}"><span class="pin" style="width:${nw}px;height:${nh}px">${pin}</span>${lb}</button>`;
  }).join('');
  return `<div class="bd" style="height:${o.h}px">${o.bg || ''}<svg width="248" height="${o.h}" aria-hidden="true">${o.under || ''}<path class="bg" d="${line(pos)}"/><path class="${o.fgCls || 'fg'}" d="${line(pos.slice(0, ri + 1))}"/></svg>${nodes}${o.extra ? o.extra(pos, st) : ''}</div>`;
}
const signs = (H, off = 2) => [1, 2, 3, 4].map((g) => `<span class="sign" style="top:${ST.findIndex((s) => s.g === g) * H + off}px">${g} ${GT[g]}</span>`).join('');

const SECS = [
  { key: 'r', n: '01', short: '레일', name: '진행 레일', lede: '단계를 세로 선 하나로 잇고 지나온 구간을 칠하는 방향입니다. 선의 색 · 굵기 · 위치와 묶음을 나누는 방법을 바꿔 봤습니다.', items: [
    { name: '이어진 레일', why: '묶음 제목에서 끊기던 선을 처음부터 끝까지 한 줄로 잇습니다. 묶음 제목은 선 위의 역 이름처럼 읽힙니다.', html: (st) => rail(st) },
    { name: '지하철 노선도', why: '묶음마다 노선 색을 따로 주고, 묶음이 바뀌는 곳에 환승역 표시를 둡니다. 지나온 구간은 진하게, 남은 구간은 옅게 칠합니다.', html: (st) => rail(st) },
    { name: '진행 막대 노드', why: '진행 중인 단계의 점을 세로 막대로 바꿔 62%만큼 채웁니다. 레일도 4px로 굵혀 섬 안에서 줄기가 먼저 보입니다.', html: (st) => rail(st, { sub: (s) => (s.state === 'running' ? `<b>${s.pct}%</b> · ${s.by} 님이 예측 중` : subTxt(s)) }) },
    { name: '번호를 품은 역', why: '단계 번호를 원 안에 넣어 점과 번호를 하나로 합칩니다. 왼쪽 칸이 줄어 단계 이름이 한 줄에 더 들어갑니다.', html: (st) => rail(st, { lead: (s) => nd(s, s.id) }) },
    { name: '오른쪽 레일', why: '레일을 본문 쪽 가장자리로 옮깁니다. 단계 이름이 섬 왼쪽 끝에서 시작해 읽기 편하고, 고른 단계는 본문 쪽으로 튀어나와 이어집니다.', html: (st) => rail(st) },
    { name: '박막 레일', why: '지나온 구간을 박막 간섭색으로 칠합니다. 진행할수록 무지개가 아래로 자라서, 브랜드 색이 곧 진행 표시가 됩니다.', html: (st) => rail(st) },
    { name: '점선 미래 · 맥박 점', why: '남은 길은 점선, 지난 길은 실선으로 나누고 진행 중인 점이 천천히 맥박칩니다. 잠김을 흐림 대신 선 모양으로 보여 줍니다.', html: (st) => rail(st) },
    { name: '세로 묶음 이름', why: '묶음 제목을 레일 왼쪽에 세로 글자로 세우고 괄호로 묶습니다. 묶음 머리 줄이 빠져 9단계가 더 짧게 들어갑니다.', html: (st) => rail(st, { group: (g, st2, ro) => grpWrap(g, st2, `<div class="vl"><b>${g}</b>${GT[g]}<em>${doneOf(g)}/${inG(g).length}</em></div>${list(inG(g), st2, ro)}`) }) },
    { name: '게임 날짜 눈금', why: '레일 왼쪽에 단계를 끝낸 게임 날짜를 눈금처럼 적습니다. 레일이 그대로 시간축이 되어 오래 걸린 구간이 보입니다.', html: (st) => rail(st, { mid: () => '<div class="today"><span>오늘</span><b>D+31</b></div>', lead: (s) => `<span class="dy${s.state === 'running' ? ' run' : ''}">${s.state === 'done' ? s.day : s.state === 'running' ? s.day + '~' : ''}</span>` + nd(s), title: (s) => `<small>${s.id}</small>${s.t}` }) },
    { name: '조밀 레일', why: '단계마다 한 줄만 쓰고 보고 있는 단계만 둘째 줄을 펼칩니다. 레일 모양은 지키면서 섬 높이를 크게 줄입니다.', html: (st) => rail(st) },
  ] },
  { key: 'p', n: '21', short: '길', name: '보드게임 길', lede: '9단계를 길 위의 칸으로 놓는 방향입니다. 길의 모양(지그재그 · 곡선 · 산 · 트랙 · 판)과 모둠 위치를 보이는 방법을 바꿔 봤습니다.', items: [
    { name: '지그재그 길 다듬기', why: '21번을 다듬은 기본형입니다. 칸 간격을 고르게 하고, 보고 있는 칸에만 둘째 줄(결과 · 진행)을 붙입니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => board(st, { h: 9 * 50, pos: (i) => [[16, 50, 84, 50][i % 4], i * 50 + 25], extra: () => signs(50) }) }) },
    { name: 'S자 곡선 길', why: '꺾인 선 대신 부드러운 곡선 하나로 9칸을 꿰어 보드게임 판의 길처럼 보이게 합니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => board(st, { h: 9 * 50, curve: true, pos: (i) => [Math.round(52 + 36 * Math.sin(i * 1.05)), i * 50 + 25] }) }) },
    { name: '징검다리 타일', why: '원 대신 단계 이름이 들어간 납작한 타일을 좌우로 엇갈려 놓습니다. 이름이 칸 안에 있어 눈이 덜 오갑니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => board(st, { h: 9 * 46, nw: 150, nh: 36, label: false, pos: (i) => [i % 2 ? 171 : 77, i * 46 + 23], pin: (s) => `<b>${s.state === 'running' ? s.pct + '%' : s.id}</b>${s.t}` }) }) },
    { name: '말과 발자국', why: '모둠의 말이 진행 중인 칸 위에 서 있고, 지나온 길엔 발자국 점이 찍힙니다. 보고 있는 칸(라임)과 모둠이 서 있는 칸(말)이 따로 보입니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => board(st, { h: 9 * 50, fgCls: 'fp', pct: false, pos: (i) => [[16, 50, 84, 50][i % 4], i * 50 + 25], extra: (pos) => { const i = ST.findIndex((s) => s.state === 'running'); const [x, y] = pos[i]; return `<svg class="pawn" viewBox="0 0 22 30" style="left:${x - 11}px;top:${y - 38}px"><circle cx="11" cy="6" r="5"/><path d="M6 13h10l3 15H3z"/></svg>`; } }) }) },
    { name: '묶음 섬과 다리', why: '네 묶음을 각각 작은 섬으로 그리고 점선 다리로 잇습니다. 본문의 둥근 섬과 같은 모양 말투입니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => `<div class="isles">${[1, 2, 3, 4].map((g) => `<div class="isle" data-gs="${gInfo(g).gs}" style="${gStyle(g)}"><p class="ih"><b>${g}</b>${GT[g]}<span>${doneOf(g)}/${inG(g).length}</span></p>${inG(g).map((s) => `<button type="button" class="nb" data-step="${s.id}" data-state="${s.state}"${cur(s, st)} aria-label="${s.id} ${s.t} · ${WORD[s.state]}"><span class="pin">${s.state === 'running' ? s.pct + '%' : s.id}</span><span class="lb">${s.t}</span></button>`).join('')}</div>${g < 4 ? `<i class="bridge${gInfo(g + 1).gs === 'lock' ? ' lock' : ''}"></i>` : ''}`).join('')}</div>` }) },
    { name: '산길 오르기', why: '1.1이 산 아래, 4.2 허가가 정상입니다. 아래에서 위로 오르는 길이라 남은 높이가 한눈에 들어옵니다.', html: (st) => { const H = 46, h = 9 * H + 20; return side(st, { group: () => '', foot: false, mid: () => board(st, { h, pos: (i) => [[30, 70, 110, 70][i % 4], h - (i * H + 30)], under: `<path class="mtn" d="M0 ${h} L60 ${h * 0.42} L104 14 L160 ${h * 0.36} L248 ${h} Z"/><path class="snow" d="M86 ${14 + 30} L104 14 L124 ${14 + 34} L112 ${14 + 26} L100 ${14 + 36} Z"/>`, extra: (pos) => `<svg class="flag" width="22" height="30" style="left:${pos[8][0] - 2}px;top:${pos[8][1] - 44}px" aria-hidden="true"><line x1="3" y1="2" x2="3" y2="30"/><path d="M3 3h15l-4 5 4 5H3z"/></svg>` }) }); } },
    { name: '원형 트랙', why: '9칸을 둥근 트랙에 놓고 가운데에 보고 있는 단계를 크게 씁니다. 사이드바 머리에 두기 좋은 정사각형 판입니다.', html: (st) => { const c = byId(st.cur); const pos = (i) => { const a = (-90 + i * 36) * Math.PI / 180; return [Math.round(124 + 96 * Math.cos(a)), Math.round(122 + 96 * Math.sin(a))]; }; return side(st, { group: () => '', mid: () => board(st, { h: 248, label: false, pos, curve: true, extra: () => `<div class="ring-c"><b>${c.id}</b><span>${c.t}</span><small>${subTxt(c)}</small></div>` }) + `<div class="legend">${[1, 2, 3, 4].map((g) => `<span><b>${g}</b>${GT[g]} ${doneOf(g)}/${inG(g).length}</span>`).join('')}</div>` }); } },
    { name: '3×3 뱀 판', why: '9칸을 3×3 판에 뱀 순서로 놓습니다. 세 줄이 한눈에 들어와 폰에서도 모양 그대로 쓸 수 있습니다.', html: (st) => { const c = byId(st.cur); return side(st, { group: () => '', mid: () => board(st, { h: 236, nw: 76, nh: 62, label: false, pos: (i) => { const r = Math.floor(i / 3), k = i % 3, col = r % 2 ? 2 - k : k; return [40 + col * 84, 34 + r * 84]; }, pin: (s) => `<b>${s.id}${s.state === 'done' ? ' ✓' : s.state === 'running' ? ' ' + s.pct + '%' : ''}</b>${s.t}` }) + `<div class="detail"><b>${c.id} ${c.t}</b><span>${WORD[c.state]} · ${subTxt(c)}</span></div>` }); } },
    { name: '묶음 깃발', why: '묶음이 시작하는 칸마다 깃발을 세우고, 다 끝낸 묶음 깃발은 박막 색으로 칠합니다. 다음 깃발까지 몇 칸 남았는지 적습니다.', html: (st) => side(st, { group: () => '', foot: false, mid: () => '<p class="next">다음 깃발 <b>3 개발 · 규제</b>까지 1칸</p>' + board(st, { h: 9 * 50, rpad: 26, pos: (i) => [[16, 50, 84, 50][i % 4], i * 50 + 25], extra: (pos) => [1, 2, 3, 4].map((g) => { const i = ST.findIndex((s) => s.g === g); return `<span class="gflag" data-gs="${gInfo(g).gs}" style="top:${pos[i][1] - 14}px"><span>${GT[g]}</span><svg viewBox="0 0 18 22" aria-hidden="true"><line x1="2" y1="1" x2="2" y2="22"/><path d="M2 2h14l-3.5 4.5L16 11H2z"/></svg></span>`; }).join('') }) }) },
    { name: '미니 길 + 목록', why: '위에는 9칸 작은 길로 전체 위치만 보이고, 아래는 지금 목록을 그대로 둡니다. 놀이 느낌은 살리면서 읽기 쉬움은 지킵니다.', html: (st) => side(st, { mid: () => `<div class="mini">${board(st, { h: 44, nw: 16, nh: 16, label: false, pos: (i) => [12 + i * 28, i % 2 ? 32 : 12] })}</div>` }) },
  ] },
  { key: 'c', n: '28', short: '묶음 색', name: '묶음마다 박막 한 색', lede: '네 묶음에 박막 간섭색을 하나씩 주는 방향입니다. 색을 어디에(바탕 · 머리 · 테두리 · 번호) 얼마나 쓰는지를 바꿔 봤습니다. 보고 있는 단계는 모두 잉크로 뒤집습니다.', items: [
    { name: '박막 묶음 다듬기', why: '28번 기본형입니다. 색을 한 단계 옅게 하고 묶음 진행 숫자를 흰 알약에 넣었습니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '색 점과 번호 알약', why: '바탕은 흰 채로 두고 묶음 점과 단계 번호 알약에만 색을 씁니다. 가장 조용한 버전입니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '진행만큼 칠하기', why: '묶음 바탕을 그 묶음의 진행만큼 위에서부터 채웁니다. 다 끝난 묶음은 꽉 차고, 잠긴 묶음은 빈 점선 상자입니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '한 장의 박막', why: '섬 전체를 위에서 아래로 흐르는 박막 그라데이션으로 칠하고, 묶음은 가는 선으로만 나눕니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '지금 묶음만 색', why: '보고 있는 단계가 속한 묶음에만 색을 켭니다. 다른 묶음 단계를 누르면 색이 그쪽으로 옮겨 갑니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '색 머리띠', why: '묶음 제목 줄만 색 알약으로 칠하고 단계 줄은 흰 바탕에 둡니다. 색은 목차 머리 역할만 합니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '박막 테두리', why: '바탕 대신 묶음 테두리를 박막 그라데이션으로 두르고 묶음마다 결의 방향을 바꿉니다. 잠긴 묶음은 회색 테두리입니다.', html: (st) => side(st, { cls: 'cc', group: (g) => grp(g, st).replace('style="', `style="--ang:${[115, 205, 25, 295][g - 1]}deg;`) }) },
    { name: '큰 색 숫자', why: '묶음 번호를 크게, 그 묶음의 짙은 색으로 씁니다. 1~4가 사이드바의 큰 눈금이 됩니다.', html: (st) => side(st, { cls: 'cc', group: (g) => grpWrap(g, st, `<p class="gh8"><b>${g}</b><strong>${GT[g]}</strong><span>${doneOf(g)}/${inG(g).length}</span></p>${list(inG(g), st, {})}`) }) },
    { name: '빛나는 완료', why: '다 끝낸 묶음은 박막이 천천히 흐르고, 진행 중인 묶음은 옅게, 잠긴 묶음은 무광 회색으로 둡니다. 끝낸 일이 보상처럼 빛납니다.', html: (st) => side(st, { cls: 'cc' }) },
    { name: '본문 머리와 같은 색', why: '묶음 색을 본문 머리 섬에도 그대로 씁니다. 단계를 눌러 보면 오른쪽 머리 섬 색이 함께 바뀝니다.', html: (st) => { const c = byId(st.cur); return side(st, { cls: 'cc' }) + `<div class="head10" aria-hidden="true" style="${gStyle(c.g)}"><span class="tagg">${c.g} ${GT[c.g]}</span><div class="hn"><b>${c.id}</b><span>${c.t}</span></div><div class="band"></div><i style="width:80%"></i><i style="width:60%"></i></div>`; } },
  ] },
];

const V = [];
SECS.forEach((sec) => sec.items.forEach((it, i) => V.push({ ...it, id: `${sec.key}${i + 1}`, n: `${sec.n}-${i + 1}`, sec })));
const state = Object.fromEntries(V.map((v) => [v.id, { cur: '2.2' }]));
const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let picks = store.get('crista-sb-picks-2') || [];

document.getElementById('secs').innerHTML = SECS.map((sec) => `<section class="sec" id="s${sec.n}" aria-labelledby="h${sec.n}"><div class="sec-h"><h2 id="h${sec.n}"><span>${sec.n}</span>${sec.name}</h2><p>${sec.lede}</p></div><div class="grid">${V.filter((v) => v.sec === sec).map((v) => `<article class="card ${v.id}" id="${v.id}"><div class="ch"><span class="cn">${v.n}</span><h3 class="ct">${v.name}</h3><button type="button" class="star" data-pick="${v.n}" aria-pressed="false">고르기</button><p class="why">${v.why}</p></div><div class="stage"></div></article>`).join('')}</div></section>`).join('');
document.getElementById('jump').innerHTML = SECS.map((sec) => `<span class="jg"><span>${sec.n} ${sec.short}</span>${V.filter((v) => v.sec === sec).map((v) => `<a href="#${v.id}" title="${v.name}" data-j="${v.n}">${v.n.split('-')[1]}</a>`).join('')}</span>`).join('');

function paint(id) {
  const v = V.find((x) => x.id === id);
  const stage = document.getElementById(id).querySelector('.stage');
  const had = stage.contains(document.activeElement) ? document.activeElement.dataset.step : null;
  stage.innerHTML = v.html(state[id]);
  if (had) stage.querySelector(`[data-step="${had}"]`)?.focus();
}
V.forEach((v) => paint(v.id));

function showPicks() {
  document.querySelectorAll('[data-pick]').forEach((b) => { const on = picks.includes(b.dataset.pick); b.setAttribute('aria-pressed', on); b.textContent = on ? '골랐음' : '고르기'; b.closest('.card').classList.toggle('picked', on); });
  document.querySelectorAll('[data-j]').forEach((a) => a.classList.toggle('on', picks.includes(a.dataset.j)));
  document.getElementById('picks').textContent = picks.length ? picks.join(', ') : '없음';
}
showPicks();

document.getElementById('secs').addEventListener('click', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const pick = e.target.closest('[data-pick]');
  if (pick) { const n = pick.dataset.pick; picks = picks.includes(n) ? picks.filter((x) => x !== n) : [...picks, n]; picks.sort(); store.set('crista-sb-picks-2', picks); showPicks(); return; }
  const step = e.target.closest('[data-step]');
  if (step) { state[card.id].cur = step.dataset.step; paint(card.id); }
});

document.getElementById('copy').addEventListener('click', async (e) => {
  const text = picks.length ? `사이드바 ${picks.join(', ')} 버전으로 가자` : '사이드바 버전을 아직 고르지 않았어요';
  const out = document.getElementById('picks');
  try { await navigator.clipboard.writeText(text); e.target.textContent = '복사됨'; setTimeout(() => (e.target.textContent = '번호 복사'), 1400); }
  catch { out.textContent = text; const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
</script>

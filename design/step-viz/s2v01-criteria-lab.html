<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기준 설계실</title>
<meta name="description" content="Crista 단계 시각화 1.2 화합물 스크리닝 — 시안 01 기준 설계실(단독 파일). 원본: design/step-viz/index.html#s2v01">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* 레이아웃: 전광판 01 화면(위 띠 · LED 띠 · 왼쪽 4묶음 사이드바 1.1~4.2) 그대로, 오른쪽 작업 영역에 '그 단계의 시각화 시안'을 띄운다.
     아래 검은 띠는 시안 고르기 도구. 색은 Crista 브랜드(잉크 · 페이퍼 · 라임) + 05 박막 간섭색, 모서리는 각지게.
     01 화면이 밝은 박막 톤 하나로 정해져 있어 이 시안집도 그 한 가지 모습으로 고정한다(어두운 곳은 LED 띠와 도구 띠뿐). */
  :root {
    --paper: #f1f1e9; --surface: #f8f8f2; --raise: #e7e8de; --ink: #080b09; --muted: #5b6358;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --hi: #c6ff4a; --led: #ffb21a; --led-r: #ff5a3c; --led-g: #8dff5a; --night: #0b0d0a; --night-2: #151a14; --night-fg: #f1f1e9; --night-muted: #9da59a;
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14); --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11);
    --me: #183080; --seum: #007868; --daon: #a048c8; --mirp: #d88828;
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-1: #ffd3ea; --film-2: #cdeaff; --film-3: #e4ffc0; --film-4: #ffe2c2; --film-5: #e6d4ff;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
    --side-w: 272px;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .ui-page { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }

  /* ── 위 띠 ── */
  .ui-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line-strong); background: var(--paper); }
  .ui-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.03em; font-size: 17px; }
  .ui-brand svg { width: 20px; height: 20px; }
  .ui-brand small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-co { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--line); font-weight: 600; }
  .ui-co .ui-tick { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 2px 6px; border: 1px solid var(--line-strong); font-weight: 500; }
  .top-r { margin-left: auto; display: flex; gap: 18px; align-items: center; }
  .ui-kv { display: grid; line-height: 1.2; }
  .ui-kv span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-kv b { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── LED 흐르는 띠(전광판 01) ── */
  .ui-board { display: flex; align-items: stretch; background: var(--night); color: var(--night-fg); border-bottom: 1px solid var(--line-strong); min-width: 0; }
  .ui-bd-in { flex: 1; min-width: 0; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
  .ui-mq-track { display: flex; width: max-content; animation: mq 46s linear infinite; }
  .ui-board:hover .ui-mq-track { animation-play-state: paused; }
  .ui-mq-seg { display: flex; align-items: center; gap: 34px; padding-right: 34px; }
  .ui-led { font-family: var(--mono); font-weight: 600; letter-spacing: 0.06em; font-size: 19px; white-space: nowrap; color: var(--led); text-shadow: 0 0 8px rgba(255, 178, 26, 0.55);
    -webkit-mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); -webkit-mask-size: 3px 3px; mask-image: radial-gradient(circle, #000 0.95px, transparent 1.3px); mask-size: 3px 3px; }
  .ui-led.r { color: var(--led-r); text-shadow: 0 0 8px rgba(255, 90, 60, 0.55); }
  .ui-led.g { color: var(--led-g); text-shadow: 0 0 8px rgba(141, 255, 90, 0.5); }
  .ui-bd-ctl { flex: none; display: flex; align-items: center; gap: 6px; padding-block: 6px; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-left: 1px solid rgba(241, 241, 233, 0.16); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--night-muted); text-transform: uppercase; }
  .ui-bd-ctl i { width: 7px; height: 7px; background: var(--led-r); border-radius: 50%; animation: blink 1.4s steps(2) infinite; }
  @keyframes mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ── 본문: 사이드바 + 작업 영역 ── */
  .ui-shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 0; }
  .ui-side { overflow: auto; border-right: 1px solid var(--line-strong); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 4px; }
  .ui-side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .ui-grp { display: grid; gap: 2px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ui-grp:last-of-type { border-bottom: 0; }
  .ui-grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; }
  .ui-grp-h b { font-family: var(--mono); font-size: 0.9em; }
  .ui-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .ui-st { appearance: none; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; border-radius: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); column-gap: 8px; padding: 8px 8px 8px 14px; }
  .ui-st:hover { background: rgba(128, 128, 128, 0.1); }
  .ui-st-n { font-family: var(--mono); font-weight: 600; font-size: 12px; grid-row: span 2; line-height: 1.6; }
  .ui-st-t { font-weight: 600; line-height: 1.35; }
  .ui-st-s { font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .ui-st[aria-current="step"] { background: var(--film); }
  .ui-side-foot { margin-top: auto; padding-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: grid; gap: 6px; }
  .ui-side-foot b { color: var(--ink); font-weight: 600; }

  .ui-main { overflow: auto; min-width: 0; }
  .ui-wrap { max-width: 1240px; padding-block: 24px 48px; padding-left: 30px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
  .ui-sh { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: start; }
  .ui-sh-n { font-size: 64px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.82; grid-row: span 3; padding-top: 4px; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--ink); }
  .ui-eyebrow { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ui-sh h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.035em; text-wrap: balance; }
  .ui-q { margin: 2px 0 0; font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

  /* 시안 고르기 탭 01~10 */
  .ui-vtabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0; border: 1px solid var(--line-strong); background: var(--surface); }
  .ui-vt { appearance: none; border: 0; box-shadow: inset -1px -1px 0 var(--line); background: transparent; border-radius: 0; padding: 8px 10px; display: grid; gap: 1px; text-align: left; min-width: 0; }
  .ui-vt span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
  .ui-vt b { font-size: 12.5px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
  .ui-vt:hover { background: rgba(128, 128, 128, 0.08); }
  .ui-vt[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ui-vt[aria-pressed="true"] span { color: var(--hi); }
  .ui-vt.ui-all { box-shadow: inset 1px 0 0 var(--line-strong), inset 0 -1px 0 var(--line); }

  /* 시안 한 장 */
  .ui-card { border: 1px solid var(--line-strong); background: var(--surface); min-width: 0; display: grid; }
  .ui-card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ui-card-h .ui-no { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; background: var(--ink); color: var(--hi); }
  .ui-card-h h2 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
  .ui-card-h .ui-kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .ui-card-h .ui-idea { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; max-width: 80ch; }
  .ui-card-b { padding: 18px 16px; min-width: 0; overflow-x: auto; }
  .ui-card-f { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-top: 1px dashed var(--line-strong); font-size: 13px; }
  .ui-card-f b { flex: none; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; background: var(--hi); }
  .ui-grid-all { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .ui-grid-all .ui-card-h { cursor: pointer; }
  .ui-grid-all .ui-card-h:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
  .ui-grid-all .ui-card-b { padding: 14px 12px; }
  .ui-err { color: var(--bad); font-family: var(--mono); font-size: 12px; }

  /* ── 시안이 함께 쓰는 부품 ── */
  .vz { display: grid; gap: 14px; min-width: 0; font-size: 13px; }
  .vz-svg { display: block; width: 100%; height: auto; max-width: 100%; overflow: visible; font-family: var(--sans); }
  .vz-svg text { fill: var(--ink); }
  .vz-svg .t-m { font-family: var(--mono); }
  .vz-svg .t-mu { fill: var(--muted); }
  .vz-lab { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .vz-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .vz-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .vz-note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 72ch; }
  .vz-chip { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--line-strong); white-space: nowrap; }
  .vz-sig { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 7px; white-space: nowrap; }
  .vz-sig.good { color: var(--good); background: var(--good-bg); }
  .vz-sig.warn { color: var(--warn); background: var(--warn-bg); }
  .vz-sig.bad { color: var(--bad); background: var(--bad-bg); }
  .vz-btn { appearance: none; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 0; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
  .vz-btn:hover { border-color: var(--ink); }
  .vz-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .vz-rng { width: 100%; accent-color: var(--ink); }
  .molbox { width: 100%; max-width: 100%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; overflow: hidden; }
  .molbox .mol { display: block; width: 100%; height: 100%; }
  .molbox .fallback { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding: 8px; word-break: break-all; }

  /* ── 아래 도구 띠 ── */
  .ui-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--night); color: var(--night-fg); border-top: 1px solid rgba(241, 241, 233, 0.32);
    padding-top: 9px; padding-bottom: calc(9px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--mono); font-size: 11px; }
  .ui-tool-btn { background: transparent; color: var(--night-fg); border: 1px solid rgba(241, 241, 233, 0.32); padding: 6px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; border-radius: 0; }
  .ui-tool-btn:hover { border-color: var(--night-fg); }
  .ui-tools :focus-visible { outline-color: var(--hi); }
  .ui-pick-w { position: relative; flex: 0 1 300px; min-width: 0; }
  .ui-pick-w::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--night-muted); pointer-events: none; }
  #vpick { appearance: none; -webkit-appearance: none; width: 100%; padding: 6px 28px 6px 10px; border: 1px solid rgba(241, 241, 233, 0.32); border-radius: 0; background: transparent; color: var(--night-fg); font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; }
  #vpick option, #vpick optgroup { background: var(--night-2); color: var(--night-fg); }
  .ui-vcount { color: var(--night-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ui-keys { margin-left: auto; display: flex; gap: 12px; color: var(--night-muted); font-size: 10px; white-space: nowrap; }
  .ui-keys kbd { font-family: var(--mono); font-size: 10px; color: var(--night-fg); border: 1px solid rgba(241, 241, 233, 0.32); padding: 1px 5px; margin-right: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .ui-mq-track, .ui-bd-ctl i { animation: none !important; }
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
  @media (max-width: 1100px) { .ui-grid-all { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) {
    .ui-shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .ui-side { border-right: 0; border-bottom: 1px solid var(--line-strong); flex-direction: row; overflow-x: auto; padding-block: 8px; gap: 6px; }
    .ui-side-h, .ui-side-foot, .ui-grp-h, .ui-st-s { display: none; }
    .ui-grp { display: contents; }
    .ui-steps { display: flex; gap: 6px; }
    .ui-st { grid-template-columns: auto auto; white-space: nowrap; padding: 6px 10px; border: 1px solid var(--line); column-gap: 6px; }
    .ui-st-n { grid-row: auto; }
    .ui-wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-block: 16px 32px; }
    .ui-sh-n { font-size: 44px; }
    .ui-sh h1 { font-size: 22px; }
    .ui-q { font-size: 15px; }
    .top-r .ui-kv:not(.ui-cash) { display: none; }
    .ui-led { font-size: 16px; }
    .ui-keys { display: none; }
    .ui-vtabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #sprev, #snext, #vall { display: none; }
    .ui-pick-w { flex: 1 1 160px; }
  }

  /* 단독 파일: 사이드바 · 도구 띠 없이 작업 영역만 */
  .ui-page { grid-template-rows: auto auto minmax(0, 1fr); }
  .ui-main { overflow: auto; }
  .ui-wrap { margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 40 40">
      <path d="M31.5 7.5A15.5 15.5 0 1 0 31.5 32.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M27.2 12.2A10.7 10.7 0 1 0 27.2 27.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M22.8 16.8A6 6 0 1 0 22.8 23.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
<div class="ui-page">
  <header class="ui-top">
    <div class="ui-brand"><svg aria-hidden="true"><use href="#mark"></use></svg>CRISTA <small>파이프라인 랩</small></div>
    <div class="ui-co"><span>크리스타바이오</span><span class="ui-tick">CRX</span></div>
    <div class="top-r">
      <div class="ui-kv"><span>예시 표적</span><b>ACHE · 4EY7</b></div>
      <div class="ui-kv"><span>게임 날짜</span><b>D+0</b></div>
      <div class="ui-kv ui-cash"><span>연구비</span><b id="kv-c"></b></div>
    </div>
  </header>
  <section class="ui-board" aria-label="학급 전광판 · 다른 모둠 소식">
    <div class="ui-bd-in"><div class="ui-mq-track" id="mq"></div></div>
    <div class="ui-bd-ctl"><i aria-hidden="true"></i>LIVE</div>
  </section>
  <main class="ui-main"><div class="ui-wrap" id="wrap"></div></main>

/* 단계 시각화 시안의 공통 바탕 — 규칙 · 예시 실행 · 그리기 도구.
   규칙 값은 pipeline-board-30-variants.html(= packages/game-rules 사본)에서 그대로 옮겼다.
   DOM 을 건드리지 않으므로 node 에서도 불러 시험할 수 있다(window 만 흉내 내면 된다). */
(function () {
  "use strict";
  const D = window.DD || { diseases: [], compounds: [], meta: {} };
  const CMP = new Map(D.compounds.map((c) => [c.id, c]));

  /* ── 글자 · 숫자 ── */
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const f1 = (v) => Number(v).toFixed(1);
  const f2 = (v) => Number(v).toFixed(2);
  const f3 = (v) => Number(v).toFixed(3);
  const MX = (v) => `$${v.toFixed(3)}M`;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  /* 선형 눈금: scale([d0, d1], [r0, r1])(v) */
  const scale = (dom, rng) => (v) => rng[0] + ((v - dom[0]) / (dom[1] - dom[0])) * (rng[1] - rng[0]);
  /* 받침에 맞춘 조사: josa("ACHE", "을", "를") */
  const josa = (w, a, b) => { const c = String(w).charCodeAt(String(w).length - 1) - 0xac00; return c >= 0 && c <= 11171 && c % 28 ? a : b; };
  /* 고정 씨앗 난수 — 미리보기가 열 때마다 같은 그림이 되도록 */
  const rng = (seed = 7) => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };

  /* ── 규칙(game-rules 사본) ── */
  const TARGETS = {
    "ache-4ey7": { gene: "ACHE", label: "아세틸콜린에스테라아제", pdb: "4EY7", disease: "알츠하이머병", ref: "도네페질", refSmiles: "COc1cc2c(cc1OC)C(=O)C(CC1CCN(Cc3ccccc3)CC1)C2", cns: true, refKcal: -11.84, rmsd: 0.82 },
    "egfr-1m17": { gene: "EGFR", label: "상피세포 성장인자 수용체", pdb: "1M17", disease: "비소세포폐암", ref: "엘로티닙", refSmiles: "C#Cc1cccc(Nc2ncnc3cc(OCCOC)c(OCCOC)cc23)c1", cns: false, refKcal: -7.24, rmsd: 1.33 },
    "dpp4-1x70": { gene: "DPP4", label: "디펩티딜 펩티다아제-4", pdb: "1X70", disease: "2형 당뇨병", ref: "시타글립틴", refSmiles: "NC(CC(=O)N1CCn2c(nnc2C(F)(F)F)C1)Cc1cc(F)c(F)cc1F", cns: false, refKcal: -9.02, rmsd: 0.8 },
    "cox2-3ln1": { gene: "PTGS2", label: "사이클로옥시게나아제-2", pdb: "3LN1", disease: "류마티스 관절염", ref: "세레콕시브", refSmiles: "Cc1ccc(-c2cc(C(F)(F)F)nn2-c2ccc(S(N)(=O)=O)cc2)cc1", cns: false, refKcal: -12.26, rmsd: 0.51 }
  };
  const TRIAL = {
    "ache-4ey7": { pops: ["경도 알츠하이머병 환자", "중등도~중증 알츠하이머병 환자", "경도인지장애(MCI) 환자"], eps: ["인지 기능 점수(ADAS-Cog) 변화", "일상 생활 기능(ADCS-ADL) 변화", "임상의 종합 평가(CIBIC-plus)"] },
    "egfr-1m17": { pops: ["EGFR 변이 양성 국소진행성 · 전이성 비소세포폐암 환자", "백금 기반 화학요법 후 재발 비소세포폐암 환자", "뇌전이를 동반한 EGFR 변이 비소세포폐암 환자"], eps: ["무진행 생존기간(PFS)", "객관적 반응률(ORR · RECIST 1.1)", "전체 생존기간(OS)"], brain: ["뇌전이를 동반한 EGFR 변이 비소세포폐암 환자"] },
    "dpp4-1x70": { pops: ["메트포르민 단독요법으로 혈당이 조절되지 않는 2형 당뇨병 환자", "신기능 저하를 동반한 2형 당뇨병 환자", "식이 · 운동요법 중인 초기 2형 당뇨병 환자"], eps: ["24주 시점 당화혈색소(HbA1c) 변화량", "공복 혈장 포도당(FPG) 변화량", "식후 2시간 혈당(PPG) 변화량"] },
    "cox2-3ln1": { pops: ["중등도~중증 활동성 류마티스 관절염 성인 환자", "기존 NSAID 위장관 부작용 위험군 관절염 환자", "급성 염증성 관절 통증 환자"], eps: ["ACR20 반응 달성률(24주)", "관절 통증 시각아날로그척도(VAS) 변화", "건강평가설문 장애지수(HAQ-DI) 변화"] }
  };
  const R = {
    cost: { htvs: 0.05, docking: 0.05, admet: 0.05, patent: 0.05, ind: 0.1, phase1: 0.3, phase2: 0.6, phase3: 1.2, final: 0.1 },
    days: { ind: 30, phase1: 90, phase2: 180, phase3: 360, final: 60 },
    absorption: { oral: { good: 1, moderate: 0.75, poor: 0.45 }, iv: 1, transdermal: { suitable: 0.85, unsuitable: 0.4 } },
    bbb: { high: 1, moderate: 0.7, low: 0.35 },
    doseE: { 10: 0.6, 50: 0.85, 100: 1 }, doseT: { 10: 10, 50: 30, 100: 55 },
    risk: { herg: { low: 0, moderate: 0.3, high: 0.6 }, hep: { low: 0, moderate: 0.25, high: 0.6 } },
    peak: { oral: 1, iv: 1.25, transdermal: 0.75 },
    th: { ind: { e: null, s: 35 }, phase1: { e: null, s: 50 }, phase2: { e: 40, s: null }, phase3: { e: 45, s: 55 } },
    noise: { phase1: 6, phase2: 6, phase3: 4 },
    approvalMult: { oral: 1.3, iv: 1, transdermal: 1.15 },
    startCash: 6
  };
  const FORM = { oral: "경구용 정제 · 캡슐", iv: "정맥주사제", transdermal: "경피 패치 · 비강 스프레이" };
  const FORM_SHORT = { oral: "경구", iv: "정맥주사", transdermal: "경피" };
  const ALERT = { aromatic_amine: "방향족 아민", nitro_aromatic: "방향족 니트로" };
  const LV = { good: "좋음", moderate: "보통", poor: "나쁨", high: "높음", low: "낮음", suitable: "적합", unsuitable: "부적합" };

  function signals(p) {
    const v = (p.mw > 500) + (p.logp > 5) + (p.hbd > 5) + (p.hba > 10);
    const oral = v === 0 && p.tpsa <= 140 && p.rotb <= 10 ? "good" : v <= 1 && p.tpsa <= 140 ? "moderate" : "poor";
    const bbb = p.tpsa <= 90 && p.mw <= 450 && p.hbd <= 3 ? "high" : p.tpsa <= 120 && p.mw <= 500 ? "moderate" : "low";
    const herg = p.ba > 0 && p.logp >= 3.7 ? "high" : p.ba > 0 && p.logp >= 2.5 ? "moderate" : "low";
    const hep = p.al.length ? "high" : p.logp > 3 && p.tpsa < 75 ? "moderate" : "low";
    const td = p.mw <= 500 && p.logp >= 1 && p.logp <= 4 ? "suitable" : "unsuitable";
    return { ro5: v, oral, bbb, herg, hep, td };
  }
  function notes(p, s) {
    return {
      ro5: `Ro5 위반 ${s.ro5} — MW ${p.mw.toFixed(1)} · cLogP ${f2(p.logp)} · HBD ${p.hbd} · HBA ${p.hba}`,
      oral: `경구 흡수 ${LV[s.oral]} — TPSA ${p.tpsa.toFixed(1)} · RotB ${p.rotb} · Ro5 위반 ${s.ro5}`,
      bbb: `뇌 노출 ${LV[s.bbb]} — TPSA ${p.tpsa.toFixed(1)} · MW ${p.mw.toFixed(1)} · HBD ${p.hbd}`,
      herg: p.ba === 0 ? "hERG 위험 낮음 — 염기성 아민 없음" : `hERG 위험 ${LV[s.herg]} — 염기성 아민 ${p.ba} · cLogP ${f2(p.logp)}`,
      hep: s.hep === "high" ? `간독성 위험 높음 — 구조 경고(${p.al.map((a) => ALERT[a] || a).join(" · ")})` : `간독성 위험 ${LV[s.hep]} — 구조 경고 없음 · cLogP ${f2(p.logp)} · TPSA ${p.tpsa.toFixed(1)}`,
      td: `경피 투과 ${LV[s.td]} — MW ${p.mw.toFixed(1)} · cLogP ${f2(p.logp)} (1~4)`
    };
  }
  /* 결합력 p: 기준 리간드보다 4.5 kcal/mol 약하면 0, 0.5 더 강하면 1 */
  const strength = (kcal, ref) => Math.min(1, Math.max(0, (ref + 4.5 - kcal) / 5));
  /* 효능 E · 안전 S 와 그 재료(parts)를 함께 돌려준다 */
  function score(c, kcal, tid, form, dose, pop) {
    const t = TARGETS[tid], s = signals(c);
    const brainPop = !!(TRIAL[tid].brain && TRIAL[tid].brain.includes(pop));
    const cns = t.cns || brainPop;
    const p = strength(kcal, t.refKcal);
    const A = form === "iv" ? 1 : form === "oral" ? R.absorption.oral[s.oral] : R.absorption.transdermal[s.td];
    const B = cns ? R.bbb[s.bbb] : 1;
    const De = R.doseE[dose], Dt = R.doseT[dose];
    const hergR = R.risk.herg[s.herg], hepR = R.risk.hep[s.hep];
    const Rk = 1 + hergR + hepR;
    const K = R.peak[form];
    const E = Math.round(100 * (0.3 + 0.7 * p) * A * B * De * 10) / 10;
    const S = Math.round(Math.max(0, 100 - Dt * Rk * K) * 10) / 10;
    return { E, S, s, parts: { p, A, B, De, Dt, hergR, hepR, Rk, K, cns, brainPop } };
  }

  const STEPS = [
    { n: 1, code: "1.1", t: "질환 · 표적 선정", short: "표적", sub: "Open Targets · 표적 탐색실", ph: 1, cost: 0,
      q: "어떤 단백질을 막으면 이 병이 나을까?" },
    { n: 2, code: "1.2", t: "화합물 스크리닝", short: "스크리닝", sub: "ChEMBL · RDKit 깔때기", ph: 1, cost: R.cost.htvs,
      q: "220개 분자 중 약이 될 만한 것만 어떻게 추릴까?" },
    { n: 3, code: "2.1", t: "분자 도킹", short: "도킹", sub: "AutoDock Vina · 서버실", ph: 2, cost: R.cost.docking,
      q: "후보 분자는 표적의 주머니에 얼마나 단단히 붙을까?" },
    { n: 4, code: "2.2", t: "ADMET 예측 · 리드", short: "ADMET", sub: "ADMET-AI v2 · ADMET실", ph: 2, cost: R.cost.admet,
      q: "잘 붙는 분자가 몸속에서도 안전하게 잘 돌아다닐까?" },
    { n: 5, code: "3.1", t: "선언 · 물질특허", short: "특허", sub: "시청 · 특허청 창구", ph: 3, cost: R.cost.patent,
      q: "우리가 찾은 분자를 어떻게 우리 것으로 지킬까?" },
    { n: 6, code: "3.2", t: "제형 · IND 신청", short: "IND", sub: "FDA 규제심사청", ph: 3, cost: R.cost.ind,
      q: "어떤 모양 · 얼마의 양으로 사람에게 처음 시험할까?" },
    { n: 7, code: "4.1", t: "임상 1 · 2 · 3상", short: "임상", sub: "대학병원 임상센터", ph: 4, cost: R.cost.phase1 + R.cost.phase2 + R.cost.phase3,
      q: "사람에게 안전하고, 정말 효과가 있을까?" },
    { n: 8, code: "4.2", t: "최종 허가", short: "허가", sub: "FDA 규제심사청", ph: 4, cost: R.cost.final,
      q: "환자에게 팔아도 된다는 허가를 받을 수 있을까?" }
  ];
  const PHASES = [{ n: 1, t: "발견" }, { n: 2, t: "최적화" }, { n: 3, t: "개발 · 규제" }, { n: 4, t: "임상 · 허가" }];

  /* ── 예시 실행: 알츠하이머 → ACHE(4EY7) 로 한 모둠이 1.1~4.2 를 밟은 결과 ──
     모든 시안이 같은 값을 그리므로, 시안끼리 공정하게 견줄 수 있다. */
  function buildExample() {
    const tid = "ache-4ey7", t = TARGETS[tid];
    const disease = D.diseases.find((d) => d.tid === tid) || D.diseases[0];
    const target = disease ? disease.targets.find((x) => x.dockingTargetId === tid) : null;

    /* 1.2 스크리닝: 단계마다 어떤 분자가 떨어졌는지 기록 */
    const P = { lib: Object.keys(D.meta.counts || {}), mwMax: 500, tpsaMax: 140, ro5Max: 1, noAlerts: true, qedMin: 0.3, topN: 10 };
    const gates = [
      { key: "lib", label: "라이브러리", rule: "고른 라이브러리 3종", test: (c) => P.lib.includes(c.lib) },
      { key: "mwTpsa", label: "MW · TPSA", rule: `분자량 ≤ ${P.mwMax} Da · TPSA ≤ ${P.tpsaMax} Å²`, test: (c) => c.mw <= P.mwMax && c.tpsa <= P.tpsaMax },
      { key: "ro5", label: "Ro5", rule: `Lipinski 위반 ≤ ${P.ro5Max}개`, test: (c) => c.ro5 <= P.ro5Max },
      { key: "alerts", label: "구조 경고", rule: "방향족 아민 · 니트로 빼기", test: (c) => !c.al.length },
      { key: "qed", label: "QED", rule: `QED ≥ ${P.qedMin}`, test: (c) => c.qed >= P.qedMin }
    ];
    const failAt = new Map();
    for (const c of D.compounds) {
      const i = gates.findIndex((g) => !g.test(c));
      failAt.set(c.id, i); /* -1 = 모두 통과 */
    }
    const passed = D.compounds.filter((c) => failAt.get(c.id) === -1).sort((a, b) => (b.sc[tid] || 0) - (a.sc[tid] || 0));
    const sel = passed.slice(0, P.topN);
    const stages = [{ key: "all", label: "전체", rule: "ChEMBL · ZINC · 사내 합성", n: D.compounds.length }];
    let alive = D.compounds.length;
    gates.forEach((g, i) => { alive -= D.compounds.filter((c) => failAt.get(c.id) === i).length; stages.push({ key: g.key, label: g.label, rule: g.rule, n: alive }); });
    stages.push({ key: "top", label: `점수 상위 ${P.topN}`, rule: `${t.gene} 스크리닝 점수 순`, n: sel.length });

    /* 2.1 도킹: 후보 상위 5 + 기준 리간드 */
    /* 기준 리간드와 같은 분자는 늘 함께 도킹하므로 후보에서 뺀다 */
    const picks = sel.filter((c) => c.s !== t.refSmiles).slice(0, 5);
    const ref = { id: "REF", n: `${t.ref} (기준)`, s: t.refSmiles, ref: true };
    const dock = picks.map((c) => ({ id: c.id, c, name: c.n, kcal: c.vk[tid], p: strength(c.vk[tid], t.refKcal), ref: false }))
      .concat([{ id: "REF", c: ref, name: ref.n, kcal: t.refKcal, p: strength(t.refKcal, t.refKcal), ref: true }])
      .sort((a, b) => a.kcal - b.kcal);

    /* 2.2 ADMET · 리드: 경구 50 mg · 첫 환자군에서 min(E, S) 가 가장 큰 분자 */
    const pop = TRIAL[tid].pops[0], ep = TRIAL[tid].eps[0];
    const admet = dock.filter((d) => !d.ref).map((d) => {
      const s = signals(d.c);
      return { id: d.id, c: d.c, name: d.name, kcal: d.kcal, p: d.p, s, n: notes(d.c, s), sc: score(d.c, d.kcal, tid, "oral", 50, pop) };
    });
    /* 이 표적을 겨냥해 만든 계열(c.t === tid)을 먼저 본다. 도킹 1위 Troglitazone 은 당뇨약(PPAR)이라 리드에서 빠지는 예시가 된다. */
    const byBalance = (a, b) => Math.min(b.sc.E, b.sc.S) - Math.min(a.sc.E, a.sc.S) || b.sc.E - a.sc.E;
    const lead = admet.filter((a) => a.c.t === tid).sort(byBalance)[0] || admet.slice().sort(byBalance)[0];

    /* 3.1 선언 · 특허 */
    const program = { company: "크리스타바이오", ticker: "CRX", code: "CRX-101", mech: `${t.gene} 선택적 가역 억제제`,
      plabel: `${lead ? lead.name.split(" ")[0] : ""} 계열 화합물`, patentNo: "KR-37-4821", day: 12 };

    /* 3.2 제형 · IND: 고른 값 + 모든 조합의 점수판 */
    const form = "oral", dose = 50;
    const base = lead ? score(lead.c, lead.kcal, tid, form, dose, pop) : null;
    const grid = [];
    if (lead) for (const f of Object.keys(FORM)) for (const d of [10, 50, 100]) {
      const r = score(lead.c, lead.kcal, tid, f, d, pop);
      grid.push({ form: f, dose: d, E: r.E, S: r.S, ind: r.S >= R.th.ind.s });
    }
    const ind = base ? { form, dose, pop, ep, E: base.E, S: base.S, pass: base.S >= R.th.ind.s, day: program.day + R.days.ind } : null;

    /* 4.1 임상: 흔들림을 고정값으로 둔 한 이야기.
       50 mg 1상이 안전 기준(S ≥ 50)에 못 미쳐 떨어지고 → FDA 에서 10 mg 로 바꿔(무료) → 1 · 2 · 3상을 통과한다. */
    const trials = [];
    let finalDose = dose;
    if (base) {
      let day = ind.day;
      const run = (k, d, n, note) => {
        const r = score(lead.c, lead.kcal, tid, form, d, pop);
        const E = Math.max(0, Math.round((r.E + n) * 10) / 10), S = Math.max(0, Math.round((r.S + n) * 10) / 10), th = R.th[k];
        const pass = (th.e == null || E >= th.e) && (th.s == null || S >= th.s);
        day += R.days[k];
        trials.push({ k, label: { phase1: "1상", phase2: "2상", phase3: "3상" }[k], dose: d, base: { E: r.E, S: r.S }, n, E, S, pass, th, day, cost: R.cost[k], note });
      };
      run("phase1", 50, 3, "건강한 지원자 · 안전 확인");
      finalDose = 10; /* 실패 뒤 FDA 에서 용량 변경(무료 · 0일) */
      run("phase1", 10, -2, "같은 프로토콜 · 10 mg 로 다시");
      run("phase2", 10, 1, "환자 소수 · 효능 확인");
      run("phase3", 10, -1, "환자 다수 · 효능 + 안전");
    }

    /* 4.2 허가 */

      for (const c of alive) (g(c) ? nx.push(c) : drop.set(c.id, k));
      alive = nx;

    const top = ranked.slice(0, C.topN), a = alive.filter(isA).length, ta = top.filter(isA).length;
    return { alive, drop, steps, top, a, ta, ef: alive.length ? a / alive.length / BASE : 0, tef: top.length ? ta / top.length / BASE : 0 };

  const efTxt = (v) => `×${v.toFixed(1)}`;

  /* ── 공용 화면 조각 ── */
  /* 지표 하나의 분포(작은 막대) + 문턱선 + 정답 분자 눈금 */

  /* 점수판: 남은 수 · 정답 몇 개 · 농축도 · 상위 N 안의 정답 */
  function tiles(r, C) {

  /* 내가 고른 기준 순서대로 줄어드는 막대 */

    let s = "";

      const y = i * rh + 3, w = Math.max(2, (x.n / DC.length) * bw), d = i ? st[i - 1].n - x.n : 0, da = i ? st[i - 1].a - x.a : 0;
      s += tx(lw - 8, y + 17, esc(x.label), { a: "end", cls: i ? "t-m" : "", fs: 11.5, w: 600 });
      s += `<rect x="${lw}" y="${y + 4}" width="${w.toFixed(1)}" height="18" fill="var(--ink)" fill-opacity="${i === st.length - 1 ? 1 : 0.72}"/>`;

      s += tx(lw + w + 6, y + 17, `${x.n}`, { cls: "t-m", fs: 12, w: 700 });

  const topChips = (r) => r.top.length ? `<div class="s2-top">${r.top.map((c, i) => `<span class="vz-chip${isA(c) ? " a" : ""}">${i + 1}. ${esc(c.n.split(" (")[0])}</span>`).join("")}</div>` : `<p class="vz-note">남은 분자가 없습니다. 기준을 조금 풀어 보세요.</p>`;
  const legendA = `<p class="vz-note"><span class="vz-chip" style="background:var(--hi);border-color:var(--ink)">노란 칸</span> = 알츠하이머 약 계열(시판 약 6 + 사내 유도체 6). 실제 연구에서도 이미 아는 약으로 거르기 기준이 쓸 만한지 확인한다.</p>`;

  /* 기준 고르는 판(여러 시안이 같이 씀). id 로 컨트롤 id 를 나눈다. */

  /* 판의 입력 → C 를 바꾸고 화면 표시를 맞춘 뒤 onChange */

  function v2list(set) {

  function v2mount(el) {

  /* ─────────── 03 화학 공간에 울타리 치기 ─────────── */
  const AX = ["mw", "logp", "tpsa", "hbd", "rotb", "qed"];

  /* ─────────── 04 내가 심사관 ─────────── */
  const CARD_IDS = ["CRX-ACHE-03", "CHEMBL95", "CHEMBL481", "CHEMBL408", "CRX-ACHE-05", "CHEMBL266349", "CHEMBL30", "CHEMBL807"];

  /* ─────────── 05 도킹할 5개 직접 고르기 ─────────── */

  }

      도킹 1위 Irinotecan(−13.62)은 분자량 586 인 큰 항암제다. 점수만 보고 고르면 이런 분자가 섞인다.</p>`;
  }
  function v5() {
    const S = { k: "sc", d: "desc", only: true, q: "", pick: [] };

      ${come.length ? `<div class="s2-top">${come.slice(0, 12).map((x) => `<span class="vz-chip${isA(x) ? " a" : ""}">${esc(x.n.split(" (")[0])}</span>`).join("")}${come.length > 12 ? `<span class="vz-chip">… ${come.length - 12}개 더</span>` : ""}</div>` : ""}
      <div class="vz-row"><button type="button" class="vz-btn" id="s2-v9-apply" data-apply style="background:var(--ink);color:var(--paper)">이렇게 규칙 바꾸기</button><button type="button" class="vz-btn" id="s2-v9-undo" data-undo>처음 규칙으로</button></div>`;
  }
  function v9() {
    const C = PRESETS.game.c(), pick = "CHEMBL95";
    return `<p class="s2-q">게임 기본 기준으로 걸렀다. 떨어진 분자 중 <b>살리고 싶은 분자</b>를 눌러 보자. 규칙은 모두에게 똑같이 적용되므로, 하나를 살리면 다른 분자도 함께 들어온다.</p>
      <div data-grid>${v9grid(C, pick)}</div><div class="s2-info" data-info aria-live="polite">${v9info(pick, C)}</div><div data-tiles>${tiles(run(C), C)}</div>`;
  }
  function v9mount(el) {
    let C = PRESETS.game.c(), sel = "CHEMBL95", note = "";
    const draw = () => { el.querySelector("[data-grid]").innerHTML = v9grid(C, sel); el.querySelector("[data-info]").innerHTML = v9info(sel, C, note); el.querySelector("[data-tiles]").innerHTML = tiles(run(C), C); };
    el.addEventListener("click", (e) => {
      const g = e.target.closest("[data-id]"); if (g) { sel = g.dataset.id; note = ""; draw(); return; }
      if (e.target.closest("[data-apply]")) {
        const c = CV.CMP.get(sel), f = fails(c, C), D = relaxFor(c, C), r0 = run(C), r1 = run(D);
        note = `방금 <b>${f.map((k) => esc(gateLabel(k, C) + " → " + gateLabel(k, D))).join(", ")}</b> 로 바꿨다. 남은 분자 ${r0.alive.length} → <b>${r1.alive.length}</b>(+${r1.alive.length - r0.alive.length}), 약 계열 ${r0.a} → ${r1.a}, 농축도 ${efTxt(r0.ef)} → ${efTxt(r1.ef)}. 살린 보람이 있었나?`;
        C = D; draw(); return;
      }
      if (e.target.closest("[data-undo]")) { C = PRESETS.game.c(); note = ""; draw(); }
    });
  }

  /* ─────────── 10 예측하고 확인하기 ─────────── */
  const SEQ = [
    { k: "mw", t: 500, q: "분자량 500 이하만 남기면 220개 중 몇 개가 남을까?" },
    { k: "tpsa", t: 90, q: "이어서 TPSA 90 이하(뇌 약 기준)만 남기면?" },
    { k: "alerts", q: "이어서 구조 경고 조각이 있는 분자를 빼면?" },
    { k: "qed", t: 0.5, q: "이어서 약다움 QED 0.5 이상만 남기면?" },
    { k: "logp", t: 4, q: "마지막으로 cLogP 4 이하(심장 독성 위험 줄이기)만 남기면?" }
  ];
  const seqC = (i) => { const C = mk(); SEQ.slice(0, i).forEach((s) => { if (s.k === "alerts") C.alerts = true; else { C.on[s.k] = 1; C.th[s.k] = s.t; } }); return C; };
  function v10stage(i, guesses) {
    if (i >= SEQ.length) {
      const rows = SEQ.map((s, j) => ({ s, n: run(seqC(j + 1)).alive.length, g: guesses[j] }));
      const W = 720, rh = 34, H = rows.length * rh + 30, lw = 220, bw = W - lw - 60, sx = (n) => (n / DC.length) * bw;
      let b = tx(lw, 14, "실제(막대) vs 내 예측(세로선)", { cls: "t-mu", fs: 11.5 });
      rows.forEach((r, j) => { const y = 24 + j * rh; b += tx(lw - 8, y + 16, esc(r.s.k === "alerts" ? "구조 경고 빼기" : gateLabel(r.s.k, seqC(j + 1))), { a: "end", cls: "t-m", fs: 11.5, w: 600 }) + `<rect x="${lw}" y="${y + 3}" width="${sx(r.n).toFixed(1)}" height="20" fill="var(--ink)" fill-opacity=".8"/><line x1="${lw + sx(r.g)}" x2="${lw + sx(r.g)}" y1="${y}" y2="${y + 26}" stroke="var(--hi)" stroke-width="4"/><line x1="${lw + sx(r.g)}" x2="${lw + sx(r.g)}" y1="${y}" y2="${y + 26}" stroke="var(--ink)" stroke-width="1"/>` + tx(lw + Math.max(sx(r.n), sx(r.g)) + 8, y + 17, `${r.n} (예측 ${r.g})`, { cls: "t-m", fs: 11.5, w: 600 }); });
      const err = rows.reduce((a, r) => a + Math.abs(r.n - r.g), 0) / rows.length;
      return `${CV.svg(W, H, b, "예측과 실제 비교")}<p class="s2-out">평균 오차 <b>${err.toFixed(1)}</b>개. 가장 크게 빗나간 관문은 어디였나? 분포(1.2-02 시안)를 보면 왜 그런지 알 수 있다.</p>
        <button type="button" class="vz-btn" id="s2-v10-again" data-again>처음부터 다시</button>`;
    }
    const s = SEQ[i], prev = run(seqC(i)).alive.length, def = Math.round(prev * 0.7);
    return `<div class="s2-pred"><span class="vz-lab">관문 ${i + 1} / ${SEQ.length} · 지금 ${prev}개 남음</span><b style="font-size:15px">${esc(s.q)}</b>
      ${s.k !== "alerts" ? `<div>${hist(s.k, Object.assign(seqC(i), { on: { ...seqC(i).on, [s.k]: 1 }, th: { ...seqC(i).th, [s.k]: s.t } }), 640, 46)}</div><p class="vz-note">위 분포는 220개 전체. 빨간 점선 밖이 버려질 쪽이다.</p>` : `<p class="vz-note">구조 경고 조각은 220개 중 32개에 있다. 앞 관문에서 이미 빠진 것도 있을 것이다.</p>`}
      <div class="vz-row"><label class="vz-lab" style="margin:0" for="s2-v10-g">내 예측</label><input class="vz-rng" style="flex:1;min-width:160px" type="range" id="s2-v10-g" min="0" max="${prev}" step="1" value="${def}"><span class="big" data-g>${def}</span>개</div>
      <div class="vz-row"><button type="button" class="vz-btn" id="s2-v10-ok" data-ok style="background:var(--ink);color:var(--paper)">확인하기</button><span class="s2-out" data-res></span></div></div>`;
  }
  function v10() {
    return `<p class="s2-q">관문을 하나씩 걸기 전에 <b>몇 개가 남을지 먼저 예측</b>하고 확인한다. 지표의 분포를 보고 감을 잡는 연습이다.</p><div data-stage>${v10stage(0, [])}</div>`;
  }
  function v10mount(el) {
    let i = 0, guesses = [], shown = false;
    const draw = () => { el.querySelector("[data-stage]").innerHTML = v10stage(i, guesses); shown = false; };
    el.addEventListener("input", (e) => { if (e.target.id === "s2-v10-g") el.querySelector("[data-g]").textContent = e.target.value; });
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-again]")) { i = 0; guesses = []; draw(); return; }
      const ok = e.target.closest("[data-ok]"); if (!ok) return;
      if (shown) { i++; draw(); return; }
      const g = +el.querySelector("#s2-v10-g").value, real = run(seqC(i + 1)).alive.length, d = g - real;
      guesses[i] = g; shown = true;
      el.querySelector("[data-res]").innerHTML = `실제 <b>${real}</b>개 · 내 예측 ${g}개 (${d === 0 ? "정확!" : (d > 0 ? "+" : "") + d})`;
      ok.textContent = i + 1 < SEQ.length ? "다음 관문" : "결과 보기";
      el.querySelector("#s2-v10-g").disabled = true;
    });
  }

  window.VIZ[2] = [
    { name: "기준 설계실", kind: "기준 고르기 · 분포 · 점수판", idea: "지표 7개와 Lipinski · 구조 경고 · 라이브러리 · 줄 세우기 기준을 직접 켜고 문턱을 옮기면, 분포 · 깔때기 · 점수판 · 도킹 후보가 바로 바뀐다.",
      learn: "기준을 켤 때마다 약 계열을 얼마나 잃고 나머지를 얼마나 걸러내는지 저울질하며 스스로 기준을 세운다.", render: v1, mount: v1mount },
    { name: "분포 보고 문턱 정하기", kind: "히스토그램 · 문턱 · 기준표", idea: "지표 하나씩 220개의 분포와 약 계열 위치를 보고 문턱을 정해 '내 기준표'에 담는다. 담은 기준을 합친 결과가 아래에 쌓인다.",
      learn: "문턱은 감으로 정하지 않는다. 분포에서 약이 몰린 곳과 버릴 꼬리를 보고 근거 있게 정한다.", render: v2, mount: v2mount },
    { name: "화학 공간 울타리", kind: "산점도 · 끌어서 상자 그리기", idea: "가로 · 세로 지표를 골라 분자 지도를 만들고, 마우스로 끌어 '약이 될 만한 동네'에 울타리를 친다. 교과서 기준선과 견줄 수 있다.",
      learn: "두 지표를 함께 보면 한 지표로는 안 보이는 약의 동네가 보이고, Lipinski 기준도 그런 울타리라는 걸 안다.", render: v3, mount: v3mount },
    { name: "내가 심사관", kind: "분자 카드 · 직접 판정 · 정답 공개", idea: "분자 카드 8장의 지표를 읽고 직접 통과 · 탈락을 정한 뒤, 게임 규칙의 판정과 실제 이야기(타크린 간 독성, Irinotecan 큰 분자, Troglitazone 철수)를 연다.",
      learn: "규칙은 사람의 판단을 숫자로 옮긴 것이고, 규칙이 잡는 위험과 놓치는 위험이 모두 있다.", render: v4, mount: v4mount },
    { name: "도킹할 5개 고르기", kind: "정렬 표 · 고르기 · 결과 공개", idea: "220개 지표 표를 정렬 · 검색해 도킹할 5개를 직접 고르고, 결과를 열어 실제 결합 값과 순위, '점수 상위 5'를 그냥 골랐을 때와 비교한다.",
      learn: "여러 지표를 함께 보고 고른 선택이 다음 단계 결과로 돌아온다. 점수 하나만 믿으면 큰 분자 같은 함정에 빠진다.", render: v5, mount: v5mount },
    { name: "두 사람 기준 겨루기", kind: "A/B 기준 · 겹침 막대 · 상위 10 비교", idea: "모둠원 A · B 가 각자 기준을 세우면 둘 다 남긴 분자, 한 사람만 남긴 분자, 상위 10의 차이가 나란히 보인다.",
      learn: "기준이 다르면 후보가 달라진다. 모둠은 근거(약 계열 보존 · 농축도)로 토론해 기준을 합친다.", render: v6, mount: v6mount },
    { name: "문턱-성과 곡선", kind: "두 곡선 · 슬라이더 · 정답 공개", idea: "문턱을 움직이면 전체가 남는 비율과 약 계열이 남는 비율이 두 곡선 위에서 움직인다. 둘이 가장 벌어지는 문턱을 찾는다.",
      learn: "좋은 문턱은 '나머지는 많이 버리고 약은 지키는' 곳이고, 아는 약에만 맞춘 문턱은 새 약을 놓칠 수 있다.", render: v7, mount: v7mount },
    { name: "미션 도전", kind: "목표 · 실시간 체크", idea: "기준 없는 220개에서 시작해 '도킹 비용 아끼기 · 뇌로 가는 약 · 함정 피하기' 미션 3개를 기준을 조절해 성공시킨다.",
      learn: "기준은 목적(비용 · 뇌 투과 · 순위)에 따라 달라진다는 것을 목표를 이루며 익힌다.", render: v8, mount: v8mount },
    { name: "탈락 분자 구제하기", kind: "220칸 격자 · 규칙 완화 · 부작용", idea: "떨어진 분자 칸을 눌러 이유를 보고, 그 분자를 살리도록 규칙을 바꾸면 함께 들어오는 분자 수와 목록이 나온다.",
      learn: "규칙은 모두에게 똑같이 적용된다. 하나를 살리려 규칙을 풀면 원치 않는 분자도 같이 들어온다.", render: v9, mount: v9mount },
    { name: "예측하고 확인하기", kind: "분포 힌트 · 예측 슬라이더 · 비교", idea: "관문 5개를 하나씩 걸기 전에 분포를 보고 남을 개수를 예측한 뒤 실제와 맞춰 보고, 끝에 예측과 실제를 한 그림에 모은다.",
      learn: "지표 분포를 읽는 감을 기르고, 어떤 관문이 크게 거르는지 스스로 알아챈다.", render: v10, mount: v10mount }
  ];
})();

</script>
<script>
(() => {
  "use strict";
  const CV = window.CV, { esc, STEPS, PHASES, MX } = CV;
  const $ = (id) => document.getElementById(id);
  const NEWS = [
    ["세움제약 SEU-904 임상 2상 통과", "g", "▲ 8.0%"], ["다온테라퓨틱스 도킹 신기록 -10.90 kcal/mol", "", "▲ 6.4%"],
    ["미르파마 MIR-810 임상 보류", "r", "▼ 4.0%"], ["세움제약 연구 설비 건설", "", "▲ 2.0%"], ["미르파마 유상증자 공시", "r", "▼ 3.0%"],

  const st = STEPS[1], it = window.VIZ[2][0];

      <p class="ui-eyebrow">${esc(PHASES[st.ph - 1].n + ". " + PHASES[st.ph - 1].t)} · ${esc(st.sub)} · ${MX(st.cost)}</p>
      <h1>${esc(st.t)}</h1><p class="ui-q">${esc(st.q)}</p></header>
    <article class="ui-card">
      <header class="ui-card-h"><span class="ui-no">2.01</span><h2>${esc(it.name)}</h2><span class="ui-kind">${esc(it.kind)}</span>
        <p class="ui-idea">${esc(it.idea)}</p></header>
      <div class="ui-card-b"><div class="vz" data-vz="0">${body}</div></div>
      <footer class="ui-card-f"><b>배우는 것</b><span>${esc(it.learn)}</span></footer></article>`;
  try { it.mount && it.mount($("wrap").querySelector("[data-vz]")); } catch (e) { console.error(e); }
  CV.drawMols($("wrap"));
})();
</script>

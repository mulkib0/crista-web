<title>Crista 사이드바 30종</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 레이아웃: 시안 카드 격자. 카드마다 본문 바탕(--raise) 위에 사이드바 섬 하나를 실제 폭(272px)으로 놓는다.
     색 · 글꼴은 apps/web/src/styles.css 의 Crista 토큰(잉크 · 페이퍼 · 라임 · 박막)을 그대로 쓴다. 앱처럼 밝은 박막 톤 하나로 고정한다. */
  :root {
    --bg: #f1f1e9; --surface: #fbfbf6; --raise: #e7e8de; --raise-2: #dcddd2; --fg: #080b09; --muted: #5b6358;
    --line: rgba(8, 11, 9, 0.13); --line-strong: rgba(8, 11, 9, 0.32);
    --hi: #c6ff4a; --hi-fg: #080b09; --hi-soft: rgba(198, 255, 74, 0.35);
    --good: #2f6f2a; --good-bg: rgba(47, 111, 42, 0.12); --warn: #8a5a00; --warn-bg: rgba(176, 120, 0, 0.14); --bad: #b2361b; --bad-bg: rgba(178, 54, 27, 0.11);
    --night: #0b0d0a; --night-2: #151a14; --night-fg: #f1f1e9; --night-muted: #9da59a; --night-line: rgba(241, 241, 233, 0.14);
    --led: #ffb21a; --led-g: #8dff5a; --led-r: #ff5a3c;
    --film: linear-gradient(115deg, #ffd3ea 0%, #cdeaff 28%, #e4ffc0 52%, #ffe2c2 76%, #e6d4ff 100%);
    --film-1: #ffd3ea; --film-2: #cdeaff; --film-3: #e4ffc0; --film-4: #ffe2c2; --film-5: #e6d4ff;
    --sans: "IBM Plex Sans KR", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--hi); color: var(--hi-fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .page { max-width: 1480px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  .hd { display: grid; gap: 10px; max-width: 760px; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--film); box-shadow: 0 0 0 1px var(--fg); }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; }
  h1 em { font-style: normal; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--fg); }
  .lede { margin: 0; color: var(--muted); max-width: 64ch; }
  .lede b { color: var(--fg); font-weight: 600; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .jump { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .jump a { font-family: var(--mono); font-size: 11px; text-decoration: none; padding: 3px 7px; border-radius: 999px; color: var(--muted); border: 1px solid transparent; }
  .jump a:hover { border-color: var(--line-strong); color: var(--fg); }
  .jump a.on { background: var(--fg); color: var(--bg); }
  .picks { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .picks output { font-family: var(--mono); font-size: 12px; }
  .btn { appearance: none; border: 1px solid var(--line-strong); background: transparent; min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--fg); }
  .btn.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; align-items: start; }
  .card { background: var(--surface); border-radius: 22px; padding: 14px; display: grid; gap: 10px; min-width: 0; scroll-margin-top: 64px; border: 1px solid transparent; }
  .card.picked { border-color: var(--fg); box-shadow: 0 0 0 3px var(--hi); }
  .card.wide { grid-column: 1 / -1; }
  .ch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
  .cn { font-family: var(--mono); font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--raise); }
  .card[data-base] .cn { background: var(--fg); color: var(--bg); }
  .ct { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
  .why { grid-column: 2 / 4; margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .star { appearance: none; border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; font-size: 11.5px; padding: 2px 9px; white-space: nowrap; }
  .star[aria-pressed="true"] { background: var(--hi); border-color: var(--fg); font-weight: 700; }
  .stage { background: var(--raise); border-radius: 16px; padding: 14px; display: flex; gap: 12px; justify-content: center; align-items: flex-start; min-width: 0; overflow: hidden; }
  .ghost { flex: 1; min-width: 0; align-self: stretch; border-radius: 20px; background: var(--surface); opacity: 0.7; padding: 14px; display: grid; gap: 8px; align-content: start; font-size: 11.5px; color: var(--muted); }
  .ghost i { display: block; height: 8px; border-radius: 4px; background: var(--raise); }
  .ghost b { font-size: 26px; letter-spacing: -0.05em; line-height: 1; color: var(--fg); }

  /* ── 사이드바 섬 — 지금 화면(styles.css)의 값을 그대로 ── */
  .sb { background: var(--surface); border-radius: 26px; padding: 18px 12px; display: grid; gap: 14px; width: 272px; max-width: 100%; flex: none; align-content: start; }
  .side-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 0 10px; }
  .groups { display: grid; gap: 16px; }
  .grp { display: grid; gap: 4px; min-width: 0; }
  .grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0; padding-left: 10px; font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .grp-h b { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); }
  .grp-h span { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; margin-left: auto; padding-right: 10px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .st { appearance: none; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; border-radius: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 8px; padding: 7px 10px; align-items: baseline; transition: background-color .18s ease; }
  .st:hover { background: var(--bg); }
  .st-n { font-family: var(--mono); font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .st-t { font-weight: 600; line-height: 1.35; min-width: 0; }
  .st-s { grid-column: 2 / 4; font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .st-k { font-family: var(--mono); font-size: 12px; }
  .st[aria-current="step"] { background: var(--hi); color: var(--hi-fg); }
  .st[aria-current="step"] .st-s { color: rgba(8, 11, 9, 0.66); }
  .st[data-state="locked"] { opacity: 0.55; }
  .st[data-state="locked"][aria-current="step"] { opacity: 1; }
  .side-foot { padding: 4px 10px 0; display: grid; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .side-team { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--fg); font-family: var(--sans); font-size: 12px; }
  .side-team .badge { font-family: var(--mono); font-size: 10px; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 999px; margin-left: 4px; color: var(--muted); }
  .ico { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico.f { fill: currentColor; stroke: none; }
  .ini { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--raise); border: 1.5px solid var(--surface); }
  .ini.k { background: var(--film-2); } .ini.p { background: var(--film-1); } .ini.l { background: var(--film-4); }

  /* 01 진행 레일 */
  .v01 .steps { gap: 0; }
  .v01 li { position: relative; }
  .v01 li::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .v01 li:first-child::before { top: 50%; } .v01 li:last-child::before { bottom: 50%; }
  .v01 li[data-state="done"]::before { background: var(--fg); }
  .v01 li[data-state="running"]::before { background: linear-gradient(var(--fg) 50%, var(--line) 50%); }
  .v01 .st { grid-template-columns: 22px 30px minmax(0, 1fr); align-items: center; position: relative; }
  .v01 .st-s { grid-column: 3; margin: 0; }
  .v01 .st-t { grid-column: 3; } .v01 .st-n { grid-column: 2; grid-row: 1; }
  .v01 .nd { grid-row: 1 / 3; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--fg); background: var(--surface); justify-self: center; z-index: 1; }
  .v01 .nd[data-s="done"] { background: var(--fg); }
  .v01 .nd[data-s="running"] { background: var(--hi); width: 14px; height: 14px; }
  .v01 .nd[data-s="locked"] { border-style: dashed; border-color: var(--line-strong); }
  .v01 .st[aria-current="step"] .nd { box-shadow: 0 0 0 3px var(--surface); }

  /* 02 묶음 칸 막대 */
  .v02 .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin: 2px 10px 6px; }
  .v02 .seg i { height: 5px; border-radius: 3px; background: var(--raise); }
  .v02 .seg i[data-s="done"] { background: var(--fg); }
  .v02 .seg i[data-s="running"] { background: linear-gradient(90deg, var(--fg) var(--p), var(--raise) var(--p)); }
  .v02 .grp-h span { color: var(--fg); font-weight: 600; }

  /* 03 선 아이콘 */
  .v03 .st { grid-template-columns: 34px minmax(0, 1fr) 22px; }
  .v03 .st-k { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; align-self: center; grid-row: 1 / 3; grid-column: 3; }
  .v03 .st-k[data-s="done"] { background: var(--good-bg); color: var(--good); }
  .v03 .st-k[data-s="running"] { background: var(--fg); color: var(--hi); }
  .v03 .st-k[data-s="locked"] { border: 1px dashed var(--line-strong); color: var(--muted); }
  .v03 .st-s { grid-column: 2; }
  .v03 .st[data-state="locked"] { opacity: 0.7; }
  .v03 .st[aria-current="step"] .st-k[data-s="done"] { background: var(--surface); }

  /* 04 잠긴 단계 접기 */
  .v04 .lockbox { border: 1px dashed var(--line-strong); border-radius: 16px; display: grid; }
  .v04 .lk-b { appearance: none; border: 0; background: transparent; text-align: left; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; border-radius: 16px; }
  .v04 .lk-b:hover { background: var(--bg); }
  .v04 .lk-b b { font-size: 13px; }
  .v04 .lk-b small { grid-column: 1 / -1; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .v04 .lk-b span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .v04 .lockbox .steps { padding: 0 4px 6px; }

  /* 05 진행 링 */
  .v05 .st { grid-template-columns: 34px minmax(0, 1fr) 24px; }
  .v05 .st-k { grid-row: 1 / 3; grid-column: 3; align-self: center; width: 24px; height: 24px; display: grid; place-items: center; }
  .v05 .st-s { grid-column: 2; }
  .v05 .ring { width: 24px; height: 24px; border-radius: 50%; background: conic-gradient(var(--fg) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
  .v05 .ring::after { content: attr(data-i); width: 17px; height: 17px; border-radius: 50%; background: var(--surface); font-family: var(--sans); font-size: 9.5px; font-weight: 700; display: grid; place-items: center; }
  .v05 .st[aria-current="step"] .ring::after { background: var(--hi); }

  /* 06 지금 할 일 */
  .v06 .todo { background: var(--fg); color: var(--bg); border-radius: 18px; padding: 12px 14px; display: grid; gap: 6px; }
  .v06 .todo .eb { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hi); }
  .v06 .todo b { font-size: 14px; line-height: 1.35; }
  .v06 .todo p { margin: 0; font-size: 12px; color: var(--night-muted); line-height: 1.45; }
  .v06 .todo .bar6 { height: 4px; border-radius: 2px; background: var(--night-line); overflow: hidden; } .v06 .todo .bar6 i { display: block; height: 100%; width: 62%; background: var(--hi); }
  .v06 .todo button { appearance: none; border: 0; background: var(--hi); color: var(--hi-fg); border-radius: 999px; font-weight: 700; font-size: 12px; padding: 6px 12px; justify-self: start; }
  .v06 .st-s { display: none; }
  .v06 .st { padding: 6px 10px; }

  /* 07 아이콘 레일 */
  .v07 .rail { width: 64px; padding: 14px 8px; border-radius: 22px; background: var(--surface); display: grid; gap: 6px; justify-items: center; flex: none; }
  .v07 .rail hr { width: 24px; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .v07 .rail .gl { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.06em; }
  .v07 .rb { appearance: none; width: 42px; height: 34px; border-radius: 12px; border: 0; background: transparent; font-family: var(--mono); font-size: 11.5px; font-weight: 600; position: relative; }
  .v07 .rb:hover { background: var(--bg); }
  .v07 .rb[aria-current="step"] { background: var(--hi); }
  .v07 .rb[data-state="locked"] { color: var(--muted); opacity: 0.6; }
  .v07 .rb::after { content: ""; position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; }
  .v07 .rb[data-state="done"]::after { background: var(--good); }
  .v07 .rb[data-state="running"]::after { background: var(--fg); box-shadow: 0 0 0 2px var(--hi); }
  .v07 .tog { appearance: none; border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; width: 30px; height: 30px; font-size: 13px; }
  .v07 .sb-top { display: flex; justify-content: space-between; align-items: center; padding-right: 4px; }

  /* 08 박막 전체 진행 */
  .v08 .total { padding: 0 10px; display: grid; gap: 6px; }
  .v08 .total-h { display: flex; justify-content: space-between; align-items: baseline; }
  .v08 .total-h b { font-size: 22px; letter-spacing: -0.04em; font-family: var(--mono); }
  .v08 .total-h span { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .v08 .cells { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .v08 .cells i { height: 14px; border-radius: 4px; background: var(--raise); }
  .v08 .cells i.g { margin-left: 4px; }
  .v08 .cells i[data-s="done"] { background: var(--film); background-size: 900% 100%; box-shadow: inset 0 0 0 1px var(--fg); }
  .v08 .cells i[data-s="running"] { background: linear-gradient(90deg, var(--fg) 62%, var(--raise) 62%); }

  /* 09 아코디언 */
  .v09 .gb { appearance: none; border: 0; background: transparent; width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 14px; font-size: 13px; font-weight: 700; }
  .v09 .gb:hover { background: var(--bg); }
  .v09 .gb b { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .v09 .gb .dots { margin-left: auto; display: flex; gap: 3px; }
  .v09 .gb .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--fg); }
  .v09 .gb .dots i[data-s="done"] { background: var(--fg); }
  .v09 .gb .dots i[data-s="running"] { background: var(--hi); }
  .v09 .gb .dots i[data-s="locked"] { border-color: var(--line-strong); }
  .v09 .gb .chev { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 12px; }
  .v09 .groups { gap: 4px; }
  .v09 .grp.open { background: var(--bg); border-radius: 18px; padding-bottom: 4px; }

  /* 10 게임 날짜 */
  .v10 .today { margin: 0 10px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; padding: 6px 10px; border-radius: 999px; background: var(--raise); }
  .v10 .day { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .v10 .st[aria-current="step"] .day { color: var(--fg); }
  .v10 .day.run { color: var(--fg); font-weight: 600; }

  /* 11 모둠원 */
  .v11 .who { display: flex; } .v11 .who .ini { margin-left: -6px; } .v11 .who .ini:first-child { margin-left: 0; }
  .v11 .st-k { align-self: center; grid-row: 1 / 3; grid-column: 3; }
  .v11 .st-s { grid-column: 2; }

  /* 12 근거 종류 */
  .v12 .ev { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
  .v12 .ev[data-e="계산"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .v12 .ev[data-e="예측"] { border-style: dashed; }
  .v12 .ev[data-e="모의"] { color: var(--muted); }
  .v12 .st[aria-current="step"] .ev[data-e="계산"] { background: var(--fg); }
  .v12 .legend { padding: 0 10px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--muted); align-items: center; }

  /* 13 세그먼트 */
  .v13 .segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; background: var(--raise); border-radius: 14px; }
  .v13 .sg { appearance: none; border: 0; background: transparent; border-radius: 11px; padding: 6px 2px; display: grid; gap: 0; justify-items: center; font-size: 11.5px; font-weight: 700; }
  .v13 .sg small { font-family: var(--mono); font-size: 9.5px; font-weight: 500; color: var(--muted); }
  .v13 .sg[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(8, 11, 9, 0.12); }
  .v13 .sg.hasrun::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--hi); margin-bottom: 2px; }
  .v13 .gname { margin: 0; padding: 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }

  /* 14 큰 번호 */
  .v14 .st { grid-template-columns: 58px minmax(0, 1fr); align-items: center; padding: 8px 10px; }
  .v14 .big { grid-row: 1 / 3; font-size: 30px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.9; background: var(--film); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px var(--fg); }
  .v14 .st[data-state="locked"] .big { background: none; -webkit-text-stroke: 1px var(--line-strong); }
  .v14 .st[aria-current="step"] { background: var(--fg); color: var(--bg); }
  .v14 .st[aria-current="step"] .big { -webkit-text-stroke: 0; }
  .v14 .st[aria-current="step"] .st-s { color: var(--night-muted); }
  .v14 .st-s { grid-column: 2; }

  /* 15 잉크 = 선택, 라임 = 진행 */
  .v15 .st[aria-current="step"] { background: var(--fg); color: var(--bg); }
  .v15 .st[aria-current="step"] .st-s { color: var(--night-muted); }
  .v15 .st[data-state="running"] .st-k { width: 10px; height: 10px; border-radius: 50%; background: var(--hi); box-shadow: 0 0 0 2px var(--fg); align-self: center; font-size: 0; animation: pulse 1.6s ease-in-out infinite; }
  .v15 .st[data-state="running"] { background: var(--hi-soft); }
  .v15 .st[data-state="running"][aria-current="step"] { background: var(--fg); }

<script>
const ST = [
  { id: '1.1', g: 1, t: '질환 · 표적 선정', meta: 'Open Targets 근거', ev: '자료', state: 'done', s: 'EGFR · 비소세포폐암', day: 'D+4', who: ['p', 'k'] },
  { id: '1.2', g: 1, t: '화합물 스크리닝', meta: 'ChEMBL · RDKit 깔때기', ev: '자료', state: 'done', s: '후보 2,418 → 12', day: 'D+11', who: ['k'] },
  { id: '2.1', g: 2, t: '분자 도킹', meta: 'AutoDock Vina · PLIP', ev: '계산', state: 'done', s: '리드 3개 · −9.4 kcal/mol', day: 'D+19', who: ['k', 'l'] },
  { id: '2.2', g: 2, t: 'ADMET 예측 · 특허 후보', meta: 'ADMET-AI v2', ev: '예측', state: 'running', pct: 62, by: '김하린', day: 'D+23', who: ['k'] },
  { id: '3.1', g: 3, t: '선언 · 물질특허', meta: 'RDKit 물성 · 서류 심사', ev: '계산', state: 'locked', need: '2.2' },
  { id: '3.2', g: 3, t: '전임상 · 동물실험', meta: '윤리 심의 · 교육용 모의 판정', ev: '모의', state: 'locked', need: '3.1' },
  { id: '3.3', g: 3, t: '제형 · IND 신청', meta: '서류 심사 · 교육용 모의 판정', ev: '모의', state: 'locked', need: '3.2' },
  { id: '4.1', g: 4, t: '임상 1 · 2 · 3상', meta: '교육용 모의 판정', ev: '모의', state: 'locked', need: '3.3' },
  { id: '4.2', g: 4, t: '최종 허가', meta: '규칙 · 서류 심사', ev: '모의', state: 'locked', need: '4.1' },
];
const GT = { 1: '발견', 2: '최적화', 3: '개발 · 규제', 4: '임상 · 허가' };
const WORD = { done: '완료', running: '진행 중', ready: '할 수 있음', locked: '잠김' };
const MEM = [{ k: 'k', n: '김하린', r: 'CSO' }, { k: 'p', n: '박서준', r: 'CEO' }, { k: 'l', n: '이도윤', r: 'CTO' }];
const INI = { k: '김', p: '박', l: '이' };
const TEAM = '세움제약';
const byId = (id) => ST.find((s) => s.id === id);
const inG = (g) => ST.filter((s) => s.g === g);
const doneOf = (g) => inG(g).filter((s) => s.state === 'done').length;

const ICON = {
  done: '<svg class="ico" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  running: '<svg class="ico f" viewBox="0 0 16 16"><path d="M5.5 3.5v9l7-4.5z"/></svg>',
  locked: '<svg class="ico" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg>',
  ready: '<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5"/></svg>',
};
const MARK = { done: '✓', running: '▸', ready: '', locked: '🔒' };
const subTxt = (s) => (s.state === 'running' ? `${s.by} · ${s.pct}%` : s.state === 'locked' ? '잠김' : s.s ?? s.meta);
const cur = (s, st) => (s.id === st.cur ? ' aria-current="step"' : '');
const ini = (k) => `<span class="ini ${k}" title="${MEM.find((m) => m.k === k).n}">${INI[k]}</span>`;

function row(s, st, o = {}) {
  return `<button type="button" class="st" data-step="${s.id}" data-state="${s.state}"${cur(s, st)}${o.attr ? o.attr(s, st) : ''}>`
    + (o.lead ? o.lead(s, st) : `<span class="st-n">${s.id}</span>`)
    + `<span class="st-t">${s.t}</span>`
    + (o.noMark ? '' : `<span class="st-k" data-s="${s.state}" aria-label="${WORD[s.state]}">${o.mark ? o.mark(s, st) : MARK[s.state]}</span>`)
    + `<span class="st-s">${o.sub ? o.sub(s, st) : subTxt(s)}</span>`
    + (o.after ? o.after(s, st) : '')
    + '</button>';
}
const list = (items, st, o) => `<ol class="steps">${items.map((s) => `<li data-state="${s.state}">${row(s, st, o)}</li>`).join('')}</ol>`;
const grp = (g, st, o = {}) => `<div class="grp" data-g="${g}" style="--k:${g - 1}"><p class="grp-h"><b>${g}</b> ${GT[g]} <span>${doneOf(g)}/${inG(g).length}</span></p>${o.grpExtra ? o.grpExtra(g, st) : ''}${list(inG(g).filter((s) => !o.filter || o.filter(s, st)), st, o)}</div>`;
const foot = () => `<div class="side-foot"><div class="side-team">${MEM.map((m) => `<span><b>${m.n}</b><span class="badge">${m.r}</span></span>`).join('')}</div><span>3학년 2반 · 모둠 6개</span><span>계산 워커 실제 계산(compute)</span></div>`;

}
const ghost = (t) => `<div class="ghost" aria-hidden="true"><span>본문</span><b>2.2</b><i style="width:70%"></i><i style="width:90%"></i><i style="width:55%"></i>${t ? `<span>${t}</span>` : ''}</div>`;

    html: (st) => side(st, { cls: st.tight ? 'tight' : '', noHead: true, top: () => `<div class="dens"><p class="side-h" style="padding:0">${TEAM}</p><div class="seg2" role="group" aria-label="목록 밀도"><button type="button" data-act="d" data-v="n" aria-pressed="${!st.tight}">보통</button><button type="button" data-act="d" data-v="t" aria-pressed="${!!st.tight}">좁게</button></div></div>` }) },

  { n: '25', name: '모둠 소식', why: '모둠원 이름 대신 최근 모둠 활동 세 줄을 발에 둡니다. 다른 모둠원이 무엇을 바꿨는지 새로 읽지 않아도 알 수 있습니다.',
    html: (st) => side(st, { foot: () => `<div class="feed"><h4>모둠 소식</h4>${[['k', '2.2 ADMET 예측을 시작했어요', '3분 전'], ['l', '2.1 연구 노트 "한계" 칸을 고쳤어요', '12분 전'], ['p', '2.1 리드 3개를 확정했어요', 'D+19']].map(([k, t, w]) => `<div class="ev25">${ini(k)}<span>${t}</span><time>${w}</time></div>`).join('')}</div>` }) },

  { n: '26', name: '고정된 발', why: '섬 높이를 화면에 맞추고 단계 목록만 스크롤되게 합니다. 모둠원 · 계산 워커 상태가 늘 바닥에 붙어 있어, 워커가 멈추면 바로 보입니다.',
    html: (st) => `<nav class="sb" aria-label="파이프라인 단계"><p class="side-h">${TEAM} · 신약 파이프라인</p><div class="scr"><div class="groups">${[1, 2, 3, 4].map((g) => grp(g, st)).join('')}</div></div><div class="dock"><div class="r"><span class="stack">${MEM.map((m) => ini(m.k)).join('')}</span><small>3명 · 3학년 2반</small><span class="wk">실제 계산</span></div></div></nav>` },

  { n: '27', name: '단계 안 할 일', why: '보고 있는 단계 아래에 그 단계에서 할 일을 체크리스트로 펼칩니다. 연구 노트 3칸 중 몇 칸을 썼는지도 함께 보여 빠뜨리기 어렵습니다.',
    html: (st) => side(st, { after: (s) => {
      if (s.id !== st.cur) return '';
      const bx = (on) => `<span class="bx${on === 1 ? ' on' : on === 2 ? ' half' : ''}">${on === 1 ? ICON.done : ''}</span>`;
      const items = s.state === 'running' ? [[2, 'ADMET 예측 돌리기', '62%'], [0, '특허 후보 1개 고르기', ''], [0, '연구 노트', '2/3칸']] : s.state === 'done' ? [[1, '결과 확정', ''], [1, '연구 노트', '3/3칸']] : [[0, `${s.need} 마치기`, ''], [0, '초안 · 연구 노트는 미리 쓸 수 있어요', '']];
      return `<ul class="chk">${items.map(([o, t, m]) => `<li>${bx(o)}<span>${t}</span><em>${m}</em></li>`).join('')}</ul>`;
    } }) },

  { n: '28', name: '묶음마다 박막 한 색', why: '네 묶음에 박막 간섭색을 하나씩 깔아 경계를 색으로 나눕니다. 머리 섬과 칩에 같은 색을 쓰면 "지금 최적화 묶음"이 색만으로도 읽힙니다.',
    html: (st) => side(st) },

  { n: '29', name: '서류철 탭', why: '네 묶음을 규제 서류철처럼 인덱스 탭으로 겹치고, 끝낸 단계엔 "승인" 도장을 찍습니다. 3.1 특허 · 3.3 IND처럼 서류를 내는 게임 흐름과 맞습니다.',
    html: (st) => side(st, { foot: () => '', group: (g) => `<div class="fold" data-g="${g}" style="--k:${g - 1}"><div class="tab"><b>${g}</b>${GT[g]}<span>${doneOf(g)}/${inG(g).length}</span></div><div class="sheet">${list(inG(g), st, { mark: (s) => (s.state === 'done' ? '<span class="stamp">승인</span>' : MARK[s.state]) })}</div></div>` }) },

  { n: '30', name: '폰 하단 단계 바', why: '폰에서는 위쪽 가로 칩 줄 대신 화면 아래에 "지금 단계 · 4/9" 바를 붙이고, 누르면 9단계 시트가 올라옵니다. 칩이 옆으로 밀려 안 보이는 문제가 없어집니다.',
    act: (st) => { st.sheet = !st.sheet; },
    html: (st) => {
      const c = byId(st.cur);
      const sheet = st.sheet ? `<button type="button" class="scrim" data-act="s" aria-label="시트 닫기"></button><div class="sheet30" role="dialog" aria-label="파이프라인 단계"><div class="groups">${[1, 2, 3, 4].map((g) => grp(g, st)).join('')}</div></div>` : '';
      return `<div class="phone"><div class="scr30"><div class="top30"><b>${TEAM}</b><span class="mono">연구비 ₩4.2억</span></div><div class="body30">${ghost()}</div><button type="button" class="dockbar" data-act="s" aria-expanded="${!!st.sheet}"><small>${c.id} · ${WORD[c.state]}</small><b>${c.t}</b><span class="cnt">${ST.indexOf(c) + 1}/9 ▴</span><span class="mini">${ST.map((s) => `<i data-s="${s.state}"></i>`).join('')}</span></button>${sheet}</div></div>`;
    } },
];

const state = {};
const grid = document.getElementById('grid');
const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let picks = store.get('crista-sb-picks') || [];

function paint(n) {
  const v = V.find((x) => x.n === n);
  const card = document.getElementById('v' + n);
  const stage = card.querySelector('.stage');
  const had = stage.contains(document.activeElement) ? document.activeElement : null;
  const key = had && (had.dataset.step ? `[data-step="${had.dataset.step}"]` : had.dataset.act ? `[data-act="${had.dataset.act}"]${had.dataset.g ? `[data-g="${had.dataset.g}"]` : ''}${had.dataset.f ? `[data-f="${had.dataset.f}"]` : ''}${had.dataset.v ? `[data-v="${had.dataset.v}"]` : ''}` : null);
  stage.innerHTML = v.html(state[n]);
  if (key) stage.querySelector(key)?.focus();
}

grid.innerHTML = V.map((v) => `<article class="card v${v.n}" id="v${v.n}"${v.base ? ' data-base' : ''}><div class="ch"><span class="cn">${v.n}</span><h2 class="ct">${v.name}</h2>${v.base ? '<span></span>' : `<button type="button" class="star" data-pick="${v.n}" aria-pressed="false">고르기</button>`}<p class="why">${v.why}</p></div><div class="stage"></div></article>`).join('');
V.forEach((v) => { state[v.n] = { cur: '2.2' }; });
state['24'].tight = store.get('crista-sb-tight') === true;
V.forEach((v) => paint(v.n));

document.getElementById('jump').innerHTML = V.map((v) => `<a href="#v${v.n}" title="${v.name}" data-j="${v.n}">${v.n}</a>`).join('');

function showPicks() {
  document.querySelectorAll('[data-pick]').forEach((b) => { const on = picks.includes(b.dataset.pick); b.setAttribute('aria-pressed', on); b.textContent = on ? '골랐음' : '고르기'; b.closest('.card').classList.toggle('picked', on); });
  document.querySelectorAll('[data-j]').forEach((a) => a.classList.toggle('on', picks.includes(a.dataset.j)));
  document.getElementById('picks').textContent = picks.length ? picks.slice().sort().join(', ') : '없음';
}
showPicks();

grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const n = card.id.slice(1), st = state[n];
  const pick = e.target.closest('[data-pick]');
  if (pick) { picks = picks.includes(n) ? picks.filter((x) => x !== n) : [...picks, n]; store.set('crista-sb-picks', picks); showPicks(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { V.find((x) => x.n === n).act?.(st, act); if (n === '24') store.set('crista-sb-tight', !!st.tight); paint(n); return; }
  const step = e.target.closest('[data-step]');
  if (step) { st.cur = step.dataset.step; if (n === '30') st.sheet = false; paint(n); }
});

// 23 — ↑ ↓ 로 단계 사이 초점 이동, 1~9 로 바로 가기
grid.addEventListener('keydown', (e) => {
  const card = e.target.closest('#v23'); if (!card) return;
  const btns = [...card.querySelectorAll('[data-step]')];
  const i = btns.indexOf(e.target);
  if (/^[1-9]$/.test(e.key)) { state['23'].cur = ST[+e.key - 1].id; paint('23'); card.querySelector(`[data-step="${state['23'].cur}"]`).focus(); e.preventDefault(); return; }
  if (i < 0) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { btns[(i + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length].focus(); e.preventDefault(); }
});

document.getElementById('copy').addEventListener('click', async (e) => {
  const text = picks.length ? `사이드바 시안 ${picks.slice().sort().join(', ')}번으로 가자` : '사이드바 시안을 아직 고르지 않았어요';
  const out = document.getElementById('picks');
  try { await navigator.clipboard.writeText(text); e.target.textContent = '복사됨'; setTimeout(() => (e.target.textContent = '번호 복사'), 1400); }
  catch { out.textContent = text; const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
</script>
